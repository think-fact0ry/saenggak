<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="/saenggak/kakao-escape.js"></script>
<meta name="theme-color" content="#ffffff">
<title>보드게임 — 생각공작소</title>
<link rel="icon" href="/saenggak/android-icon-192x192.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="games.css?v=1">
</head>
<body data-mode="list">
<div id="wrap">
  <div class="screen active" id="s-list">
    <div class="head"><h1>어떤 보드게임을 가져갈까요?</h1></div>
    <div class="find">
      <span class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg></span>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="게임 이름" aria-label="게임 이름으로 찾기">
      <button class="clr" id="qClr" type="button" aria-label="지우기"></button>
    </div>
    <div class="bar"><span class="cnt" id="cnt"></span></div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<div class="toast" id="toast"><span class="tk"><svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6"/></svg></span><span class="tx"></span></div>
<script src="games.js?v=1"></script>
</body>
</html>
