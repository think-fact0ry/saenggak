<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="/saenggak/kakao-escape.js"></script>
<meta name="theme-color" content="#ffffff">
<title>보드게임 설문 — 생각공작소</title>
<link rel="icon" href="/saenggak/android-icon-192x192.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="games.css?v=2">
<link rel="stylesheet" href="survey.css?v=1">
</head>
<body data-mode="survey">
<div id="wrap">

  <div class="screen" id="s-gate">
    <div class="gatebox"><h1 id="gateTitle">카톡방에 온 링크로 열면 시작할 수 있어요</h1></div>
  </div>

  <div class="screen" id="s-name">
    <div class="head"><h1>이름을 골라 주세요</h1></div>
    <div class="names" id="names"></div>
  </div>

  <div class="screen" id="s-list">
    <div class="head"><h1>해 본 보드게임을 눌러 주세요</h1><button type="button" class="role who" id="who" aria-label="이름 바꾸기"></button></div>
    <div class="find">
      <span class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg></span>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="게임 이름" aria-label="게임 이름으로 찾기">
      <button class="clr" id="qClr" type="button" aria-label="지우기"></button>
    </div>
    <div class="bar">
      <span class="cnt" id="cnt"></span>
      <div class="seg" id="seg"><button type="button" class="on" data-f="all">전체</button><button type="button" data-f="todo">남은 것</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="screen" id="s-game">
    <button class="back" id="gBack" type="button" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <div class="ghead"><div class="ph gph" id="gPh"></div><h1 id="gTitle"></h1></div>
    <button type="button" class="skipbtn" id="gSkip">이 게임은 안 해봤어요</button>

    <div class="q" id="q1"><div class="qt"><span class="num">1.</span>규칙 설명이 <span class="qk">5분 안에</span> 끝났어요?</div>
      <div class="opts" data-q="q1"><button type="button" class="opt" data-v="예">예</button><button type="button" class="opt neg" data-v="아니오">아니오</button></div></div>
    <div class="q" id="q2"><div class="qt"><span class="num">2.</span>아이가 <span class="qk">20분 넘게</span> 집중했어요?</div>
      <div class="opts" data-q="q2"><button type="button" class="opt" data-v="예">예</button><button type="button" class="opt neg" data-v="아니오">아니오</button></div></div>
    <div class="q" id="q3"><div class="qt"><span class="num">3.</span>다음에 <span class="qk">또 가져갈</span> 거예요?</div>
      <div class="opts" data-q="q3"><button type="button" class="opt" data-v="예">예</button><button type="button" class="opt neg" data-v="아니오">아니오</button></div></div>
    <div class="q" id="qn"><div class="qt"><span class="num">4.</span>아이들과 <span class="qk">몇 번</span> 해 봤어요?</div>
      <div class="opts" data-q="n"><button type="button" class="opt" data-v="1번">1번</button><button type="button" class="opt" data-v="2~4번">2~4번</button><button type="button" class="opt" data-v="5번 넘게">5번 넘게</button></div></div>
    <div class="q"><div class="qt"><span class="num">5.</span>이 게임이 <span class="qk">안 맞았던 아이</span>는 어땠어요?<span class="optl">선택</span></div>
      <textarea class="ta" id="gMemo" rows="3" maxlength="300" aria-label="안 맞았던 아이는 어땠는지"></textarea></div>

    <button class="btn save" id="gSave" type="button"><span class="bl">저장</span></button>
  </div>

</div>
<div class="toast" id="toast"><span class="tk"><svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6"/></svg></span><span class="tx"></span></div>
<script src="survey.js?v=1"></script>
</body>
</html>
