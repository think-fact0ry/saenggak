<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="/saenggak/kakao-escape.js"></script>
<meta name="theme-color" content="#ffffff">
<title>보드게임 사진 넣기 — 생각공작소</title>
<link rel="icon" href="/saenggak/android-icon-192x192.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="games.css?v=2">
</head>
<body data-mode="admin">
<div id="wrap">

  <div class="screen" id="s-gate">
    <div class="gatebox">
      <h1 id="gateTitle">관리자 비밀번호를 적어 주세요</h1>
      <input class="pin" id="pinIn" type="password" inputmode="numeric" autocomplete="off" aria-labelledby="gateTitle">
      <button class="btn" id="pinBtn" type="button" disabled><span class="bl">확인</span></button>
    </div>
  </div>

  <div class="screen" id="s-list">
    <div class="head"><h1>사진을 넣을 게임을 눌러 주세요</h1><span class="role">행정</span></div>
    <div class="find">
      <span class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg></span>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="게임 이름" aria-label="게임 이름으로 찾기">
      <button class="clr" id="qClr" type="button" aria-label="지우기"></button>
    </div>
    <div class="bar">
      <span class="cnt" id="cnt"></span>
      <div class="seg" id="seg"><button type="button" class="on" data-f="all">전체</button><button type="button" data-f="nophoto">사진 없는 것</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

</div>
<!-- 안드로이드 크롬은 accept=image/* 만 주면 앨범 창만 띄운다(카메라 선택지 없음, 2026-09-21 유성 실기기) → 두 입력을 따로 두고 우리가 묻는다 -->
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<div class="dim" id="pickDim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
  <h2 id="pickTitle"></h2>
  <div class="row"><button type="button" class="no" id="pickAlbum">앨범에서 고르기</button><button type="button" class="go" id="pickCam">사진 찍기</button></div>
</div></div>
<div class="dim" id="dim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <h2 id="dlgTitle"></h2>
  <div class="row"><button type="button" class="no" id="dlgNo">닫기</button><button type="button" class="yes" id="dlgYes">빼기</button></div>
</div></div>
<div class="toast" id="toast"><span class="tk"><svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6"/></svg></span><span class="tx"></span></div>
<script src="jpegmeta.js?v=1"></script>
<script src="games.js?v=3"></script>
</body>
</html>
