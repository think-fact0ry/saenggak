<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>전화 응대 매뉴얼 · 생각공작소</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root{
    --green:#3a8a5f; --green-d:#2f6f4d; --green-l:#eaf5ee;
    --g900:#191f28; --g700:#4e5968; --g500:#8b95a1; --g300:#d1d6db;
    --g200:#e5e8eb; --g100:#f2f4f6; --red:#f04452; --amber:#c77700; --amber-l:#fff8ec;
    --bar:56px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}   /* 롱프레스→구글검색 차단(ex9) */
  input,textarea{-webkit-user-select:text;user-select:text;}
  html{scroll-behavior:smooth;}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:#fff;color:var(--g900);
    word-break:keep-all;line-height:1.62;padding-top:calc(var(--bar) + env(safe-area-inset-top));
    -webkit-text-size-adjust:100%;text-size-adjust:100%;}

  /* ── 상단 바 (고정) ── */
  .bar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:6px;
    background:#fff;border-bottom:1px solid var(--g200);
    height:calc(var(--bar) + env(safe-area-inset-top));padding:0 8px;padding-top:env(safe-area-inset-top);}
  .back{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:none;background:transparent;text-decoration:none;font-size:25px;color:var(--g700);cursor:pointer;flex-shrink:0;}
  .back:active{background:var(--g100);}
  .bar-title{font-size:17px;font-weight:700;letter-spacing:-.4px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .icon-btn{display:flex;align-items:center;justify-content:center;width:42px;height:40px;border-radius:12px;border:none;background:transparent;font-size:21px;color:var(--g700);cursor:pointer;flex-shrink:0;}
  .icon-btn:active{background:var(--g100);}
  .icon-btn svg{width:22px;height:22px;}

  .layout{display:flex;max-width:1120px;margin:0 auto;}

  /* ── 좌측 목차 ── */
  aside{width:288px;flex-shrink:0;border-right:1px solid var(--g200);
    height:calc(100vh - var(--bar) - env(safe-area-inset-top));position:sticky;
    top:calc(var(--bar) + env(safe-area-inset-top));overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 10px 60px;}
  .toc-group{font-size:12px;font-weight:800;letter-spacing:.2px;color:var(--g500);
    padding:8px 12px 6px;margin-top:16px;border-top:1px solid var(--g200);}
  .toc-group:first-of-type{margin-top:2px;border-top:none;}
  nav a{display:block;text-decoration:none;color:var(--g700);font-size:14.5px;font-weight:600;
    padding:8px 12px;border-radius:9px;letter-spacing:-.3px;line-height:1.35;}
  nav a.sub{font-size:13px;font-weight:500;color:var(--g500);padding:6px 12px 6px 24px;margin-top:0;}
  nav a:not(.sub){margin-top:8px;}      /* 섹션(H2)끼리는 띄우고, 하위(분기 등)는 바짝 */
  nav .toc-group + a{margin-top:0;}
  nav a:active{background:var(--g100);}
  nav a.active{background:var(--green-l);color:var(--green-d);font-weight:700;}

  /* ── 검색 오버레이 (돋보기) ── */
  #searchPanel{position:fixed;top:0;left:0;right:0;z-index:70;background:#fff;
    box-shadow:0 8px 24px rgba(0,0,0,.1);border-bottom:1px solid var(--g200);
    transform:translateY(-110%);transition:transform .2s;padding-top:env(safe-area-inset-top);max-height:88vh;overflow-y:auto;}
  #searchPanel.on{transform:translateY(0);}
  .sp-top{display:flex;align-items:center;gap:8px;padding:8px 12px;}
  .search{flex:1;min-width:0;font-family:inherit;font-size:16px;font-weight:500;padding:12px 15px;border-radius:13px;
    border:1.5px solid var(--g200);background:var(--g100);color:var(--g900);outline:none;}
  .search:focus{border-color:var(--green);background:#fff;}
  .search::placeholder{color:var(--g500);}
  .sp-close{border:none;background:transparent;color:var(--g500);cursor:pointer;flex-shrink:0;
    width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;}
  .sp-close:active{background:var(--g100);}
  .sp-close svg{width:22px;height:22px;}
  .sp-body{padding:4px 14px 18px;}
  .chip-title{font-size:12.5px;font-weight:800;color:var(--g500);margin:6px 2px 10px;letter-spacing:.2px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-family:inherit;font-size:14px;font-weight:600;color:var(--g700);background:var(--g100);
    border:1.5px solid var(--g200);border-radius:999px;padding:9px 15px;cursor:pointer;}
  .chip:active{background:var(--green-l);border-color:var(--green);color:var(--green-d);}
  .results{margin-top:6px;}
  .result-item{display:block;width:100%;text-align:left;background:transparent;border:none;
    border-bottom:1px solid var(--g100);padding:13px 6px;cursor:pointer;font-family:inherit;}
  .result-item:active{background:var(--g100);}
  .result-item .rt{font-size:15.5px;font-weight:700;color:var(--g900);letter-spacing:-.3px;}
  .result-item .rg{font-size:12.5px;color:var(--g500);margin-top:2px;}
  .result-empty{color:var(--g500);font-size:14px;padding:24px 6px;text-align:center;}

  /* ── 본문 ── */
  main{flex:1;min-width:0;padding:18px 26px 160px;max-width:760px;}
  .doc{font-size:15.5px;}

  .group-head{font-size:13px;font-weight:800;letter-spacing:.3px;color:var(--green);
    background:var(--green-l);border-radius:10px;padding:9px 14px;margin:48px 0 8px;}
  .group-head:first-child{margin-top:6px;}

  .doc h1{font-size:24px;font-weight:800;letter-spacing:-.7px;margin:2px 0 14px;}
  .doc h1+blockquote{margin-top:0;}
  .doc h2{font-size:20px;font-weight:800;letter-spacing:-.5px;margin:56px 0 14px;
    padding-bottom:9px;border-bottom:2px solid var(--g900);scroll-margin-top:calc(var(--bar) + 12px);}
  .group-head + h2{margin-top:10px;}     /* 대분류 헤더 바로 뒤 첫 섹션은 가깝게 */
  .doc h3{font-size:16.5px;font-weight:700;letter-spacing:-.3px;margin:30px 0 10px;color:var(--green-d);
    scroll-margin-top:calc(var(--bar) + 12px);}
  .doc h4{font-size:15px;font-weight:700;margin:18px 0 7px;}
  .doc p{margin:7px 0;}
  .doc ul,.doc ol{margin:7px 0 10px;padding-left:19px;}
  .doc li{margin:8px 0;}
  .doc li::marker{color:var(--g500);}
  .doc hr{display:none;}
  .doc a{color:var(--green-d);text-decoration:underline;}

  /* 라벨(증상 예시·대응 절차·메모·자주 묻는 질문 …) = 스캔 앵커. 초록 강조 + 좌측 바 */
  .doc p.lbl{font-size:13.5px;font-weight:800;letter-spacing:-.2px;color:var(--green-d);
    margin:32px 0 8px;padding-left:11px;border-left:3px solid var(--green);line-height:1.3;}
  .doc p.lbl strong{font-weight:800;color:var(--green-d);}
  .doc p.lbl em{font-weight:500;color:var(--g500);font-style:normal;}
  /* 대사 화자(담당자/보호자) 색 구분 — 한 블록에 섞여도 단어별로 */
  .spk{font-weight:800;}
  .spk-staff{color:var(--green-d);}
  .spk-parent{color:#2f6f9e;}
  .doc p.qa{font-size:15.5px;font-weight:700;color:var(--g900);margin:14px 0 4px;}
  .doc p.qa + blockquote{margin-top:4px;}

  /* 대사·안내 = blockquote */
  .doc blockquote{background:var(--g100);border-left:3px solid var(--g300);border-radius:0 12px 12px 0;
    padding:10px 15px;margin:6px 0;}
  .doc blockquote p{margin:4px 0;}
  .doc blockquote em{color:var(--g500);font-style:normal;font-size:13.5px;}
  .doc blockquote.say-staff{background:var(--green-l);border-left-color:var(--green);}
  .doc blockquote.say-parent{background:var(--g100);border-left-color:var(--g300);color:var(--g700);}
  .doc blockquote.note{background:var(--amber-l);border-left-color:var(--amber);font-size:14.5px;color:#8a5a00;margin:16px 0;}
  .doc blockquote.note em{color:#8a5a00;}

  /* 콜아웃 라벨 */
  .doc p.call{font-size:14.5px;font-weight:700;border-radius:10px;padding:9px 13px;margin:24px 0 6px;letter-spacing:-.2px;}
  .doc p.call.warn{background:var(--amber-l);color:#8a5a00;}
  .doc p.call.no{background:#fdecee;color:#c0303c;}
  .doc p.call.yes{background:var(--green-l);color:var(--green-d);}
  .doc p.call.sos{background:#fdecee;color:#c0303c;}

  /* 메모·보고 양식 */
  .doc pre{background:var(--g900);color:#e8edf2;border-radius:12px;padding:14px 16px;margin:9px 0;
    overflow-x:auto;font-size:13.5px;line-height:1.75;
    font-family:'Pretendard',-apple-system,sans-serif;white-space:pre-wrap;word-break:break-word;}
  .doc code{font-family:inherit;}
  .doc :not(pre)>code{background:var(--g100);padding:1px 6px;border-radius:6px;font-size:14px;}

  /* 표 — 화면 폭에 맞춰 줄바꿈(가로 스크롤 X) */
  .tbl{border:1px solid var(--g200);border-radius:12px;overflow:hidden;margin:11px 0;}
  .tbl table{width:100%;border-collapse:collapse;table-layout:auto;font-size:13.5px;}
  .tbl th,.tbl td{border-bottom:1px solid var(--g200);border-right:1px solid var(--g200);
    padding:9px 10px;text-align:left;vertical-align:top;word-break:keep-all;overflow-wrap:normal;line-height:1.45;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl th:last-child,.tbl td:last-child{border-right:none;}
  .tbl th{background:var(--g100);font-weight:700;}

  mark{background:#fff3a0;color:inherit;border-radius:3px;padding:0 1px;}

  /* ── 모바일 ── */
  @media (max-width:820px){
    aside{position:fixed;top:0;left:0;bottom:0;width:86%;max-width:340px;height:100%;z-index:60;
      background:#fff;border-right:1px solid var(--g200);box-shadow:6px 0 24px rgba(0,0,0,.12);
      transform:translateX(-102%);transition:transform .22s;padding-top:calc(14px + env(safe-area-inset-top));}
    aside.open{transform:translateX(0);}
    main{padding:16px 18px 160px;}
    .scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;}
    .scrim.on{opacity:1;pointer-events:auto;}
    .tbl table{font-size:12.5px;}
    .tbl th,.tbl td{padding:7px 7px;}
  }
  @media (min-width:821px){ .icon-btn.toc{display:none;} }  /* 넓은 화면은 목차 항상 보임 */

  /* 게이트 */
  #gate{position:fixed;inset:0;z-index:9999;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;padding-bottom:calc(40px + env(safe-area-inset-bottom));}
  #gate.on{display:flex;}
  .gate-logo{width:60px;height:60px;border-radius:18px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:18px;}
  .gate-title{font-size:19px;font-weight:700;letter-spacing:-.4px;}
  .gate-sub{font-size:14px;color:var(--g500);font-weight:500;margin-top:6px;}
  .gate-dots{display:flex;gap:14px;margin:28px 0 4px;}
  .gate-dot{width:14px;height:14px;border-radius:50%;background:var(--g200);transition:background .12s,transform .12s;}
  .gate-dot.on{background:var(--green);transform:scale(1.15);}
  .gate-err{height:18px;font-size:13px;color:var(--red);font-weight:600;margin-top:8px;opacity:0;transition:opacity .15s;}
  .gate-err.show{opacity:1;}
  .gate-err.shake{animation:gshake .35s;}
  @keyframes gshake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .gate-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:22px;}
  .gate-key{height:64px;border-radius:18px;background:var(--g100);border:none;cursor:pointer;font-family:inherit;font-size:26px;font-weight:600;color:var(--g900);display:flex;align-items:center;justify-content:center;transition:background .1s,transform .08s;}
  .gate-key:active{background:var(--g200);transform:scale(.94);}
  .gate-key.fn{font-size:15px;font-weight:600;color:var(--g500);background:transparent;}

  #load{position:fixed;inset:0;z-index:500;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;}
  #load.on{display:flex;}
  .spin{width:34px;height:34px;border:3px solid var(--g200);border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .errmsg{text-align:center;color:var(--g500);font-size:14.5px;padding:60px 20px;}
  .errmsg.bad{color:var(--red);}

  @media print{
    .bar,aside,#searchPanel,#gate,#load,.scrim{display:none !important;}
    body{padding-top:0;}
    main{max-width:none;padding:0;}
  }
</style>
</head>
<body>

<div class="bar">
  <a class="back" href="./index.html" aria-label="홈으로">‹</a>
  <div class="bar-title">전화 응대 매뉴얼</div>
  <button class="icon-btn" onclick="openSearch()" aria-label="검색">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  </button>
  <button class="icon-btn toc" onclick="toggleToc()" aria-label="목차">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
</div>

<!-- 검색 패널 -->
<div id="searchPanel">
  <div class="sp-top">
    <input class="search" id="search" type="search" placeholder="검색어 입력" autocomplete="off">
    <button class="sp-close" onclick="closeSearch()" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sp-body">
    <div id="chipWrap">
      <div class="chip-title">자주 찾는 항목</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="results" id="results"></div>
  </div>
</div>

<div class="layout">
  <aside id="toc"><nav id="nav"></nav></aside>
  <div class="scrim" id="scrim" onclick="toggleToc(false)"></div>
  <main>
    <div class="doc" id="doc"></div>
    <div class="errmsg" id="errmsg" style="display:none"></div>
  </main>
</div>

<!-- PIN 게이트 -->
<div id="gate">
  <div class="gate-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
  <div class="gate-title">전화 응대 매뉴얼</div>
  <div class="gate-sub">암호 4자리를 눌러요</div>
  <div class="gate-dots"><div class="gate-dot"></div><div class="gate-dot"></div><div class="gate-dot"></div><div class="gate-dot"></div></div>
  <div class="gate-err" id="gateErr">암호가 맞지 않아요</div>
  <div class="gate-pad">
    <button class="gate-key" data-k="1">1</button>
    <button class="gate-key" data-k="2">2</button>
    <button class="gate-key" data-k="3">3</button>
    <button class="gate-key" data-k="4">4</button>
    <button class="gate-key" data-k="5">5</button>
    <button class="gate-key" data-k="6">6</button>
    <button class="gate-key" data-k="7">7</button>
    <button class="gate-key" data-k="8">8</button>
    <button class="gate-key" data-k="9">9</button>
    <span></span>
    <button class="gate-key" data-k="0">0</button>
    <button class="gate-key fn" data-k="del">지우기</button>
  </div>
</div>

<div id="load"><div class="spin"></div></div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwAyTXgNRYg3hRUUwWRbilNx_pGAvvAqfwoKduWCCwxQT2502oQKY1lKiqclze1ko3QNw/exec';
var TOKEN_KEY = 'tf_forms_token';

var GROUPS = [
  { name:'🚨 긴급 · 시스템',      keys:['긴급 연락처','유관기관','연락이 안','전자바우처 시스템','구글 시트'] },
  { name:'📋 기본 원칙',          keys:['민원','절대 하면 안'] },
  { name:'🟢 신청 · 서비스 안내', keys:['서비스 신청','서비스 절차','체험','영상','서비스 프로그램'] },
  { name:'🔄 이용 변경 · 연장',   keys:['추가 이용','종료 이후','일정·시간','잠시 중단'] },
  { name:'💳 비용 · 카드 · 등급', keys:['현금영수증','세액공제','국민행복카드','등급 변경'] }
];
function groupOf(title){
  for(var i=0;i<GROUPS.length;i++){ for(var j=0;j<GROUPS[i].keys.length;j++){ if(title.indexOf(GROUPS[i].keys[j])>=0) return i; } }
  return -1;
}
// 자주 찾는 항목(큐레이션) — {t:보이는 라벨, q:실제 검색어(본문에 존재해야 매칭)}
// 추후 실제 검색로그 집계로 대체 예정(유성 기기 제외)
var CHIPS = [
  {t:'환불',q:'환불'},{t:'일정 변경',q:'일정'},{t:'수업 중단',q:'중단'},
  {t:'현금영수증',q:'현금영수증'},{t:'등급 변경',q:'등급'},{t:'연장·재신청',q:'연장'},
  {t:'체험 수업',q:'체험'},{t:'국민행복카드',q:'행복카드'},{t:'신청 방법',q:'신청'},{t:'세액공제',q:'세액공제'}
];

// 대표(유성) 기기: 주소에 ?owner=1 로 한 번 열면 이 기기는 검색 집계에서 영구 제외
(function(){ try{ if(/[?&]owner=1/.test(location.search)) localStorage.setItem('tf_no_log','1'); }catch(e){} })();
function noLog(){ try{ return localStorage.getItem('tf_no_log')==='1'; }catch(e){ return false; } }
var searchSource='type', lastTop=null;
function logSearch(q){
  if(noLog()) return;
  q=(q||'').trim(); if(q.length<2) return;
  try{ fetch(GAS_URL+'?action=logsearch&t='+encodeURIComponent(getToken())+'&q='+encodeURIComponent(q),{redirect:'follow'}); }catch(e){}
}
function fetchTop(){
  fetch(GAS_URL+'?action=topsearches&t='+encodeURIComponent(getToken()),{redirect:'follow'})
    .then(function(r){ return r.json(); })
    .then(function(d){ if(d && d.terms){ lastTop=d.terms; buildChips(lastTop); } }).catch(function(){});
}

function getToken(){ try{ return localStorage.getItem(TOKEN_KEY)||''; }catch(e){ return ''; } }
function setToken(t){ try{ localStorage.setItem(TOKEN_KEY,(t||'').trim()); }catch(e){} }
function showLoad(on){ document.getElementById('load').classList.toggle('on',!!on); }

function fetchManual(token){
  return fetch(GAS_URL + '?action=manual&t=' + encodeURIComponent(token), { redirect:'follow' })
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}
function loadManual(){
  // 암호 게이트 제거(유성 2026-06-24) — 허브 OTP+PIN + 매뉴얼 타일 data-tier=admin으로 접근 통제. #gate 키패드는 미사용(dormant)
  showLoad(true);
  fetchManual(getToken()).then(function(d){
    showLoad(false);
    if(d && d.error==='Unauthorized'){ setToken(''); openGate(); return; }
    if(d && d.error){ return showErr('불러오기 실패: '+d.error); }
    render((d && d.md) || '');
  }).catch(function(){ showLoad(false); showErr('네트워크 오류예요. 와이파이를 확인해 주세요.'); });
}
function showErr(t){ var e=document.getElementById('errmsg'); e.textContent=t; e.className='errmsg bad'; e.style.display='block'; }

var sections = [];   // [{id, title, group, navEl, headEl, text}]

function render(md){
  if(!md){ return showErr('매뉴얼 내용이 비어 있어요.'); }
  marked.setOptions({ gfm:true, breaks:false });
  var doc = document.getElementById('doc');
  // "→ 즉시 보고"가 화살표와 뒷글자로 갈라져 줄바꿈되지 않게 → 와 다음 글자를 붙임(줄바꿈은 화살표 앞에서)
  doc.innerHTML = marked.parse(md).replace(/→ /g, "→ ");
  wrapTables(doc);
  styleBlockquotes(doc);
  styleLabels(doc);
  buildToc(doc);
  buildChips();
  setupScrollSpy();
}

function wrapTables(doc){
  doc.querySelectorAll('table').forEach(function(t){
    if(t.parentNode.classList.contains('tbl')) return;
    var w=document.createElement('div'); w.className='tbl';
    t.parentNode.insertBefore(w,t); w.appendChild(t);
  });
}
function styleBlockquotes(doc){
  doc.querySelectorAll('blockquote').forEach(function(bq){
    var t = bq.textContent.trim();
    var cls = '';
    if(/^담당자\s*[:：]/.test(t) || /^["“]/.test(t)) cls='say-staff';   // 담당자 대사 + 라벨 없는 따옴표 답변
    else if(/^보호자/.test(t) || /^이용자/.test(t)) cls='say-parent';
    else if(/^[_(]/.test(t)) cls='note';
    if(cls) bq.classList.add(cls);
    // 한 블록에 보호자·담당자가 섞여도 각 줄의 화자 단어를 색칠(담당자=초록·보호자=파랑)
    if(cls==='say-staff' || cls==='say-parent'){
      bq.querySelectorAll('p').forEach(function(p){
        p.innerHTML = p.innerHTML
          .replace(/^(\s*)(담당자)(\s*[:：])/, '$1<span class="spk spk-staff">$2$3</span>')
          .replace(/^(\s*)(이용자 보호자|보호자)(\s*[:：])/, '$1<span class="spk spk-parent">$2$3</span>');
      });
    }
  });
}
function styleLabels(doc){
  doc.querySelectorAll('p').forEach(function(p){
    // 라벨 = 굵은 글씨로 시작하는 문단(앞에 일반 텍스트가 없을 때)
    var lead = p.firstChild;
    if(lead && lead.nodeType===3 && lead.textContent.trim()) return;   // 앞에 일반 텍스트 → 라벨 아님
    var strong = p.firstElementChild;
    if(!strong || strong.tagName!=='STRONG') return;
    var t = strong.textContent.trim();
    if(/^🚨/.test(t)){ p.classList.add('call','sos'); return; }
    if(/^⚠️/.test(t)){ p.classList.add('call','warn'); return; }
    if(/^❌/.test(t)){ p.classList.add('call','no'); return; }
    if(/^✅/.test(t)){ p.classList.add('call','yes'); return; }
    if(/^Q\s*\d/i.test(t)){ p.classList.add('qa'); return; }
    p.classList.add('lbl');
  });
}

function buildToc(doc){
  var nav = document.getElementById('nav');
  nav.innerHTML=''; sections=[];
  var heads = doc.querySelectorAll('h2, h3');
  var lastGroup=-2;
  heads.forEach(function(h,i){
    var id='sec-'+i; h.id=id;
    var title = h.textContent.replace(/^[📞🚨⚠️❌✅🧾💱🎄🟢🔄💳📋🔒\s]+/, '').trim() || h.textContent;
    var level = (h.tagName==='H3') ? 3 : 2;
    var text = h.textContent+' ';
    var n=h.nextElementSibling;
    while(n && !/^H[23]$/.test(n.tagName)){ text+=n.textContent+' '; n=n.nextElementSibling; }
    if(level===2){
      var g=groupOf(title);
      if(g!==lastGroup){
        lastGroup=g;
        var gname=(g>=0)?GROUPS[g].name:'기타';
        var gb=document.createElement('div'); gb.className='toc-group'; gb.textContent=gname; nav.appendChild(gb);
        var bh=document.createElement('div'); bh.className='group-head'; bh.textContent=gname;
        h.parentNode.insertBefore(bh,h);
      }
    }
    var a=document.createElement('a'); a.href='#'+id; a.textContent=title;
    if(level===3) a.className='sub';
    a.onclick=function(e){ e.preventDefault(); jumpTo(id); };
    nav.appendChild(a);
    sections.push({ id:id, title:title, group:lastGroup, navEl:a, headEl:h, text:text.toLowerCase() });
  });
}

function jumpTo(id){
  closeSearch(); toggleToc(false);
  var el=document.getElementById(id);
  if(el) setTimeout(function(){ el.scrollIntoView({ behavior:'smooth', block:'start' }); }, 60);
}

// ── 검색 패널 ──
function openSearch(){
  document.getElementById('searchPanel').classList.add('on');
  var s=document.getElementById('search'); s.value=''; searchSource='type'; runSearch('');
  buildChips(lastTop);   // 캐시 즉시 표시
  fetchTop();            // 최신 상위어 갱신
  setTimeout(function(){ s.focus(); }, 120);
}
function closeSearch(){ document.getElementById('searchPanel').classList.remove('on'); }
function buildChips(topTerms){
  var box=document.getElementById('chips'); box.innerHTML='';
  var title=document.querySelector('.chip-title');
  var list=[];
  if(topTerms && topTerms.length>=3){
    if(title) title.textContent='많이 찾는 항목';
    topTerms.forEach(function(q){ list.push({t:q, q:q}); });
  } else if(title){ title.textContent='자주 찾는 항목'; }
  CHIPS.forEach(function(c){ if(list.length>=10) return; if(!list.some(function(x){return x.q===c.q;})) list.push(c); });
  list.forEach(function(c){
    var b=document.createElement('button'); b.className='chip'; b.textContent=c.t;
    b.onclick=function(){ searchSource='chip'; var s=document.getElementById('search'); s.value=c.q; runSearch(c.q); };
    box.appendChild(b);
  });
}
function runSearch(q){
  q=(q||'').trim().toLowerCase();
  var chipWrap=document.getElementById('chipWrap');
  var res=document.getElementById('results');
  chipWrap.style.display = q ? 'none' : 'block';
  res.innerHTML='';
  if(!q) return;
  var hits = sections.filter(function(s){ return s.text.indexOf(q)>=0; });
  if(!hits.length){ res.innerHTML='<div class="result-empty">찾는 내용이 없어요. 다른 단어로 찾아보세요.</div>'; return; }
  hits.forEach(function(s){
    var gname=(s.group>=0)?GROUPS[s.group].name:'';
    var b=document.createElement('button'); b.className='result-item';
    b.innerHTML='<div class="rt"></div><div class="rg"></div>';
    b.querySelector('.rt').textContent=s.title;
    b.querySelector('.rg').textContent=gname;
    b.onclick=function(){ if(searchSource==='type') logSearch(document.getElementById('search').value); jumpTo(s.id); };
    res.appendChild(b);
  });
}
document.getElementById('search').addEventListener('input', function(){ searchSource='type'; runSearch(this.value); });

function setupScrollSpy(){
  if(!('IntersectionObserver' in window)) return;
  var byId={}; sections.forEach(function(s){ byId[s.id]=s.navEl; });
  var obs=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        document.querySelectorAll('nav a.active').forEach(function(a){ a.classList.remove('active'); });
        var a=byId[en.target.id]; if(a){ a.classList.add('active'); a.scrollIntoView({ block:'nearest' }); }
      }
    });
  }, { rootMargin:'-60px 0px -72% 0px', threshold:0 });
  sections.forEach(function(s){ obs.observe(s.headEl); });
}

function toggleToc(force){
  var open=(force===undefined)?!document.getElementById('toc').classList.contains('open'):force;
  document.getElementById('toc').classList.toggle('open', open);
  document.getElementById('scrim').classList.toggle('on', open);
}

// ── PIN 게이트 ──
var gateEntry='';
function openGate(){ gateEntry=''; gateDraw(); document.getElementById('gate').classList.add('on'); }
function gateDraw(){ var d=document.querySelectorAll('#gate .gate-dot'); for(var i=0;i<d.length;i++) d[i].classList.toggle('on', i<gateEntry.length); }
function gateFail(msg){ var e=document.getElementById('gateErr'); if(msg) e.textContent=msg; e.classList.add('show','shake'); setTimeout(function(){ e.classList.remove('shake'); },360); gateEntry=''; gateDraw(); }
function gateSubmit(){
  var pin=gateEntry; showLoad(true);
  fetchManual(pin).then(function(d){
    showLoad(false);
    if(d && d.error){ gateFail('암호가 맞지 않아요'); return; }
    setToken(pin);
    document.getElementById('gate').classList.remove('on');
    render((d && d.md) || '');
  }).catch(function(){ showLoad(false); gateFail('연결이 안 돼요. 와이파이를 확인해요'); });
}
function gatePress(k){
  var err=document.getElementById('gateErr');
  if(k==='del'){ gateEntry=gateEntry.slice(0,-1); err.classList.remove('show'); gateDraw(); return; }
  if(gateEntry.length>=4) return;
  err.classList.remove('show'); gateEntry+=k; gateDraw();
  if(gateEntry.length===4) gateSubmit();
}
document.querySelector('#gate .gate-pad').addEventListener('click', function(e){
  var b=e.target.closest('.gate-key'); if(b) gatePress(b.getAttribute('data-k'));
});
document.addEventListener('keydown', function(e){
  if(document.getElementById('gate').classList.contains('on')){
    if(/^[0-9]$/.test(e.key)) gatePress(e.key);
    else if(e.key==='Backspace') gatePress('del');
    return;
  }
  if(e.key==='Escape') closeSearch();
});

loadManual();
</script>
