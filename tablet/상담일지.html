<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>상담일지 — 생각공작소</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --green:#3a8a5f; --green-d:#2f6f4d; --green-l:#eaf5ee;
    --g900:#191f28; --g700:#4e5968; --g500:#8b95a1; --g400:#b0b8c1; --g300:#d1d6db;
    --g200:#e5e8eb; --g100:#f2f4f6; --red:#f04452;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:#fff;color:var(--g900);word-break:keep-all;line-height:1.5;}
  .screen{display:none;}
  .screen.active{display:block;}
  .wrap{max-width:720px;margin:0 auto;padding:20px 22px 120px;}
  .back{display:flex;align-items:center;justify-content:center;width:40px;height:40px;margin:0 0 4px -4px;border-radius:12px;border:none;background:transparent;text-decoration:none;font-size:22px;color:var(--g700);cursor:pointer;}
  .back:active{background:var(--g100);}
  h1{font-size:24px;font-weight:700;letter-spacing:-.6px;margin:8px 2px 6px;}
  .sub{font-size:14.5px;color:var(--g500);font-weight:500;margin:0 2px 22px;}
  .who{display:inline-block;font-size:13px;font-weight:700;color:var(--green-d);background:var(--green-l);border-radius:8px;padding:5px 11px;margin:0 2px 18px;}
  .head-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}

  /* 입력 공통 */
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:14px;font-weight:600;color:var(--g700);margin:0 2px 8px;}
  .field input,.field textarea{width:100%;font-family:inherit;font-size:17px;padding:16px 17px;border-radius:14px;border:2px solid transparent;background:var(--g100);outline:none;transition:.15s;}
  .field textarea{font-size:16px;line-height:1.65;resize:vertical;min-height:300px;}
  .field input::placeholder,.field textarea::placeholder{color:var(--g400);font-weight:500;}
  .field input:focus,.field textarea:focus{background:#fff;border-color:var(--green);}
  .field input.pin{letter-spacing:14px;text-align:center;font-size:22px;}

  /* 하단 고정 버튼 */
  .footbar{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:12px 22px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--g100);}
  .footbar .inner{max-width:720px;margin:0 auto;display:flex;gap:10px;}
  .btn{flex:1;font-family:inherit;font-size:17px;font-weight:700;padding:17px;border-radius:15px;border:none;background:var(--green);color:#fff;cursor:pointer;transition:.12s;}
  .btn:active{transform:scale(.985);background:var(--green-d);}
  .btn:disabled{background:var(--g200);color:var(--g500);cursor:default;transform:none;}

  .note{text-align:center;font-size:13.5px;margin:12px 2px 0;color:var(--g500);min-height:18px;}
  .note.err{color:var(--red);font-weight:600;}
  .note .lk{color:var(--green-d);background:none;border:none;text-decoration:underline;cursor:pointer;font:inherit;padding:0;}
  .stub{text-align:center;font-size:12.5px;color:var(--g400);margin-top:10px;}

  /* 내담자 검색 + 목록 */
  .search{position:relative;margin-bottom:16px;}
  .search input{width:100%;font-family:inherit;font-size:16px;padding:15px 16px 15px 46px;border-radius:14px;border:2px solid transparent;background:var(--g100);outline:none;transition:.15s;}
  .search input:focus{background:#fff;border-color:var(--green);}
  .search .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--g400);display:flex;}
  .search .ico svg{width:20px;height:20px;}
  .count{font-size:13.5px;color:var(--g500);font-weight:600;margin:0 2px 10px;}
  .client-list{display:flex;flex-direction:column;gap:10px;}
  .client-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1.5px solid var(--g200);border-radius:16px;padding:16px 18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:.12s;}
  .client-card:active{border-color:var(--green);background:#F6FAF6;}
  .client-card .nm{font-size:16.5px;font-weight:700;letter-spacing:-.3px;}
  .client-card .meta{font-size:13px;color:var(--g500);font-weight:500;}
  .client-card .chev{color:var(--g300);display:flex;}
  .empty{text-align:center;color:var(--g400);font-size:14px;font-weight:500;padding:40px 0;}

  /* 내담자 헤더(월·작성 화면 공통) */
  .subject{margin:6px 2px 18px;}
  .subject .nm{font-size:20px;font-weight:700;letter-spacing:-.4px;}
  .subject .meta{font-size:13.5px;color:var(--g500);font-weight:500;margin-top:3px;}

  /* 월 네비 */
  .month-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 22px;}
  .month-nav button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--g200);background:#fff;color:var(--g700);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .month-nav button:active{background:var(--g100);}
  .month-nav button:disabled{opacity:.35;cursor:default;}
  .month-nav .ym{font-size:18px;font-weight:700;letter-spacing:-.3px;min-width:130px;text-align:center;}

  /* 회차 그리드 */
  .round-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .round{position:relative;background:#fff;border:1.5px solid var(--g200);border-radius:16px;padding:22px 16px;cursor:pointer;text-align:center;transition:.12s;}
  .round:active{transform:scale(.985);}
  .round .rn{font-size:16px;font-weight:700;}
  .round .st{font-size:12.5px;font-weight:600;color:var(--g400);margin-top:6px;}
  .round.done{border-color:var(--green);background:var(--green-l);}
  .round.done .rn{color:var(--green-d);}
  .round.done .st{color:var(--green-d);}

  /* 모드 선택 카드 */
  .mode-list{display:flex;flex-direction:column;gap:12px;}
  .mode-card{text-align:left;width:100%;font-family:inherit;background:#fff;border:1.5px solid var(--g200);border-radius:18px;padding:22px 20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:.12s;}
  .mode-card:active{border-color:var(--green);background:#F6FAF6;transform:scale(.99);}
  .mode-card .mc-tl{font-size:18px;font-weight:700;letter-spacing:-.3px;color:var(--g900);}
  .mode-card .mc-ds{font-size:14px;color:var(--g500);font-weight:500;margin-top:6px;line-height:1.5;}

  /* 폼 보조 */
  .hint{font-size:12.5px;color:var(--g500);font-weight:500;margin:0 2px 9px;}
  .field textarea.sm{min-height:92px;}

  /* 호소 태그 칩 */
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-family:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;border:1.5px solid var(--g200);background:#fff;color:var(--g700);cursor:pointer;transition:.12s;}
  .chip.on{border-color:var(--green);background:var(--green-l);color:var(--green-d);}
  .chip:active{transform:scale(.96);}

  /* 세그먼트(평가척도·위험) */
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;font-family:inherit;font-size:16px;font-weight:600;padding:13px 0;border-radius:12px;border:1.5px solid var(--g200);background:#fff;color:var(--g700);cursor:pointer;transition:.12s;}
  .seg button.on{border-color:var(--green);background:var(--green-l);color:var(--green-d);font-weight:700;}
  .seg button.danger.on{border-color:var(--red);background:#FEF2F3;color:var(--red);}
  .seg button:active{transform:scale(.97);}

  /* 완료 토스트 */
  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--g900);color:#fff;font-size:14px;font-weight:600;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 008 월 상담일지 출력 */
  #report008{color:#000;}
  .r008{max-width:760px;margin:0 auto;}
  .r-title{text-align:center;font-size:28px;font-weight:800;letter-spacing:-1px;margin:12px 0 2px;}
  .r-period{font-size:20px;font-weight:600;}
  .r-sub{text-align:right;font-size:12.5px;color:#333;margin-bottom:8px;}
  .r-who{font-size:13px;color:var(--g500);font-weight:600;margin-bottom:10px;}
  .r-tbl{width:100%;border-collapse:collapse;}
  .r-tbl th,.r-tbl td{border:1.2px solid #000;padding:8px 10px;font-size:13px;vertical-align:top;}
  .r-tbl th{background:#f2f2f2;text-align:center;font-weight:700;}
  .rc-h{width:18%;}
  .r-tbl td.rc{text-align:center;font-weight:600;vertical-align:middle;width:18%;}
  .r-tbl td.rd{height:110px;line-height:1.65;}
  .r-bigo-tbl{margin-top:-1.2px;}
  .r-bigo{height:90px;}
  @media print{
    @page{size:A4 portrait;margin:14mm;}
    body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .noprint{display:none!important;}
    .wrap{max-width:none;padding:0;}
    .footbar{display:none!important;}
    #report008{padding:0;}
  }
</style>
</head>
<body>

<!-- ═══ 가입 1: 이름·전화 ═══ -->
<div class="screen" id="s-signup1">
  <div class="wrap">
    <a class="back" href="./index.html" aria-label="홈으로">‹</a>
    <h1>반가워요</h1>
    <p class="sub">상담일지를 쓰려면 본인 확인을 한 번만 할게요.<br>이름과 전화번호를 적어 주세요.</p>
    <div class="field"><label>이름</label><input id="su-name" type="text" placeholder="홍길동" autocomplete="off"></div>
    <div class="field"><label>전화번호</label><input id="su-phone" type="text" inputmode="numeric" placeholder="010-0000-0000" autocomplete="off"></div>
    <div class="note" id="su1Note"></div>
  </div>
  <div class="footbar"><div class="inner"><button class="btn" id="su1Btn" disabled>인증번호 받기</button></div></div>
</div>

<!-- ═══ 가입 2: OTP ═══ -->
<div class="screen" id="s-signup2">
  <div class="wrap">
    <button class="back" id="su2Back" aria-label="이전">‹</button>
    <h1>인증번호 확인</h1>
    <p class="sub" id="su2Sub">문자로 받은 6자리 숫자를 적어 주세요.</p>
    <div class="field"><label>인증번호</label><input id="su-code" type="text" inputmode="numeric" maxlength="6" placeholder="● ● ● ● ● ●" autocomplete="off"></div>
    <div class="note" id="su2Note"></div>
    <div class="stub" id="su2Stub"></div>
  </div>
  <div class="footbar"><div class="inner"><button class="btn" id="su2Btn" disabled>확인</button></div></div>
</div>

<!-- ═══ 가입 3: PIN 설정 ═══ -->
<div class="screen" id="s-signup3">
  <div class="wrap">
    <h1>비밀번호 설정</h1>
    <p class="sub">앱을 열 때 쓸 4자리 숫자를 정해 주세요. 이 기기에서만 써요.</p>
    <div class="field"><label>비밀번호 4자리</label><input id="su-pin1" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></div>
    <div class="field"><label>한 번 더</label><input id="su-pin2" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></div>
    <div class="note" id="su3Note"></div>
  </div>
  <div class="footbar"><div class="inner"><button class="btn" id="su3Btn" disabled>시작하기</button></div></div>
</div>

<!-- ═══ 게이트: PIN 입력(재진입) ═══ -->
<div class="screen" id="s-gate">
  <div class="wrap">
    <h1>다시 오셨네요</h1>
    <p class="sub">비밀번호 4자리를 적어 주세요.</p>
    <div class="field"><input id="g-pin" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="● ● ● ●" autocomplete="off"></div>
    <div class="note" id="gateNote"></div>
  </div>
</div>

<!-- ═══ 모드 선택: 바우처(008) / 일반 ═══ -->
<div class="screen" id="s-mode">
  <div class="wrap">
    <a class="back" href="./index.html" aria-label="홈으로">‹</a>
    <div class="head-row"><h1>상담일지</h1><span class="who" id="whoTag2"></span></div>
    <p class="sub">어떤 상담일지를 쓸까요?</p>
    <div class="mode-list">
      <button class="mode-card" id="mode-voucher">
        <div class="mc-tl">바우처 상담일지</div>
        <div class="mc-ds">아동청소년·성인·정신토탈 — 담당 아이를 골라 회차별로 적어요.</div>
      </button>
      <button class="mode-card" id="mode-general">
        <div class="mc-tl">일반 상담일지</div>
        <div class="mc-ds">바우처가 아닌 상담 — 내담자를 직접 적고 회기별로 기록해요.</div>
      </button>
    </div>
  </div>
</div>

<!-- ═══ 내담자 선택(하이브리드: 검색 + 목록) ═══ -->
<div class="screen" id="s-clients">
  <div class="wrap">
    <button class="back" id="cl-back" aria-label="이전">‹</button>
    <div class="head-row"><h1>바우처 상담일지</h1><span class="who" id="whoTag"></span></div>
    <div class="search">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <input id="cs-search" type="text" placeholder="이름으로 찾기" autocomplete="off">
    </div>
    <div class="count" id="cs-count"></div>
    <div class="client-list" id="cs-list"></div>
    <div class="note" id="cs-note"></div>
  </div>
</div>

<!-- ═══ 월 / 회차 그리드 ═══ -->
<div class="screen" id="s-month">
  <div class="wrap">
    <button class="back" id="m-back" aria-label="목록">‹</button>
    <div class="subject" id="m-subject"></div>
    <div class="month-nav">
      <button id="m-prev" aria-label="이전 달">‹</button>
      <div class="ym" id="m-ym"></div>
      <button id="m-next" aria-label="다음 달">›</button>
    </div>
    <div class="round-grid" id="m-rounds"></div>
    <div class="note" id="m-note"></div>
  </div>
  <div class="footbar"><div class="inner"><button class="btn" id="m-print">이번 달 상담일지 출력</button></div></div>
</div>

<!-- ═══ 008 출력 미리보기 ═══ -->
<div class="screen" id="s-print">
  <div class="wrap">
    <button class="back noprint" id="p-back" aria-label="뒤로">‹</button>
    <div id="report008"></div>
  </div>
  <div class="footbar noprint"><div class="inner"><button class="btn" id="p-do">인쇄 / PDF 저장</button></div></div>
</div>

<!-- ═══ [일반] 내담자 직접입력 ═══ -->
<div class="screen" id="s-gclient">
  <div class="wrap">
    <button class="back" id="gc-back" aria-label="이전">‹</button>
    <h1>일반 상담일지</h1>
    <p class="sub">내담자 정보를 적어 주세요. 이름과 생년월일로 회기를 모아 둘게요.</p>
    <div class="field"><label>이름</label><input id="gc-name" type="text" placeholder="홍길동" autocomplete="off"></div>
    <div class="field"><label>생년월일</label><input id="gc-birth" type="text" inputmode="numeric" placeholder="0000. 00. 00" autocomplete="off"></div>
    <div class="note" id="gc-note"></div>
  </div>
  <div class="footbar"><div class="inner"><button class="btn" id="gc-btn" disabled>회기 보기</button></div></div>
</div>

<!-- ═══ [일반] 회기 목록 ═══ -->
<div class="screen" id="s-grounds">
  <div class="wrap">
    <button class="back" id="gr-back" aria-label="이전">‹</button>
    <div class="subject" id="gr-subject"></div>
    <div class="count" id="gr-count"></div>
    <div class="client-list" id="gr-list"></div>
    <div class="note" id="gr-note"></div>
  </div>
  <div class="footbar"><div class="inner"><button class="btn" id="gr-new">새 회기 작성</button></div></div>
</div>

<!-- ═══ [일반] 회기 기록 폼(7칸) ═══ -->
<div class="screen" id="s-gwrite">
  <div class="wrap">
    <button class="back" id="gw-back" aria-label="회기">‹</button>
    <div class="subject" id="gw-subject"></div>

    <div class="field"><label>상담일자</label><input id="gw-date" type="text" inputmode="numeric" placeholder="0000. 00. 00" autocomplete="off"></div>
    <div class="field"><label>주호소</label><input id="gw-complaint" type="text" placeholder="내담자가 호소하는 핵심 어려움" autocomplete="off"></div>

    <div class="field">
      <label>호소 태그 <span style="color:var(--g400);font-weight:500;">(고르면 좋아요)</span></label>
      <div class="chips" id="gw-tags"></div>
    </div>

    <div class="field"><label>회기 내용</label><textarea id="gw-content" placeholder="이번 회기에서 다룬 내용과 내담자의 반응을 적어요."></textarea></div>

    <div class="field">
      <label>회기 평가</label>
      <div class="hint">이번 회기 상태나 진전을 1~5로 표시해요. 1 낮음 · 5 높음</div>
      <div class="seg" id="gw-score"></div>
    </div>
    <div class="field"><textarea id="gw-opinion" class="sm" placeholder="평가 소견을 적어요 (선택)"></textarea></div>

    <div class="field">
      <label>위험 신호</label>
      <div class="seg" id="gw-risk"></div>
    </div>
    <div class="field" id="gw-riskbox" style="display:none;"><textarea id="gw-risknote" class="sm" placeholder="어떤 위험 신호인지, 어떻게 대응했는지 적어요."></textarea></div>

    <div class="note" id="gw-note"></div>
  </div>
  <div class="footbar"><div class="inner"><button class="btn" id="gw-save" disabled>저장</button></div></div>
</div>

<!-- ═══ 회차 상세내용 입력·수정 ═══ -->
<div class="screen" id="s-write">
  <div class="wrap">
    <button class="back" id="w-back" aria-label="회차">‹</button>
    <div class="subject" id="w-subject"></div>
    <div class="field"><label>상담일</label><input id="w-date" type="text" inputmode="numeric" placeholder="0000. 00. 00" autocomplete="off"></div>
    <div class="field"><label>상세내용</label><textarea id="w-content" placeholder="서비스 세부 내용 및 이용자 상태평가 등을 적어요."></textarea></div>
    <div class="note" id="w-note"></div>
  </div>
  <div class="footbar"><div class="inner"><button class="btn" id="w-save" disabled>저장</button></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════
//  상담일지 — 제공인력 신원(가입+PIN게이트) + 008 양식 모델(내담자→월/회차→상세내용).
//  저장·신원·조회 모두 11_플랫폼 GAS(검사_오감과 같은 배포 URL).
//  SMS = 솔라피 연결 — 인증번호는 문자로만 옴(화면 노출 없음).
//  ⚠️ PIN 게이트 = 안심 UX + 가벼운 억제(로컬). 진짜 보호 = 기기 OS 잠금 + 서버 세션검증.
// ════════════════════════════════════════════════════════════

// ── 세션 저장소 ──
function loadSess(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY) || "null"); }catch(e){ return null; } }
function saveSess(s){ localStorage.setItem(SESS_KEY, JSON.stringify(s)); }
function getDevice(){
  let s = loadSess();
  if (s && s.device) return s.device;
  let d = "";
  try { d = (crypto.randomUUID ? crypto.randomUUID() : ("d"+Date.now()+Math.random())).replace(/-/g,""); } catch(e){ d = "d"+Date.now(); }
  return d;
}
async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); $(id).classList.add("active"); window.scrollTo(0,0); }

// ── 자동서식 헬퍼 ──
function bindPhone(el){ el.oninput=()=>{ let d=el.value.replace(/\D/g,"").slice(0,11); if(d.length<4) el.value=d; else if(d.length<8) el.value=d.slice(0,3)+"-"+d.slice(3); else el.value=d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7); el.dispatchEvent(new Event("fmt")); }; }
function bindDate(el){ el.oninput=()=>{ let d=el.value.replace(/\D/g,"").slice(0,8); let out=d.slice(0,4); if(d.length>4) out+=". "+d.slice(4,6); if(d.length>6) out+=". "+d.slice(6,8); el.value=out; el.dispatchEvent(new Event("fmt")); }; }
function normPhone(v){ return String(v||"").replace(/\D/g,"").replace(/^0+/,""); }
function ymd(v){ const d=String(v||"").replace(/\D/g,"").slice(0,8); return d.length===8 ? d.slice(0,4)+"-"+d.slice(4,6)+"-"+d.slice(6,8) : ""; }
function fmtBirth(b8){ const d=String(b8||"").replace(/\D/g,""); return d.length===8 ? d.slice(0,4)+"."+d.slice(4,6)+"."+d.slice(6,8) : d; }
function svcFull(s){ s=String(s||""); if(s.indexOf('아동')>=0||s.indexOf('아청')>=0) return '아동청소년 심리지원 서비스'; if(s.indexOf('성인')>=0) return '성인심리상담 서비스'; if(s.indexOf('정신')>=0) return '정신건강 토탈케어 서비스'; if(s.indexOf('오감')>=0) return '오감쑥쑥 바우처 서비스'; return s; }

function post(obj){ return fetch(GAS_EXEC, {method:"POST", body:JSON.stringify(obj)}).then(r=>{ if(!r.ok) throw new Error("서버 오류 "+r.status); return r.json(); }); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800); }

$("g-pin").oninput=async()=>{
  $("g-pin").value=$("g-pin").value.replace(/\D/g,"").slice(0,4);

  const h=await sha256(s.device + ":" + $("g-pin").value);
  const note=$("gateNote");

  else { note.className="note err"; note.textContent="비밀번호가 달라요"; $("g-pin").value=""; }
};
function markUnlocked(){ try{ sessionStorage.setItem(UNLOCK_KEY,"1"); }catch(e){} }
function needGate(s){ const u=(()=>{ try{ return sessionStorage.getItem(UNLOCK_KEY)==="1"; }catch(e){ return false; } })(); return !u || (Date.now()-(s.lastAuth||0) > GATE_MS); }

function thisMonth(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+"-"+p(d.getMonth()+1); }
function selectClient(c){ curClient=c; openMonth(thisMonth()); }
$("m-back").onclick=()=>{ show("s-clients"); };
$("m-prev").onclick=()=>openMonth(shiftMonth(curYm,-1));
$("m-next").onclick=()=>{ if(curYm >= thisMonth()) return; openMonth(shiftMonth(curYm,1)); };
function shiftMonth(ym, delta){
  let y=parseInt(ym.slice(0,4),10), m=parseInt(ym.slice(5,7),10)-1+delta;
  y += Math.floor(m/12); m = ((m%12)+12)%12;
  return y+"-"+String(m+1).padStart(2,'0');
}
function ymLabel(ym){ return ym.slice(0,4)+"년 "+parseInt(ym.slice(5,7),10)+"월"; }

function openMonth(ym){
  curYm=ym; if(!curClient) return;
  $("m-subject").innerHTML='<div class="nm">'+curClient.name+' <span style="font-size:14px;color:var(--g500);font-weight:500;">('+fmtBirth(curClient.birth)+')</span></div><div class="meta">'+svcFull(curClient.service)+'</div>';
  $("m-ym").textContent = ymLabel(ym);
  $("m-next").disabled = (ym >= thisMonth());   // 미래 월로 못 넘어가게
  $("m-rounds").innerHTML='';
  $("m-note").className="note"; $("m-note").textContent="불러오는 중…";
  show("s-month");
  if(DEMO){ roundData = JSON.parse(JSON.stringify(MOCK_ROUNDS[curClient.name]||{})); $("m-note").textContent=""; renderRounds(); return; }
  const s=loadSess()||{};
  post({action:"journal_get", staffId:s.staffId, session:s.session, child:{name:curClient.name, birth:curClient.birth}, ym}).then(d=>{
    if(d && d.code==="auth"){ sessExpired(); return; }
    roundData = {};
    if(d && d.ok){ (d.rounds||[]).forEach(r=>{ roundData[r.round]={date:r.date, content:r.content}; }); $("m-note").textContent=""; }
    else { $("m-note").className="note err"; $("m-note").textContent=(d&&d.error)||"조회 실패"; }
    renderRounds();
  }).catch(()=>{ $("m-note").className="note err"; $("m-note").textContent="연결이 안 됐어요"; });
}
function renderRounds(){
  const box=$("m-rounds"); box.innerHTML="";
  for(let r=1;r<=4;r++){
    const has = !!(roundData[r] && roundData[r].content);
    const el=document.createElement("div"); el.className="round"+(has?" done":"");
    el.innerHTML='<div class="rn">'+r+'회차</div><div class="st">'+(has? "작성됨" : "비어 있음")+'</div>';
    el.onclick=()=>openRound(r);
    box.appendChild(el);
  }
}

function openRound(r){
  curRound=r;
  const ex = roundData[r] || {};
  $("w-subject").innerHTML='<div class="nm">'+curClient.name+' · '+r+'회차</div><div class="meta">'+ymLabel(curYm)+'</div>';
  // 상담일: 기존 값 있으면 그것, 없으면 비움(상담사가 그 회차 날짜 입력)
  $("w-date").value = ex.date ? ex.date.replace(/-/g,". ") : "";
  $("w-content").value = ex.content || "";
  $("w-save").disabled = !$("w-content").value.trim();
  $("w-note").className="note"; $("w-note").textContent="";
  show("s-write");
}

let _saving=false;
$("w-save").onclick=()=>saveRound(true);
function saveRound(retry){
  if(_saving) return;
  if(DEMO){ roundData[curRound]={date:ymd($("w-date").value), content:$("w-content").value.trim()}; toast(curRound+"회차 저장(데모)"); openMonth(curYm); return; }
  _saving=true;
  const note=$("w-note"); note.className="note"; note.textContent="저장하고 있어요…"; $("w-save").disabled=true;
  const s=loadSess()||{};
  const body={ action:"journal", staffId:s.staffId, session:s.session,
    child:{ name:curClient.name, birth:curClient.birth }, service:curClient.service||"",
    ym:curYm, round:curRound, date:ymd($("w-date").value), content:$("w-content").value.trim() };
  post(body).then(d=>{
    if(d && d.ok){ _saving=false; roundData[curRound]={date:body.date, content:body.content}; toast(curRound+"회차 저장했어요"); openMonth(curYm); return; }
    if(d && d.code==="auth"){ _saving=false; sessExpired(); return; }
    throw new Error((d&&d.error)||"저장 실패");
  }).catch(err=>{
    _saving=false; note.className="note err";
    if(retry){ note.textContent="다시 시도하고 있어요…"; setTimeout(()=>saveRound(false),1500); return; }
    $("w-save").disabled=false;
    note.innerHTML='저장이 안 됐어요. <button class="lk" id="retrySave">다시 저장</button>';
    const b=$("retrySave"); if(b) b.onclick=()=>saveRound(true);
  });
}

bindDate($("gc-birth"));
function vgc(){ $("gc-btn").disabled = !($("gc-name").value.trim() && ymd($("gc-birth").value)); }
$("gc-name").oninput=vgc; $("gc-birth").addEventListener("fmt",vgc);
$("gc-back").onclick=()=>show("s-mode");
$("gc-btn").onclick=()=>{
  const name=$("gc-name").value.trim(), birth=ymd($("gc-birth").value);
  if(!name || !birth) return;
  gClient={ name, birth:birth.replace(/-/g,"") };   // birth8(YYYYMMDD)
  loadGRounds();
};

// ── 회기 목록 ──
function loadGRounds(){
  $("gr-subject").innerHTML='<div class="nm">'+escapeHtml(gClient.name)+' <span style="font-size:14px;color:var(--g500);font-weight:500;">('+fmtBirth(gClient.birth)+')</span></div><div class="meta">일반 상담</div>';
  $("gr-list").innerHTML=""; $("gr-count").textContent="";
  $("gr-note").className="note"; $("gr-note").textContent="불러오는 중…";
  show("s-grounds");
  if(DEMO){ gRounds = JSON.parse(JSON.stringify(DEMO_GROUNDS[gClient.name]||{})); $("gr-note").textContent=""; renderGRounds(); return; }
  const s=loadSess()||{};
  post({action:"gjournal_get", staffId:s.staffId, session:s.session, child:{name:gClient.name, birth:gClient.birth}}).then(d=>{
    if(d && d.code==="auth"){ sessExpired(); return; }
    gRounds={};
    if(d && d.ok){ (d.rounds||[]).forEach(r=>{ gRounds[r.round]=r; }); $("gr-note").textContent=""; }
    else { $("gr-note").className="note err"; $("gr-note").textContent=(d&&d.error)||"조회를 못 했어요"; }
    renderGRounds();
  }).catch(()=>{ $("gr-note").className="note err"; $("gr-note").textContent="연결이 안 됐어요"; });
}
function renderGRounds(){
  const rounds=Object.keys(gRounds).map(Number).sort((a,b)=>a-b);
  $("gr-count").textContent = rounds.length ? "기록 "+rounds.length+"회기" : "";
  const box=$("gr-list"); box.innerHTML="";
  if(!rounds.length){ box.innerHTML='<div class="empty">아직 기록이 없어요. 새 회기를 적어 보세요.</div>'; return; }
  rounds.forEach(r=>{
    const it=gRounds[r]||{};
    const sub=[it.date, it.complaint].filter(Boolean).join(" · ") || "기록 있음";
    const el=document.createElement("div"); el.className="client-card";
    el.innerHTML='<div><div class="nm">'+r+'회기</div><div class="meta">'+escapeHtml(sub)+'</div></div>'
      +'<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>';
    el.onclick=()=>openGRound(r);
    box.appendChild(el);
  });
}
$("gr-back").onclick=()=>show("s-gclient");
$("gr-new").onclick=()=>{ const rs=Object.keys(gRounds).map(Number); openGRound(rs.length?Math.max.apply(null,rs)+1:1); };

// ── 7칸 폼 ──
bindDate($("gw-date"));
$("gw-complaint").oninput=validateGW;
$("gw-content").oninput=validateGW;
$("gw-date").addEventListener("fmt",validateGW);
$("gw-risknote").oninput=validateGW;

function renderTags(){
  const box=$("gw-tags"); box.innerHTML="";
  COMPLAINT_TAGS.forEach(t=>{
    const b=document.createElement("button"); b.type="button"; b.className="chip"+(gTagsSel.has(t)?" on":""); b.textContent=t;
    b.onclick=()=>{ if(gTagsSel.has(t)) gTagsSel.delete(t); else gTagsSel.add(t); b.classList.toggle("on"); };
    box.appendChild(b);
  });
}
function renderScore(){
  const box=$("gw-score"); box.innerHTML="";
  for(let i=1;i<=5;i++){
    const b=document.createElement("button"); b.type="button"; if(String(i)===gScore) b.className="on"; b.textContent=i;
    b.onclick=()=>{ gScore = (gScore===String(i)) ? "" : String(i); renderScore(); };   // 다시 누르면 해제(선택 항목)
    box.appendChild(b);
  }
}
function renderRisk(){
  const box=$("gw-risk"); box.innerHTML="";
  RISK_OPTS.forEach(o=>{
    const b=document.createElement("button"); b.type="button"; let cls=(o===gRisk?"on":""); if(o==="위기") cls=(cls+" danger").trim(); b.className=cls; b.textContent=o;
    b.onclick=()=>{ gRisk=o; if(o==="없음") $("gw-risknote").value=""; renderRisk(); toggleRiskBox(); validateGW(); };
    box.appendChild(b);
  });
}
function toggleRiskBox(){ $("gw-riskbox").style.display = (gRisk!=="없음") ? "block" : "none"; }

// 회기번호(gCurRound)는 진입 시 확정(새 회기=max+1, 기존=그 번호) — 폼에서 못 바꿈(다른 회기 덮어쓰기 방지).
function gwSnapshot(){ return JSON.stringify([ymd($("gw-date").value), $("gw-complaint").value.trim(), Array.from(gTagsSel).sort(), $("gw-content").value.trim(), gScore, $("gw-opinion").value.trim(), gRisk, $("gw-risknote").value.trim()]); }
function validateGW(){
  const dateOk = !!ymd($("gw-date").value);
  const roundOk = gCurRound>=1 && gCurRound<=999;
  const hasText = !!($("gw-complaint").value.trim() || $("gw-content").value.trim());   // 백엔드: 주호소 OR 회기내용 필수
  const riskOk = (gRisk==="없음") || !!$("gw-risknote").value.trim();                    // 위험 표시 시 상세 필수
  $("gw-save").disabled = !(dateOk && roundOk && hasText && riskOk);
}

function openGRound(r){
  gCurRound=r;
  const ex=gRounds[r]||{};
  $("gw-subject").innerHTML='<div class="nm">'+escapeHtml(gClient.name)+' · '+r+'회기</div><div class="meta">'+fmtBirth(gClient.birth)+'</div>';
  $("gw-date").value = ex.date ? ex.date.replace(/-/g,". ") : "";
  $("gw-complaint").value = ex.complaint || "";
  gTagsSel = new Set(ex.tags ? String(ex.tags).split(",").map(t=>t.trim()).filter(Boolean) : []); renderTags();
  $("gw-content").value = ex.content || "";
  gScore = (Number(ex.score)>=1 && Number(ex.score)<=5) ? String(Number(ex.score)) : ""; renderScore();
  $("gw-opinion").value = ex.opinion || "";
  gRisk = ex.risk || "없음"; renderRisk(); toggleRiskBox();
  $("gw-risknote").value = ex.riskNote || "";
  $("gw-note").className="note"; $("gw-note").textContent="";
  validateGW();
  gwLoaded = gwSnapshot();
  show("s-gwrite"); window.scrollTo(0,0);
}
$("gw-back").onclick=()=>{ if(gwSnapshot()!==gwLoaded && !confirm("저장하지 않은 내용이 있어요. 나갈까요?")) return; show("s-grounds"); };

$("gw-save").onclick=()=>saveGRound(true);
function saveGRound(retry){
  if(_gsaving) return;
  const round=gCurRound;
  const payload={ child:{ name:gClient.name, birth:gClient.birth }, date:ymd($("gw-date").value), round:round,
    complaint:$("gw-complaint").value.trim(), tags:Array.from(gTagsSel), content:$("gw-content").value.trim(),
    score:gScore, opinion:$("gw-opinion").value.trim(), risk:gRisk, riskNote:$("gw-risknote").value.trim() };
  const local=Object.assign({}, payload, { tags:payload.tags.join(", ") });   // 목록 캐시용(tags 문자열로 통일)
  if(DEMO){ gRounds[round]=local; gwLoaded=gwSnapshot(); toast(round+"회기 저장(데모)"); renderGRounds(); show("s-grounds"); return; }
  _gsaving=true;
  const note=$("gw-note"); note.className="note"; note.textContent="저장하고 있어요…"; $("gw-save").disabled=true;
  const s=loadSess()||{};
  post(Object.assign({ action:"gjournal", staffId:s.staffId, session:s.session, via:"태블릿" }, payload)).then(d=>{
    if(d && d.ok){ _gsaving=false; gRounds[round]=local; gwLoaded=gwSnapshot(); toast(round+"회기 저장했어요"); renderGRounds(); show("s-grounds"); return; }
    if(d && d.code==="auth"){ _gsaving=false; sessExpired(); return; }
    throw new Error((d&&d.error)||"저장 실패");
  }).catch(err=>{
    _gsaving=false; note.className="note err";
    if(retry){ note.textContent="다시 시도하고 있어요…"; setTimeout(()=>saveGRound(false),1500); return; }
    $("gw-save").disabled=false;
    note.innerHTML='저장이 안 됐어요. <button class="lk" id="gretry">다시 저장</button>';
    const b=$("gretry"); if(b) b.onclick=()=>saveGRound(true);
  });
}

// 작성 중 페이지 이탈(홈·닫기·새로고침) 경고 — 008(s-write)·일반(s-gwrite) 공통. 화면 전환은 값 유지라 제외.
window.addEventListener("beforeunload", e=>{
  const a=document.querySelector(".screen.active"); if(!a) return;
  const dirty = (a.id==="s-write" && $("w-content").value.trim())
             || (a.id==="s-gwrite" && gwSnapshot()!==gwLoaded);
  if(dirty){ e.preventDefault(); e.returnValue=""; }
});

boot();
</script>
</body>
</html>
