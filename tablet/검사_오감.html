<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/saenggak/kakao-escape.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>사전사후검사 — 생각공작소</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    /* TOKENS:START — §3.1 정본 토큰. 직접 편집 금지: docs/1 §3.1 고치고 node 디자인프리뷰/토큰동기.js */

  /* 회색 — §3.1 정본(중립 회색 스케일). 필요한 칸만 골라 써도 되나 이름·값은 이대로 */
  --g50:#f9fafb; --g100:#f2f4f6; --g200:#e5e8eb; --g300:#d1d6db;
  --g400:#b0b8c1; --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968;
  --g800:#333d4b; --g900:#191f28;
  /* 초록 — §3.1 OKLCH 스케일(회색 명도 사다리 고정, green600=브랜드 #3a8a5f 앵커).
     밝은 50~400 = 토스 weak 실측 기반 재보정(2026-07-04 유성 #e9f8ee 확정 — ex43 실측 C.021·브랜드 H157,
     100→500 수렴 가중 1/.85/.62/.40/.20으로 이음새 없음. 옛 A안 채도부스트 값 폐기) */
  --green50:#f8fbf9; --green100:#e9f8ee; --green200:#cef2db; --green300:#a7e7c0; --green400:#7bcb9c;
  --green500:#57a77a; --green600:#3a8a5f; --green700:#166841; --green800:#01492a; --green900:#002614;
  --green:var(--green600); --green-dark:var(--green700); --green-bg:var(--green100);  /* 별칭(기존 코드 호환) */
  /* 시맨틱 */
  --red:#f04452;           /* 에러·경고 상태(폼 오류·OTP 오류·알림) */
  --ink-on-dark:#F9FBFA;   /* 어두운 배경 흰 글씨(§3.5 line125) */
  /* 버튼·뱃지 시맨틱 (§4.14 버튼 체계 — 유성 2026-07-02) */
  --dark:#525966;          /* dark variant(중립 짙은 회색 버튼/뱃지) + 흰 폰트 */
  --danger:#D25357;        /* danger variant(파괴적 액션 버튼/뱃지) + 흰 폰트. ※--red(#f04452)와 구분: red=상태알림, danger=버튼 */
  --danger-weak-bg:#fdecee; --danger-weak-fg:#c0392b;   /* danger weak(연빨강 채움+진한빨강 폰트) */
  --p-disabled:#b7e0c8; --dark-disabled:#c8ccd0; --danger-disabled:#f2cdce;   /* disabled = variant 흐린 버전+흰폰트(회색 아님) */
  /* 라운드 — §3.3 */
  --r-sm:clamp(7px,1.8vw,10px); --r-md:clamp(10px,2.6vw,14px); --r-lg:clamp(13px,3.2vw,20px);
  /* 타입 스케일 — §3.2 (큰 제목 clamp 유동 / 본문 고정) */
  --fs-display:clamp(28px,6vw,42px); --fs-h1:clamp(23px,3.4vw,30px); --fs-h2:clamp(20px,2.6vw,26px); --fs-h3:20px;
  --fs-title:17px; --fs-body:15px; --fs-sm:13.5px; --fs-caption:12px;
  /* TOKENS:END */
    --green-d:var(--green700); --green-l:var(--green100);   /* 폐기 별칭 호환(usage 미교체 — rename은 3-G 점진) */
    --mint-h:#d8e4e2; --mint-l:#eef4ef;   /* 검사_오감 전용 */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}   /* 롱프레스→구글검색 차단(ex9) */
  input,textarea{-webkit-user-select:text;user-select:text;}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:#fff;color:var(--g900);word-break:keep-all;line-height:1.5;}
  .screen{display:none;}
  .screen.active{display:block;}
  .wrap{max-width:720px;margin:0 auto;padding:20px 22px 48px;}
  .back{
    display:flex; align-items:center; justify-content:flex-start;
    width:40px; height:40px; margin:0 0 4px 0; border-radius:var(--r-md);
    border:none; background:transparent; text-decoration:none;
    color:var(--g700); cursor:pointer; position:sticky; top:0; z-index:5;   /* §5.8 인증번호 확인 페이지식 */
  }
  .back svg{width:24px;height:24px;display:block;}
  .back:active{background:var(--g100);}

  /* 진행바 */
  .progress{position:sticky;top:0;background:#fff;padding:14px 0 10px;z-index:5;}
  .progress .bar{height:6px;background:var(--g100);border-radius:99px;overflow:hidden;}
  .progress .fill{height:100%;background:var(--green);width:0;transition:width .25s;}
  .progress .lbl{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--g500);font-weight:600;}

  h1{font-size:24px;font-weight:700;letter-spacing:-.6px;margin:8px 2px 6px;}
  .sub{font-size:14.5px;color:var(--g500);font-weight:500;margin:0 2px 24px;}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .head-row h1{margin-bottom:0;}
  .who{display:inline-block;font-size:13px;font-weight:700;color:var(--green-d);background:var(--green-l);border-radius:var(--r-sm);padding:5px 11px;white-space:nowrap;}   /* 우상단 상담사/행정명(상담일지와 동일) */

  /* 입력 */
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:14px;font-weight:600;color:var(--g700);margin:0 2px 8px;}
  .field input{width:100%;font-family:inherit;font-size:17px;padding:16px 17px;border-radius:var(--r-md);border:2px solid transparent;background:var(--g100);outline:none;transition:.15s;}
  .field input::placeholder{color:var(--g400);font-weight:500;}   /* 예시 텍스트는 연하게(현금영수증 폼과 동일) */
  .field input:focus{background:#fff;border-color:var(--green);}
  .toggle{display:flex;gap:10px;}
  .toggle button{flex:1;font-family:inherit;font-size:16px;font-weight:600;padding:15px;border-radius:var(--r-md);border:2px solid transparent;background:var(--g100);color:var(--g700);cursor:pointer;transition:.12s;}   /* §4.9 면 문법(테두리 0, 2026-07-04) */
  .toggle button.on{background:var(--green-l);color:var(--green-d);}

  /* 버튼 */
  .btn{width:100%;font-family:inherit;font-size:17px;font-weight:700;padding:17px;border-radius:var(--r-md);border:none;background:var(--green);color:#fff;cursor:pointer;margin-top:14px;transition:.12s;position:relative;overflow:hidden;}
  .btn:active{transform:scale(.97);background:var(--green-d);}
  .btn:disabled{background:var(--p-disabled);color:#fff;cursor:default;transform:none;}   /* §4.14 게이팅 비활성=연초록+흰폰트(F7, 옛 g200/g500) */
  .btn.loading:disabled{background:var(--green);color:#fff;}   /* 로딩(.loading 클래스)=채운초록 유지 */
  .btn.loading .ld-dots{margin-left:8px;vertical-align:middle;}
  .btn.loading .ld-dots i{background:#fff;}   /* 초록 버튼 위 점=흰색(§4.13-4) */
  @keyframes shakeX{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
  .btn.shake{animation:shakeX .4s cubic-bezier(.36,.07,.19,.97);}   /* 비활성 버튼 탭=좌우 흔들림(§4.9 '지금 못 눌러요' 능동표시, 상담일지 패턴) */
  .btn.ghost{background:var(--g100);color:var(--g700);}
  .btn.ghost:active{background:var(--g200);}   /* ghost=박스형 → darken만(초록 플래시 X, §5.3-2) */
  /* 누름 ripple(§5.3-1) — 레퍼런스=index.html pressRipple */
  .bl{position:relative; z-index:1;}   /* 라벨을 ripple 위 레이어로(흰 글자 유지) */
  .rip{position:absolute; z-index:0; top:50%; width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,.16); transform:translate(-50%,-50%) scale(0); pointer-events:none;}
  .rip.go{transform:translate(-50%,-50%) scale(var(--rs,16)); transition:transform .46s cubic-bezier(.25,.6,.3,1);}
  .rip.fade{opacity:0; transition:opacity .3s;}

  /* 문항 */
  .q{padding:18px 2px;border-bottom:1px solid var(--g100);}
  .q .qtext{font-size:16px;font-weight:600;letter-spacing:-.3px;margin-bottom:12px;}
  .q .qtext .num{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:var(--r-sm);background:var(--g100);color:var(--g500);font-size:13px;font-weight:700;margin-right:8px;vertical-align:middle;}
  .opts{display:flex;gap:8px;}
  .opts button{flex:1;font-family:inherit;font-size:13.5px;font-weight:600;padding:12px 4px;border-radius:var(--r-md);border:2px solid transparent;background:var(--g100);color:var(--g700);cursor:pointer;line-height:1.3;transition:.1s;}   /* §4.9 면 문법 — 선택 솔리드는 F1 확정 유지 */
  .opts button.on{background:var(--green);color:#fff;}
  .q.unanswered.flash{animation:flash .5s;}
  @keyframes flash{0%,100%{background:#fff;}50%{background:#fff0f1;}}

  .sec-title{font-size:19px;font-weight:700;letter-spacing:-.4px;margin:6px 2px 2px;}
  .sec-desc{font-size:13.5px;color:var(--g500);margin:0 2px 8px;}

  /* ===== 결과지 (A4 가로 비율) ===== */
  #s-result .wrap{max-width:1060px;}
  #resultDoc{background:#fff;overflow-x:auto;}
  .report{border:1.6px solid var(--g900);margin-top:8px;min-width:920px;}
  .rtitle{text-align:center;font-size:24px;font-weight:800;letter-spacing:-1px;padding:16px 0 4px;}
  .rname{padding:2px 18px 12px;font-size:14px;}
  .rname b{display:inline-block;background:var(--g100);padding:3px 14px;border-radius:var(--r-sm);margin-left:6px;font-weight:600;}
  table.rt{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;}
  table.rt th,table.rt td{border:1px solid var(--g300);padding:4px 6px;text-align:center;vertical-align:middle;}
  table.rt thead th{background:var(--mint-h);font-weight:700;height:32px;}
  table.rt tbody tr{height:40px;}                  /* 하위영역 행 높이 균일 */
  .method{background:var(--mint-l);font-weight:700;line-height:1.55;}
  .method .mtag{color:var(--green-d);}
  .critcell{padding:6px 8px!important;}
  .crit{width:100%;border-collapse:collapse;font-size:11px;}
  .crit th,.crit td{border:1px solid var(--g300);padding:0 4px;height:24px;text-align:center;white-space:nowrap;}  /* crit 행 높이 균일 */
  .crit th{background:#fafbfc;color:var(--g700);font-weight:600;}
  .crit .rk{background:#fafbfc;font-weight:600;}
  .desc{font-size:10.5px;color:var(--g700);line-height:1.5;text-align:left;padding:6px 2px 0;}
  .grp{background:#fafbfc;font-weight:700;}          /* 세로쓰기 제거 → 가로 두 글자 */
  .score{font-weight:700;font-size:14px;}
  .judge.danger{color:var(--red);font-weight:700;}
  /* 사전→사후 델타 표시 */
  .sc-prev{color:var(--g400);font-weight:600;}
  .sc-arr{color:var(--g400);}
  .dlt{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;border-radius:var(--r-sm);margin-left:2px;white-space:nowrap;}
  .dlt.up{background:var(--green-l);color:var(--green-d);}   /* 개선 */
  .dlt.down{background:#fdecee;color:var(--red);}            /* 심화 */
  .dlt.same{background:var(--g100);color:var(--g500);}       /* 유지 */
  .rfoot{font-size:12.5px;line-height:1.6;padding:13px 18px;text-align:center;}
  .rfoot .flabel{display:block;font-weight:700;margin-bottom:3px;color:var(--g700);}

  /* 결과 화면 액션 = 고정 footbar(상담일지 s-print 문법 통일 — L6, 유성 2026-07-05). 옛 .print-row(스크롤 끝 인라인) 폐기 */
  #s-result .wrap,#s-view .wrap{padding-bottom:120px;}   /* footbar 가림 방지 */

  /* ===== 허브 목록 카드(이용자·이력) — 09 카드 톤(흰+옅은 보더+은은한 그림자) ===== */
  .list-card{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
    background:#fff;border:1.5px solid var(--g200);border-radius:var(--r-md);padding:16px 18px;margin-bottom:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;font-family:inherit;transition:.12s;}
  .list-card:active{border-color:var(--green);background:var(--green-l);}
  .list-card .lc-main{min-width:0;}
  .list-card .lc-name{font-size:17px;font-weight:700;color:var(--g900);letter-spacing:-.3px;}
  .list-card .lc-sub{font-size:13px;color:var(--g500);margin-top:3px;font-weight:500;}
  .list-card .lc-meta{font-size:13px;color:var(--g500);font-weight:600;white-space:nowrap;flex-shrink:0;text-align:right;}
  .list-card .lc-meta .lc-draw{display:block;color:var(--green-d);font-weight:700;}
  .list-empty{text-align:center;color:var(--g500);font-size:14.5px;padding:40px 16px;line-height:1.6;}
  /* §5.4 스켈레톤 — 목록 로드=구조 미리보기(실제 카드와 같은 위치·크기 회색 바). 점(§5.2)은 버튼 액션·짧은 대기용 */
  .sk-b{background:var(--g100);border-radius:7px;animation:skp 1.2s ease-in-out infinite;}
  @keyframes skp{0%,100%{opacity:1}50%{opacity:.5}}
  .list-card.skel{pointer-events:none;}
  .retry-btn{display:inline-block;margin-top:12px;padding:12px 26px;border:none;border-radius:var(--r-md);background:var(--green);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;position:relative;overflow:hidden;}   /* §4.5 경량 골격(F9) */
  .retry-btn:active{background:var(--green-d);transform:scale(.97);}
  /* 로딩 = 글자 + 점 3개 출렁(정적 '…' 금지, 1_원칙_디자인UX §7.1) — 상담일지 loadingNote와 동일 */
  .ld{display:inline-flex;align-items:center;gap:9px;color:var(--g500);font-weight:500;}
  .ld-dots{display:inline-flex;gap:5px;}
  .ld-dots i{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;animation:ldb 1.1s ease-in-out infinite;}
  .ld-dots i:nth-child(2){animation-delay:.16s;} .ld-dots i:nth-child(3){animation-delay:.32s;}
  @keyframes ldb{0%,75%,100%{transform:translateY(0);opacity:.4;}38%{transform:translateY(-6px);opacity:1;}}

  /* ===== 등록폼: 토스식 입력(라벨·밑줄·X·그린캐럿) — docs §5.5 / 상담일지 signup 복제 ===== */
  #s-register .wrap{padding-top:64px;padding-bottom:120px;position:relative;}   /* footbar 가림 방지 + §5.6-6 위 여백 */
  #s-register .back{position:absolute;top:18px;left:22px;margin:0;}              /* 화살표가 제목 안 밀게(§5.6-6) */
  html:has(#s-register input:focus){overflow:hidden;}                            /* 적은-칸=키보드 시 스크롤 잠금=고정(§5.5 ⓗ, 위여백 고정·점프 없음) */
  .tfield{margin-bottom:24px;}
  .tfield label{display:block;font-size:13.5px;font-weight:600;color:var(--g500);margin:0 0 6px;transition:color .15s;}
  .tfield.focus label{color:var(--green);}
  .tin-wrap{position:relative;border-bottom:2px solid var(--g200);transition:border-color .15s;}
  .tfield.focus .tin-wrap{border-color:var(--green);}
  .tin-wrap input{width:100%;border:none;background:none;outline:none;font-family:inherit;font-size:22px;font-weight:600;color:var(--g900);padding:2px 40px 5px 0;caret-color:var(--green);}
  .tin-wrap input::placeholder{color:var(--g300);font-weight:500;}
  .tin-wrap .clr{position:absolute;right:0;top:8px;width:19px;height:19px;border-radius:50%;background:var(--g300);border:none;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .tfield.has-val .clr{display:flex;}
  .tin-wrap .clr svg{width:10px;height:10px;color:#fff;display:block;}
  .reg-sex{margin-bottom:24px;}
  .reg-sex>label{display:block;font-size:13.5px;font-weight:600;color:var(--g500);margin:0 0 8px;}
  .reg-note{font-size:13px;color:var(--red);font-weight:600;min-height:18px;margin:2px;}

  /* 하단 고정 버튼(키보드 위) — §5.5 ⓐ */
  .footbar{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:12px 22px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--g100);transition:transform .25s cubic-bezier(.2,.7,.3,1);}
  .footbar .inner{max-width:720px;margin:0 auto;display:flex;gap:10px;}
  .footbar .btn{width:auto;flex:1;margin-top:0;}
  .footbar.kb{padding:0;border-top:none;transition:none;}                        /* (meta 미지원 폴백) 키보드 위로 올라가면 꽉 차게 + 즉시 추종 */
  .footbar.kb .inner{max-width:none;gap:0;}
  .footbar.kb .btn{border-radius:0;padding:19px;}
  /* resizes-content 환경=visualViewport로 키보드 감지 안 됨 → 입력 포커스면 :has로 footbar 꽉 차게(§5.5 ⓐ) */
  .screen:has(input:focus,textarea:focus) .footbar{padding:0;border-top:none;transition:none;}
  .screen:has(input:focus,textarea:focus) .footbar .inner{max-width:none;gap:0;}
  .screen:has(input:focus,textarea:focus) .footbar .btn{border-radius:0;padding:19px;}

  /* ===== 아동 상세: 검사 종류 카드 / 사정·사후 선택 ===== */
  .sec-h{font-size:14px;font-weight:700;color:var(--g700);margin:26px 2px 12px;}
  .type-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--g200);border-radius:var(--r-md);padding:18px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;font-family:inherit;transition:.12s;}
  .type-card:active{border-color:var(--green);background:var(--green-l);}
  .type-card.soon{opacity:.55;cursor:default;box-shadow:none;}
  .type-card .tc-name{font-size:16px;font-weight:700;color:var(--g900);}
  .type-card .tc-sub{font-size:13px;color:var(--g500);margin-top:2px;font-weight:500;}
  .pick-card{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--g200);border-radius:var(--r-md);padding:20px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;font-family:inherit;transition:.12s;}
  .pick-card:active{border-color:var(--green);background:var(--green-l);}
  .pick-card .pc-name{font-size:18px;font-weight:700;color:var(--g900);}
  .pick-card .pc-sub{font-size:13.5px;color:var(--g500);margin-top:4px;font-weight:500;}

  @media print{
    @page{size:A4 landscape;margin:8mm;}
    body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .noprint{display:none!important;}
    .wrap{max-width:none;padding:0;}
    #resultDoc{overflow:visible;}
    .report{border-color:#000;min-width:0;}
  }
</style>
<script src="/saenggak/favicon.js"></script>
</head>
<body>

<!-- ===== 허브 0: 세션 없음 안내 ===== -->
<div class="screen" id="s-gate">

<script>
// ===== 문항 데이터 =====
const SDQ_ITEMS = [

  "자주 불행해 보이고, 낙담하며, 눈물이 고인다.",
  "대체로 다른 아이들이 내 자녀를 좋아한다.",
  "쉽게 주의가 분산되고, 집중력이 산만하다.",
  "낯선 상황에서는 불안해하거나 안 떨어지려 하고, 쉽사리 자신감을 잃는다.",

  "종종 거짓말을 하거나 속인다.",
  "다른 아이들에게 놀림을 받거나 괴롭힘을 당한다.",
  "자주 부모나 선생님, 또는 다른 아이들을 자진해서 돕는다.",
  "곰곰이 생각한 다음에 행동한다.",
  "가정이나 학교 또는 어떤 곳에서 무언가를 훔친다.",
  "또래 아이들보다 어른들과 더 잘 지낸다.",
  "두려움이 많고 무서움을 잘 탄다.",
  "주어진 일을 끝까지 마치고, 주의력을 잘 유지한다."
];
const SDQ_OPTS = ["전혀 아니다","다소 그렇다","분명히 그렇다"]; // 0,1,2

const KARS_ITEMS = [
  "세부적인 면에 대해 꼼꼼하게 주의를 기울이지 못하거나, 학업에서 부주의한 실수를 한다.",
  "손발을 가만히 두지 못하거나, 의자에 앉아서도 몸을 꼼지락거린다.",
  "일을 하거나 놀이를 할 때, 지속적으로 주의를 집중하는데 어려움이 있다.",
  "자리에 앉아 있어야 하는 교실이나 다른 상황에서 앉아있지 못한다.",
  "다른 사람이 마주 보고 이야기할 때, 경청하지 않는 것처럼 보인다.",
  "상황에 부적절하게 뛰어다니거나 높은 곳에 기어오른다.",
  "지시를 따르지 않고, 일을 끝내지 못한다.",
  "여가 활동이나 재미있는 일에 조용히 참여하기가 어렵다.",
  "과제와 일을 체계적으로 하지 못한다.",
  "끊임없이 무엇인가를 하거나 마치 모터가 돌아가듯 움직인다.",
  "지속적인 노력이 요구되는 과제(학교 공부나 숙제)를 하지 않으려 한다.",
  "지나치게 말을 많이 한다.",
  "과제나 일을 하는데 필요한 물건들은 잃어버린다.",
  "질문이 채 끝나기도 전에 성급하게 대답한다.",
  "쉽게 주의가 분산된다.",
  "차례를 기다리는 데 어려움이 있다.",
  "일상적으로 하는 일을 잊어버린다.",
  "다른 사람을 방해하거나 간섭한다."
];
const KARS_OPTS = ["전혀 그렇지 않다","때때로 그렇다","자주 그렇다","매우 자주 그렇다"]; // 0,1,2,3

const sdqAns = new Array(25).fill(null);
const karsAns = new Array(18).fill(null);

// ===== 상태 =====
const state = {sex:""};        // 등록폼 성별
let activeChild = null;        // 검사/이력 중인 아이 {name, birth8, sex, phone}
let activeDraw  = "사전";       // 이 검사의 차수(사정/사후) — s-pick에서 정함

function bindToggle(id, key){
  document.querySelectorAll("#"+id+" button").forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll("#"+id+" button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on"); state[key]=b.dataset.v; validateRegister();
    };
  });
}
bindToggle("reg-sex","sex");

// 토스식 입력 동작: 포커스 라벨/밑줄 + 우측 X + 값 채워짐(docs §5.5) — 상담일지 setupTField 복제
function setupTField(tf){
  const inp=tf.querySelector("input"), clr=tf.querySelector(".clr");
  const upd=()=>tf.classList.toggle("has-val", inp.value.length>0);
  inp.addEventListener("focus",()=>{ inp.removeAttribute("readonly"); tf.classList.add("focus"); });   // readonly 해제=자동완성 차단 후 입력
  inp.addEventListener("blur",()=>tf.classList.remove("focus"));
  inp.addEventListener("input",upd);
  clr.addEventListener("click",()=>{ inp.value=""; inp.dispatchEvent(new Event("input")); inp.focus(); });   // 비우고 검증·서식·has-val 재실행 + 포커스 유지
  upd();
}
["rf-name","rf-birth","rf-phone"].forEach(id=>setupTField(document.getElementById(id)));

// 생년월일 자동서식 — 다 채우면 키패드 닫힘(고치러 다시 연 경우엔 안 닫음, 원칙 §5.5)
const birth=document.getElementById("reg-birth");
birth.addEventListener("focus",()=>{ birth._wasFull = birth.value.replace(/\D/g,"").length>=8; });
birth.addEventListener("input",()=>{
  let d=birth.value.replace(/\D/g,"").slice(0,8);
  let out=d.slice(0,4);
  if(d.length>4) out+=". "+d.slice(4,6);
  if(d.length>6) out+=". "+d.slice(6,8);
  birth.value=out; validateRegister();
  if(d.length===8 && !birth._wasFull) birth.blur();
});
// 전화 자동 하이픈 — 동일 규칙
const phone=document.getElementById("reg-phone");
phone.addEventListener("focus",()=>{ phone._wasFull = phone.value.replace(/\D/g,"").length>=11; });
phone.addEventListener("input",()=>{
  let d=phone.value.replace(/\D/g,"").slice(0,11);
  if(d.length<4) phone.value=d;
  else if(d.length<8) phone.value=d.slice(0,3)+"-"+d.slice(3);
  else phone.value=d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);
  validateRegister();
  if(d.length===11 && !phone._wasFull) phone.blur();
});
document.getElementById("reg-name").addEventListener("input",validateRegister);

function validateRegister(){
  const ok = document.getElementById("reg-name").value.trim()
    && birth.value.replace(/\D/g,"").length===8
    && state.sex
    && phone.value.replace(/\D/g,"").length>=10;
  document.getElementById("regBtn").disabled=!ok;
}
validateRegister();

// ===== 문항 렌더 =====
function renderQuestions(listId, items, opts, ansArr, onChange){
  const box=document.getElementById(listId);
  box.innerHTML="";
  items.forEach((txt,i)=>{
    const q=document.createElement("div");
    q.className="q"; q.dataset.i=i;
    const optBtns=opts.map((o,v)=>`<button type="button" data-v="${v}">${o}</button>`).join("");
    q.innerHTML=`<div class="qtext"><span class="num">${i+1}</span>${txt}</div><div class="opts">${optBtns}</div>`;
    q.querySelectorAll(".opts button").forEach(b=>{
      b.onclick=()=>{
        q.querySelectorAll(".opts button").forEach(x=>x.classList.remove("on"));
        b.classList.add("on"); ansArr[i]=parseInt(b.dataset.v);
        q.classList.remove("unanswered","flash"); onChange();
      };
    });
    box.appendChild(q);
  });
}
function countAnswered(arr){return arr.filter(x=>x!==null).length;}

function updateSdq(){
  const n=countAnswered(sdqAns);
  document.getElementById("sdqCount").textContent=n+" / 25";
  document.getElementById("sdqFill").style.width=(n/25*100)+"%";
}
function updateKars(){
  const n=countAnswered(karsAns);
  document.getElementById("karsCount").textContent=n+" / 18";
  document.getElementById("karsFill").style.width=(n/18*100)+"%";
}

// ===== 미응답 검사 =====
function firstUnanswered(listId, arr){
  for(let i=0;i<arr.length;i++){
    if(arr[i]===null){
      const q=document.querySelector(`#${listId} .q[data-i="${i}"]`);
      q.classList.add("unanswered","flash");
      q.scrollIntoView({behavior:"smooth",block:"center"});
      setTimeout(()=>q.classList.remove("flash"),600);
      return i;
    }
  }
  return -1;
}

// ===== 화면 전환 =====
function show(id){
  document.querySelectorAll(".footbar").forEach(f=>{ f.style.transform=""; f.classList.remove("kb"); });   // 키보드 올린 채 전환 시 잔류 방지
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}
document.getElementById("toKars").onclick=()=>{
  if(firstUnanswered("sdqList",sdqAns)>=0) return;
  show("s-kars");
};
document.getElementById("toResult").onclick=()=>{
  if(firstUnanswered("karsList",karsAns)>=0) return;
  if(!examStamp) examStamp=nowStamp();   // 이 실시의 고정 시각(멱등키) — 첫 결과보기 때 1회
  fetchPrev().then(prev=>{               // 사후+신원세션이면 사전 점수 조회(델타). 실패/없음=단회 폴백.
    prevData = prev;
    renderReport(); show("s-result");
    saveExam(true);                      // 결과 표시 후 백그라운드 적립 (화면을 막지 않음)
  });
};
document.getElementById("backEdit").onclick=()=>show("s-kars");

// ===== 채점 =====
function scoreSDQ(a){
  // 응답 a[i] = 0,1,2 (검사지 1~3 기준 -1 환산과 동일)
  const social=[1,4,9,17,20], hyper=[2,10,15,21,25], emotion=[3,8,13,16,24],
        conduct=[5,7,12,18,22], peer=[6,11,14,19,23], reverse=[7,11,14,21,25];
  const val=(itemNum)=>{
    const raw=a[itemNum-1];                 // 0~2
    return reverse.includes(itemNum) ? (2-raw) : raw;
  };
  const sum=(arr)=>arr.reduce((s,n)=>s+val(n),0);
  const sc={social:sum(social),hyper:sum(hyper),emotion:sum(emotion),conduct:sum(conduct),peer:sum(peer)};
  sc.total=sc.hyper+sc.emotion+sc.conduct+sc.peer;
  return sc;
}
function judgeSDQ(key,v){
  switch(key){
    case "social":  return v>=6?"정상":(v===5?"경계선":"개입필요");      // 높을수록 정상
    case "hyper":   return v<=5?"정상":(v===6?"경계선":"개입필요");
    case "emotion": return v<=3?"정상":(v===4?"경계선":"개입필요");
    case "conduct": return v<=2?"정상":(v===3?"경계선":"개입필요");
    case "peer":    return v<=2?"정상":(v===3?"경계선":"개입필요");
    case "total":   return v<=13?"정상":((v>=14&&v<=16)?"경계선":"개입필요");
  }
}
function scoreKARS(a){
  let ia=0,hi=0;
  for(let i=1;i<=18;i++){
    const itemValue=a[i-1];                 // 0~3
    if(i%2===1) ia+=itemValue; else hi+=itemValue;
  }
  return {ia,hi,total:ia+hi};
}
function judgeKARS(key,v){
  switch(key){
    case "ia":    return v<=8?"정상":((v>=9&&v<=11)?"경계선":"개입필요");
    case "hi":    return v<=9?"정상":((v>=10&&v<=12)?"경계선":"개입필요");
    case "total": return v<=15?"정상":((v>=16&&v<=18)?"경계선":"개입필요");
  }
}
const J=(t)=>t==="개입필요"?` class="judge danger"`:"";

  const bd=(prev,cur,lowerBetter)=>{

  } else {

  }
  const scoreHdr = hasPrev ? "점수 (사전→사후)" : "점수";

  const sj={social:judgeSDQ("social",s.social),hyper:judgeSDQ("hyper",s.hyper),emotion:judgeSDQ("emotion",s.emotion),
            conduct:judgeSDQ("conduct",s.conduct),peer:judgeSDQ("peer",s.peer),total:judgeSDQ("total",s.total)};
  const kj={ia:judgeKARS("ia",k.ia),hi:judgeKARS("hi",k.hi),total:judgeKARS("total",k.total)};

      <thead><tr><th>평가방법</th><th>범위 및 기준</th><th colspan="2">하위영역</th><th>${scoreHdr}</th><th>결과</th></tr></thead>

      </tbody>

    <!-- K-ARS -->
    <table class="rt">
      <colgroup><col style="width:13%"><col style="width:35%"><col style="width:7%"><col style="width:18%"><col style="width:12%"><col style="width:15%"></colgroup>
      <thead><tr><th>평가방법</th><th>범위 및 기준</th><th colspan="2">하위영역</th><th>${scoreHdr}</th><th>결과</th></tr></thead>

// ===== 검사 자산화 저장 (11_플랫폼 GAS로 POST) =====
//  메일·발송 없음(유성 2026-06-21). 제출 시 raw응답+채점결과만 적립 = 종단 자산.
//  GAS_EXEC = scripts/11 웹앱 배포 후 /exec URL을 채운다(미설정이면 저장 건너뜀 — 폼은 정상 동작).
const GAS_EXEC = "https://script.google.com/macros/s/AKfycbySwgDsPt1jily4WenVzoGNW9L0U3wh6AEJ4Leuo315H5_DLEBfg-f4DZ5mdJ9rkkFg/exec";

// ===== 사전 점수(사후 결과지의 델타 비교용) =====
//  사후 검사 시, 제공인력 세션(상담일지 앱이 저장한 tf_staff_v1)으로 사전 점수 조회.
//  세션 없는 기기(공개)·조회 실패·사전 기록 없음 = null → 단회 결과지로 폴백. 입력 흐름은 안 막음.
const DEMO = /[?&]demo=1/.test(location.search);   // 검사 전용 미리보기. ga=1(일반상담 게이트)은 검사와 무관 → 제외(MOCK이 실결과지에 섞이던 버그, 리뷰 발견)
let prevData = null;
const MOCK_PREV = { "SDQ-kr":{subscores:{social:4,hyper:8,emotion:6,conduct:4,peer:3},total:21},
                    "K-ARS":{subscores:{ia:13,hi:14},total:27} };
function getStaffSess(){ try{ return JSON.parse(localStorage.getItem("tf_staff_v1")||"null"); }catch(e){ return null; } }
function fetchPrev(){
  return new Promise(resolve=>{
    if(activeDraw!=="사후"){ resolve(null); return; }                    // 사정(사전)=비교 대상 없음
    if(DEMO){ resolve(MOCK_PREV); return; }                              // 데모=목 사전데이터로 미리보기
    const sess=getStaffSess();
    if(!sess||!sess.staffId||!sess.session||!activeChild){ resolve(null); return; }   // 제공인력 신원 없는 기기=단회
    const body={ action:"exam_prev", staffId:sess.staffId, session:sess.session,
      child:{ name:activeChild.name, birth:activeChild.birth8 },
      by:"보호자", tools:["SDQ-kr","K-ARS"] };
    fetch(GAS_EXEC,{method:"POST",body:JSON.stringify(body)})
      .then(r=>r.json())
      .then(d=>resolve(d&&d.ok&&d.prev&&Object.keys(d.prev).length?d.prev:null))
      .catch(()=>resolve(null));
  });
}

// 실시일시 = 검사당 1회 고정(첫 전송·재시도 동일) → 서버 멱등 dedup 키. 기기 로컬시각(태블릿=서울).
let examStamp = "";
function nowStamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}

// 도구버전 = 문항+보기 내용의 지문(해시). 문항을 고치면 자동으로 새 버전 → 옛 문구 보존(수동 X).
//  안 바뀌면 같은 버전 = 기존 문항정의 재사용. djb2 32-bit, 도구 버전 식별엔 충분.
function instrumentVer(items, opts){
  const str = JSON.stringify(items)+""+JSON.stringify(opts);
  let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; }
  return "v"+(h>>>0).toString(16).padStart(8,"0");
}

function buildPayload(){
  const s=scoreSDQ(sdqAns), k=scoreKARS(karsAns);
  const c = activeChild || {};
  return {
    child:{
      name: c.name || "",
      birth: c.birth8 || "",   // 서버가 숫자만 추출(8자리)
      sex: c.sex || "",
      phone: c.phone || ""
    },
    service:"오감", draw: activeDraw, by:"보호자", via:"태블릿", "실시일시": examStamp,
    tools:[
      { tool:"SDQ-kr", toolVer: instrumentVer(SDQ_ITEMS, SDQ_OPTS), scoreVer:"sdq-kr-v1",
        items: SDQ_ITEMS, opts: SDQ_OPTS,        // 문항 고치면 toolVer 자동 변경(내용 해시) → 옛 문구 보존
        answers: sdqAns.map((a,i)=>({q:i+1,a})),
        subscores:{social:s.social,hyper:s.hyper,emotion:s.emotion,conduct:s.conduct,peer:s.peer},
        total:s.total,
        judge:{social:judgeSDQ("social",s.social),hyper:judgeSDQ("hyper",s.hyper),emotion:judgeSDQ("emotion",s.emotion),conduct:judgeSDQ("conduct",s.conduct),peer:judgeSDQ("peer",s.peer),total:judgeSDQ("total",s.total)} },
      { tool:"K-ARS", toolVer: instrumentVer(KARS_ITEMS, KARS_OPTS), scoreVer:"kars-v1",
        items: KARS_ITEMS, opts: KARS_OPTS,       // 문항 고치면 toolVer 자동 변경(내용 해시)
        answers: karsAns.map((a,i)=>({q:i+1,a})),
        subscores:{ia:k.ia,hi:k.hi}, total:k.total,
        judge:{ia:judgeKARS("ia",k.ia),hi:judgeKARS("hi",k.hi),total:judgeKARS("total",k.total)} }
    ]
  };
}

let _saved=false;   // 한 번만 적립(같은 실시 중복 방지). 수정 후 재보기는 첫 버전 유지 = 재제출 엣지(결정기록 4번 비핵심)
function saveExam(retry){
  if(_saved) return;
  if(DEMO){ _saved=true; return; }   // 데모=미리보기 → 실제 적립 안 함(GAS 미호출, 자산 오염 방지)
  if(!GAS_EXEC){ console.warn("GAS_EXEC 미설정 — 저장 건너뜀(배포 후 /exec URL 채우기)"); return; }
  const note=document.getElementById("saveNote");
  const sess=getStaffSess();   // 검사 저장은 이제 세션 게이트(설계 §0.5) — 시행자=세션 staffId로 서버가 기록
  if(!sess||!sess.staffId||!sess.session){
    if(note) note.textContent="로그인이 풀려 결과를 저장하지 못했어요. 홈에서 다시 로그인해 주세요.";
    return;
  }
  const payload=buildPayload(); payload.staffId=sess.staffId; payload.session=sess.session;
  // body가 문자열 → Content-Type text/plain 기본 → CORS 프리플라이트 없이 cross-origin POST 가능
  fetch(GAS_EXEC, {method:"POST", body: JSON.stringify(payload)})
    .then(r=>r.json())
    .then(d=>{
      if(d && d.ok){ _saved=true; if(note) note.textContent=""; }
      else throw new Error((d && d.error) || "저장 실패");
    })
    .catch(err=>{
      console.error("검사 저장 실패:", err);
      if(retry){ setTimeout(()=>saveExam(false), 1500); return; }   // 1회 자동 재시도
      if(note){
        note.innerHTML='결과 저장에 실패했어요. <button id="retrySave" style="font:inherit;color:var(--green-d);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;">다시 저장</button>';
        const b=document.getElementById("retrySave"); if(b) b.onclick=()=>saveExam(true);
      }
    });
}
</script>

<script>
// ════════════════════════════════════════════════════════════
//  검사 허브 — 이용자 목록 → 검사 이력 → 결과 열람 (설계 docs/설계_2026-06-24_검사허브.md)
//   신원 = 허브(index.html) 진입 세션(tf_staff_v1) 공유. 검사앱 자체 신원 화면 없음.
//   세션 없으면 s-gate로 유도. 목록·이력은 시행자=내 staffId 필터(서버) → 남의 검사 안 보임.
// ════════════════════════════════════════════════════════════

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtBirthDisp(b8){ b8=String(b8||'').replace(/\D/g,''); return b8.length===8 ? b8.slice(0,4)+'.'+b8.slice(4,6)+'.'+b8.slice(6,8) : b8; }
function fmtDateDisp(stamp){ const m=String(stamp||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m? m[1]+'.'+m[2]+'.'+m[3] : ''; }
function drawLabel(d){ return d==='사전'?'사정 평가':(d==='사후'?'사후 평가':(d==='추적'?'추적 검사':(d||'검사'))); }

// staffId+세션 첨부 POST
function hubPost(body){
  const sess=getStaffSess();
  body.staffId = sess && sess.staffId;
  body.session = sess && sess.session;
  return fetch(GAS_EXEC,{method:"POST",body:JSON.stringify(body)}).then(r=>r.json());
}

// ── ① 등록 아동 목록 ──────────────────────────────────────
// 우상단 신원 표시: 행정→"행정 OOO" / 상담사(서약)→"상담사 OOO" / 그 외→"OOO 선생님" (상담일지 whoTag와 동일 규칙)
function setExamWho(){
  var el=document.getElementById('examWho'); if(!el) return;
  if(DEMO){ el.textContent='상담사 데모'; return; }
  var s=getStaffSess()||{}; var nm=String(s.name||'').trim();
  el.textContent = !nm ? '' : (s.admin ? ('행정 '+nm) : (s.oath ? ('상담사 '+nm) : (nm+' 선생님')));
}
// §5.4 스켈레톤 — 목록 뜰 자리에 카드 골격 미리보기(점 대신 — 점은 버튼·짧은 대기용)
function skelCards(box,n){ box.innerHTML=''; for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='list-card skel'; d.innerHTML='<div class="lc-main"><div class="sk-b" style="width:96px;height:17px;"></div><div class="sk-b" style="width:140px;height:13px;margin-top:6px;"></div></div><div class="sk-b" style="width:72px;height:13px;"></div>'; box.appendChild(d); } }
// 목록=화면 본문 로드 실패 = 재시도 주액션 1개(§4.5 경량 골격, F9)
function listFail(box,msg,fn){ const w=document.createElement('div'); w.className='list-empty'; w.textContent=msg; const b=document.createElement('button'); b.className='retry-btn'; b.textContent='다시 시도'; b.onclick=fn; pressRipple(b); w.appendChild(document.createElement('br')); w.appendChild(b); box.innerHTML=''; box.appendChild(w); }
function showClients(){
  show('s-clients'); setExamWho();
  const box=document.getElementById('clientList');
  if(DEMO){ renderClients(MOCK_CLIENTS); return; }
  const sess=getStaffSess();
  if(!sess||!sess.staffId||!sess.session){ show('s-gate'); return; }
  skelCards(box,4);
  hubPost({action:'exam_clients'}).then(d=>{
    if(d&&d.ok){ renderClients(d.clients||[]); }
    else if(d&&d.code==='auth'){ show('s-gate'); }
    else listFail(box,'목록을 불러오지 못했어요.',showClients);
  }).catch(()=>{ listFail(box,'목록을 불러오지 못했어요.',showClients); });
}
function renderClients(clients){
  const box=document.getElementById('clientList');
  if(!clients.length){ box.innerHTML='<div class="list-empty">아직 등록한 아이가 없어요.<br>위에서 새 아이를 등록해요.</div>'; return; }
  box.innerHTML='';
  clients.forEach(c=>{
    const card=document.createElement('button');
    card.className='list-card';
    const meta = c.count>0
      ? `<div class="lc-meta"><span class="lc-draw">${drawLabel(c.lastDraw)}</span>검사 ${c.count}회 · ${fmtDateDisp(c.lastStamp)}</div>`
      : `<div class="lc-meta">검사 전</div>`;
    card.innerHTML=`<div class="lc-main"><div class="lc-name">${esc(c.name)}</div><div class="lc-sub">${fmtBirthDisp(c.birth)}</div></div>`+meta;
    card.onclick=()=>openChild(c.name,c.birth);
    box.appendChild(card);
  });
}

// ── 새 아이 등록(폼 초기화 후 진입 → 등록 저장 → 아동 화면) ──
function startRegister(){
  document.getElementById('reg-name').value='';
  document.getElementById('reg-birth').value='';
  document.getElementById('reg-phone').value='';
  state.sex='';
  document.querySelectorAll('#reg-sex button').forEach(b=>b.classList.remove('on'));
  ['rf-name','rf-birth','rf-phone'].forEach(id=>document.getElementById(id).classList.remove('has-val','focus'));
  document.getElementById('regNote').textContent='';
  validateRegister();
  show('s-register'); window.scrollTo(0,0);
}
let regBusy=false;
function submitRegister(){
  if(regBusy) return;
  const name=document.getElementById('reg-name').value.trim();
  const birth8=document.getElementById('reg-birth').value.replace(/\D/g,'').slice(0,8);
  const sex=state.sex;
  const phone=document.getElementById('reg-phone').value.replace(/\D/g,'');
  if(!name||birth8.length!==8||!sex||phone.length<10) return;
  const child={name:name, birth8:birth8, sex:sex, phone:phone};
  if(DEMO){ activeChild=child; openChild(name,birth8); return; }   // 데모=GAS 미호출, 바로 아동 화면
  const sess=getStaffSess();
  if(!sess||!sess.staffId||!sess.session){ show('s-gate'); return; }
  const note=document.getElementById('regNote'); note.textContent='';
  regBusy=true; const btn=document.getElementById('regBtn'); btn.disabled=true; btn.classList.add('loading'); btn.innerHTML='등록하고 있어요<span class="ld-dots"><i></i><i></i><i></i></span>';   // 더블탭 가드(§5.6-3) + 로딩=채운초록(F7) + 문구·점(§5.2 — 옛 정적 '등록 중…' 폐기 2026-07-04)
  hubPost({action:'register', child:{name:name, birth:birth8, sex:sex, phone:phone}}).then(d=>{
    regBusy=false; btn.classList.remove('loading'); btn.textContent='등록하기';
    if(d&&d.ok){ activeChild=child; openChild(name,birth8); }
    else if(d&&d.code==='auth'){ show('s-gate'); }
    else { btn.disabled=false; note.textContent=(d&&d.error)||'등록에 실패했어요. 잠시 후 다시 시도해 주세요.'; }
  }).catch(()=>{ regBusy=false; btn.classList.remove('loading'); btn.textContent='등록하기'; btn.disabled=false; note.textContent='등록에 실패했어요. 잠시 후 다시 시도해 주세요.'; });
}

// ── ② 아동 상세(검사 종류 + 지난 검사 이력) ─────────────────
function openChild(name,birth){
  const b8=String(birth||'').replace(/\D/g,'').slice(0,8);
  if(!activeChild || activeChild.name!==name || activeChild.birth8!==b8){   // 같은 아이면 성별·전화 보존
    activeChild={name:name, birth8:b8, sex:'', phone:''};
  }
  document.getElementById('childName').textContent=name;
  document.getElementById('childSub').textContent=fmtBirthDisp(b8);
  show('s-child');
  loadChildHistory(name,b8);
}
function loadChildHistory(name,b8){
  const box=document.getElementById('childHistory');
  if(DEMO){ childResults=MOCK_HISTORY[name]||[]; sittings=groupSittings(childResults); renderChildHistory(); return; }
  skelCards(box,3);
  hubPost({action:'exam_history', child:{name:name, birth:b8}}).then(d=>{
    if(d&&d.ok){ childResults=d.results||[]; sittings=groupSittings(childResults); renderChildHistory(); }
    else if(d&&d.code==='auth'){ show('s-gate'); }
    else listFail(box,'이력을 불러오지 못했어요.',()=>loadChildHistory(name,b8));
  }).catch(()=>{ listFail(box,'이력을 불러오지 못했어요.',()=>loadChildHistory(name,b8)); });
}
// 도구별 행 → 실시(같은 실시일시=SDQ+K-ARS 한 번) 단위로 묶음, 시간순
function groupSittings(results){
  const by={};
  (results||[]).forEach(r=>{
    const key=r.stamp||'';
    if(!by[key]) by[key]={stamp:r.stamp, draw:r.draw, tools:{}};
    by[key].tools[r.tool]=r;
  });
  return Object.keys(by).map(k=>by[k]).sort((a,b)=> a.stamp<b.stamp?-1:(a.stamp>b.stamp?1:0));
}
function renderChildHistory(){
  const box=document.getElementById('childHistory');
  if(!sittings.length){ box.innerHTML='<div class="list-empty">아직 검사 기록이 없어요.</div>'; return; }
  box.innerHTML='';
  sittings.forEach((st,idx)=>{
    const tools=Object.keys(st.tools).join(' · ');
    const card=document.createElement('button');
    card.className='list-card';
    card.innerHTML=`<div class="lc-main"><div class="lc-name">${drawLabel(st.draw)}</div><div class="lc-sub">${esc(tools)}</div></div>`
      +`<div class="lc-meta">${fmtDateDisp(st.stamp)}</div>`;
    card.onclick=()=>openView(idx);
    box.appendChild(card);
  });
}

function startTest(draw){
  activeDraw=draw;
  for(let i=0;i<sdqAns.length;i++) sdqAns[i]=null;
  for(let i=0;i<karsAns.length;i++) karsAns[i]=null;
  renderQuestions("sdqList",SDQ_ITEMS,SDQ_OPTS,sdqAns,updateSdq);
  renderQuestions("karsList",KARS_ITEMS,KARS_OPTS,karsAns,updateKars);
  updateSdq(); updateKars();
  examStamp=''; _saved=false; prevData=null;
  show('s-sdq'); window.scrollTo(0,0);
}

// ── ③ 결과 열람 — 저장 점수로 재렌더(즉석 채점 아님). 사후면 같은 child의 '사전' 실시 대비 델타. ──
function openView(idx){
  const st=sittings[idx]; if(!st) return;
  const sdq=st.tools['SDQ-kr'], kars=st.tools['K-ARS'];
  if(!sdq && !kars) return;
  const s = sdq ? Object.assign({}, sdq.subscores, {total: sdq.total}) : {};
  const k = kars ? Object.assign({}, kars.subscores, {total: kars.total}) : {};
  const isPre = st.draw==='사전';
  let prev=null;
  if(!isPre){
    const pres=sittings.filter(x=>x.draw==='사전' && x.stamp<st.stamp);   // 이 실시 이전의 사전
    const base = pres.length ? pres[pres.length-1] : sittings.filter(x=>x.draw==='사전')[0];
    if(base){
      prev={};
      if(base.tools['SDQ-kr']) prev['SDQ-kr']={subscores:base.tools['SDQ-kr'].subscores, total:base.tools['SDQ-kr'].total};
      if(base.tools['K-ARS'])  prev['K-ARS'] ={subscores:base.tools['K-ARS'].subscores,  total:base.tools['K-ARS'].total};
    }
  }
  renderReport({ name: activeChild?activeChild.name:'', s:s, k:k, isPre:isPre, prev:prev, target:'viewDoc' });
  show('s-view');
}

// ── 키보드 위 액션 버튼(KeyboardAboveView 폴백, 비-resizes-content 기기) — docs §5.5 ──
function liftActiveFooter(){
  const fb=document.querySelector('.screen.active .footbar');
  document.querySelectorAll('.footbar').forEach(f=>{ if(f!==fb){ f.style.transform=''; f.classList.remove('kb'); } });
  if(!fb) return;
  const kb = window.visualViewport ? Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop) : 0;
  if(kb>80){ fb.style.transform='translateY('+(-kb)+'px)'; fb.classList.add('kb'); }
  else { fb.style.transform=''; fb.classList.remove('kb'); }
}
window.addEventListener('resize',liftActiveFooter);
if(window.visualViewport){ window.visualViewport.addEventListener('resize',liftActiveFooter); window.visualViewport.addEventListener('scroll',liftActiveFooter); }

// §4.9 비활성 버튼 탭=흔들림 — disabled 버튼은 이벤트 투명이라 footbar(부모)가 탭을 받음 → 그 안 비활성 .btn을 흔든다(상담일지 패턴)
document.addEventListener('pointerdown',function(e){
  var fb=e.target.closest('.footbar'); if(!fb) return;
  if(e.target.closest('a,button:not([disabled])')) return;   // 활성 링크·버튼 탭은 제외
  var b=fb.querySelector('.btn[disabled]'); if(!b) return;
  b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
},true);

// 누름 ripple(§5.3-1 솔리드 색버튼) — 레퍼런스=index.html. 라벨 .bl wrap으로 흰 글자 유지, 누른 지점→끝까지 어두워짐
function pressRipple(btn){
  btn.addEventListener("pointerdown",function(e){
    if(!btn.querySelector(".bl")){ var bl=document.createElement("span"); bl.className="bl"; while(btn.firstChild) bl.appendChild(btn.firstChild); btn.appendChild(bl); }
    var r=btn.getBoundingClientRect();
    var x=e.clientX-r.left;
    var sp=document.createElement("span"); sp.className="rip"; sp.style.left=x+"px";
    sp.style.setProperty("--rs", Math.ceil(Math.hypot(Math.max(x,r.width-x), r.height/2)/15)+1);
    btn.appendChild(sp); requestAnimationFrame(function(){ sp.classList.add("go"); });
    var end=function(){ sp.classList.add("fade"); setTimeout(function(){ if(sp.parentNode) sp.remove(); },340); btn.removeEventListener("pointerup",end); btn.removeEventListener("pointerleave",end); };
    btn.addEventListener("pointerup",end); btn.addEventListener("pointerleave",end);
  });
}
document.querySelectorAll(".btn").forEach(pressRipple);
