<style>
  :root{
    --green:#3a8a5f; --green-d:#2f6f4d;
    --g900:#191f28; --g700:#4e5968; --g500:#8b95a1; --g300:#d1d6db;
    --g200:#e5e8eb; --g100:#f2f4f6; --red:#f04452;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Pretendard',-apple-system,sans-serif;
    background:#fff; color:var(--g900);
    word-break:keep-all; line-height:1.5;
    min-height:100vh;
  }
  .wrap{max-width:720px; margin:0 auto; padding:40px 24px 60px;}

  /* 헤더 */
  .head{display:flex; align-items:center; gap:12px; margin-bottom:28px;}
  .logo{ width:42px; height:42px; flex-shrink:0; }
  .logo img{ width:100%; height:100%; object-fit:contain; display:block; }
  .head h1{font-size:26px; font-weight:700; letter-spacing:-.6px;}
  .head .sub{font-size:15px; color:var(--g500); font-weight:500; margin-top:2px;}
  .hello{margin:28px 2px 22px; font-size:19px; font-weight:600; color:var(--g700); letter-spacing:-.3px;}

  /* 타일 격자 */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}  /* 이름이 모두 1줄이라 타일 높이 자동 동일 */
  .tile{
    position:relative;
    display:flex; flex-direction:column; justify-content:flex-start;
    background:var(--g100); border:1.5px solid transparent;
    border-radius:20px; padding:22px 20px; min-height:128px;
    text-decoration:none; color:inherit; cursor:pointer;
    transition:transform .08s, background .15s, border-color .15s;
  }
  .tile:active{transform:scale(.985); background:#eef0f3;}
  .tile.primary{background:#eaf5ee;}
  .tile.primary:active{background:#e1f0e7;}
  .tile.soon{opacity:.62;}
  .tile .ico{font-size:30px; color:var(--green); display:flex; margin-bottom:16px;}
  .tile .ico svg{width:30px; height:30px;}
  .tile .name{font-size:16px; font-weight:700; letter-spacing:-.5px; margin-top:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}  /* 1줄 고정 — 띄어쓰기 많아도 안 넘어감 */
  .lock{position:absolute; top:14px; right:14px; color:var(--g300); display:flex;}
  .lock svg{width:16px; height:16px; display:block;}
  .tile .desc{font-size:13.5px; color:var(--g500); font-weight:500; margin-top:3px;}
  .tag{
    align-self:flex-start; font-size:11.5px; font-weight:700;
    color:var(--green); background:#fff; border-radius:8px;
    padding:3px 8px; margin-top:6px;
  }
  .tag.soon{color:var(--g500); background:#fff;}

  .foot{margin-top:36px; text-align:center; color:var(--g300); font-size:12.5px;}

  /* ═ PIN 잠금 오버레이 ═ */
  #gate{
    position:fixed; inset:0; z-index:9999; background:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 24px; padding-bottom:calc(40px + env(safe-area-inset-bottom));
  }
  #gate.hide{display:none;}
  .gate-logo{ width:52px; height:52px; margin-bottom:18px; }
  .gate-logo img{ width:100%; height:100%; object-fit:contain; display:block; }
  .gate-title{font-size:19px; font-weight:700; letter-spacing:-.4px;}
  .gate-sub{font-size:14px; color:var(--g500); font-weight:500; margin-top:6px;}
  .gate-dots{display:flex; gap:14px; margin:28px 0 4px;}
  .gate-dot{width:14px; height:14px; border-radius:50%; background:var(--g200); transition:background .12s, transform .12s;}
  .gate-dot.on{background:var(--green); transform:scale(1.15);}
  .gate-err{height:18px; font-size:13px; color:var(--red); font-weight:600; margin-top:8px; opacity:0; transition:opacity .15s;}
  .gate-err.show{opacity:1;}
  .gate-err.shake{animation:gshake .35s;}
  @keyframes gshake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .gate-pad{display:grid; grid-template-columns:repeat(3,72px); gap:14px; margin-top:22px;}
  .gate-key{
    height:64px; border-radius:18px; background:var(--g100); border:none; cursor:pointer;
    font-family:inherit; font-size:26px; font-weight:600; color:var(--g900);
    display:flex; align-items:center; justify-content:center; transition:background .1s, transform .08s;
  }
  .gate-key:active{background:var(--g200); transform:scale(.94);}
  .gate-key.fn{font-size:15px; font-weight:600; color:var(--g500); background:transparent;}

  /* ═ 오프라인 안내 토스트 ═ */
  .net-toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(10px); z-index:200;
    background:var(--g900); color:#fff; font-size:14px; font-weight:600;
    padding:12px 18px; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,.18);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .net-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .net-toast.upd{background:var(--green);}   /* 업데이트 안내(초록) */

  /* ═ 홈 화면 추가(설치) 안내 바 — 크롬 자동 설치바가 안 떠도 직접 띄움 ═ */
  .install-bar{
    position:fixed; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:300; display:none; align-items:center; gap:10px;
    background:var(--green); color:#fff; border-radius:16px;
    padding:13px 14px 13px 18px; box-shadow:0 8px 24px rgba(58,138,95,.35);
  }
  .install-bar.show{display:flex;}
  .install-bar .t{flex:1; font-size:14.5px; font-weight:600; letter-spacing:-.3px; line-height:1.4;}
  .install-bar button{font-family:inherit; cursor:pointer; border:none;}
  .install-bar .add{font-size:14px; font-weight:700; border-radius:11px; padding:10px 16px; background:#fff; color:var(--green-d);}
  .install-bar .add:active{background:#eef0f3;}
  .install-bar .x{background:transparent; color:#fff; font-size:20px; padding:4px 6px; opacity:.85;}
</style>

<script>
// ════════════════════════════════════════════════════════════════
//  PIN 잠금 — 기기당 1회. 공개 소스라 진짜 보안 아님(소스 보면 우회 가능).
//  목적 = URL을 우연히 연 사람에게 메뉴를 가리는 속도방지턱.
//
//  ▼▼▼ 유성이 여기만 채우면 됨 ▼▼▼
//  1) 원하는 4자리 PIN의 SHA-256 해시를 구한다 (PIN 자체는 채팅·코드에 적지 말 것):
//       python -c "import hashlib;print(hashlib.sha256('1234'.encode()).hexdigest())"
//     ('1234' 자리에 진짜 PIN을 넣어 실행 → 64자리 해시가 나옴)
//  2) 그 해시를 아래 PIN_HASH 따옴표 안에 붙여넣는다.
//  ※ PIN_HASH가 비어 있으면 잠금이 꺼진 채로 동작(설정 전 안전).
//  ※ PIN을 바꾸면(해시 교체) 모든 기기가 다음 진입 때 PIN을 다시 물음.
var PIN_HASH = "8d0a8cbf9d1e53373e02a4ad80e49b2853259c854de49349cd776a7569c47142";
// ▲▲▲ 여기까지 ▲▲▲

var UNLOCK_KEY = 'tf_tablet_pin_ok';
async function sha256(s){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
window.sha256 = sha256;  // 콘솔에서 await sha256('PIN') 으로도 해시 확인 가능

(function(){
  var gate = document.getElementById('gate');
  function unlock(){ gate.classList.add('hide'); }

  // PIN 미설정 → 잠금 끔(설정 전 페이지가 막히지 않게)
  if (!PIN_HASH) { unlock(); return; }
  // 이 기기에서 이미 풀었고 PIN이 안 바뀌었으면 통과
  try { if (localStorage.getItem(UNLOCK_KEY) === PIN_HASH) { unlock(); return; } } catch(e){}

  var dots = Array.prototype.slice.call(document.querySelectorAll('.gate-dot'));
  var err = document.getElementById('gateErr');
  var entry = '';

  function render(){
    dots.forEach(function(d,i){ d.classList.toggle('on', i < entry.length); });
  }
  function fail(){
    err.classList.add('show','shake');
    setTimeout(function(){ err.classList.remove('shake'); }, 360);
    entry = ''; render();
  }
  async function submit(){
    var ok = false;
    try { ok = (await sha256(entry)) === PIN_HASH; }
    catch(e){ err.textContent = '이 기기에선 PIN 확인이 안 돼요'; fail(); return; }
    if (ok){ try{ localStorage.setItem(UNLOCK_KEY, PIN_HASH); }catch(e){} unlock(); }
    else { err.textContent = 'PIN이 달라요'; fail(); }
  }
  function press(k){
    if (k === 'del'){ entry = entry.slice(0,-1); err.classList.remove('show'); render(); return; }
    if (entry.length >= 4) return;
    err.classList.remove('show');
    entry += k; render();
    if (entry.length === 4) submit();
  }

  document.querySelector('.gate-pad').addEventListener('click', function(e){
    var btn = e.target.closest('.gate-key'); if (!btn) return;
    press(btn.getAttribute('data-k'));
  });
  // 물리 키보드(태블릿 외장 키보드)도 지원
  document.addEventListener('keydown', function(e){
    if (gate.classList.contains('hide')) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('del');
  });
  render();
})();

// ════ 버전 표시 + 자동 업데이트 ════
// APP_VERSION은 배포할 때마다 올린다(푸터에 표시 → 전화로 최신 여부 확인용). sw.js의 CACHE도 함께 올릴 것.
var APP_VERSION = '26.06.21d';
(function(){ var v = document.getElementById('ver'); if (v) v.textContent = 'v' + APP_VERSION; })();

// 자동 업데이트:
//  · 앱을 새로 열면 network-first 서비스워커가 항상 최신을 받아옴(기본).
//  · 앱을 켜둔 채 다시 돌아와도(포그라운드) 새 버전을 확인 → 있으면 허브만 조용히 새로고침.
//    (허브는 메뉴라 안전. 검사 폼·지도 등 작업 페이지는 이 새로고침에 휩쓸리지 않음 — 거긴 '열 때' 최신화)
if ('serviceWorker' in navigator) {
  var hadController = !!navigator.serviceWorker.controller;   // true면 '갱신'(첫 설치 아님)
  var reloadedForUpdate = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (reloadedForUpdate || !hadController) return;          // 첫 설치는 새로고침 불필요
    reloadedForUpdate = true;
    var t = document.getElementById('updateToast'); if (t) t.classList.add('show');
    setTimeout(function(){ location.reload(); }, 1100);       // 잠깐 안내 후 최신으로
  });
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.update();                                            // 열 때 즉시 새 버전 확인
      document.addEventListener('visibilitychange', function(){ if (!document.hidden) reg.update(); }); // 포그라운드 복귀 시 확인
    }).catch(function(){});
  });
}

// ─ 홈 화면 추가(설치) — 크롬 자동 설치바가 쿨다운으로 안 떠도 우리 버튼으로 설치 가능 ─
// beforeinstallprompt를 가로채 우리 바를 띄우고, '추가' 누르면 네이티브 설치창 호출.
(function(){
  var bar = document.getElementById('installBar');
  var btn = document.getElementById('installBtn');
  var x   = document.getElementById('installX');
  var deferred = null;
  function installed(){
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  }
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();              // 크롬 기본 미니바 억제 → 우리 바로 통일
    deferred = e;
    if (!installed()) bar.classList.add('show');
  });
  btn.addEventListener('click', function(){
    if (!deferred) { bar.classList.remove('show'); return; }
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null; bar.classList.remove('show'); });
  });
  x.addEventListener('click', function(){ bar.classList.remove('show'); });   // 이번 세션만 닫기
  window.addEventListener('appinstalled', function(){ bar.classList.remove('show'); deferred = null; });
})();

// 오프라인이면 인터넷 필요한 타일(활동 이야기·제공인력 지도)은 이동 막고 안내.
// 가격표·심리검사는 서비스워커가 캐시해 와이파이 없어도 열림.
(function(){
  var toast = document.getElementById('netToast');
  var tiles = document.querySelectorAll('a.needs-net');
  for (var i = 0; i < tiles.length; i++) {
    tiles[i].addEventListener('click', function(e){
      if (!navigator.onLine) {
        e.preventDefault();
        toast.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
      }
    });
  }
})();
</script>
</body>
</html>
