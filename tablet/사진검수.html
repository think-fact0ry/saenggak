<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>사진 검수 — 생각공작소</title>
<link rel="icon" href="/saenggak/android-icon-192x192.png">
<style>
  :root{
    /* TOKENS:START — §3.1 정본 토큰. 직접 편집 금지: docs/1 §3.1 고치고 node 디자인프리뷰/토큰동기.js */

  /* 회색 — §3.1 정본(중립 회색 스케일). 필요한 칸만 골라 써도 되나 이름·값은 이대로 */
  --g50:#f9fafb; --g100:#f2f4f6; --g200:#e5e8eb; --g300:#d1d6db;
  --g400:#b0b8c1; --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968;
  --g800:#333d4b; --g900:#191f28;
  /* 초록 — §3.1 OKLCH 스케일(회색 명도 사다리 고정, green600=브랜드 #3a8a5f 앵커).
     밝은 50~400 = 토스 weak 실측 기반 재보정(2026-07-04 유성 #e9f8ee 확정 — ex43 실측 C.021·브랜드 H157,
     100→500 수렴 가중 1/.85/.62/.40/.20으로 이음새 없음. 옛 A안 채도부스트 값 폐기) */
  --green50:#f8fbf9; --green100:#e9f8ee; --green200:#cef2db; --green300:#a7e7c0; --green400:#7bcb9c;
  --green500:#57a77a; --green600:#3a8a5f; --green700:#166841; --green800:#01492a; --green900:#002614;
  --green:var(--green600); --green-dark:var(--green700); --green-bg:var(--green100);  /* 별칭(기존 코드 호환) */
  /* 시맨틱 */
  --red:#f04452;           /* 에러·경고 상태(폼 오류·OTP 오류·알림) */
  --ink-on-dark:#F9FBFA;   /* 어두운 배경 흰 글씨(§3.5 line125) */
  /* 버튼·뱃지 시맨틱 (§4.14 버튼 체계 — 유성 2026-07-02) */
  --dark:#525966;          /* dark variant(중립 짙은 회색 버튼/뱃지) + 흰 폰트 */
  --danger:#D25357;        /* danger variant(파괴적 액션 버튼/뱃지) + 흰 폰트. ※--red(#f04452)와 구분: red=상태알림, danger=버튼 */
  --danger-weak-bg:#fdecee; --danger-weak-fg:#c0392b;   /* danger weak(연빨강 채움+진한빨강 폰트) */
  --p-disabled:#b7e0c8; --dark-disabled:#c8ccd0; --danger-disabled:#f2cdce;   /* disabled = variant 흐린 버전+흰폰트(회색 아님) */
  /* 라운드 — §3.3 */
  --r-sm:clamp(7px,1.8vw,10px); --r-md:clamp(10px,2.6vw,14px); --r-lg:clamp(13px,3.2vw,20px);
  /* 타입 스케일 — §3.2 (큰 제목 clamp 유동 / 본문 고정) */
  --fs-display:clamp(28px,6vw,42px); --fs-h1:clamp(23px,3.4vw,30px); --fs-h2:clamp(20px,2.6vw,26px); --fs-h3:20px;
  --fs-title:17px; --fs-body:15px; --fs-sm:13.5px; --fs-caption:12px;
  /* TOKENS:END */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; min-height:100%; background:#fff;}
  body{font-family:Pretendard,-apple-system,system-ui,'Apple SD Gothic Neo',sans-serif; color:var(--g900); line-height:1.5; word-break:keep-all; overscroll-behavior:none;}

  .screen{display:none;}
  .screen.active{display:block;}
  .wrap{max-width:560px; margin:0 auto; padding:20px 22px 60px;}
  h1{font-size:24px; font-weight:700; letter-spacing:-.6px; margin:8px 0 6px; line-height:1.4;}
  .sub{font-size:14.5px; color:var(--g500); font-weight:500; margin:0 0 22px; line-height:1.6;}

  /* 키 입력(행정 1회) */
  .tfield{margin-bottom:18px;}
  .tfield label{display:block; font-size:12.5px; font-weight:600; color:var(--g500); margin:0 0 5px; transition:color .15s;}
  .tfield.focus label{color:var(--green);}
  .tin-wrap{position:relative; border-bottom:2px solid var(--g200); transition:border-color .15s;}
  .tfield.focus .tin-wrap{border-color:var(--green);}
  .tin-wrap input{width:100%; border:none; background:none; outline:none; font:inherit; font-size:18px; font-weight:600; color:var(--g900); padding:2px 0 3px; caret-color:var(--green); -webkit-text-security:disc; min-width:0;}
  .note{font-size:13.5px; margin:12px 2px 0; color:var(--g500); min-height:18px;}
  .note.err{color:var(--red);}

  /* 검수 카드 */
  .rcard{background:#fff; border-radius:var(--r-md); box-shadow:0 2px 10px rgba(0,0,0,.07); overflow:hidden; margin-bottom:16px;}
  .rcard .im{position:relative; width:100%; aspect-ratio:4/3; background:var(--g100);}
  .rcard .im img{width:100%; height:100%; object-fit:contain; display:block; background:var(--g100);}
  .rcard .meta{display:flex; align-items:center; gap:8px; padding:12px 14px 0;}
  .rcard .meta .nm{font-size:16px; font-weight:700; flex:1;}
  .rcard .meta .inf{font-size:12.5px; color:var(--g500);}
  .rcard .acts{display:flex; gap:8px; padding:12px 14px 14px;}
  .star{width:46px; flex-shrink:0; border:none; border-radius:var(--r-sm); background:var(--g100); color:var(--g400); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .1s;}
  .star:active{transform:scale(.94);}
  .star svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
  .star.on{background:var(--green-bg); color:var(--green);}
  .star.on svg{fill:currentColor;}
  .ok-btn{flex:1; padding:13px; border:none; border-radius:var(--r-sm); font:inherit; font-size:15px; font-weight:700; color:#fff; background:var(--green); cursor:pointer; position:relative; overflow:hidden; transition:background .2s,transform .1s;}
  .ok-btn:active{background:var(--green-dark); transform:scale(.97);}
  .no-btn{flex-shrink:0; padding:13px 16px; border:none; border-radius:var(--r-sm); font:inherit; font-size:15px; font-weight:700; color:var(--danger-weak-fg); background:var(--danger-weak-bg); cursor:pointer; transition:transform .1s;}   /* weak-danger(§4.14) */
  .no-btn:active{transform:scale(.95);}
  .btn .bl,.ok-btn .bl{position:relative; z-index:1;}
  .rip{position:absolute; z-index:0; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; background:rgba(0,0,0,.20); pointer-events:none; transform:scale(0);}
  .rip.go{transform:scale(var(--rs,16)); opacity:0; transition:transform .46s ease-out, opacity .46s ease-out;}
  .rcard.sk{height:220px; background:var(--g100); box-shadow:none; animation:skp 1.2s ease-in-out infinite;}
  @keyframes skp{0%,100%{opacity:1} 50%{opacity:.5}}

  .btn{width:100%; padding:16px; border:none; border-radius:var(--r-md); font:inherit; font-size:16px; font-weight:700; color:#fff; background:var(--green); cursor:pointer; transition:background .2s,transform .1s; position:relative; overflow:hidden; margin-top:8px;}
  .btn:active{background:var(--green-dark); transform:scale(.97);}
  .btn:disabled{background:var(--p-disabled); cursor:default; transform:none;}
  .btn:disabled:has(.ld-dots){background:var(--green);}
  .ld-dots{display:inline-flex; gap:3px; margin-left:7px; vertical-align:middle;}
  .ld-dots i{width:4px; height:4px; border-radius:50%; background:#fff; animation:ldb .9s infinite ease-in-out;}
  .ld-dots i:nth-child(2){animation-delay:.16s;} .ld-dots i:nth-child(3){animation-delay:.32s;}
  @keyframes ldb{0%,80%,100%{transform:translateY(0); opacity:.45;} 40%{transform:translateY(-4px); opacity:1;}}
  .empty,.errbox{padding:56px 10px; text-align:center;}
  .empty p,.errbox p{font-size:15px; color:var(--g500); margin:0 0 18px; line-height:1.7;}
  .retry-btn{font:inherit; font-size:15px; font-weight:700; color:#fff; background:var(--green); border:none; border-radius:var(--r-md); padding:13px 26px; cursor:pointer; position:relative; overflow:hidden;}
  .retry-btn:active{background:var(--green-dark); transform:scale(.97);}
  .cnt{display:inline-block; font-size:var(--fs-caption); font-weight:700; color:var(--green); background:var(--green-bg); padding:5px 12px; border-radius:99px; margin-bottom:12px;}

  .toast{position:fixed; left:50%; bottom:60px; transform:translateX(-50%) translateY(20px); background:#222; color:#fff; font-size:14px; padding:12px 18px; border-radius:12px; max-width:90%; text-align:center; opacity:0; transition:opacity .2s,transform .2s; pointer-events:none; z-index:1300;}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- 키 입력(행정 1회 — 서버 검증) -->
<div class="screen active" id="s-key">
  <div class="wrap">
    <h1>행정 비밀번호를 알려주세요</h1>
    <p class="sub">행정 등록할 때 쓰는 번호예요. 처음 한 번만 넣으면 이 기기에 기억돼요.</p>
    <div class="tfield" id="tfKey"><label for="inKey">행정 비밀번호</label><div class="tin-wrap">
      <input id="inKey" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true">
    </div></div>
    <div class="note" id="keyNote"></div>
    <button class="btn" id="keyBtn"><span class="bl">시작하기</span></button>
  </div>
</div>

<!-- 검수 목록 -->
<div class="screen" id="s-list">
  <div class="wrap">
    <h1>사진 검수</h1>
    <p class="sub">공개하면 그 아이 보호자에게 바로 보여요. 별은 블로그에 쓸 만한 사진 담아두기예요.</p>
    <span class="cnt" id="cnt" style="display:none"></span>
    <div id="list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_EXEC="https://script.google.com/macros/s/AKfycbw5K71HEBZKP9TQr84YxkGed_bG3mvbzWfAMwkhcDJcCLDNBiDql5TjeYHCEuiMuvGAbQ/exec";
const $=id=>document.getElementById(id);
function post(obj, retries){
  const go=()=>fetch(GAS_EXEC,{method:"POST",body:JSON.stringify(obj)}).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
  if(!retries) return go();
  return go().catch(()=>new Promise(res=>setTimeout(res,700)).then(go)).catch(()=>new Promise(res=>setTimeout(res,1600)).then(go));
}
const loadingHTML=t=>t+'<span class="ld-dots"><i></i><i></i><i></i></span>';
function btnLoad(btn,text){ if(btn.dataset.lbl==null) btn.dataset.lbl=btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="bl">'+loadingHTML(text)+'</span>'; }
function btnDone(btn){ if(btn.dataset.lbl==null) return; btn.innerHTML=btn.dataset.lbl; delete btn.dataset.lbl; btn.disabled=false; }
function pressRipple(btn,e){
  if(!btn.querySelector(".bl")){ const bl=document.createElement("span"); bl.className="bl"; while(btn.firstChild) bl.appendChild(btn.firstChild); btn.appendChild(bl); }
  const r=btn.getBoundingClientRect();
  const x=(e.clientX!=null?e.clientX:r.left+r.width/2)-r.left;
  const rs=Math.ceil(Math.hypot(Math.max(x,r.width-x),r.height/2)/15)+1;
  const rip=document.createElement("span"); rip.className="rip";
  rip.style.left=x+"px"; rip.style.top=(r.height/2)+"px"; rip.style.setProperty("--rs",rs);
  btn.appendChild(rip); requestAnimationFrame(()=>rip.classList.add("go"));
  setTimeout(()=>rip.remove(),480);
}
document.addEventListener("pointerdown",e=>{ const b=e.target.closest(".btn,.ok-btn,.retry-btn"); if(b&&!b.disabled) pressRipple(b,e); });
let toastT; function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2600); }
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id===id)); window.scrollTo(0,0); }

const KEY="saenggak_admin_token";   // 허브 행정 등록·지도·결제내역과 같은 키(06 ACCESS_TOKEN) — 행정 등록된 기기는 입력 생략(유성 2026-07-05 통일)
function adminKey(){ try{ return localStorage.getItem(KEY)||""; }catch(e){ return ""; } }
// 밑줄 포커스
(function(){ const inp=$("inKey"), tf=$("tfKey");
  inp.addEventListener("focus",()=>tf.classList.add("focus"));
  inp.addEventListener("blur",()=>tf.classList.remove("focus")); })();
$("keyBtn").onclick=()=>{
  const k=$("inKey").value.trim();
  if(!k){ $("keyNote").className="note err"; $("keyNote").textContent="행정 비밀번호를 적어주세요"; return; }
  btnLoad($("keyBtn"),"확인하고 있어요");
  post({action:"a_list", adminKey:k},true).then(d=>{
    btnDone($("keyBtn"));
    if(d && d.ok){ try{ localStorage.setItem(KEY,k); }catch(e){} show("s-list"); render(d); }
    else { $("keyNote").className="note err"; $("keyNote").textContent="비밀번호가 달라요. 다시 확인해 주세요"; }
  }).catch(()=>{ btnDone($("keyBtn")); $("keyNote").className="note err"; $("keyNote").textContent="연결이 안 됐어요. 잠시 후 다시 시도해 주세요"; });
};

function loadList(){
  const box=$("list");
  box.innerHTML='<div class="rcard sk"></div><div class="rcard sk"></div>';
  $("cnt").style.display="none";
  post({action:"a_list", adminKey:adminKey()},true).then(d=>{
    if(!(d&&d.ok)){
      if(d&&d.error==="unauthorized"){ try{ localStorage.removeItem(KEY); }catch(e){} show("s-key"); return; }
      throw new Error();
    }
    render(d);
  }).catch(()=>{
    box.innerHTML='<div class="errbox"><p>목록을 불러오지 못했어요.<br>잠시 후 다시 시도해 주세요.</p><button class="retry-btn" onclick="loadList()">다시 시도</button></div>';
  });
}
function render(d){
  const box=$("list"); box.innerHTML="";
  if(!d.items.length){
    $("cnt").style.display="none";
    box.innerHTML='<div class="empty"><p>검수할 사진이 다 끝났어요 :)</p></div>';
    return;
  }
  $("cnt").style.display="inline-block";
  $("cnt").textContent="검수 대기 "+d.total+"장";
  d.items.forEach(it=>{
    const c=document.createElement("div"); c.className="rcard";
    c.innerHTML='<div class="im"><img alt=""></div>'
      +'<div class="meta"><span class="nm"></span><span class="inf"></span></div>'
      +'<div class="acts"><button class="star" aria-label="블로그 후보"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>'
      +'<button class="ok-btn"><span class="bl">공개하기</span></button><button class="no-btn">반려</button></div>';
    if(it.thumb) c.querySelector("img").src="data:image/jpeg;base64,"+it.thumb;
    c.querySelector(".nm").textContent=it.child;
    c.querySelector(".inf").textContent=(it.date||"")+" · "+(it.teacher||"")+" 선생님";
    let star=false;
    const sb=c.querySelector(".star");
    sb.onclick=()=>{ star=!star; sb.classList.toggle("on",star); };
    const done=(status)=>{
      const okB=c.querySelector(".ok-btn"), noB=c.querySelector(".no-btn");
      okB.disabled=true; noB.disabled=true;
      post({action:"a_set", adminKey:adminKey(), id:it.id, status:status, star:star}).then(r=>{
        if(r && r.ok){ c.style.transition="opacity .3s, transform .3s"; c.style.opacity="0"; c.style.transform="translateX(-16px)";
          setTimeout(()=>{ c.remove(); const n=Math.max(0,(parseInt(($("cnt").textContent.match(/\d+/)||[1])[0],10)-1)); $("cnt").textContent="검수 대기 "+n+"장"; if(!$("list").children.length) loadList(); },300); }   // 화면 비면 서버 재조회 — 20장 넘는 날 다음 배치(리뷰 HIGH)
        else { okB.disabled=false; noB.disabled=false; toast((r&&r.error)||"잠시 후 다시 시도해 주세요"); }
      }).catch(()=>{ okB.disabled=false; noB.disabled=false; toast("연결이 안 됐어요. 잠시 후 다시 시도해 주세요"); });
    };
    c.querySelector(".ok-btn").onclick=()=>done("공개");
    c.querySelector(".no-btn").onclick=()=>{ if(confirm("이 사진을 반려할까요? 보호자에게 보이지 않아요.")) done("반려"); };
    box.appendChild(c);
  });
}

if(adminKey()){ show("s-list"); loadList(); }
</script>
<script src="tfnav.js"></script>
</body>
</html>
