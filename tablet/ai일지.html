<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/saenggak/kakao-escape.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>AI 상담일지 — 생각공작소</title>

<!-- ═ PWA(홈 화면에 추가) — tablet PWA 재사용(scope /saenggak/) ═ -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="생각공작소">
<link rel="icon" href="/saenggak/android-icon-192x192.png">
<script src="/saenggak/favicon.js"></script>

<script>
// 앱 진입 게이트 = 직원 계정 세션 필요. 없으면 상담일지 신원으로 보냄(끝나면 여기로 복귀 — from=ai일지 화이트리스트).
//  index.html 허브 게이트와 동일 기준(needGate=PIN 6h) 유지 — 한쪽만 바꾸면 루프. 오류=잠그지 말고 통과(fail-open).
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('tf_staff_v1') || 'null');
    function storageBroken(){ try{ sessionStorage.setItem('_g','1'); sessionStorage.removeItem('_g'); return false; }catch(e){ return true; } }
    function needGate(s){
      if(!s.pinHash) return true;          // PIN 미설정 → 상담일지가 설정 받게
      var u; try{ u = sessionStorage.getItem('tf_staff_unlocked')==='1'; }catch(e){ u=false; }
      return !u || (Date.now()-(s.lastAuth||0) > 6*3600*1000);   // 잠김(콜드런치) 또는 6시간 경과
    }
    if (!(s && s.session && (storageBroken() || !needGate(s)))){
      location.replace('상담일지.html?from=ai일지');   // 세션 없음 OR PIN 잠김 → 로그인/PIN. 상담일지 신원 끝나면 여기로 복귀
    }
  } catch(e){}
})();
</script>

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    /* TOKENS:START — §3.1 정본 토큰. 직접 편집 금지: docs/1 §3.1 고치고 node 디자인프리뷰/토큰동기.js */
  --g50:#f9fafb; --g100:#f2f4f6; --g200:#e5e8eb; --g300:#d1d6db;
  --g400:#b0b8c1; --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968;
  --g800:#333d4b; --g900:#191f28;
  --green50:#f8fbf9; --green100:#e9f8ee; --green200:#cef2db; --green300:#a7e7c0; --green400:#7bcb9c;
  --green500:#57a77a; --green600:#3a8a5f; --green700:#166841; --green800:#01492a; --green900:#002614;
  --green:var(--green600); --green-dark:var(--green700); --green-bg:var(--green100);
  --red:#f04452;
  --r-sm:clamp(7px,1.8vw,10px); --r-md:clamp(10px,2.6vw,14px); --r-lg:clamp(13px,3.2vw,20px);
  --fs-display:clamp(28px,6vw,42px); --fs-h1:clamp(23px,3.4vw,30px); --fs-h2:clamp(20px,2.6vw,26px); --fs-h3:20px;
  --fs-title:17px; --fs-body:15px; --fs-sm:13.5px; --fs-caption:12px;
    /* TOKENS:END */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  input,textarea{-webkit-user-select:text;user-select:text;}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:#fff;color:var(--g900);word-break:keep-all;line-height:1.5;overscroll-behavior:none;}
  .wrap{max-width:720px;margin:0 auto;padding:24px 22px 120px;}
  .head-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px;}
  h1{font-size:var(--fs-h1);font-weight:800;letter-spacing:-.02em;}
  .who{font-size:var(--fs-sm);color:var(--g500);flex-shrink:0;}
  .count{font-size:var(--fs-sm);color:var(--g600);margin:2px 0 16px;}
  .client-list{display:flex;flex-direction:column;gap:10px;}
  .client-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 18px;border-radius:var(--r-md);background:var(--g100);cursor:pointer;transition:transform .12s,background .12s;}
  .client-card:active{transform:scale(.98);background:var(--g200);}
  .client-card .nm{font-size:var(--fs-title);font-weight:700;color:var(--g900);}
  .client-card .meta{font-size:var(--fs-sm);color:var(--g500);margin-top:2px;}
  .client-card .chev{color:var(--g400);display:flex;flex-shrink:0;}
  .client-card .chev svg{width:20px;height:20px;}
  .empty{padding:56px 0;text-align:center;color:var(--g400);font-size:var(--fs-body);}
  .note{margin-top:18px;text-align:center;font-size:var(--fs-sm);color:var(--g500);}
  .note.err{color:var(--red);}
  .note .retry{margin-left:8px;color:var(--green);font-weight:700;cursor:pointer;text-decoration:underline;}
  /* 로딩 = 출렁이는 점 (§7.1) */
  .ldb i{display:inline-block;width:5px;height:5px;margin:0 1.5px;border-radius:50%;background:currentColor;animation:ldb 1s infinite ease-in-out;}
  .ldb i:nth-child(2){animation-delay:.15s;} .ldb i:nth-child(3){animation-delay:.3s;}
  @keyframes ldb{0%,80%,100%{transform:translateY(0);opacity:.45;}40%{transform:translateY(-4px);opacity:1;}}
  /* 토스트(P1 임시 안내 — write 흐름은 P2) */
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);max-width:88%;padding:13px 18px;border-radius:var(--r-md);background:var(--g900);color:#fff;font-size:var(--fs-sm);opacity:0;pointer-events:none;transition:.25s;z-index:100;text-align:center;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="screen" id="s-kids">
  <div class="wrap">
    <div class="head-row"><h1>AI 상담일지</h1><span class="who" id="whoTag"></span></div>
    <div class="count" id="k-count"></div>
    <div class="client-list" id="k-list"></div>
    <div class="note" id="k-note"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  var GAS_EXEC = "https://script.google.com/macros/s/AKfycbySwgDsPt1jily4WenVzoGNW9L0U3wh6AEJ4Leuo315H5_DLEBfg-f4DZ5mdJ9rkkFg/exec";   // 11 플랫폼(상담일지와 같은 배포)
  function $(id){ return document.getElementById(id); }
  function sess(){ try{ return JSON.parse(localStorage.getItem('tf_staff_v1')||'null'); }catch(e){ return null; } }
  async function rpc(action, extra){
    var s = sess()||{};
    var body = Object.assign({ action:action, staffId:s.staffId, session:s.session }, extra||{});
    var res = await fetch(GAS_EXEC, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body) });
    return res.json();
  }
  function fmtBirth(b8){ var d=String(b8||"").replace(/\D/g,""); return d.length===8 ? d.slice(0,4)+"."+d.slice(4,6)+"."+d.slice(6,8) : d; }
  var toastT;
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("on"); }, 2200); }

  var allKids = [];
  function renderKids(){
    var box=$("k-list"); box.innerHTML="";
    $("k-count").textContent = "담당 " + allKids.length + "명";
    if(!allKids.length){ box.innerHTML='<div class="empty">담당 아이가 없어요</div>'; return; }
    allKids.forEach(function(c){
      var el=document.createElement("div"); el.className="client-card";
      el.innerHTML='<div><div class="nm">'+esc(c.name)+'</div><div class="meta">'+esc(c.service||'')+(c.birth?' · '+fmtBirth(c.birth):'')+'</div></div>'
        +'<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>';
      el.onclick=function(){ toast(esc(c.name)+" 기록 화면은 다음 단계에서 이어져요"); };   // P1=목록까지. write(메모→AI→확정) 흐름=P2
      box.appendChild(el);
    });
  }
  function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  async function loadKids(){
    var note=$("k-note"); note.className="note"; note.innerHTML='<span class="ldb"><i></i><i></i><i></i></span>';
    try{
      var d = await rpc('staff_clients');
      if(d && d.ok){ allKids = d.clients||[]; note.textContent=""; renderKids(); }
      else if(d && d.code==='auth'){ location.replace('상담일지.html?from=ai일지'); }   // 서버 세션 죽음 → 재인증
      else { note.className="note err"; note.innerHTML='목록을 못 불러왔어요<span class="retry" id="k-retry">다시 시도</span>'; $("k-retry").onclick=loadKids; }
    }catch(e){
      note.className="note err"; note.innerHTML='연결이 안 됐어요<span class="retry" id="k-retry">다시 시도</span>'; $("k-retry").onclick=loadKids;
    }
  }

  (function boot(){
    var s = sess();
    if(!(s && s.session)){ location.replace('상담일지.html?from=ai일지'); return; }   // head 게이트 백스톱
    $("whoTag").textContent = "상담사 " + (s.name||"");
    $("s-kids").classList.add("active");
    loadKids();
  })();
</script>
<script src="install.js"></script>
</body>
</html>
