<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<script>/* 카톡 안 브라우저면 바로 기본 브라우저로(뒤로가기·기기 기억이 카톡 안에선 안 맞음 — 유성 10-08). 등록 코드(?reg=)도 주소째 넘어간다 */
if (/KAKAOTALK/i.test(navigator.userAgent)) location.replace('kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href));</script>
<title>추천서 — 생각공작소</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 22 추천서 휴대폰 발송 화면(2026-10-08) — Pages 판(GAS 회색 안내 줄 없애려고 옮김, 유성 10-08). 화면 코드만 공개 레포, 데이터는 등록된 기기 열쇠로 22 doPost에서.
   원본 = 생각공작소 레포 scripts/22_추천서/휴대폰.js(서버).  시안 = prototype/22_추천서_휴대폰발송_4방향_프리뷰.html(C 할 일 목록 2차).
   토큰 = docs/1 §3.1 정본 :root에서 쓰는 칸만. 상태 딱지 색 = 관리시트.js HB_STATUS_BG 그대로(시트에서 보던 것과 같게 — 유성 10-08). */
:root{
  --g50:#f9fafb; --g100:#f2f4f6; --g200:#e5e8eb; --g300:#d1d6db; --g400:#b0b8c1; --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968; --g800:#333d4b; --g900:#191f28;
  --green50:#f8fbf9; --green100:#e9f8ee; --green200:#cef2db; --green600:#3a8a5f; --green700:#166841;
  --warn-weak-bg:#fef4e2; --warn-weak-fg:#8a5a00; --danger-weak-bg:#fdecee; --danger-weak-fg:#c0392b; --p-disabled:#b7e0c8;
  --sh1:0 1px 2px rgba(47,111,77,.05), 0 4px 14px rgba(47,111,77,.06);   /* §3.4 그린틴트 2겹 — 흰 바탕 위 카드 */
  --fs-title:17px; --fs-body:15px; --fs-sm:13.5px; --fs-caption:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--g900);font-family:Pretendard,"Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:var(--fs-body);line-height:1.55;word-break:keep-all;-webkit-font-smoothing:antialiased}
button{font:inherit}
.top{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;gap:6px;padding:14px 16px 10px;font-weight:700;font-size:var(--fs-title)}
.top .sp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{border:0;background:none;padding:6px;margin:-6px;color:var(--g800);cursor:pointer;display:grid;place-items:center}
.tl{border:0;background:none;color:var(--g600);font-size:var(--fs-sm);font-weight:600;cursor:pointer;padding:6px 4px}
.grp{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--g500);padding:14px 20px 6px}
.grp .n{color:var(--g400);margin-left:4px;font-variant-numeric:tabular-nums}
.grp button{border:0;background:none;color:var(--g500);font-size:12.5px;cursor:pointer;padding:0}
.lc{background:#fff;border-radius:16px;margin:0 12px;overflow:hidden;box-shadow:var(--sh1)}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.row+.row{border-top:1px solid var(--g100)}
.row:active{background:var(--g50)}
.row.hl{background:var(--green50)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15.5px}
.row .t span{display:block;font-size:12.5px;color:var(--g500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span.err{color:var(--danger-weak-fg)}
.row.past .t b{color:var(--g500);font-weight:600}
.stc{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.st{font-size:12.5px;font-weight:700;border-radius:6px;padding:3px 8px;color:#202124;white-space:nowrap}
.st.new{background:#e0e0e0}.st.draft{background:#d3e3fd}.st.risk,.st.aifail,.st.sfail{background:#f8d7da}
.st.issued{background:#fff3cd}.st.sent{background:#c8e6c9}.st.old{background:#eeeeee;color:#9e9e9e}.st.hold{background:#ffe0b2}.st.ing{background:var(--g100);color:var(--g600)}
.empty{text-align:center;color:var(--g500);padding:60px 24px}
.pad{padding:0 14px}
.note{border-radius:12px;padding:11px 13px;font-size:var(--fs-sm);margin:8px 0;white-space:pre-line}
.note b{display:block;margin-bottom:2px}
.note.w{background:var(--warn-weak-bg);color:var(--warn-weak-fg)}
.note.r{background:var(--danger-weak-bg);color:var(--danger-weak-fg)}
.note.n{background:var(--g50);color:var(--g700)}
.note.g{background:var(--green100);color:var(--green700)}
.fb{background:#fff;border-radius:14px;padding:4px 14px;margin:8px 0;box-shadow:var(--sh1)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-sm);padding:9px 0}
.kv+.kv{border-top:1px solid var(--g100)}
.kv span:first-child{color:var(--g500);flex:none}
.kv span:last-child{font-weight:700;text-align:right;min-width:0;word-break:break-all}
.call{display:inline-block;margin:2px 0 8px;font-size:13.5px;font-weight:700;color:var(--green700);text-decoration:none}
.who{font-size:13px;font-weight:700;color:var(--g600);margin:14px 2px 6px}
.pw{position:relative;overflow:hidden;background:#fff;border-radius:6px;box-shadow:var(--sh1)}
.pw.on{overflow-x:auto}
.pw iframe{border:0;display:block;transform-origin:0 0;background:#fff}
.pw .cap{position:absolute;left:0;top:0}
.ph{font-size:12px;color:var(--g500);text-align:center;margin:6px 0 2px}
.bar{position:sticky;bottom:0;z-index:5;padding:20px 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 24%)}
.bar .sub{text-align:center;color:var(--g500);font-size:12.5px;margin-top:8px}
.btns{display:flex;gap:8px}
.btn{flex:1;display:block;width:100%;border:0;border-radius:15px;background:var(--green600);color:#fff;font-weight:700;font-size:16px;padding:15px;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.985);background:var(--green700)}
.btn.gh{background:var(--g100);color:var(--g800)}
.btn.gh:active{background:var(--g200)}
.btn[aria-disabled="true"]{background:var(--p-disabled)}
.load{display:flex;flex-direction:column;align-items:center;gap:14px;padding:80px 20px;color:var(--g500);font-size:var(--fs-sm)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--green200);border-top-color:var(--green600);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ib.busy svg{animation:sp .8s linear infinite}
.full{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 28px;background:#fff}
.ttl{font-size:22px;font-weight:700;letter-spacing:-.5px}
.sub2{color:var(--g500);font-size:var(--fs-sm);margin:6px 0 24px;white-space:pre-line}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;z-index:20}
.cm{width:calc(100% - 64px);max-width:320px;background:#fff;border-radius:20px;padding:22px 20px 16px;text-align:left}
.cm .mt{font-size:18px;font-weight:700;letter-spacing:-.3px}
.cm .ms{font-size:var(--fs-sm);color:var(--g600);margin-top:8px}
.cm .mr{display:flex;gap:8px;margin-top:16px}
.cm .mr button{flex:1;border:0;border-radius:13px;padding:13px;font-weight:700;cursor:pointer}
.cm .mr .c{background:var(--g100);color:var(--g700)}
.cm .mr .o{background:var(--green600);color:#fff}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--g800);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill .spin{width:14px;height:14px;border-width:2px;border-color:rgba(255,255,255,.35);border-top-color:#fff}
.toast{position:fixed;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--g800);color:#fff;border-radius:12px;padding:12px 14px;font-size:var(--fs-sm);white-space:pre-line}
/* §5.4 스켈레톤 = 실제 줄 마크업에 회색 바만, 훑기 하나, 누름 막음 */
.sk{pointer-events:none;position:relative}
.sk-b{display:block;border-radius:6px;background-color:var(--g100);background-image:linear-gradient(90deg,rgba(255,255,255,0) 0,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 100%);background-size:60% 100%;background-repeat:no-repeat;background-position:-150% 0;animation:sksh 1.5s ease-in-out infinite}
@keyframes sksh{0%{background-position:-150% 0}70%,100%{background-position:250% 0}}
.skw{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;background:#fff;border-radius:999px;box-shadow:var(--sh1);padding:10px 16px;font-size:var(--fs-sm);color:var(--g700);text-align:center;white-space:pre-line;max-width:calc(100% - 48px);pointer-events:none}
.skp{background:#fff;border-radius:6px;box-shadow:var(--sh1);aspect-ratio:210/297;padding:9% 8%;display:flex;flex-direction:column;gap:3.2%}
.errb{text-align:center;color:var(--g600);padding:60px 24px;white-space:pre-line}
.errb b{display:block;color:var(--g900);font-size:16px;margin-bottom:4px}
.errb .btn{max-width:200px;margin:20px auto 0}
@media (prefers-reduced-motion:reduce){.spin,.sk-b,.ib.busy svg{animation:none}}
</style>
</head>
<body>
<div id="app"><div class="load"><div class="spin"></div>불러오는 중</div></div>
<script>
(function () {
  var KEY = 'rc-mb-dev', app = document.getElementById('app');
  var tok = '', ST = {}, items = [], sheetUrl = '', focusId = '', view = 'list', cur = null, showSent = false;
  var docs = {}, errs = {}, queue = [], sending = null, poll = 0;

  function lsGet() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function lsSet(v) { try { localStorage.setItem(KEY, v); return localStorage.getItem(KEY) === v; } catch (e) { return false; } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // 22 웹앱 doPost — text/plain이라 프리플라이트 없음(23·24와 같은 결). 서버 오류는 { ok:false, error } → reject
  var GAS_EXEC = 'https://script.google.com/macros/s/AKfycbxiaIfUdh0q1C_OF65xmk-4QQLUklWPjcq2ZKBVpnI5TYhHV9TXyKUUWqRxEkZk_WnR0A/exec';
  var ACT = { mbImages: 'imgs', mbList: 'list', mbDoc: 'doc', mbSend: 'send', mbHold: 'hold', mbUnhold: 'unhold', mbRequestReg: 'reqreg', mbRegister: 'register', mbSendResult: 'sendres' };
  function isTransient(x) { return x instanceof TypeError || String(x && x.message) === 'BAD_REPLY'; }   // 응답을 못 받은 것(서버가 했는지 모름)
  function run(fn) {
    var a = [].slice.call(arguments, 1), body = { action: ACT[fn] };
    if (fn === 'mbRegister') { body.code = a[0]; body.ua = a[1]; }
    else if (fn === 'mbSendResult') { body.tok = a[0]; body.job = a[1]; }
    else if (fn !== 'mbRequestReg') { body.tok = a[0]; body.id = a[1]; if (a[2]) body.job = a[2]; }
    var once = function () {
      return fetch(GAS_EXEC, { method: 'POST', body: JSON.stringify(body) })
        .then(function (r) { return r.text(); })
        .then(function (t) {
          var o; try { o = JSON.parse(t); } catch (x) { throw new Error('BAD_REPLY'); }   // 구글이 JSON 대신 HTML 화면을 줄 때가 있다(10-08 실측)
          if (o && o.error) throw new Error(o.error); return o ? o.data : null;
        });
    };
    if (!{ mbList: 1, mbDoc: 1, mbImages: 1, mbSendResult: 1 }[fn]) return once();   // 보내기·등록은 두 번 가면 안 된다 = 한 번만
    // 읽기 = 4초 안에 안 오면 같은 요청을 하나 더 보내 먼저 온 것을 쓴다(HTML·끊김이면 바로 하나 더).
    // 10-08 실측: 빈 요청도 구글 쪽에서 가끔 8~43초(빈 1줄 프로젝트도 같이 느림 = 22 코드 탓 아님), 바로 다음 요청은 대개 2초
    //   → 실측 분포로 돌려 보면 10초 넘는 대기 9.8% → 1.6%
    return new Promise(function (res, rej) {
      var started = 0, inflight = 0, done = false, timer = 0;
      var transient = isTransient;
      var go = function () {
        started++; inflight++;
        once().then(function (d) { inflight--; if (done) return; done = true; clearTimeout(timer); res(d); },
          function (x) {
            inflight--; if (done) return;
            if (!transient(x)) { done = true; clearTimeout(timer); return rej(x); }
            if (started < 2) { clearTimeout(timer); return go(); }
            if (!inflight) { done = true; rej(x); }
          });
      };
      go();
      timer = setTimeout(function () { if (!done && started < 2) go(); }, 4000);
    });
  }
  function needReg(e) { return /NEED_REG/.test(String(e && e.message || e)); }
  function toast(msg, ms) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, ms || 3500);
  }

  // ── 상태 → 딱지·묶음 ──
  function cls(st) {
    return ({ NEW: 'new', DRAFT: 'draft', RISK: 'risk', FAIL: 'aifail', ISSUED: 'issued', SENT: 'sent', SENDFAIL: 'sfail', FIX: 'hold' })[keyOf(st)] || 'new';
  }
  function keyOf(st) { for (var k in ST) if (ST[k] === st) return k; return ''; }
  function grpOf(st) {
    var k = keyOf(st);
    if (k === 'SENDFAIL') return 'fail';
    if (k === 'DRAFT' || k === 'RISK' || k === 'ISSUED') return 'ready';
    if (k === 'FIX' || k === 'FAIL') return 'pc';
    if (k === 'NEW') return 'draft';
    if (k === 'SENT') return 'sent';
    return 'other';
  }
  // 같은 묶음 안의 형제(같은 가족키)는 한 줄 — 한 메일로 가니까
  function entries() {
    var out = [], byKey = {};
    items.forEach(function (it) {
      if (queued(it.id)) return;
      var g = grpOf(it.st), k = g + '|' + (it.fam || it.id);
      if (byKey[k]) { byKey[k].members.push(it); return; }
      byKey[k] = { g: g, members: [it] }; out.push(byKey[k]);
    });
    out.forEach(function (e) { e.id = e.members[0].id; e.name = e.members.map(function (m) { return m.name; }).join(', '); e.st = e.members[0].st; e.at = e.members[0].at; });
    out.sort(function (a, b) { return a.at < b.at ? -1 : a.at > b.at ? 1 : 0; });
    return out;
  }
  function queued(id) { return (sending && sending.ids.indexOf(id) >= 0) || queue.some(function (q) { return q.ids.indexOf(id) >= 0; }); }
  function subOf(e) {
    var m = e.members[0], k = keyOf(e.st);
    if (errs[e.id]) return '<span class="err">못 보냄: ' + esc(errs[e.id].split('\n')[0]) + '</span>';
    if (k === 'NEW') return '<span>초안 쓰는 중, 1분쯤 걸려요</span>';
    if (k === 'SENT') return '<span>' + esc(m.sent) + '</span>';
    if (k === 'SENDFAIL') return '<span class="err">메일이 안 갔어요</span>';
    if (k === 'FIX') return '<span>PC에서 고칠 것</span>';
    if (k === 'FAIL') return '<span>AI가 초안을 못 썼어요</span>';
    return '<span>' + (e.members.length > 1 ? '형제, ' : '') + esc(m.gu || '') + ', 접수 ' + esc(m.at) + '</span>';
  }
  function chip(e) {
    return '<span class="stc"><b class="st ' + cls(e.st) + '">' + esc(e.st) + '</b>' + (e.members.some(function (m) { return m.resub; }) ? '<b class="st old">↻ 재접수</b>' : '') + '</span>';
  }

  // ── 목록 ──
  function topList(busy) {
    return '<div class="top"><span class="sp">추천서</span><button class="tl" data-go="sheet">시트</button><button class="ib' + (busy ? ' busy' : '') + '" data-go="reload" aria-label="새로고침"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button></div>';
  }
  // §5.4 — 실제 줄과 같은 마크업에 회색 바만. .sk = 누름 막음
  function skelList() {
    var row = '<div class="row"><div class="t"><span class="sk-b" style="width:34%;height:16px;margin:3px 0 8px"></span><span class="sk-b" style="width:64%;height:12px"></span></div><span class="sk-b" style="width:58px;height:23px;flex:none"></span></div>';
    var grp = function (w, n) { return '<div class="grp"><span class="sk-b" style="width:' + w + 'px;height:13px"></span></div><div class="lc">' + new Array(n + 1).join(row) + '</div>'; };
    return '<div class="sk">' + grp(52, 3) + grp(70, 2) + grp(64, 1) + '</div>';
  }
  function renderList() {
    view = 'list'; cur = null; clearWait();
    var es = entries(), by = function (g) { return es.filter(function (e) { return e.g === g; }); };
    var row = function (e) { return '<div class="row' + (e.g === 'sent' ? ' past' : '') + (focusId && e.members.some(function (m) { return m.id === focusId; }) ? ' hl' : '') + '" data-id="' + esc(e.id) + '"><div class="t"><b>' + esc(e.name) + '</b>' + subOf(e) + '</div>' + chip(e) + '</div>'; };
    var grp = function (title, list, extra) { return list.length ? '<div class="grp"><span>' + title + '<span class="n">' + list.length + '</span></span>' + (extra || '') + '</div><div class="lc">' + list.map(row).join('') + '</div>' : ''; };
    var sent = by('sent');
    var h = topList(false)
      + grp('안 간 것', by('fail')) + grp('보낼 것', by('ready')) + grp('PC에서 할 것', by('pc')) + grp('초안 쓰는 중', by('draft'))
      + (sent.length ? '<div class="grp"><span>최근 보낸 것<span class="n">' + sent.length + '</span></span><button data-go="sent">' + (showSent ? '접기' : '펼치기') + '</button></div>' + (showSent ? '<div class="lc">' + sent.slice().reverse().map(row).join('') + '</div>' : '') : '')
      + (es.length ? '' : '<div class="empty">지금은 할 일이 없어요</div>') + '<div style="height:40px"></div>';
    app.innerHTML = h;
    pillUpdate();
    clearTimeout(poll);
    if (by('draft').length) poll = setTimeout(function () { if (view === 'list') loadList(true); }, 20000);   // 쓰는 중이 있으면 20초마다
  }
  var LIST_KEY = 'rc-mb-list';
  // bg=true: 보던 목록을 그대로 두고 뒤에서 새로 받는다(처음 열 때 기억한 목록·20초 자동 갱신).
  // bg=false: 새로고침 버튼 = 목록을 뼈대로 바꾸고 못 누르게(유성 10-08) + §5.4 「대기가 길 때」 3초·12초·20초.
  // 실패해도 상세 화면은 절대 덮지 않는다(10-08 유성: 보낸 아이를 열었는데 「불러오지 못했어요」로 바뀌고 다시 시도가 안 먹음)
  var loadGen = 0, waitT = [];
  function clearWait() { waitT.forEach(clearTimeout); waitT = []; var w = document.getElementById('skw'); if (w) w.remove(); }
  function listErr(title) {
    app.innerHTML = topList(false) + '<div class="errb"><b>' + title + '</b><button class="btn" data-go="retry">다시 불러오기</button></div>';
  }
  function loadList(bg) {
    var my = ++loadGen;
    clearWait(); clearTimeout(poll);
    if (!bg) {
      view = 'list'; cur = null;

        else if (r.ok) toast('카톡으로 등록 링크를 보냈어요. 10분 안에 이 기기에서 눌러 주세요.', 6000);
        else toast('카톡을 못 보냈어요. 잠시 후 다시 눌러 주세요.');
      }).catch(function () { toast('카톡을 못 보냈어요. 잠시 후 다시 눌러 주세요.'); t.removeAttribute('aria-disabled'); });
    }
  });
  window.addEventListener('resize', function () { [].forEach.call(document.querySelectorAll('.pw'), function (w) { if (w._fit) w._fit(); }); });
  window.addEventListener('popstate', function (ev) { if (!ev.state || !ev.state.d) { if (view === 'detail') { renderList(); window.scrollTo(0, listY); } } });

  // ── 시작 ──
  (function () {
    var q = new URLSearchParams(location.search);
    focusId = q.get('id') || '';
    tok = lsGet();
    var reg = q.get('reg');
    if (reg) { try { history.replaceState(null, '', location.pathname); } catch (x) {} return register(reg); }   // 등록 코드는 주소창에서 지운다
    if (!tok) return renderFirst();
    try { var c = JSON.parse(localStorage.getItem(LIST_KEY) || 'null'); if (c && c.items) { ST = c.st; items = c.items; sheetUrl = c.sheet; renderList(); var f = focusId && entries().filter(function (e) { return e.members.some(function (m) { return m.id === focusId; }); })[0]; if (f && f.g !== 'draft') openDetail(f); } } catch (e) {}
    loadList(!!items.length);
  })();
})();
</script>
