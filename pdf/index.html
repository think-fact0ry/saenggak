<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>PDF PNG — 주소가 바뀌었어요</title>
<meta http-equiv="refresh" content="0;url=https://think-fact0ry.github.io/pdfpng/">
<script>
// 구주소(2026-07-21 당일 이사) — 남은 서비스워커·캐시를 정리하고 새 주소로 보냄
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
if (window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ if (k.indexOf('tf-pdf') === 0) caches.delete(k); }); });
location.replace('https://think-fact0ry.github.io/pdfpng/');
</script>
</head>
<body>
<p style="font-family:sans-serif;padding:40px">주소가 바뀌었어요 → <a href="https://think-fact0ry.github.io/pdfpng/">think-fact0ry.github.io/pdfpng</a></p>
</body>
</html>
