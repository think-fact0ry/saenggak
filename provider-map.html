function boot(){
  if (getAdminToken()) MODE = 'admin';
  else { var s = getStaffSess(); MODE = (s && s.session) ? 'provider' : 'basic'; }
  applyModeUI();
  if (MODE === 'admin') { loadProviders(); loadOccupancy(); }   // 병렬 — 겹침 배지용 점유표(추가 지연 0)
  else if (MODE === 'provider') loadStaffMap();
  else loadBasicMap();
}
// 🔑 행정 버튼: basic서 토큰 입력→행정 승격(토큰은 localStorage에 영구 저장, 다음 방문부터 자동 admin)
function adminKeyLogin(){
  promptAdminToken('🔑 행정 인증 토큰을 입력하세요:').then(function(){
    if (getAdminToken()){ MODE='admin'; applyModeUI(); _svcCache={}; loadProviders(); loadOccupancy(); }
  });
}
function applyModeUI(){
  var admin = MODE === 'admin', provider = MODE === 'provider';
  var show = function(id, on){ var el = document.getElementById(id); if (el) el.style.display = on ? '' : 'none'; };
  show('providerSelect', admin);          // 행정만 제공인력 선택 드롭다운
  show('dashLink', admin);
  show('searchWrap', admin);              // 검색은 전 아동 PII 노출 → 행정만
  show('nlFab', admin);                   // 신청폼 리스트 패널 → 행정만
  show('filterHome', admin || provider);
  show('filterAssigned', admin || provider);
  show('filterMark', admin);              // 마크 = 행정 매칭 shortlist 전용
  show('waitAge', admin);                 // 대기 기간 슬라이더 = 행정 전용(확정: 서버 0줄·행정만)
  // 숨김→보임으로 바뀐 **그 자리에서** 다시 그린다. 안 하면 원이 0px에 남고 알약 글자가 비어
  // '작은 검정 조각'만 뜬다(유성 08-31). 알약 폭(offsetWidth)도 보이는 상태에서만 제대로 잰다.
  if (admin && typeof _waLayout === 'function') _waLayout();
  show('legendMark', admin);
  show('staffLoginBtn', MODE === 'basic');
  show('adminKeyBtn', MODE === 'basic');   // 신규/초기화 브라우저(basic)서 행정으로 올라갈 입구 — PC 주소 직접진입 대비
  var who = document.getElementById('staffWhoami');
  if (who){
    who.style.display = provider ? '' : 'none';
    if (provider){ var ss = getStaffSess(); var b = who.querySelector('b'); if (b) b.textContent = (ss && ss.name) || '제공인력'; }
  }
  if (!admin) hideDashboard();
  // 모드별 마커 토글 기본값(서비스 전환 시엔 유지 — applyModeUI는 모드 바뀔 때만 호출)
  if (MODE === 'basic'){ showHome=false; showAssigned=false; showWaiting=true; }
  else if (provider){ showHome=true; showAssigned=true; showWaiting=true; }
  ['filterHome','filterAssigned','filterWaiting','filterMark'].forEach(function(id){
    var el=document.getElementById(id); if(!el) return;
    var on = id==='filterHome'?showHome : id==='filterAssigned'?showAssigned : id==='filterMark'?showMark : showWaiting;
    el.classList.toggle('active', on);
  });
  var logo = document.querySelector('.controls .logo span');
  if (logo) logo.textContent = admin ? '지도 · 행정' : (provider ? '지도 · 제공인력' : '지도');
}

// ══ 대시보드 ══
function updateDashboard() {
  if (!currentData) return;
  var d = currentData;
  var total = d.assigned.length + d.waiting.length;
  document.getElementById('dashTotal').textContent = total;
  document.getElementById('dashAssigned').textContent = d.assigned.length;
  // 대기 = 요일/시간 필터가 걸린 뒤의 수. 자르면 '268명 중 58명'(PC) / '268 중 58'(폰, '명' 없이).
  var dw = document.getElementById('dashWait');
  if (dw){
    var base = getFilteredWaiting();
    var live = base.filter(_waAlive).length;
    var narrow = window.innerWidth <= 480;
    var unit = narrow ? '' : '<i>명</i>';
    dw.innerHTML = (_waCutoff() === Infinity)
      ? '<i>대기</i><b>' + base.length + '</b>' + unit
      : '<i>대기</i><b class="den">' + base.length + '</b><i>' + (narrow ? '중' : '명 중') + '</i><b>' + live + '</b>' + unit;
  }
  document.getElementById('dashboard').classList.add('show');
  if (typeof _waLayout === 'function') _waLayout();   // 띠가 열린 그 자리에서(폰=슬라이더가 이 안에 있다)
  _fitDashbar();
}
function hideDashboard() { document.getElementById('dashboard').classList.remove('show'); }

function getFilteredWaiting() {
  if (!currentData) return [];
  var day = document.getElementById('filterDay').value;
  var hour = document.getElementById('filterTime').value;

/* '전체'면 글자를 안 그린다(CSS .allsel) — 좁은 폰 28px 칸에 '전체 요일'이 안 들어가 잘렸다.

function applyFilters() { _dashSelMark(); renderMarkers(); updateDashboard(); }
// currentData가 갈리면 기준 시각표(_waEff)도 다시 만들어야 한다 — 안 하면 옛 서비스의 행 번호로 자른다
function _waInvalidate(){ _waEff = null; }

/* ══════════════════════════════════════════════════════════════════════════════
   대기 기간 슬라이더 (2026-08-31, 유성 발의 · 프리뷰 10라운드로 전 항목 확정)
   통증 = "오래된 대기 마커와 방금 온 것이 구분 안 됨(오래된 건 사실상 잠수)".
   확정 = 대기만 자른다 / 묶기 전에 자른다(같은 자리 N명 숫자가 같이 줄어든다) / 배정·집·마크는 그대로 /
          기본 최근 3개월 / 칸 5개를 로그 간격 / 행정 전용 / 서버 0줄.
   ══════════════════════════════════════════════════════════════════════════════ */
var WA_STOPS = [
  { age: Infinity, label: '전체' },
  { age: 180, label: '최근 6개월' },
  { age: 90,  label: '최근 3개월' },
  { age: 30,  label: '최근 1개월' },
  { age: 7,   label: '최근 1주' }
];
(function(){   // 칸 위치 = 로그 간격. 기준 축을 365→7로 **고정**한다 — 데이터 최고령에 맞추면 계절마다 칸이 흔들린다.
  var HI = Math.log(365), LO = Math.log(7);
  WA_STOPS.forEach(function(x){ x.v = (x.age === Infinity) ? 0 : (HI - Math.log(x.age)) / (HI - LO); });
})();
var waV = 0;   // 슬라이더 값 0~1. 부팅에서 '최근 3개월'로 세팅(저장 안 함 — 새로고침하면 늘 3개월)

function _waStopAt(v){
  var best = WA_STOPS[0], bd = Infinity;
  WA_STOPS.forEach(function(x){ var d = Math.abs(x.v - v); if (d < bd){ bd = d; best = x; } });
  return best;
}
function _waCutoff(){ return _waStopAt(waV).age; }

/* 🔴 기준축 = '마지막 움직임(행 순서)'. A열 접수시각은 재신청·본인수정에도 **원본이 유지된 채** 그 행만
   맨 아래로 가므로 날짜로 자르면 어제 다시 신청한 집이 숨는다(리스트 '최신순'이 행 번호를 쓰는 이유와 같다).
   ⇒ 행 순서를 훑으며 '그 행 위쪽의 가장 늦은 접수일'을 하한으로 삼는다.
   🔴 모집단이 결과를 뒤집는다(실측 08-30): 이 running-max를 **전체 행**(거절 포함)으로 돌리면 시트 4행의
      이상치 한 줄(접수 2026-06-04·거절)이 아래 전 행에 상속돼 3개월 컷에서 대기 268명이 **전원 살아남는다**
      = 슬라이더가 아무것도 안 자른다. **대기 배열만**으로 돌리면 58명(22%)이 남아 정상 동작한다. */
var _waEff = null;   // row → 기준 시각(ms)
function _waBuildEff(){
  _waEff = {};
  if (!currentData || !currentData.waiting) return;
  var list = currentData.waiting.slice().sort(function(a,b){ return (a.row||0) - (b.row||0); });
  var run = 0;
  list.forEach(function(c){
    var t = c.timestamp ? new Date(c.timestamp).getTime() : 0;
    if (isNaN(t)) t = 0;
    var eff = Math.max(t, run);
    _waEff[c.row] = eff;
    if (t > run) run = t;
  });
}
function _waAgeDays(c){
  if (!_waEff) _waBuildEff();
  var eff = _waEff[c.row] || 0;
  if (!eff) return Infinity;          // 시각을 못 읽으면 '오래됨'이 아니라 **모름** — 자르지 않는다(아래 _waAlive)
  return (Date.now() - eff) / 86400000;
}
/* 모름(시각 없음)은 '아님'이 아니다 — 안 자르는 쪽으로 안전하게 틀린다(data-presence 규율). */
function _waAlive(c){
  var cut = _waCutoff();
  if (cut === Infinity) return true;
  var eff = (_waEff || (_waBuildEff(), _waEff))[c.row] || 0;
  if (!eff) return true;
  return (Date.now() - eff) / 86400000 <= cut;
}

// ── 슬라이더 기하 (원·점·알약이 같은 매핑을 쓴다) ──
var WA_INSET = 4, WA_THUMB_R = 9;
function _waPosPx(el, v){ var w = el.clientWidth || 180; return WA_INSET + v * (w - 2 * WA_INSET); }
function _waVFromPx(el, px){ var w = el.clientWidth || 180; return Math.max(0, Math.min(1, (px - WA_INSET) / (w - 2 * WA_INSET))); }
var _waRo = null;
function _waWatch(){
  var el = document.getElementById('waitAge');
  if (!el || !window.ResizeObserver) return;
  if (_waRo) _waRo.disconnect();
  // _waLayout은 자식의 left만 건드려 .wa 크기를 안 바꾼다 → 되먹임 루프 없음
  _waRo = new ResizeObserver(function(){ _waLayout(); });
  _waRo.observe(el);
}

function _waLayout(){
  // ⚠️ display:none을 이유로 빠져나가면 **보이게 된 뒤에 다시 부를 사람이 없다**(유성 08-31 적발).
  //    폭이 0일 때만 건너뛴다 — 그때만 계산이 망가지고, 폭이 생기는 순간 다시 불리면 정확해진다.
  var el = document.getElementById('waitAge'); if (!el || !el.clientWidth) return;
  var c = _waPosPx(el, waV);
  var th = el.querySelector('.thumb'); if (th) th.style.left = c + 'px';
  var st = el.querySelector('.stops');
  if (st){
    if (st.childElementCount !== WA_STOPS.length){
      st.innerHTML = '';
      WA_STOPS.forEach(function(){ st.appendChild(document.createElement('i')); });
    }
    Array.prototype.forEach.call(st.children, function(d,i){ d.style.left = _waPosPx(el, WA_STOPS[i].v) + 'px'; });
  }
  var pill = el.querySelector('.pill');
  if (pill){
    var label = _waStopAt(waV).label;
    if (pill.textContent !== label) pill.textContent = label;
    // 양끝에서 알약 가장자리가 원 가장자리에 맞는다(유성 확정): L = C − r − (Wp − 2r)·v
    var wp = pill.offsetWidth || 60;
    pill.style.left = (c - WA_THUMB_R - (wp - 2 * WA_THUMB_R) * waV) + 'px';
  }
}
/* 드래그 중엔 **스냅하지 않는다** — 칸이 5개뿐이라 스냅하면 손가락을 끌어도 다섯 단계로 점프해 뚝뚝 끊긴다
   (유성 지적). 원은 손가락을 그대로 따라오고, 보여줄 값(알약 글자·마커)만 가장 가까운 칸을 쓴다. */
function _waBind(){
  var el = document.getElementById('waitAge'); if (!el || el.__bound) return; el.__bound = true;
  var grabbing = false, ended = true;
  function vAt(cx){ var r = el.getBoundingClientRect(); return _waVFromPx(el, cx - r.left); }
  function nearThumb(cx){ var r = el.getBoundingClientRect(); return Math.abs(cx - (r.left + _waPosPx(el, waV))) <= 16; }
  function snap(v){ return _waStopAt(v).v; }
  function put(v, glide){
    waV = Math.max(0, Math.min(1, v));
    el.classList.toggle('anim', !!glide);
    _waSchedule();
  }
  function cxOf(e){ return e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : null); }
  function down(e){
    var cx = cxOf(e); if (cx == null) return;
    ended = false; grabbing = true; el.classList.add('dragging');
    if (nearThumb(cx)) el.classList.remove('anim');
    else put(snap(vAt(cx)), true);
    if (e.pointerId != null && el.setPointerCapture){ try { el.setPointerCapture(e.pointerId); } catch(_){} }
    if (e.cancelable) e.preventDefault();
  }
  function move(e){
    if (!grabbing) return;
    var cx = cxOf(e); if (cx == null) return;
    put(vAt(cx), false);
    if (e.cancelable) e.preventDefault();
  }
  function up(){
    if (ended) return; ended = true; grabbing = false;
    el.classList.remove('dragging');
    put(snap(waV), true);
  }
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointermove', move);
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){ el.addEventListener(ev, up); });
  // 터치는 pointer만으론 스크롤에 뺏긴다 — 반드시 {passive:false}
  el.addEventListener('touchstart', function(e){ if (!grabbing) down(e); }, {passive:false});
  el.addEventListener('touchmove', move, {passive:false});
  ['touchend','touchcancel'].forEach(function(ev){ el.addEventListener(ev, up); });
  el.addEventListener('keydown', function(e){
    var i = WA_STOPS.indexOf(_waStopAt(waV)), d = 0;
    if (e.key === 'ArrowRight') d = 1;
    else if (e.key === 'ArrowLeft') d = -1;
    else if (e.key === 'Home'){ put(0, true); e.preventDefault(); return; }
    else if (e.key === 'End'){ put(1, true); e.preventDefault(); return; }
    else return;
    e.preventDefault();
    put(WA_STOPS[Math.max(0, Math.min(WA_STOPS.length - 1, i + d))].v, true);
  });
}
// 드래그 입력 코얼레싱 — 한 프레임에 한 번만 그린다
var _waPending = null;
function _waSchedule(){
  if (_waPending) return;
  _waPending = requestAnimationFrame(function(){ _waPending = null; _waLayout(); _waApplyCut(); updateDashboard();
    if (window.candCut) candCut();   // 빈 자리 후보도 같이 잘린다(전량 재렌더 없이 델타)
  });
}

/* 🟢 마커를 다시 만들지 않는다 — kakao.maps.Marker.setOpacity()/setZIndex()/setImage()로 상태만 민다.
   (필터 토글·서비스 전환은 여전히 전량 재생성. 여기만 델타.) 마커에 붙여둔 __items가 판정 소스다. */
function _waApplyCut(){
  var cut = _waCutoff();
  markers.forEach(function(m){
    if (!m.__items || m.__kind !== 'waiting' || m.__mark) return;
    var live = 0, absent = false;
    for (var i = 0; i < m.__items.length; i++){
      if (_waAlive(m.__items[i])){ live++; if (m.__items[i].status === '부재1') absent = true; }
    }
    var sunk = (live === 0);
    var showN = sunk ? m.__items.length : live;
    if (sunk){ for (var j = 0; j < m.__items.length; j++) if (m.__items[j].status === '부재1') absent = true; }
    var img = getMarkerImage('waiting', showN, { absent: absent, gray: sunk });
    if (m.__imgKey !== showN + '|' + (absent?1:0) + '|' + (sunk?1:0)){
      m.__imgKey = showN + '|' + (absent?1:0) + '|' + (sunk?1:0);
      m.setImage(img);
    }
    if (m.setOpacity) m.setOpacity(sunk ? _waOpacity() : 1);
    // 가라앉은 건 **전부 또렷한 마커 밑**으로(유성). 카카오 음수 zIndex는 미확인이라 0으로 두고 정상은 1 이상.
    m.setZIndex(sunk ? 0 : 1);
  });
}
function _waOpacity(){
  var v = getComputedStyle(document.documentElement).getPropertyValue('--cutop');
  var n = parseFloat(v); return isNaN(n) ? 0.1 : n;
}

/* 슬라이더 자리 = PC는 상단 바(유성 지정), 폰(≤480)은 둘째 줄(대시보드 바) — 갈래 6 A안 확정.
   CSS로는 부모를 못 바꾸므로 DOM을 옮긴다. */
function _waPlace(){
  var el = document.getElementById('waitAge'); if (!el) return;
  var narrow = window.innerWidth <= 480;
  var host = narrow ? document.querySelector('.dashboard .dash-filters') : null;
  if (narrow){
    if (host && el.parentElement !== host) host.appendChild(el);
  } else {
    var svc = document.getElementById('svcFilter');
    if (svc && el.nextElementSibling !== svc.previousElementSibling) {
      svc.parentElement.insertBefore(el, svc.previousElementSibling);   // 서비스 앞 divider 앞자리
    }

}


/* 모바일 둘째 줄이 한 줄에 안 들어가면 '배정'을 뺀다(V2→V3, 유성 2026-08-31).
   고정 브레이크포인트가 아니라 **실측**이다 — 필요 폭은 기기·폰트에 따라 몇 px 달라져서
   @media로 박으면 그 오차만큼 어긋난다. 한 태스크 안에서 보이게→재고→숨기므로 깜빡임이 없다.
   ⚠️ 줄 수는 **바 높이**로 본다. offsetTop 비교는 align-items:center라 같은 줄에서도 다르고,
      left 되감김은 .dash-filters의 margin-left:auto 때문에 둘째 줄에서 오히려 left가 커져 못 잡는다. */
function _barWraps(bar){
  var cs = getComputedStyle(bar);
  var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  var maxH = 0;
  Array.prototype.forEach.call(bar.children, function(k){
    if (getComputedStyle(k).display === 'none') return;
    maxH = Math.max(maxH, k.getBoundingClientRect().height);
  });
  return bar.getBoundingClientRect().height > padY + maxH + 1;
}
function _fitDashbar(){
  var bar = document.getElementById('dashboard');
  if (!bar || !bar.classList.contains('show')) return;
  var asg = bar.querySelector('.ds-asg'), tot = bar.querySelector('.ds-total');
  if (!asg || !tot) return;
  if (window.innerWidth > 480){ asg.style.display = ''; tot.style.display = ''; return; }
  tot.style.display = 'none';        // 폰에선 '전체'를 늘 뺀다(V2 확정)
  asg.style.display = '';
  if (_barWraps(bar)) asg.style.display = 'none';   // 그래도 안 들어가면 '배정'까지(V3)
}

// ══ 말풍선 정렬 (유성 2026-08-31) ══
//  기본 = **최신순**(맨 위 = 가장 최근 신청). 축은 리스트 '최신순'과 같은 **행 번호 역순**이다 —
//  A열 접수시각은 신청폼 수정에도 원본이 유지된 채 그 행만 맨 아래로 가므로 날짜로는 최신성을 못 잰다
//  (renderNewList의 같은 주석 참조). 대기=c.row / 배정=c.formRow, 둘은 같은 탭의 같은 행 좌표계다.
function _rowNo(c) { return c.row || c.formRow || 0; }
function _sortLatest(items) {
  return items.slice().sort(function(a, b) { return _rowNo(b) - _rowNo(a); });
}
//  검색·리스트로 **특정 아이를 지목해** 들어왔을 때는 그 아이를 맨 위로 올린다.
//  말풍선 높이가 '첫 카드 + 회색 띠'로 잘려 있어(setContent 래퍼) 맨 위 카드가 사실상 보이는 전부다.
function _sortPicked(items, picked) {
  var pk = _rowNo(picked);
  return items.slice().sort(function(a, b) {
    if (_rowNo(a) === pk) return -1;
    if (_rowNo(b) === pk) return 1;
    return _rowNo(b) - _rowNo(a);
  });
}
//  좌표가 아니라 **그 아이를 실제로 담고 있는 마커**를 찾는다.
//  🔴 findMarkerAt(좌표)은 같은 자리에 마커가 여럿이면 *마지막에 추가된 것*을 돌려준다. 마크 필터가 켜져
//     있으면 같은 좌표에 [마크 안 된 아이들 마커]와 [마크된 아이들 마커]가 동시에 서므로, 리스트에서 마크
//     안 된 아이를 눌러도 마크 마커가 잡혀 **그 아이가 없는 말풍선**이 열린다. 행 번호로 찾으면 안 헷갈린다
//     (대기 row·배정 formRow는 같은 탭의 같은 행 좌표계라 한 아이가 두 마커에 동시에 들어갈 수 없다).
function _markerHolding(picked) {
  var pk = _rowNo(picked), found = null;
  if (!pk) return null;
  markers.forEach(function(m) {
    if (!m.__items || _sunk(m)) return;   // 가라앉은 마커는 빨간 핀으로 보낸다(위 _sunk 주석)
    for (var i = 0; i < m.__items.length; i++) if (_rowNo(m.__items[i]) === pk) { found = m; return; }
  });
  return found;
}
//  마커가 **실제로 들고 있는** 아이 목록으로 말풍선을 다시 만든다.
//  ⚠️ currentData에서 좌표로 다시 모으면 안 된다 — 요일/시간 필터·마크 필터가 걸린 상태를 재구성하지
//     못해 화면에 없는 아이가 말풍선에 뜬다. 마커에 붙여 둔 원본(__items)이 유일하게 화면과 일치한다.
function _iwForPicked(marker, picked, fallbackType) {
  var hLat = currentData && currentData.provider ? currentData.provider.lat : null;
  var hLng = currentData && currentData.provider ? currentData.provider.lng : null;
  var items = (marker && marker.__items && marker.__items.length) ? marker.__items : [picked];
  var kind = (marker && marker.__kind) || fallbackType;
  // 이중 안전: 넘어온 마커가 그 아이를 안 담고 있으면(좌표로만 잡힌 경우) 그 아이 단독으로 연다.
  var pk = _rowNo(picked), has = false;
  for (var i = 0; i < items.length; i++) if (_rowNo(items[i]) === pk) { has = true; break; }
  if (!has) { items = [picked]; kind = fallbackType; }
  var sorted = _sortPicked(items, picked);
  return kind === 'assigned'
    ? buildGroupedAssignedIW(sorted, hLat, hLng)
    : buildGroupedWaitingIW(sorted, hLat, hLng);
}

// ══ 좌표 그룹핑 ══
function groupByCoord(items) {
  var g = {};
  items.forEach(function(c) {
    if (!c.lat||!c.lng) return;
    var k = c.lat.toFixed(6)+','+c.lng.toFixed(6);
    if (!g[k]) g[k] = {lat:c.lat,lng:c.lng,items:[]};
    g[k].items.push(c);
  });
  return Object.values(g);
}

// ══ 마커 렌더링 ══
function clearMarkers() { markers.forEach(function(m){m.setMap(null)}); markers=[]; overlays.forEach(function(o){o.setMap(null)}); overlays=[]; }

function renderMarkers() {
  clearMarkers();
  _copyData = [];
  if (!currentData) return;
  var d = currentData, hLat = d.provider.lat, hLng = d.provider.lng;

  if (showHome) {
    if (d.allProviders && d.allProviders.length > 0) {
      // [ALL 모드] 집은 테두리 링.
      //  - 축소(개요): 링을 아동 위로 → 집·이용자 한눈에 (가림 방지, #3)
      //  - 확대(정밀): 링을 아동 아래로 → 겹침부는 아동 클릭, 링은 바운더리로 (의도 디자인 유지)
      var ringZ = isOverview() ? 6 : 0;
      d.allProviders.forEach(function(p) {
        if (p.lat && p.lng) {
          addHomeRingMarker(p.lat, p.lng, buildHomeIW(p), ringZ);
          addLabel(p.lat, p.lng, p.name, 'home');
        }
      });
    } else if (hLat && hLng) {
      // [단일 선생님] 유성 2026-08-08: **전체 모드와 같은 링 아이콘**을 쓴다.
      //   물방울은 바닥앵커라 좌표 위에 떠 있어 같은 자리 아동(예: 김세은=김주희 같은 동)과 겹치고,
      //   가운데가 채워져 밑에 깔린 아동이 안 비친다. 링은 중심앵커 + 투명 채움이라 둘 다 해결된다.
      addHomeRingMarker(hLat, hLng, buildHomeIW(d.provider), isOverview() ? 6 : 0);
      addLabel(hLat, hLng, d.provider.name, 'home');   // .mlbl.home = 마커 아래·#1d4ed8 파랑
    }
  }

  // 마크 필터 ON이면 마크된 아동은 배정/대기 레이어에서 빼고 아래 마크 레이어에서 빨강으로 하나만(핀 2개 방지)
  var baseAssigned = showMark ? d.assigned.filter(function(c){ return !c.marked; }) : d.assigned;
  if (showAssigned) groupByCoord(baseAssigned).forEach(function(g) {
    addMarker(g.lat, g.lng, 'assigned', g.items.length, buildGroupedAssignedIW(_sortLatest(g.items), hLat, hLng), g.items);
    var label = '';
    var names = {};
    g.items.forEach(function(c){ if(c.assignedTo) names[c.assignedTo]=1; });
    var uq = Object.keys(names);
    if (uq.length === 1) {
      label = uq[0].charAt(0);
    } else if (uq.length >= 2 && uq.length <= 3) {
      label = uq.map(function(n){ return n.charAt(0); }).join('·');
    }
    if (label && !hideAssignedLabels()) addLabel(g.lat, g.lng, label, 'assigned', g.items.length > 1 ? 32 : 26); // 완전 축소 시 숨김. 마커높이=단일 26·숫자 32
  });

  if (showWaiting) {
    var filtered = getFilteredWaiting();
    if (showMark) filtered = filtered.filter(function(c){ return !c.marked; });   // 마크된 대기는 마크 레이어로
    groupByCoord(filtered).forEach(function(g) {
      addMarker(g.lat, g.lng, 'waiting', g.items.length, buildGroupedWaitingIW(_sortLatest(g.items), hLat, hLng), g.items);
    });
  }

  // ── 마크 레이어 (행정 shortlist) ── 빨강 북마크 마커 + 빨강 이름 라벨. 마크된 아동만 뽑아 하나씩.
  //  대기 마크는 요일/시간 필터 무시(shortlist 전량 노출). 마커/IW는 원 상태(배정/대기) 그대로, 색만 빨강.
  if (showMark) {
    groupByCoord(d.assigned.filter(function(c){ return c.marked; })).forEach(function(g) {
      addMarkMarker(g.lat, g.lng, g.items.length, buildGroupedAssignedIW(_sortLatest(g.items), hLat, hLng), g.items, 'assigned');
      addLabel(g.lat, g.lng, markNames(g.items), 'mark');
    });
    groupByCoord(d.waiting.filter(function(c){ return c.marked; })).forEach(function(g) {
      addMarkMarker(g.lat, g.lng, g.items.length, buildGroupedWaitingIW(_sortLatest(g.items), hLat, hLng), g.items, 'waiting');
      addLabel(g.lat, g.lng, markNames(g.items), 'mark');
    });
  }

  // ── 4개 센터 표시 ── 집 마커보다 작은 빨간 테두리 흰 원. 항상 맨 위(z=12)로 올려
  // 안 가려지게 + 탭하면 항상 '○○ 센터'만 뜨게(아래 깔린 아동 마커가 클릭 가로채 주소/동 노출되는 것 차단)
  centerPoints.forEach(function(c){ addCenterMarker(c.pos, c.name, 12); });
  // 마커를 새로 만들었으니 기간 컷을 다시 입힌다(안 하면 슬라이더가 걸린 채 전부 또렷하게 돌아온다)
  if (typeof _waApplyCut === 'function') _waApplyCut();
}

// markerH = 마커가 점(latlng) 위로 솟은 픽셀 높이. 이걸로 라벨을 마커 위에 '바짝' 붙인다(#5).
// home(테두리 링)은 가운데 정렬이라 이름을 원 '아래'에 둔다(#2).
function addLabel(lat, lng, text, type, markerH) {
  // 배정 라벨(교사 성)은 마커 위에 앉는다 — margin은 앵커점(좌표) 기준이라 마커 높이별로 계산해야
  // 시각 간격이 같다(map-marker-label-anchor-gap 메모리. 옛 고정 -46px은 단일 마커(높이 26)에서
  // 라벨이 6px 떠 보이고 숫자 마커(32)에선 붙어 보였다 — 유성 2026-08-10 "마커마다 다르다" 적발).
  // 식 = -(마커높이 + 라벨높이 14 + 간격 2)
  var style = (type === 'assigned' && markerH) ? ' style="margin-top:-' + (markerH + 16) + 'px"' : '';
  var content = '<div class="mlbl '+type+'"'+style+'>'+text+'</div>';
  var opts = {
    position: new kakao.maps.LatLng(lat, lng),
    content: content,
    zIndex: type==='home' ? 9 : 8        // 이름은 모든 마커(≤6) 위로
  };
  // 기준점은 마커 지점(좌상단). 가로 중앙정렬은 .mlbl의 transform:translateX(-50%)가
  // 제 너비 절반만큼 당겨 처리 → 이름 길이가 달라져도 항상 중앙. 세로는 margin-top.
  opts.xAnchor = 0; opts.yAnchor = 0;
  var ov = new kakao.maps.CustomOverlay(opts);
  ov.setMap(map);
  overlays.push(ov);
}

// items = 이 마커가 실제로 대표하는 아이들(필터가 걸린 뒤의 목록). 리스트·검색이 '그 아이를 맨 위로'
// 다시 그릴 때 이 원본을 쓴다 — currentData에서 좌표로 재수집하면 필터 상태가 어긋난다.
function addMarker(lat, lng, type, count, iwContent, items) {
  if (!lat || !lng) return;
  var pos = new kakao.maps.LatLng(lat, lng);
  var img = getMarkerImage(type, count);
  var m = new kakao.maps.Marker({position:pos,image:img,map:map,zIndex:type==='home'?10:(type==='assigned'?5:1)});
  m.__items = items || null; m.__kind = type;
  var _mkKey = 'mk:' + (++_mkSeq);   // 좌표로 키를 만들면 같은 집의 대기·마크 마커가 충돌한다
  kakao.maps.event.addListener(m,'click',function(){
    if (iwToggle(_mkKey)) return;   // 같은 마커 다시 클릭 = 말풍선 내리기(유성 09-01)
    infoWindow.setContent(iwContent); infoWindow.open(map,m); });
  markers.push(m);
}

// ══ 마크 마커 (빨강 북마크, 행정 shortlist) ── 기존 빨강(센터=원·검색/지점=물방울)과 모양으로 구분 ══
function markNames(items){ return items.map(function(c){ return c.name || ''; }).filter(Boolean).join('·'); }
function markerBookmark(n){
  var num = n>1 ? '<text x="13" y="13" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="sans-serif">'+n+'</text>' : '';
  return svgUri('<svg xmlns="http://www.w3.org/2000/svg" width="26" height="28" viewBox="0 0 26 28"><path d="M6 2h14a3 3 0 0 1 3 3v21a1 1 0 0 1-1.6.8L13 21.4l-8.4 5.4A1 1 0 0 1 3 26V5a3 3 0 0 1 3-3z" fill="#ef4444" stroke="#b91c1c" stroke-width="1.3"/>'+num+'</svg>');
}
var _markImgCache = {};
function getMarkImage(count){
  var key = 'mark|'+(count>1?count:1);
  if (_markImgCache[key]) return _markImgCache[key];
  return (_markImgCache[key] = new kakao.maps.MarkerImage(markerBookmark(count>1?count:0), new kakao.maps.Size(26,28), {offset:new kakao.maps.Point(13,26)}));
}
function addMarkMarker(lat, lng, count, iwContent, items, kind) {
  if (!lat || !lng) return;
  var pos = new kakao.maps.LatLng(lat, lng);
  var m = new kakao.maps.Marker({position:pos,image:getMarkImage(count),map:map,zIndex:11});   // 배정(5)·집(10) 위, 센터(12) 아래
  m.__items = items || null; m.__kind = kind || 'waiting';
  m.__mark = true;   // 마크(행정 shortlist)는 기간 슬라이더로 자르지 않는다 — 요일/시간 필터를 무시하는 규칙과 같은 결
  var _mkKey = 'mk:' + (++_mkSeq);   // 좌표로 키를 만들면 같은 집의 대기·마크 마커가 충돌한다
  kakao.maps.event.addListener(m,'click',function(){
    if (iwToggle(_mkKey)) return;   // 같은 마커 다시 클릭 = 말풍선 내리기(유성 09-01)
    infoWindow.setContent(iwContent); infoWindow.open(map,m); });
  markers.push(m);
}

function fitBounds() {
  if (!markers.length) return;
  if (markers.length===1) { map.setCenter(markers[0].getPosition()); map.setLevel(5); return; }
  var b = new kakao.maps.LatLngBounds();
  markers.forEach(function(m){b.extend(m.getPosition())});
  map.setBounds(b,60);
  // 좁은 화면(태블릿·모바일)에선 마커가 넓게 퍼져 setBounds가 과하게 축소돼 첫 화면이 너무 멀어짐
  // → 시작 레벨 상한(숫자↓=더 확대) + 시작 중심을 미추홀 센터로 고정. PC(>768)는 기존 fitBounds 그대로
  if (window.innerWidth <= 768) {
    if (map.getLevel() > 8) map.setLevel(8);
    if (michuholCenter) map.setCenter(michuholCenter);
  } else {
    map.setLevel(Math.max(1, map.getLevel() - 1));   // PC: setBounds가 다 담느라 살짝 멀어짐 → 한 칸 확대해서 시작(유성 2026-07-04)
  }
}

// ══ 마커 SVG ══
// 서비스별 배정 마커색 (오감=기존 초록, 대기는 전부 노랑 고정, 선생님은 기존 파랑)
var SVC_COLOR={'오감':{f:'#22c55e',s:'#15803d'},'아청심':{f:'#38bdf8',s:'#0284c7'},'성인':{f:'#f472b6',s:'#db2777'},'정신토탈':{f:'#a78bfa',s:'#7c3aed'},'비바우처재가':{f:'#9ca3af',s:'#6b7280'},'비바우처기관':{f:'#9ca3af',s:'#6b7280'}};
var currentService='오감';
var _svcCache={};   // (provider|service) → mapdata 캐시: 서비스 전환 즉시화. 쓰기 액션은 그 서비스 키만 비운다(_invalidateServiceCache)
var MC={home:{f:'#3b82f6',s:'#1d4ed8'},assigned:SVC_COLOR['오감'],waiting:{f:'#f59e0b',s:'#d97706'}};
// 서비스 선택(단일) — 배정색·범례·데이터만 갱신. 줌/위치(keepView)·토글 유지
function pickService(svc){
  if(!SVC_COLOR[svc]||svc===currentService)return;
  // 열려 있는 배치안은 **옛 서비스 탭의 행번호**를 들고 있다 — 그대로 두면 낡은 안을 보며 조작하게 된다
  if(PLAN||PLANB)planExit();
  currentService=svc;
  MC.assigned=SVC_COLOR[svc];
  _imgCache={};   // 배정 색이 바뀌었으니 마커 이미지 캐시 무효화
  var btns=document.querySelectorAll('#svcFilter .sbtn');
  for(var i=0;i<btns.length;i++)btns[i].classList.toggle('active',btns[i].getAttribute('data-svc')===svc);
  var ld=document.querySelector('.legend .ldot.assigned');if(ld)ld.style.background=MC.assigned.f;
  reloadCurrent(true);   // 줌/위치 유지
}
function svgUri(s){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)}
// viewBox 상단에 -2 여백: 물방울 원의 맨 위 stroke가 잘리던 문제(#4) 방지
/* 기간 슬라이더로 가라앉힌 대기 마커는 **회색 이미지**로 바꾼다 — 카카오 Marker는 setOpacity()는 있어도
   CSS filter(grayscale)를 못 건다. 탈색 100%(유성 확정)라 회색 한 벌이면 된다.
   부재1은 빗금(유성 확정) — 마커 이미지에 흰 사선 2줄. */
var GRAY={f:'#c9ced6',s:'#aab1ba'};
function _mcolor(t,gray){ return gray ? GRAY : MC[t]; }
function _hatch(){ return '<path d="M5.2 11.6 L18.8 5.2 M6.6 15.2 L19.6 9.1" stroke="#fff" stroke-width="1.7" stroke-linecap="round" opacity=".95"/>'; }
function markerSVG(t,opt){opt=opt||{};var c=_mcolor(t,opt.gray);if(t==='home')return svgUri('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="34" viewBox="0 -2 32 34"><path d="M16 30C16 30 4 18 4 12A12 12 0 0128 12C28 18 16 30 16 30Z" fill="'+c.f+'" stroke="'+c.s+'" stroke-width="1.5"/><circle cx="16" cy="12" r="5" fill="#fff"/><path d="M13 13.5L16 10.5L19 13.5V16H17V14H15V16H13Z" fill="'+c.f+'"/></svg>');return svgUri('<svg xmlns="http://www.w3.org/2000/svg" width="24" height="26" viewBox="0 -2 24 26"><path d="M12 23C12 23 3 14 3 9A9 9 0 0121 9C21 14 12 23 12 23Z" fill="'+c.f+'" stroke="'+c.s+'" stroke-width="1.2"/><circle cx="12" cy="9" r="3.5" fill="#fff"/>'+(opt.absent?_hatch():'')+'</svg>')}
function markerSVGCount(t,n,opt){opt=opt||{};var c=_mcolor(t,opt.gray);return svgUri('<svg xmlns="http://www.w3.org/2000/svg" width="30" height="32" viewBox="0 -2 30 32"><path d="M15 29C15 29 4 17 4 11A11 11 0 0126 11C26 17 15 29 15 29Z" fill="'+c.f+'" stroke="'+c.s+'" stroke-width="1.3"/><circle cx="15" cy="11" r="7" fill="#fff"/><text x="15" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="'+c.f+'" font-family="sans-serif">'+n+'</text>'+(opt.absent?'<path d="M6.5 13.5 L23.5 6.5" stroke="'+c.s+'" stroke-width="1.6" stroke-linecap="round"/>':'')+'</svg>')}

// 집(선생님) 테두리 링 — ALL 모드 전용. 가운데가 비어 밑의 아동이 비쳐 보임.
function markerHomeRing(){return svgUri('<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" fill="rgba(59,130,246,0.12)" stroke="#1d4ed8" stroke-width="2.5"/></svg>')}

// ── 마커 이미지 캐시: 같은 모양은 한 번만 생성 (렌더/줌 재배치 시 SVG 인코딩 반복 제거) ──
var _imgCache = {}, _ringImg = null;
// ⚠️ 캐시 키는 **그리는 데 쓰는 모든 축**을 담아야 한다. 옛 키가 'type|count'뿐이라 탈색·부재를 넣으면
//    첫 이미지가 전부에 재사용된다(백로그 ⚙️⑤).
function getMarkerImage(type, count, opt) {
  opt = opt || {};
  var key = type + '|' + (count > 1 ? count : 1) + '|' + (opt.absent ? 1 : 0) + '|' + (opt.gray ? 1 : 0);
  if (_imgCache[key]) return _imgCache[key];
  var svg = count > 1 ? markerSVGCount(type, count, opt) : markerSVG(type, opt);
  var sz, off;
  if (type==='home') { sz=new kakao.maps.Size(32,34); off=new kakao.maps.Point(16,34); }
  else if (count>1)  { sz=new kakao.maps.Size(30,32); off=new kakao.maps.Point(15,32); }
  else               { sz=new kakao.maps.Size(24,26); off=new kakao.maps.Point(12,26); }
  return (_imgCache[key] = new kakao.maps.MarkerImage(svg, sz, {offset:off}));
}
function getRingImage() {
  if (!_ringImg) _ringImg = new kakao.maps.MarkerImage(markerHomeRing(), new kakao.maps.Size(30,30), {offset:new kakao.maps.Point(15,15)});
  return _ringImg;
}

function addHomeRingMarker(lat,lng,iwContent,z){
  if(!lat||!lng)return;
  var pos=new kakao.maps.LatLng(lat,lng);
  var img=getRingImage();
  var m=new kakao.maps.Marker({position:pos,image:img,map:map,zIndex:z||0});
  var _mkKey = 'mk:' + (++_mkSeq);   // 좌표로 키를 만들면 같은 집의 대기·마크 마커가 충돌한다
  kakao.maps.event.addListener(m,'click',function(){
    if (iwToggle(_mkKey)) return;   // 같은 마커 다시 클릭 = 말풍선 내리기(유성 09-01)
    infoWindow.setContent(iwContent); infoWindow.open(map,m); });
  markers.push(m);
}

// 센터 마커 — 작은 빨간 테두리 흰 원(집 마커보다 작게). 18x18, 중심 정렬
function markerCenter(){ return svgUri('<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6" fill="#fff" stroke="#ef4444" stroke-width="2.5"/></svg>'); }
var _centerImg = null;
function getCenterImage(){
  if (!_centerImg) _centerImg = new kakao.maps.MarkerImage(markerCenter(), new kakao.maps.Size(18,18), {offset:new kakao.maps.Point(9,9)});
  return _centerImg;
}
function addCenterMarker(pos, name, z){
  var m = new kakao.maps.Marker({position:pos, image:getCenterImage(), map:map, zIndex:z});
  // 센터에도 출발·도착을 단다 (유성 2026-09-01 — 원래 없었다). 아동·선생님 집과 같은 문법
  var _mkKey = 'mk:' + (++_mkSeq);
  var iw = '<div class="iw"><div class="iw-nm">'+esc(name)+'<span class="iw-bdg ctr">센터</span></div>'
    + routeBtns(name, pos.getLat(), pos.getLng()) + '</div>';
  kakao.maps.event.addListener(m,'click',function(){
    if (iwToggle(_mkKey)) return;      // 같은 마커 다시 클릭 = 말풍선 내리기
    infoWindow.setContent(iw); infoWindow.open(map,m); });
  markers.push(m);
}

// 줌 임계값 (카카오 레벨: 숫자 클수록 축소. 첫 화면=7)
var RING_TOP_LEVEL = 7;            // 이 레벨 이상이면 집 링을 아동 위로 (전 6 → 한 칸 더 축소)
var HIDE_ASSIGNED_LABEL_LEVEL = 8; // 이 레벨 이상이면 배정 성 라벨 숨김 (완전 축소 시 지저분 방지)
function isOverview(){ return map && map.getLevel() >= RING_TOP_LEVEL; }
function hideAssignedLabels(){ return map && map.getLevel() >= HIDE_ASSIGNED_LABEL_LEVEL; }

// ══ 인포윈도우 ══
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
/**
 * onclick="foo('여기')" 처럼 **큰따옴표 속성 안의 JS 문자열**에 넣을 값.
 *
 * 🔴 옛 구현은 `esc(s).replace(/'/g,"\\'")` 였는데 **`"`를 못 막았다.**
 *    `esc`는 textContent→innerHTML 직렬화라 텍스트 노드에서 `&<>`만 이스케이프하고
 *    따옴표는 그대로 통과한다(HTML 직렬화 사양 — 속성 모드에서만 인용부호를 바꾼다).
 *    아동 이름은 학부모가 신청폼에 직접 적고 sanitize가 없다 → 이름에 `"`를 넣으면
 *    속성이 조기 종료돼 임의 핸들러를 심을 수 있었다(이 페이지 localStorage에 행정 토큰이 있다).
 *    이제 따옴표를 **엔티티로** 바꾼다 — 속성 파싱 시 원문으로 복원되므로 JS 값은 그대로다.
 *    백슬래시도 막는다(옛 코드는 `김\` 같은 값에서 문법 오류로 조용히 죽었다).
 */
function escQ(s){
  return esc(s)                       // ① &<> → 엔티티 (esc가 처리)
    .replace(/\\/g, '\\\\')           // ② 백슬래시 — JS 레벨. 먼저 해야 아래 이스케이프가 안 먹힌다
    .replace(/'/g, "\\'")             //   작은따옴표 = **JS 레벨**(`&#39;`로 쓰면 HTML 파서가 먼저 풀어 문자열이 조기 종료된다)
    .replace(/"/g, '&quot;')          //   큰따옴표 = **HTML 레벨**(속성 인용부호를 지켜야 한다. 풀려도 '…' 안이라 JS는 안전)
    .replace(/[\r\n]/g, ' ');         // ③ 줄바꿈은 JS 문자열을 깨뜨린다
}

function iwRow(ic, label, valHtml, valCls) {
  return '<div class="k">'+IW_IC[ic]+label+'</div><div class="v'+(valCls?' '+valCls:'')+'">'+valHtml+'</div>';

// 희망 시간 = "요일+시간 한 세트" nowrap(유성 2026-08-09 — 요일과 시간이 갈라져 줄바꿈되면 안 읽힘).
// 구분점 ·는 앞 세트에 붙여 줄 끝에 남긴다.
function iwSegs(timesStr) {
  var t = fmtTimes(timesStr);
  if (!t) return '';
  var parts = t.split(' | ');
  return parts.map(function(p, i) {
    return '<span class="iw-seg">'+esc(p)+(i < parts.length-1 ? ' ·' : '')+'</span>';
  }).join(' ');
}

function routeBtns(name,lat,lng) {
  if (!lat||!lng) return '';
  var n=escQ(name);
  return '<div class="iw-r2">'
    +'<button class="iw-chip wb" onclick="setRoute(\'from\',\''+n+'\','+lat+','+lng+')"><span class="iw-dot g"></span>출발</button>'
    +'<button class="iw-chip wb" onclick="setRoute(\'to\',\''+n+'\','+lat+','+lng+')"><span class="iw-dot r"></span>도착</button>'
    +'</div>';
}

function buildHomeIW(p) {
  /* 「이 선생님만 보기」 = 좌상단 드롭다운을 이 선생님으로 바꾼다 (유성 2026-09-01).
     전체 보기에서 집 마커를 눌렀을 때 그 선생님으로 들어가는 길이 없어서 드롭다운까지 올라가야 했다.
     ⛔이름은 안 쓴다 — 바로 위 제목이 이미 이름이다(§2.1 문구 중복).
     자리는 **출발·도착 위**(유성) — 아래는 길찾기 묶음이고 이건 성격이 다른 이동이다. */
  var _sel = document.getElementById('providerSelect');
  var _can = _sel && isAdmin() && p.name && _sel.value !== p.name
             && [].some.call(_sel.options, function(o){ return o.value === p.name; });
  return '<div class="iw"><div class="iw-nm">'+esc(p.name)+'<span class="iw-bdg tc">선생님</span></div>'
    +'<div class="iw-tbl">'+iwRow('pin','위치','집')+'</div>'
    +(_can ? '<div class="iw-r2"><button class="iw-chip wb" onclick="pickProvider(\''+escQ(p.name)
             +'\')">이 선생님만 보기</button></div>' : '')   /* 출발·도착과 같은 결(유성 09-01) */
    +routeBtns(p.name+' 집',p.lat,p.lng)+'</div>';
}

/** 드롭다운을 그 선생님으로 바꾼다 — 사람이 직접 고른 것과 **같은 경로**를 탄다(change 이벤트).
    별도 로딩 함수를 부르면 planExit·경로 초기화 같은 부수 처리를 빠뜨린다(0-9 단일 경로). */
window.pickProvider = function(name){
  var sel = document.getElementById('providerSelect');
  if (!sel) return;
  if (![].some.call(sel.options, function(o){ return o.value === name; })) {
    showToast(name + ' 선생님이 이 서비스 목록에 없어요'); return;
  }
  infoWindow.close();
  sel.value = name;
  sel.dispatchEvent(new Event('change', { bubbles: true }));
};

function buildGroupedAssignedIW(items, hLat, hLng) {
  var h='<div class="iw">';
  if (items.length>1) h+='<div class="iw-grp">같은 위치 '+items.length+'명</div>';
  items.forEach(function(c,i) {
    if (i>0) h+='<div class="iw-sep16"></div>';
    var dist='';
    if (hLat&&hLng&&c.lat&&c.lng) dist='<span class="iw-bdg dst">'+fmtDist(haversine(hLat,hLng,c.lat,c.lng))+'</span>';
    h+='<div class="iw-nm">'+esc(c.name)+'<span class="iw-bdg as">'+(c.assignedTo?esc(c.assignedTo)+' 배정':'배정')+'</span>'+dist+'</div>';
    // 🔴 「스케줄 미정」을 띄우기만 하고 고칠 길이 없던 것(2026-08-09) → 확정 행의 정하기/고치기 링크가
    //    같은 배정 다이얼로그를 연다(서버가 같은 선생님이면 S·T만 쓴다). 링크는 행정만.
    var _fix = (isAdmin() && c.formRow)
      ? '<button class="iw-fix" onclick="setChildTime('+c.formRow+')">'+((c.confirmedDay||c.confirmedTime)?'고치기':'정하기')+'</button>' : '';
    h+='<div class="iw-tbl">';
    h+=iwRow('pin','주소',esc(c.address));
    if (c.confirmedDay || c.confirmedTime) {
      h+=iwRow('clock','확정','<b>'+esc(c.confirmedDay||'')+' '+esc(c.confirmedTime||'')+'</b>'+_fix);
    } else {
      h+=iwRow('clock','확정','아직 없어요'+_fix,'miss');
    }
    if (c.times) h+=iwRow('cal','희망',iwSegs(c.times)+earlyBadge(c.notes));
    // 확정은 없는데 대장 수업 기록이 있는 제3상태 — '기록' 행(라벨명 유성 확정 2026-08-10)
    if (!(c.confirmedDay||c.confirmedTime) && c.schedule && c.schedule.length) {
      var schHtml = c.schedule.map(function(s,si){
        return '<span class="iw-seg">'+esc(s.day)+' '+esc(s.time)+' '+esc(s.service)+(si<c.schedule.length-1?' ·':'')+'</span>';
      }).join(' ');
      h+=iwRow('chart','기록',schHtml);
    }
    if (c.notes) h+=iwRow('note','참고',esc(c.notes),'dim');
    if (c.phone) h+=iwRow('phone','전화','<a href="tel:'+esc(c.phone)+'">'+esc(fmtPhone(c.phone))+'</a>');
    if (c.voucher && c.voucher !== '네') h+=iwRow('warn','바우처',esc(c.voucher),'vwarn');
    h+='</div>';
    // 1차 액션 = 배정 취소(fill 레드, 미정이어도 — 유성 확정. 출발/도착 위 = 대기 IW의 배정하기와 같은 자리)
    if (isAdmin() && c.formRow) h+='<button class="iw-fillbtn del" onclick="doUnassign('+c.formRow+')">배정 취소</button>';
    h+=routeBtns(c.name,c.lat,c.lng);
    var ci = registerCopyData(c);
    h+='<div class="iw-r3">'
      +'<button class="iw-chip gw" onclick="doCopy('+ci+')">'+IW_IC.copy+'복사</button>'
      +(isAdmin() && c.formRow ? markActBtn(c.formRow, c.marked) : '')
      +'</div>';
  });
  return h+'</div>';
}

    if (isAdmin()) h += buildRecommendation(c);

    if (MODE !== 'basic') h+=routeBtns(c.name,c.lat,c.lng);
    if (isAdmin()) {
      var ci = registerCopyData(c);

      h+='<div class="iw-r3">'

        +'<button class="iw-chip dw" onclick="doStatus('+c.row+',\'거절\')">거절</button>'

        +'</div>';

}


// ══ 배정 추천 ══

function buildRecommendation(child) {
  if (!providerList || !providerList.length || !child.lat || !child.lng) return '';

  var recs = getRecommendations(child);
  // ⚠️ 추천이 0명이어도 통째로 숨기지 않는다 — 담당자가 "추천이 안 나온다"는 사실 자체를 알아야 한다
  //    (빈 화면은 고장인지 결과인지 구분이 안 된다).
  // 🔴 추천 줄의 배정 버튼·「다른 선생님 고르기」 select는 2026-08-09에 뺐다 — 배정 다이얼로그의
  //    교사 select가 같은 점수·순서·라벨(`_asgFillProviders`)이라 정보·행동이 전부 중복.
  //    여긴 읽기 전용 + 행동은 「배정하기」 하나(1순위는 다이얼로그가 자동 선택하므로 클릭 수 동일).
  var h = '<div class="iw-rec"><div class="iw-rec-t">배정 추천</div>';
  recs.forEach(function(r, idx) {
    h += '<div class="iw-ri">'
      + '<span class="no">' + (idx+1) + '.</span>'
      + '<b>' + esc(r.name) + '</b>'
      + '<span class="d">' + fmtDist(r.dist) + '</span>'
      + '<span class="t">' + esc(r.timeLabel) + '</span>'
      + '<span class="c">' + r.assignedCount + '명</span>'
      + '</div>';
  });
  if (!recs.length) {
    h += '<div class="iw-ri none">가까우면서 시간이 맞는 선생님이 없어요</div>';
  }

  h += '<button class="iw-fillbtn go" onclick="doAssign(' + child.row + ')">배정하기</button>';

  // ── 다음 스텝(밑줄 링크) ── 상태에 따라 갈린다(유성 2026-08-09):
  //    · 전체 보기(__ALL__) → 이 아이를 **누가** 맡을지가 남은 질문 → 모드 B(교사 후보)
  //    · 특정 교사 선택     → 그 교사의 **주간 어디에** 넣을지가 남은 질문 → 모드 A(배치안)
  var _psel = document.getElementById('providerSelect');
  var _pnow = _psel ? _psel.value : '';
  var _hasProv = isAdmin() && _pnow && _pnow !== '__ALL__';
  h += '<div class="iw-next">'
    + (_hasProv
        ? '<button class="iw-txtu" onclick="planFromChild(' + child.row + ',' + (child.marked ? 'true' : 'false') + ')">'
          + esc(_pnow) + '님 주간에서 보기</button>'
        : '<button class="iw-txtu" onclick="planForChild(' + child.row + ',\'' + escQ(child.name) + '\')">'
          + '동선까지 따져 선생님 찾기</button>')
    + '</div>';
  return h + '</div>';
}



/** 4번 줄 드롭다운으로 배정 — 고른 선생님을 그대로 배정 다이얼로그로 넘긴다 */

function getRecommendations(child) {
  var assignCounts = {};
  if (currentData && currentData.assigned) {
    currentData.assigned.forEach(function(a) {
      var p = a.assignedTo || '';
      assignCounts[p] = (assignCounts[p] || 0) + 1;
    });
  }
  var results = [];

  providerList.forEach(function(p) {
    if (!p.lat || !p.lng) return;
    var dist = haversine(child.lat, child.lng, p.lat, p.lng);
    var timeOverlap = calcTimeOverlap(child.times, p.avail);
    if (timeOverlap.count === 0 && child.times && /[월화수목금토일]-\d/.test(child.times)) return;

    results.push({
      name: p.name,
      dist: dist,
      timeLabel: timeOverlap.label,
      timeCount: timeOverlap.count,
      assignedCount: assignCounts[p.name] || 0,
      score: dist + (timeOverlap.count > 0 ? 0 : 5)
    });
  });

  results.sort(function(a,b) { return a.score - b.score; });
  return results.slice(0, 3);
}

// 신청폼 '[시간참고]' 자유칸에서 **시작 하한**만 뽑는다 ("4시40분부터 가능" → 16:40).
// 체크박스(times)는 시(時) 단위라 분을 못 담아, 학부모가 분 단위 조건을 이 칸에 쓴다
// (2026-08-08 실측: 시간참고 34건 중 68%가 "~부터/이후" 형식 — 폼 placeholder가 그 형식을 유도한다).
// ⚠️ 하한은 **표시만** 한다 — 판정(calcTimeOverlap)은 건드리지 않는다. 사람이 보고 조정할 정보이지
//    자동 탈락 사유가 아니다. 34건 전수 + 오전 방어 케이스로 32/32 정확, 초과추출 0.
function noteEarliest(notes) {
  var s = String(notes || '').replace(/\[시간참고\]|\[원본시간\]/g, '').replace(/\s+/g, '');
  var m = s.match(/(오전|오후)?(\d{1,2})\s*(?::|시)\s*(반|\d{1,2})?\s*분?\s*(?:정도|쯤|경)?\s*(?:이후|부터|이상)/);
  if (!m) return '';
  var h = parseInt(m[2], 10);
  var mi = m[3] === '반' ? 30 : (m[3] ? parseInt(m[3], 10) : 0);
  if (isNaN(h) || h > 23 || mi > 59) return '';
  if (h < 12 && m[1] !== '오전') h += 12;   // 방문 시간대가 14~20시라 12 미만은 오후로 읽는다('오전' 명시만 예외)
  return (h < 10 ? '0' : '') + h + ':' + (mi < 10 ? '0' : '') + mi;
}
function earlyBadge(notes) {
  var e = noteEarliest(notes);
  return e ? '<span class="iw-hint">' + e + '부터</span>' : '';
}

function calcTimeOverlap(childTimes, provAvail) {
  if (!childTimes || !provAvail || !/[월화수목금토일]-\d/.test(childTimes)) {
    return { count: -1, label: '시간 비교 불가' };
  }

  var childSlots = childTimes.split(',').map(function(s) {
    s = s.trim();
    var p = s.split('-');
    return { day: p[0], hour: parseInt(p[1]) };
  });

  var overlapping = [];
  var daySet = {};
  var knownDays = 0;   // 아동이 원한 요일 중 교사 가용시간이 **실제로 읽힌** 요일 수

  childSlots.forEach(function(slot) {
    var availRange = provAvail[slot.day];
    if (!availRange) return;
    var m = availRange.match(/(\d{1,2}):?(\d{2})?\s*[-~]\s*(\d{1,2}):?(\d{2})?/);
    if (!m) return;
    knownDays++;
    var start = parseInt(m[1]);
    var end = parseInt(m[3]);
    if (slot.hour >= start && slot.hour < end) {
      overlapping.push(slot);
      daySet[slot.day] = 1;
    }
  });

  // 읽힌 요일이 하나도 없으면 '안 맞는다'가 아니라 **'모른다'**이다.
  // ⚠️ 06 제공인력 F~L 가용시간은 죽은 데이터다 (2026-08-07 실측: 21명 중 19명이 실제 수업시간과 불일치, 빈칸 다수).
  //    옛 코드는 이 경우도 count=0을 냈고 getRecommendations가 count===0인 교사를 통째로 제외해서,
  //    **가용시간이 비었거나 표기를 못 읽는 교사는 배정 추천에 영영 뜨지 않았다** (화면엔 '시간 불일치'라는 확신에 찬 오답).
  //    -1로 빼면 추천에는 남고 score +5 페널티만 받는다 = 사람이 보고 판단할 기회가 생긴다.
  if (knownDays === 0) return { count: -1, label: '가용시간 미기록' };

  if (overlapping.length === 0) return { count: 0, label: '시간 불일치' };

  var days = Object.keys(daySet);
  return {
    count: overlapping.length,
    label: days.join('') + ' 겹침'
  };
}

// ══ 배정 확인 다이얼로그 (요일·시각 같이) ══
// ⚠️ 배정 추천(doAssignTo)과 제공인력 선택 배정(doAssign)이 **같은 다이얼로그**를 쓴다 —
//    한쪽만 고치면 다른 쪽에 확정 시각이 안 남아 이중배정 구멍이 그대로 남는다.
var _asgCtx = null, _asgPick = null;
var ASG_DAYS = ['월','화','수','목','금','토'];
var ASG_HOURS = [14,15,16,17,18,19];   // F3 — 최대 6열이 이 범위다(유성 2026-08-10)

// ══ 점유 시간표 (겹침 배지 F2) ══
// 그 교사의 6개 서비스 탭 S·T + 대장 역산을 서버가 합쳐 준다. **부팅 때 한 번**(mapdata·providers와 병렬)
// 받아 두면 다이얼로그를 열 때 왕복이 0이다([[gas-latency-is-roundtrip-count]]).
// ⚠️ 이건 표시용 사본이라 낡을 수 있다 — **진짜 판정은 쓰기 직전 서버가 다시 한다**(사본을 믿고 막지 않는다).
var OCC = { map: {}, unknown: {} };
function loadOccupancy() {
  return fetchGAS('occupancy').then(function(r) {
    if (r && r.occupancy) { OCC.map = r.occupancy; OCC.unknown = r.unknown || {}; }
    schedRefresh();   // 월 스케줄 시트가 이미 떠 있으면(점유표가 늦게 도착) 격자를 채운다
  }).catch(function() { /* 실패해도 배정은 되어야 한다 — 배지만 안 뜬다 */ });
}
/** 그 교사의 (요일, 시각) 자리에 이미 있는 아동 이름들. 자기 자신은 뺀다(엣지 5). */
function _occAt(prov, day, hour, durMin, selfName) {
  var list = OCC.map[prov] || [], s = hour * 60, e = s + (durMin || 40), out = [];
  for (var i = 0; i < list.length; i++) {
    var o = list[i];
    if (o.d !== day || !(o.s < e && s < o.e)) continue;
    if (selfName && o.n === selfName) continue;
    out.push(o.n);
  }
  return out;
}
function _asgDur() { return currentService === '아청심' ? 50 : 40; }

/**
 * F3 — 요일별 **행**으로 그린다(행 좌측에 PLAN_DC 요일색). F2 — 찬 자리엔 그 아동 이름 배지.
 * 찬 자리도 **누를 수 있다**(유성 확정) — 누르면 서버가 겹침 다이얼로그를 띄운다.
 * @return {number} 한 요일의 최대 버튼 수 — 다이얼로그 폭(열 수)을 이게 정한다
 */
function _asgRenderRows(el, pairs, prov, selfName) {
  var byDay = {}, dur = _asgDur(), maxN = 0;
  pairs.forEach(function(p) { (byDay[p.day] = byDay[p.day] || []).push(p.hour); });
  var html = ASG_DAYS.map(function(d) {
    var hrs = (byDay[d] || []).slice().sort(function(a, b){ return a - b; });
    if (!hrs.length) return '';
    if (hrs.length > maxN) maxN = hrs.length;
    return '<div class="asg-row"><span class="asg-day" style="background:' + (PLAN_DC[d] || '#666') + '">' + d + '</span>'
      + '<div class="asg-cells">' + hrs.map(function(h) {
          var occ = _occAt(prov, d, h, dur, selfName);
          var lab = occ.length ? '<span class="asg-occ">' + esc(occ[0]) + (occ.length > 1 ? ' +' + (occ.length - 1) : '') + '</span>' : '';
          return '<button class="asg-slot' + (occ.length ? ' taken' : '') + '" data-d="' + d + '" data-h="' + h
               + '" onclick="asgPick(this)">' + lab + h + ':00</button>';
        }).join('') + '</div></div>';
  }).join('');
  el.innerHTML = html;
  return maxN;
}

function askAssignSchedule(row, provName, childName, times) {
  _asgCtx = { row: row, prov: provName, child: childName, times: times };
  _asgPick = null;

  document.getElementById('asgTitle').textContent = '배정하기';
  // ⚠️ 추천은 상위 3명뿐이라 원하는 선생님이 없을 수 있다. 예전엔 좌상단 드롭다운을 바꾸고
  //    지도가 통째로 갈아엎어진 뒤 아동을 다시 찾아야 했다(유성 지적) ⇒ 여기서 바로 고른다.
  _asgFillProviders(row, provName, childName);
  document.getElementById('asgSub').textContent = (childName || (row + '행 아동')) + ' · ' + currentService;

  _asgPaint();
  document.getElementById('asgNote').innerHTML = '';
  document.getElementById('asgOk').disabled = true;
  document.getElementById('asgOk').textContent = '이 시간으로 배정';   // 밀린 아이 옮기기 모드에서 바뀌므로 되돌린다
  document.getElementById('asgModal').style.display = 'flex';
}

/** 슬롯 두 벌(희망시간·그 외 전체)을 다시 그린다. 선생님을 바꾸면 배지가 달라지므로 다시 부른다. */
function _asgPaint() {
  if (!_asgCtx) return;
  var prov = _asgCtx.prov, self = _asgCtx.child;
  var list = String(_asgCtx.times || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
  var pairs = list.map(function(t) {
    var p = t.split('-'), h = parseInt(p[1], 10);
    return (!p[0] || isNaN(h)) ? null : { day: p[0], hour: h };
  }).filter(Boolean);

  var wrap = document.getElementById('asgSlots');
  var n1 = 0;
  if (!pairs.length) {
    wrap.innerHTML = '<span style="font-size:13px;color:#8b95a1">희망시간이 비어 있습니다 — 아래에서 직접 고르세요</span>';
    asgToggleMore(true);
  } else {
    n1 = _asgRenderRows(wrap, pairs, prov, self);
  }

  // '그 외' = 전 요일 × 14~19시. 같은 렌더러라 배지·요일색이 두 벌에서 어긋나지 않는다(0-9).
  var all = [];
  ASG_DAYS.forEach(function(d){ ASG_HOURS.forEach(function(h){ all.push({ day: d, hour: h }); }); });
  var n2 = _asgRenderRows(document.getElementById('asgAll'), all, prov, self);

  // F3 — 폭은 버튼이 가장 많은 요일이 정한다(기본 3열·최대 6열)
  var open = document.getElementById('asgMore').style.display !== 'none';
  var cols = Math.max(3, Math.min(6, open ? Math.max(n1, n2) : n1));
  document.querySelector('#asgModal .sm-card').style.setProperty('--asg-cols', cols);

  // 시간 미상 경고 — "겹치지 않는다"가 아니라 "모른다"를 숨기지 않는다(유성 확정)
  var unk = (OCC.unknown && OCC.unknown[prov]) || [];
  document.getElementById('asgUnknown').innerHTML = unk.length
    ? '<div class="asg-unk">이 선생님에게 <b>시간을 모르는 아동이 ' + unk.length + '명</b> 있어요 ('
      + esc(unk.slice(0, 3).join(', ')) + (unk.length > 3 ? ' 외' : '') + ') — 겹칠 수도 있어요.</div>'
    : '';
}
/**
 * 다이얼로그의 선생님 드롭다운을 채운다.
 * 정렬 = 배정 추천과 **같은 기준**(거리 + 시간 안 맞으면 페널티) → 위 3명이 곧 추천 3명이라 둘이 따로 놀지 않는다.
 * 각 항목에 거리·시간겹침을 붙여 30명 중에서도 근거를 보고 고를 수 있게 한다.
 * ⚠️ 가용시간이 비어 판정 불가면 '가용시간 미기록'으로 뜬다 — 그 선생님이 안 되는 게 아니라 **모르는 것**이다.
 */
function _asgFillProviders(row, preferName, childName) {
  var sel = document.getElementById('asgProvSelect');
  var child = _findChildByRow(row);
  var list = (providerList || []).slice();

  var scored = list.map(function(p) {
    var d = (child && child.lat && p.lat) ? haversine(child.lat, child.lng, p.lat, p.lng) : null;
    var t = (child && child.times) ? calcTimeOverlap(child.times, p.avail) : { count: -1, label: '' };
    return { name: p.name, dist: d, tLabel: t.label, tCount: t.count,
             score: (d == null ? 99 : d) + (t.count > 0 ? 0 : 5) };
  });
  scored.sort(function(a, b) { return a.score - b.score; });

  sel.innerHTML = scored.map(function(x) {
    var bits = [];
    if (x.dist != null) bits.push(fmtDist(x.dist));
    if (x.tLabel) bits.push(x.tLabel);
    return '<option value="' + escQ(x.name) + '">' + esc(x.name) + (bits.length ? ' · ' + bits.join(' · ') : '') + '</option>';
  }).join('');

  if (preferName) sel.value = preferName;
  if (!sel.value && scored.length) sel.value = scored[0].name;
  _asgCtx.prov = sel.value;
}

function asgProvChanged() {
  var sel = document.getElementById('asgProvSelect');
  if (!_asgCtx) return;
  _asgCtx.prov = sel.value;
  _asgPick = null;                     // 선생님이 바뀌면 그 자리의 의미도 바뀐다 — 고른 것을 지운다
  _asgPaint();                         // 배지(누가 이미 있는지)를 새 선생님 기준으로 다시 그린다
  document.getElementById('asgOk').disabled = true;
  document.getElementById('asgNote').innerHTML = '';
}

function asgClose(){ document.getElementById('asgModal').style.display='none'; _asgCtx=null; }
function asgToggleMore(force){
  var m = document.getElementById('asgMore'), b = document.getElementById('asgMoreBtn');
  var open = force === true ? true : (m.style.display === 'none');
  m.style.display = open ? '' : 'none';
  b.textContent = open ? '접기 ▴' : '그 외 시간 고르기 ▾';
  if (_asgCtx) _asgPaint();            // 열리면 6열이 되므로 폭을 다시 잡는다
}
function _asgClear(sel){ Array.prototype.forEach.call(document.querySelectorAll(sel), function(b){ b.classList.remove('on'); }); }
function asgPick(btn){
  _asgClear('#asgSlots .asg-slot'); _asgClear('#asgAll .asg-slot');
  btn.classList.add('on');
  _asgPick = { day: btn.dataset.d, hour: Number(btn.dataset.h),
               wished: btn.parentNode.parentNode.parentNode.id === 'asgSlots' };
  _asgSync();
}
function _asgSync(){
  var ok = !!(_asgPick && _asgPick.day && _asgPick.hour != null);
  document.getElementById('asgOk').disabled = !ok;
  // 아동이 체크하지 않은 칸을 고르면 알린다 — 막지는 않는다(조율해서 정한 시간일 수 있다)
  var note = document.getElementById('asgNote');
  note.innerHTML = (ok && !_asgPick.wished)
    ? '<div class="asg-note">학부모가 체크하지 않은 시간입니다. 조율해서 정하신 시간이면 그대로 진행하세요.</div>' : '';
}
function asgConfirm(){
  if (!_asgCtx) return;
  var d = _asgPick && _asgPick.day, h = _asgPick && _asgPick.hour;
  if (!d || h == null) return;
  var time = (h < 10 ? '0' : '') + h + ':00';

  // 밀려난 아이의 **새 시간**을 고르는 중이면, 원래 배정 요청에 그 결정을 실어 한 번에 보낸다
  // (엣지 8 — 두 번에 나눠 보내면 창을 닫았을 때 밀린 아이가 미아가 된다).
  if (_asgCtx.victimFor) {
    var vf = _asgCtx.victimFor;
    asgClose();
    _cgSend(vf.req, { mode: 'move', row: vf.victim.row, tab: vf.victim.tab, day: d, time: time }, false);
    return;
  }

  var prov = document.getElementById('asgProvSelect').value || _asgCtx.prov;
  if (!prov) { showToast('선생님을 고르세요'); return; }
  var req = { row: _asgCtx.row, provider: prov, service: currentService, ctx: _ctxKeyName(),
              day: d, time: time, child: _asgCtx.child };
  asgClose();
  _cgSend(req, null, false);
}

/**
 * 배정 요청을 보낸다. 겹치면 서버가 **아무것도 안 쓰고** conflict를 돌려주고, 그때 다이얼로그를 띄운다.
 * @param {Object} resolve  사람이 고른 처리(밀린 아이 옮김/대기/거절 · 형제 합반) — 서버가 같은 요청에서 함께 처리
 */
function _cgSend(req, resolve, force){
  var row = req.row, prov = req.provider, d = req.day, time = req.time;
  var p = { row: row, provider: prov, service: req.service, ctx: req.ctx, day: d, time: time };
  if (resolve) p.resolve = JSON.stringify(resolve);
  if (force) p.force = '1';
  showLoading(true); infoWindow.close();
  fetchGAS('assign', p)
    .then(function(res) {
      showLoading(false);
      // ── 겹침 — 아직 아무것도 안 써졌다. 사람에게 묻는다(취소/바꾸기/형제) ──
      if (res.conflict) { _cgOpen(res.conflict, req); return; }
      if (res.error) {
        // 서버가 스택을 같이 보낸다(인증된 액션 한정). 안 보여주면 또 "서버 오류"만 남고
        // 어느 줄에서 죽었는지 모른 채 추측하게 된다(2026-08-09).
        showToast(res.error + (res.stack ? '  ⟨' + res.stack + '⟩' : ''));
        if (window.console) console.log('[assign 오류]', JSON.stringify(res));
        return;
      }
      // 🔴 **서버가 "썼다"고 말할 때만 완료라고 말한다** (2026-08-09 유성:
      //    *"이 시간으로 배정을 눌렀는데 왜 계속 스케줄 미정이냐"*).
      //    옛 코드는 `res.stamped`를 **한 번도 안 보고** 무조건 *"화 17:00 시간 기록 완료!"*를 띄웠다.
      //    S·T가 안 써진 경우에도 성공이라 말하니, 화면이 안 바뀌는 게 버그로 보이고
      //    새로고침해도 그대로였다(시트에 애초에 없으니까). **화면이 거짓말을 하면 진단이 불가능해진다.**
      if (res.stamped) {
        // 밀린 아이를 함께 처리했으면 **그 결과도 같이 말한다** — 조용히 처리하면 사람이 확인할 길이 없다
        var extra = (res.resolved || []).map(function(r) {
          return r.name + ' → ' + (r.mode === 'move' ? r.day + ' ' + r.time : r.mode === 'wait' ? '대기' : '거절');
        }).join(', ');
        showToast(prov + ' · ' + d + ' ' + time
          + (res.mode === 'time' ? ' 시간 기록 완료!' : ' 배정 완료!')
          + (res.sibling ? ' (형제 합반)' : '') + (extra ? '  ·  ' + extra : ''), true);
        if (res.logged === false) showToast('⚠️ 시트엔 기록됐지만 로그 남기기에 실패했어요: ' + (res.logError || ''));
      } else {
        // 🔴 서버가 **쓰고 나서 다시 읽은 결과**를 그대로 보여준다. 어디에 썼는지·무엇이 읽혔는지를
        //    사람이 볼 수 있어야 "성공이라는데 시트는 그대로"를 진단할 수 있다(2026-08-09).
        var v = res.verify;
        showToast('⚠️ 기록 실패 — ' + (v
          ? v.ss + ' / ' + v.tab + ' ' + v.row + '행(' + v.nameAtRow + ', Q=' + v.qAtRow + ')'
            + ' · 쓴값 ' + v.wrote.join(' ') + ' · 되읽음 [' + v.readback.join(', ') + ']'
            + ' · 마지막행 ' + v.lastRow
          : (res.row || '?') + '행 · 보낸값 ' + d + ' ' + time + ' · verify 없음(구 서버)'));
        if (window.console) console.log('[assign 실패 진단]', JSON.stringify(res));
      }
      // 🔴 **지도는 언제나 갱신한다** (2026-08-09 유성: *"요일·시간을 확정했는데 즉시 반영되지 않음"*).
      //    옛 코드는 배치안 시트가 열려 있으면 `_planRefetch()`만 부르고 `_afterWrite`를 건너뛰었다.
      //    배치안 시트는 **논모달**이라 열어둔 채 지도 말풍선을 만질 수 있다 → 그 경로로 확정하면
      //    지도가 한 번도 다시 그려지지 않아 「스케줄 미정」이 그대로 남았다.
      // 🔴 게다가 `_planRefetch(ok)`는 **콜백을 받는 함수**인데 여기서만 인자 없이 불렀다 →
      //    `ok(...)`가 `.then` 안에서 TypeError를 내고, 그 throw가 promise 체인에 삼켜져
      //    **배치안도 안 바뀌고 에러도 안 뜨는** 완전 무반응이 됐다. 호출부가 둘인데 한쪽만 규약을 어겼다.
      _afterWrite(res);
      // 🔴 **응답이 방금 쓴 값을 실제로 담고 있는지 확인한다.** 안 담겼으면 서버가 쓰기 이전 상태를
      //    읽었다는 뜻이므로 한 번 더 읽는다. 왕복 1회를 더 쓰더라도, 화면이 시트와 어긋난 채
      //    남아 사람이 "안 눌렸나?" 하고 다시 누르는 것보다 낫다.
      if (res.stamped) {
        var _w = ((res.map && res.map.assigned) || []).filter(function(x) {
          return Number(x.formRow) === Number(row); })[0];
        if (!_w || String(_w.confirmedDay || '') !== d || String(_w.confirmedTime || '') !== time) {
          reloadCurrent(true);
        }
      }
      if (PLAN) { planDirty = false; _planRefetch(_planApplyRefresh); }
      loadOccupancy();   // 방금 채운 자리를 배지에 반영(배경 — 화면을 막지 않는다)
    }).catch(function(e) { showLoading(false); showToast('배정 실패: '+e.message); });
}

// ══ 겹침 다이얼로그 ══ (유성 2026-08-10 설계: [취소][바꾸기][형제] → 밀린 아이 ①옮김 ②대기 ③거절)
function _cgClose(){ document.getElementById('cgModal').classList.remove('show'); }
function _cgBtn(label, cls, fn){
  var b = document.createElement('button');
  b.className = 'cg-b' + (cls ? ' ' + cls : '');
  b.textContent = label;
  b.addEventListener('click', fn);
  return b;
}
function _cgOpen(cf, req){
  var v = cf.victim || {};
  document.getElementById('cgTitle').textContent =
    cf.day + ' ' + cf.time + '에는 이미 ' + v.name + ' 아동이 있어요';

  // 왜 그렇게 아는지를 같이 말한다 — 근거를 숨기면 담당자가 화면을 못 믿는다
  var src = v.src === 'recon'
    ? '결제 이력 기준 · 최근 8주 ' + (v.sessions || 0) + '회'
      + (v.lastDaysAgo != null ? ' (마지막 ' + v.lastDaysAgo + '일 전)' : '')
    : '시트에 확정된 시간';
  var sub = v.time + '~' + v.endTime + ' · ' + src;
  if (cf.forVictim) sub = '옮기려는 자리도 차 있어요. ' + sub;
  if (cf.others && cf.others.length) sub += '\n같은 시간에 ' + cf.others.length + '명 더 있어요.';
  document.getElementById('cgSub').textContent = sub;

  var w = [];
  if (v.inProgress) w.push('이 아동은 <b>실제로 수업이 진행 중</b>이에요 — 과거 회기는 지울 수 없어요.');
  if (!v.movable) w.push('이 아동은 신청 시트에서 찾지 못해 <b>자동으로 옮길 수 없어요</b>(대장에만 있는 아동).');
  if (cf.unknown && cf.unknown.length) w.push('이 선생님에게 <b>시간을 모르는 아동 ' + cf.unknown.length + '명</b>이 더 있어요.');
  document.getElementById('cgWarn').innerHTML = w.length ? '<div class="cg-warn">' + w.join('<br>') + '</div>' : '';

  var box = document.getElementById('cgBtns');
  box.className = 'cg-btns';
  box.innerHTML = '';
  box.appendChild(_cgBtn('취소', '', _cgClose));
  if (v.movable) {
    box.appendChild(_cgBtn('바꾸기', 'pri', function(){ _cgStep2(cf, req); }));
  } else {
    box.appendChild(_cgBtn('그래도 배정', 'dngr', function(){ _cgClose(); _cgSend(req, null, true); }));
  }
  // [형제]는 **오감 + 같은 보호자 전화 + 다른 생년**일 때만 서버가 켜 준다(§1 규정) — 합반 60분
  if (cf.siblingOk) {
    box.appendChild(_cgBtn('형제', 'outline', function(){ _cgClose(); _cgSend(req, { mode: 'sibling' }, false); }));
  }
  document.getElementById('cgModal').classList.add('show');
}
function _cgStep2(cf, req){
  var v = cf.victim || {};
  document.getElementById('cgTitle').textContent = '그럼 ' + v.name + ' 아동은 어떻게 할까요?';
  document.getElementById('cgSub').textContent =
    '고르는 즉시 ' + (req.child || '이 아동') + ' 배정과 한 번에 처리돼요 — 중간에 창을 닫아도 미아가 생기지 않아요.';
  var box = document.getElementById('cgBtns');
  box.className = 'cg-btns col';
  box.innerHTML = '';
  box.appendChild(_cgBtn('다른 시간으로 옮김', 'pri', function(){
    _cgClose();
    // 밀린 아이의 새 시간을 같은 다이얼로그로 고른다(희망시간은 그 아이 것을 쓴다)
    var vc = _findChildByRow(v.row);
    askAssignSchedule(v.row, req.provider, v.name, vc && vc.times);
    _asgCtx.victimFor = { req: req, victim: v };
    document.getElementById('asgTitle').textContent = v.name + ' 아동을 옮길 시간';
    document.getElementById('asgSub').textContent = req.provider + ' 선생님 · ' + (vc ? currentService : '');
    document.getElementById('asgOk').textContent = '이 시간으로 옮기고 배정';
    asgToggleMore(true);
  }));
  box.appendChild(_cgBtn('배정을 풀고 대기', '', function(){
    _cgClose(); _cgSend(req, { mode: 'wait', row: v.row, tab: v.tab }, false);
  }));
  box.appendChild(_cgBtn('거절', 'dngr', function(){
    _cgClose(); _cgSend(req, { mode: 'decline', row: v.row, tab: v.tab }, false);
  }));
  box.appendChild(_cgBtn('취소', '', _cgClose));
}

/**
 * 이미 배정된 아이의 **요일·시각만** 기록한다(같은 선생님 → 서버가 S·T만 쓴다).
 * 새 다이얼로그를 만들지 않는다 — Q·R·S·T를 쓰는 정본 경로가 둘이 되면 다시 어긋난다(0-9).
 */
function setChildTime(formRow) {
  var c = _findChildByRow(formRow);
  var prov = (c && c.assignedTo) || document.getElementById('providerSelect').value;
  askAssignSchedule(formRow, prov || '', c && c.name, c && c.times);
}

// 배정 추천에서 (아동 인포윈도우 → 추천 목록 → 배정)
function doAssignTo(row, provName) {
  var c = _findChildByRow(row);
  askAssignSchedule(row, provName, c && c.name, c && c.times);
}

// ══ 배정 처리 ══ (제공인력을 고른 상태에서 아동 인포윈도우의 배정 버튼)
function doAssign(row) {
  // ⚠️ 예전엔 좌상단에서 선생님을 안 고르면 막았다. 이제 다이얼로그 안에서 고를 수 있으므로 그대로 연다
  //    — '전체' 보기 상태에서도 아동을 눌러 바로 배정할 수 있다(지도를 갈아엎고 아동을 다시 찾을 필요 없음).
  var prov = document.getElementById('providerSelect').value;
  var c = _findChildByRow(row);
  askAssignSchedule(row, prov || '', c && c.name, c && c.times);
}

/** 행번호로 현재 화면 데이터에서 아동을 찾는다 (희망시간을 버튼으로 띄우려고) */
function _findChildByRow(row) {
  if (!currentData) return null;
  var pools = [currentData.waiting || [], currentData.assigned || []];
  for (var i = 0; i < pools.length; i++)
    for (var j = 0; j < pools[i].length; j++)
      // 배정 아동의 행번호 키는 `formRow`다 — `row`만 보면 배정된 아이를 영영 못 찾는다
      if (Number(pools[i][j].row || pools[i][j].formRow) === Number(row)) return pools[i][j];
  return null;
}

// ── 중앙 확인 다이얼로그(§4.4) — 크롬 confirm() 대체(유성 2026-08-10). 파괴적 액션이면 danger=true(우측 버튼 빨강) ──
var _cmEl = null, _cmOk = null;
function iwConfirm(title, sub, okLabel, danger, onOk) {
  if (!_cmEl) {
    _cmEl = document.createElement('div');
    _cmEl.id = 'cmDim';
    _cmEl.innerHTML = '<div class="cmodal"><div class="cm-t"></div><div class="cm-s"></div>'
      + '<div class="cm-btns"><button class="cm-btn" id="cmClose">닫기</button>'
      + '<button class="cm-btn primary" id="cmGo"></button></div></div>';
    document.body.appendChild(_cmEl);
    document.getElementById('cmClose').addEventListener('click', function(){ _cmEl.classList.remove('show'); _cmOk = null; });
    document.getElementById('cmGo').addEventListener('click', function(){ _cmEl.classList.remove('show'); var f = _cmOk; _cmOk = null; if (f) f(); });
  }
  _cmEl.querySelector('.cm-t').textContent = title;
  _cmEl.querySelector('.cm-s').textContent = sub || '';
  var go = document.getElementById('cmGo');
  go.textContent = okLabel || '확인';
  go.classList.toggle('danger', !!danger);
  _cmOk = onOk;
  _cmEl.classList.add('show');
}

// 대기 아동 이름·행 표기(모달 부제용)
function _cmWho_(row) {
  var c = _findChildByRow(row);
  return (c && c.name ? c.name + ' · ' : '') + row + '행';
}

// 상태 변경 낙관 반영 — 거절·부재2는 지도에서 빠지고, 부재1은 뱃지만 바뀐다. 반환 = 되돌리기.
function _optimisticStatus(row, status) {
  if (!currentData || !currentData.waiting) return null;
  var idx = -1;
  for (var i = 0; i < currentData.waiting.length; i++)
    if (Number(currentData.waiting[i].row) === Number(row)) { idx = i; break; }
  if (idx < 0) return null;
  var prevList = currentData.waiting;
  var c = prevList[idx], prevStatus = c.status;
  if (status === '거절' || status === '부재2') {
    currentData.waiting = prevList.slice(0, idx).concat(prevList.slice(idx + 1));
  } else {
    c.status = status;
  }
  _renderCurrent();
  return function undo() { c.status = prevStatus; currentData.waiting = prevList; _renderCurrent(); };
}

function doStatus(row, status) {
  var isRej = status === '거절';
  iwConfirm(isRej ? '거절로 처리할까요?' : status + '로 처리할까요?',
    _cmWho_(row) + (isRej ? ' — 지도에서 빠져요' : ''),
    isRej ? '거절하기' : '처리하기', true, function(){
    infoWindow.close();
    var undo = _optimisticStatus(row, status);   // 화면 먼저(대기 0초), 서버는 뒤에서(유성 2026-08-10 로딩 최적화)
    if (!undo) showLoading(true);
    fetchGAS('status', { row: row, status: status, service: currentService, ctx: _ctxKeyName() }).then(function(res) {
      showLoading(false);
      if (res.error) { if (undo) undo(); showToast(res.error); return; }
      showToast((isRej ? '거절' : status) + ' 처리 완료', true);
      _afterWrite(res);
    }).catch(function(e) { showLoading(false); if (undo) undo(); showToast('처리 실패: '+e.message); });
  });
}

function doAbsent(row, currentStatus) {
  var next = (currentStatus === '부재1') ? '부재2' : '부재1';
  iwConfirm(next === '부재2' ? '부재2로 기록할까요?' : '부재로 기록할까요?',
    _cmWho_(row) + (next === '부재2' ? ' — 이후 검색에서 빠져요' : ''),
    '기록하기', false, function(){
    infoWindow.close();
    var undo = _optimisticStatus(row, next);
    if (!undo) showLoading(true);
    fetchGAS('status', { row: row, status: next, service: currentService, ctx: _ctxKeyName() }).then(function(res) {
      showLoading(false);
      if (res.error) { if (undo) undo(); showToast(res.error); return; }
      showToast(next + ' 기록 완료', true);
      _afterWrite(res);
    }).catch(function(e) { showLoading(false); if (undo) undo(); showToast('처리 실패: '+e.message); });
  });
}

function doUnassign(row) {
  iwConfirm('배정을 취소할까요?', _cmWho_(row) + ' — 대기로 돌아가요', '배정 취소하기', true, function(){
    infoWindow.close();
    // 먼저 화면에 반영하고(대기 0초) 서버 왕복은 뒤에서 확정한다. undo가 null이면 낙관 반영 불가 → 옛 로딩바 경로.
    var undo = _optimisticUnassign(row);
    if (!undo) showLoading(true);
    fetchGAS('unassign', { row: row, service: currentService, ctx: _ctxKeyName() }).then(function(res) {
      showLoading(false);
      if (res.error) { if (undo) undo(); showToast(res.error); return; }
      showToast('배정 취소됨', true);
      _afterWrite(res);
      loadOccupancy();   // 비워진 자리를 배지에 반영
    }).catch(function(e) { showLoading(false); if (undo) undo(); showToast('처리 실패: '+e.message); });
  });
}

// 마크 토글 (북마크 버튼) — 확인창 없음(가벼운 개인 뷰 토글).
// 낙관 반영(유성 2026-08-10 "해제 로딩이 너무 오래"): 결과가 결정적(marked 뒤집기)이라 화면 먼저(대기 0초),
// 서버는 뒤에서 확정. doUnassign과 같은 패턴 — undo 실패 시에만 옛 로딩바 경로.
// 화면이 그 행을 누구로 알고 있는지 — 서버가 시트 B열과 대조해 낡은 탭의 오마크를 막는다(08-31).
function _markName(row) {
  var c = _findChildByRow(row);
  return (c && c.name) ? String(c.name) : '';
}

function doMark(row, on) {
  infoWindow.close();
  var undo = _optimisticMark(row, on);
  if (!undo) showLoading(true);
  fetchGAS('mark', { row: row, on: on ? '1' : '0', service: currentService, ctx: _ctxKeyName(), name: _markName(row) }).then(function(res) {
    showLoading(false);
    // stale = 그 행이 이미 다른 아이 것이다(재제출·본인수정으로 행이 밀림) → 화면을 서버 실물로 다시 맞춘다
    if (res.error) { if (undo) undo(); showToast(res.error); if (res.stale) { _invalidateServiceCache(); reloadCurrent(true); } return; }
    showToast(on ? '마크됨' : '마크 해제', true);
    _afterWrite(res);
  }).catch(function(e) { showLoading(false); if (undo) undo(); showToast('처리 실패: '+e.message); });
}

// 마크 낙관 반영 — 대상 아동의 marked만 뒤집고 즉시 재렌더. 반환 = 되돌리기 함수.
function _optimisticMark(row, on) {
  var c = _findChildByRow(row);
  if (!c) return null;
  var prev = !!c.marked;
  c.marked = !!on;
  _renderCurrent();
  return function undo() { c.marked = prev; _renderCurrent(); };
}

var _copyData = [];
function registerCopyData(c) {
  var idx = _copyData.length;
  _copyData.push(c);
  return idx;
}

function doCopy(idx) {
  var c = _copyData[idx];
  if (!c) { showToast('복사 실패'); return; }
  var lines = ['신청폼-오감', c.name || ''];
  if (c.address) lines.push(c.address);
  if (c.times) lines.push(fmtTimes(c.times));
  if (c.phone) lines.push(fmtPhone(c.phone));
  if (c.notes) lines.push(c.notes);
  if (c.voucher) lines.push('바우처: ' + c.voucher);
  var text = lines.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ showToast('복사됨', true); });
  } else {
    var ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); showToast('복사됨', true);
  }
}

function reloadCurrent(keepView) {
  if (MODE === 'basic') { loadBasicMap(keepView); return; }
  if (MODE === 'provider') { loadStaffMap(keepView); return; }
  var sel = document.getElementById('providerSelect').value;
  if (sel === '__ALL__') loadAllProviders(keepView);
  else if (sel) loadMapData(sel, keepView);
}

// ══ 쓰기 액션 최적화 (2026-08-05) ══
// 구조: [클릭] → 낙관적 로컬 반영(즉시) → 쓰기 왕복 1회(응답에 최신 지도데이터 동봉) → 같으면 재렌더 생략.
// 옛 구조는 [쓰기 왕복]+[mapdata 왕복] = 왕복 2회(실측 왕복 1회 1.5~2.1초 + 전독 2~5초) = 4~7초 대기였다.

// 지금 보고 있는 지도 컨텍스트 = 캐시 키의 앞부분이자 서버에 보낼 ctx.
function _ctxKeyName() {
  var sel = document.getElementById('providerSelect').value;
  return sel || '__ALL__';
}

// 쓰기는 '한 서비스 탭의 한 행'만 바꾼다 → 다른 서비스(아청심 등) 캐시는 여전히 유효.
// 옛 코드는 _svcCache={}로 전부 날려 서비스 전환 때마다 왕복이 되살아났다.
function _invalidateServiceCache() {
  var suf = '|' + currentService;
  Object.keys(_svcCache).forEach(function(k) {
    if (k.length >= suf.length && k.slice(-suf.length) === suf) delete _svcCache[k];
  });
}

// 렌더에 쓰이는 데이터 전체의 지문. 서버 응답이 낙관 반영값과 완전히 같으면
// 마커 253개를 다시 파괴/생성하지 않는다(= 몇 초 뒤 깜빡임 0).
// 필드를 골라 뽑지 않고 통째로 직렬화한다 — 골라 뽑으면 IW의 메모·전화 같은 변경을 놓쳐
// 옛 화면이 남는다. 서버는 항상 같은 키 순서로 객체를 만들고, 낙관 객체도 그 순서를 그대로 따른다(_optimisticUnassign).
var _sigFailN = 0;
function _renderSig(d) {
  if (!d) return '';
  try { return JSON.stringify([d.provider || null, d.assigned || [], d.waiting || [], d.allProviders || null]); }
  catch (e) { return 'sigfail' + (++_sigFailN); }   // 직렬화 실패 시엔 절대 안 맞음 → 안전하게 재렌더
}
var _lastRenderSig = null;

// currentData를 화면에 반영. __ALL__일 때만 드롭다운 카운트 갱신(개별 모드의 assigned는 그 선생님 것뿐이라 카운트가 틀림).
function _renderCurrent() {
  if (!currentData) return;
  if (_ctxKeyName() === '__ALL__') updateProviderCounts(currentData.assigned);
  renderMarkers(); updateDashboard();
  populateNlFilters(); renderNewList();
  // 🔴 이 한 줄이 없어서 「후보안 뽑기」 버튼이 **영영 안 떴다** — 유일한 호출부가 planExit이라
  //    시트를 나가야만 켜지는데 들어갈 수가 없었다(2026-08-09 검증). 마크·제공인력이 바뀔 때마다 갱신.
  planSyncFab();
  schedSync();       // 월 스케줄 시트도 같은 단일 렌더 경로에서만 동기한다(복제 금지 교훈)
  _lastRenderSig = _renderSig(currentData);
}

// 쓰기 성공 후 마무리. 응답에 map이 동봉돼 있으면 그대로 채택(왕복 0),
// 없으면(구 GAS 배포) 기존처럼 재조회 → 배포 순서와 무관하게 안전.
function _afterWrite(res) {
  _invalidateServiceCache();
  // 더 나중 조작이 아직 진행 중이면 이 응답은 그것을 모른다 → 화면 확정은 마지막 응답에 넘긴다.
  // (낙관 반영 덕에 화면엔 이미 두 조작이 다 보이는 상태라 사용자는 기다리는 게 없다)
  if (_writesInFlight > 0) return;
  if (MODE !== 'admin' || !res || !res.map || res.map.error) { reloadCurrent(true); return; }
  var sel = _ctxKeyName();
  var data = res.map;
  if (sel !== '__ALL__') data.allProviders = null;   // loadMapData와 동일 규칙
  _svcCache[sel + '|' + currentService] = data;
  currentData = data; _waInvalidate();
  if (_renderSig(data) === _lastRenderSig) return;   // 낙관 반영과 동일 → 재렌더 생략
  _renderCurrent();
}

// 배정취소의 결과는 결정적이다(Q=''·R='대기'·S/T=''). 서버를 기다리지 않고 먼저 그린다.
// 반환값 = 되돌리기 함수(실패 시 호출). 대상 아동을 못 찾으면 null → 호출부가 기존 로딩바 경로로 폴백.
function _optimisticUnassign(row) {
  if (!currentData || !currentData.assigned) return null;
  var idx = -1;
  for (var i = 0; i < currentData.assigned.length; i++) {
    if (Number(currentData.assigned[i].formRow) === Number(row)) { idx = i; break; }
  }
  if (idx < 0) return null;

  var prevA = currentData.assigned, prevW = currentData.waiting || [];
  var c = prevA[idx];
  currentData.assigned = prevA.slice(0, idx).concat(prevA.slice(idx + 1));
  /* 🔴 서버 waiting 리터럴과 **키·순서·값이 바이트로 같아야** 한다 — `_renderSig`가 통짜 JSON 비교라
        하나만 어긋나면 "재렌더 생략"이 영영 안 걸리고 마커 294개가 매번 다시 만들어진다.
        ① `dob` 누락(2026-08-26 서버에 추가될 때 여기만 안 따라옴)
        ② 배열 끝에 concat → 서버는 **행 번호 오름차순**이라 위치가 어긋남
        둘 다 2026-09-01에 맞췄다. 서버 순서 = Code.js getMapData가 formData를 행 순으로 한 번 훑는 것. */
  var _nw = {
    row: Number(row), name: c.name, dob: c.dob, lat: c.lat, lng: c.lng, address: c.address,
    times: c.times, phone: c.phone, notes: c.notes, voucher: c.voucher,
    status: '대기', sigungu: c.sigungu || '', bname: c.bname || '',
    addr1: c.addr1 || '', timestamp: c.timestamp, marked: !!c.marked   // 마크는 배정취소가 지우지 않음(직교)
  };
  var _wa = prevW.slice(), _at = _wa.length;
  for (var _i = 0; _i < _wa.length; _i++) { if (Number(_wa[_i].row) > Number(row)) { _at = _i; break; } }
  _wa.splice(_at, 0, _nw);
  currentData.waiting = _wa;
  _renderCurrent();
  return function undo() {
    currentData.assigned = prevA; currentData.waiting = prevW;
    _renderCurrent();
  };
}

function placeSearchMarker(lat, lng, iwContent) {
