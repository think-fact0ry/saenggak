  /** 시간 바꾸기 = 기존 배정 다이얼로그(setChildTime) 재사용 — Q·R·S·T 정본 경로는 하나(0-9) */
  function fixBtn(v,id,label,mi){
    return '<button class="lnk" onclick="scFix(event,'+id+','+(mi||0)+')">'+label+'</button>';
  }

  /* ════ 빈 자리 후보 (2026-09-01) ═══════════════════════════════════════════════
     빈 칸을 누르면 그 자리 앞뒤 아동 근처에서 기다리는 아이를 시트 위(폰)·왼쪽(PC)에 띄운다.
     서버 0줄 — 대기 아동 좌표·희망시간·접수시각이 이미 currentData.waiting에 다 와 있다.

     규칙(유성 확정 2026-09-01)
       반경 = 앞뒤 아동 중 **가까운 쪽까지 1km**. 사전계획 §4-B의 타원(k배 우회) 가지는
              1km 컷이 이미 더 좁아서 아무것도 못 넣는다 ⇒ k는 안 쓴다(1.2/1.3 선택 불요).
       순위 = ①같은 단지(좌표 일치) ②시간 앎 > 시간 모름 > 시간 안 맞음 ③최신순(행 번호 역순)
       뱃지 = '시간 모름'(회색)·'시간 안 맞음'(주황)만. **'맞음'은 안 단다.**
       대기 기간 슬라이더는 여기에도 걸린다(기본 최근 3개월).
     ⚠️ 시간 판정은 3분법이다 — 라이브 matchesTimeFilter는 못 읽는 형식을 '맞음'으로 통과시키는데,
        그건 맞는 게 아니라 **모름**이다(08-08 가용시간 사고와 같은 규율: 모름 ≠ 아님/맞음). */
  var CAND = { key:null, g:null, list:[] };
  var CAND_KM = 1, CAND_HD = 24, CAND_PAD = 14, CAND_CARD = 34, CAND_GAP = 4, CAND_MAPMIN = 120;
  var CAND_FRESH = 90;   // 같은 단지를 1순위로 올리는 신청 나이 상한(일) — 슬라이더 '최근 3개월'과 같은 값
  function gkey(d,g){ return d+'|'+g.s+'|'+g.e; }
  function candH(rows){ return CAND_HD + CAND_PAD + rows*CAND_CARD + (rows-1)*CAND_GAP; }

  /** 기준점 = 그 그룹에서 좌표를 아는 멤버 중 자리에 가장 붙은 쪽. 아무도 좌표가 없으면 null */
  function anchor(gp, side){
    var best = null;
    (gp||[]).forEach(function(u){ (u.mem||[]).forEach(function(m){
      if (m.lat == null || m.lng == null) return;
      if (!best) { best = m; return; }
      best = (side === 'end') ? (m.e > best.e ? m : best) : (m.s < best.s ? m : best);
    });});
    return best;
  }
  function sameSpot(c, a){ return Math.abs(c.lat-a.lat) < 1e-6 && Math.abs(c.lng-a.lng) < 1e-6; }

  /** 자리 하나 → 후보 배열(대기 기간은 아직 안 자른다 — 슬라이더가 실시간으로 자를 수 있게) */
  /** 앞·뒤 자리(R3)의 반대쪽 기준점 = **교사의 집**. 하루의 시작은 집에서 출발하고 끝은 집으로 돌아간다.
      집 좌표는 26명 전원에게 있다(2026-09-01 실측 · 없으면 서버 getMapData가 지오코딩으로 자가치유한다). */
  function homeAnchor(){
    var p = currentData && currentData.provider;
    return (p && p.lat && p.lng) ? { lat:p.lat, lng:p.lng } : null;
  }
  function candBuild(g, d){
    var pv = g.pv ? anchor(g.pv,'end')   : homeAnchor();
    var nx = g.nx ? anchor(g.nx,'start') : homeAnchor();
    if (!pv && !nx) return null;                       // 앞뒤 둘 다 주소를 모른다
    var hrs = []; for (var h=0; h<24; h++) if (h*60 >= g.s && h*60 < g.e) hrs.push(h);
    var out = [];
    ((currentData && currentData.waiting) || []).forEach(function(c){
      if (!c.lat || !c.lng) return;
      var km = Infinity;
      if (pv) km = Math.min(km, haversine(c.lat, c.lng, pv.lat, pv.lng));
      if (nx) km = Math.min(km, haversine(c.lat, c.lng, nx.lat, nx.lng));
      if (km > CAND_KM) return;
      /* 3분법 — 0 앎 / 1 모름 / 2 안 맞음.
         ⚠️ 희망시간이 **빈칸**인 아이(실측 274명 중 1명)를 라이브 matchesTimeFilter는 `false`로 떨군다.
            그건 '안 맞음'이 아니라 '모름'이다 — 안 적은 걸 안 맞는다고 말하면 거짓말이다(08-08 규율).
         ⚠️ 형식을 못 읽는 아이(실측 7명, 최근 3개월 안엔 1명)도 마찬가지로 모름. */
      var raw = String(c.times || '');
      var v;
      if (!raw || !/[월화수목금토일]-\d/.test(raw)) v = 1;
      else v = hrs.some(function(x){ return matchesTimeFilter(raw, d, x); }) ? 0 : 2;
      /* 같은 단지(좌표 일치)는 시간이 안 맞아도 1순위로 올린다 — **단 3개월 내 신청일 때만**(유성 09-01).
         오래 기다린 집을 "같은 건물"이라는 이유만으로 맨 위에 올리면, 정작 지금 움직이는 집이 밀린다.
         기준은 슬라이더와 **같은 축**(`_waAgeDays` = 행 순서 running-max)이라 「최근 3개월」로 놓고 보면
         화면에 남은 같은 단지 아이는 전부 승격된다. ⚠️ 카드에 찍는 접수일(원본)과는 다를 수 있다 —
         재신청·본인수정한 집은 접수일이 옛날이어도 '최근'으로 잡힌다(그게 "다시 하고 싶다"는 신호).
         시각을 모르는 집은 승격 안 한다(`_waAgeDays`가 Infinity) — 모르면 안 올리는 쪽이 안전하다. */
      var sameSite = (pv && sameSpot(c,pv)) || (nx && sameSpot(c,nx));
      out.push({ c:c, km:km, v:v,
                 rk:(sameSite && _waAgeDays(c) <= CAND_FRESH) ? 0 : 1 });
    });
    out.sort(function(a,b){
      if (a.rk !== b.rk) return a.rk - b.rk;
      if (a.v  !== b.v ) return a.v  - b.v;
      return (b.c.row||0) - (a.c.row||0);              // 최신순 = 행 번호 역순(A열 접수시각이 아니라)
    });
    return out;
  }

  /** 접수일 MM-DD. 슬라이더가 자르는 기준은 _waEff(행 순서 running-max)지만, 카드에 적는 건 **원본 접수일**이다 */
  function candDay(c){
    if (!c.timestamp) return '';
    var t = new Date(c.timestamp); if (isNaN(t)) return '';
    return ('0'+(t.getMonth()+1)).slice(-2) + '-' + ('0'+t.getDate()).slice(-2);
  }
  function candCards(list){
    if (!list.length) return '<div class="cmsg">'+CAND_KM+'km 안에 대기 중인 아이가 없어요</div>';
    return '<div class="cg">' + list.map(function(o,i){
      var c = o.c;
      // 「시간 」은 ≥680px에서 CSS가 숨긴다 — 폰은 전체 문구, PC 115px에선 「안 맞음」·「모름」(유성 09-01)
      var badge = o.v===2 ? '<span class="ctb no"><i class="pre">시간 </i>안 맞음</span>'
                : o.v===1 ? '<span class="ctb unk"><i class="pre">시간 </i>모름</span>' : '';
      // 시간이 안 맞거나 모르면 뱃지 + 흐리게 (유성 09-01). 앎만 선명하다
      return '<div class="cc enter'+(o.v?' dim':'')+'" onclick="candGo('+c.row+')">'
        + '<div class="c1"><span class="crk">'+(i+1)+'</span>'
        + '<span class="cnm">'+esc(c.name)+'</span>'
        + '<span class="ckm">'+o.km.toFixed(2)+'km</span></div>'
        + '<div class="c2"><span>'+candDay(c)+'</span>'+badge+'</div></div>';
    }).join('') + '</div>';
  }

  /** 높이 = A+C (유성 확정 2026-09-01. 옛 "작은 폰 4명·큰 폰 6명" 기기 규칙은 이걸로 대체됐다 —
      실측에서 기기 크기가 아니라 **그 교사의 격자 시간폭**이 진짜 축이었다)
      **A** 후보 수가 행 수를 정한다 — 4명 이하면 2행, 5명 이상이면 3행(상한). 실측상 자리 12곳 중 10곳이
           후보 4명 이하라 대개 2행으로 끝나고 지도를 그만큼 더 돌려준다. 8행은 안 만든다
           (6명→8명으로 늘려도 덮는 자리가 하나도 안 늘어났다: 11/12 → 11/12).
      **C** 시트가 `모달 높이 + 8px`만큼 자리를 내준다 — 시트+모달이 합쳐서 지금 시트가 쓰던 82%를
           나눠 쓴다. 그래서 **지도에 남는 띠는 모달을 열기 전과 같고**, 어떤 격자·어떤 폰에서도 안 밀린다. */
  function candFit(){
    var el = document.getElementById('candSheet'), sheet = document.getElementById('schedSheet');
    function plain(){ sheet.classList.remove('withcand'); sheet.style.removeProperty('--cand-reserve');
                      el.style.height = ''; }
    if (!el.classList.contains('on') || window.innerWidth >= 680) { plain(); return; }
    var n = CAND.list ? CAND.list.filter(function(o){ return _waAlive(o.c); }).length : 0;
    var h = candH(n <= 4 ? 2 : 3);
    sheet.style.setProperty('--cand-reserve', (h + 8) + 'px');
    sheet.classList.add('withcand');
    el.style.height = h + 'px';
    /* ⛔여기서 시트를 **재지 않는다** — max-height가 전환 중이라 offsetHeight가 낡은 값을 준다.
       잴 필요도 없다: 시트가 `82% − (h+8)`로 묶이므로 모달 자리는 항상 `0.18×화면높이 − 상단바 + h`,
       즉 **h보다 최소 50px 크다**(667px 폰 기준). 어떤 격자·어떤 폰에서도 밀릴 수 없다. */
    syncFade();   // 시트 높이가 바뀌었으니 격자 하단 그라데이션을 다시 판정한다
    setTimeout(syncFade, 340);   // 전환이 끝난 뒤 한 번 더 (넘침 판정이 최종 높이에서 정해지게)
  }
  function candFade(){
    var el = document.getElementById('candSheet'), bd = document.getElementById('candBody');
    el.classList.toggle('more', bd.scrollHeight - bd.clientHeight - bd.scrollTop > 6);
  }
  function candDraw(){
    var el = document.getElementById('candSheet');
    if (!CAND.key) { el.classList.remove('on'); return; }
    var live = CAND.list ? CAND.list.filter(function(o){ return _waAlive(o.c); }) : null;
    // 구 탭 토스트 문구를 그대로 흡수했다(2026-09-01) — 토스트와 헤더가 같은 말을 하면 §2.1 중복.
    // 폰 실측: 가장 긴 '월 14:30부터 1시간 27분 (이동 12분 뺀 값)'=184px < 360px폰 제목칸 194px.
    // ≥680px에선 .lg가 숨어 '월 14:30'만 — 시간은 격자 빈칸의 '+57분'이 바로 옆에서 말한다.
    document.getElementById('candTitle').innerHTML = CAND.g.d + ' ' + hh(CAND.g.s)
      + '<span class="lg">부터 ' + dur(CAND.g.min) + ' (이동 ' + CAND.g.mv + '분 뺀 값)</span>';
    document.getElementById('candN').textContent = live ? ('근처 ' + live.length + '명') : '';
    // 내용이 그대로면 다시 그리지 않는다 — 아동 블록을 탭할 때마다 카드가 다시 튀어오르고
    // 스크롤 위치가 처음으로 돌아가는 걸 막는다.
    var bd = document.getElementById('candBody');
    _candSig = live ? live.map(function(o){ return o.c.row; }).join(',') : '';
    /* 🔴 sig에 행 번호만 넣으면 안 된다 — 같은 파일 `_renderSig`가 경고하는 그 안티패턴이다.
       ①서비스를 바꾸면 행 번호는 탭별이라 우연히 같은 집합이 나올 수 있고(옛 탭 아이가 남는다)
       ②재조회로 이름·희망시간만 바뀌면 뱃지가 옛 값으로 굳는다 ③앵커가 바뀌면 km이 옛 값이 된다.
       ⇒ 카드에 실제로 그리는 값을 전부 넣는다. */
    var sig = (typeof currentService !== 'undefined' ? currentService : '') + '|' + CAND.key + '#'
      + (live ? live.map(function(o){ return o.c.row+':'+o.v+':'+o.km.toFixed(2)+':'+o.c.name; }).join(',')
              : 'noaddr');
    if (bd.__sig !== sig){
      bd.__sig = sig;
      bd.innerHTML = live ? candCards(live)
        : '<div class="cmsg warn">앞뒤 아동의 주소를 몰라 근처 아이를 찾을 수 없어요.</div>';
    }
    el.classList.add('on');
    candFit(); candFade();
    bd.onscroll = candFade;
  }
  /** paint() 끝에서 부른다 — 자리가 사라졌으면(교사·데이터 변경) 조용히 닫는다 */
  function candSync(){
    if (!CAND.key) { document.getElementById('candSheet').classList.remove('on'); return; }
    var found = null;
    RL.forEach(function(r){ if (r.free && gkey(r.d, r.g) === CAND.key) found = r; });
    if (!found) { CAND.key=null; CAND.g=null; CAND.list=null;
                  document.getElementById('candSheet').classList.remove('on'); return; }
    CAND.g = { d:found.d, s:found.g.s, e:found.g.e, min:found.g.min, mv:found.g.mv };
    CAND.list = candBuild(found.g, found.d);
    candDraw();
  }
  /** 대기 기간 슬라이더 델타 — 다시 그리지 않고 '사라짐 → 다시 그림'만.
      (2열 격자에선 카드를 접으면 그 칸이 구멍으로 남는다. 1열이던 프리뷰와 다른 점) */
  var _candCutT = null, _candSig = '';
  function candCut(){
    if (!CAND.key || !CAND.list) return;
    var live = CAND.list.filter(function(o){ return _waAlive(o.c); });
    var sig = live.map(function(o){ return o.c.row; }).join(',');
    if (sig === _candSig) return;
    _candSig = sig;
    var bd = document.getElementById('candBody');
    [].forEach.call(bd.querySelectorAll('.cc'), function(e){ e.classList.add('leaving'); });
    /* 🔴 DOM을 건드린 쪽이 DOM 캐시 키를 무효화한다. 이게 없으면:
       3개월→1개월→3개월을 180ms 안에 왕복했을 때 candDraw의 sig가 bd.__sig와 같아져 다시 안 그리고,
       `.leaving`(opacity 0)이 붙은 카드가 그대로 굳는다 = 헤더엔 '근처 3명'인데 본문은 백지. */
    bd.__sig = null;
    clearTimeout(_candCutT);
    _candCutT = setTimeout(function(){ candDraw(); }, 180);
  }
  window.candCut = candCut;
  /* ══ 배정 아동은 선생님 집이 같이 보이게 (유성 2026-09-02, 프리뷰 승인) ══
     상한을 두지 않는다 — 둘 다 들어올 때까지 지도가 알아서 축소한다.
     지난 안에 '레벨 6까지만' 같은 상한을 붙였던 건 '밖으로 나가지 않는다'는 지시를 어긴 것이라 지웠다.
     ① 좌우 여백으로 가로 span을 880px로 묶는다 — PC 지도가 1920px라 안 묶으면 1269px까지 벌어져
        유성이 말한 1000×1000 상자를 넘는다(실측). 폰은 폭이 작아 여백이 최소값 30으로 떨어진다.
     ② 너무 당겨지는 것만 막는다 — 아동이 선생님과 같은 건물이면 250m 시야까지 가므로 레벨 3이 하한.
     ⛔ 둘을 잇는 선은 그리지 않는다(유성 09-02). */
  /* 어느 집을 같이 보여줄 것인가 — **아이의 담당 교사** 집이다.
     개별 교사 모드면 `provider`가 곧 그 교사지만, '전체 제공인력' 모드에선 `provider.lat`이 null이고
     아이마다 교사가 다르다(실측: 배정 167명 / allProviders 26명). 그때는 `assignedTo`로 찾는다. */
  function _homeOf(child){
    var p = currentData && currentData.provider;
    if (p && p.lat && p.lng) return p;
    var to = child && child.assignedTo, list = (currentData && currentData.allProviders) || [];
    for (var i = 0; i < list.length; i++) if (list[i].name === to && list[i].lat && list[i].lng) return list[i];
    return null;
  }

  function focusChild(lat, lng, child){
    var pos = new kakao.maps.LatLng(lat, lng);
    var h = child && _homeOf(child);
    if (!h){ map.setCenter(pos); map.setLevel(3); return; }   // 대기 아동·집을 못 찾는 경우 = 종전 동작
    var b = new kakao.maps.LatLngBounds();
    b.extend(pos); b.extend(new kakao.maps.LatLng(h.lat, h.lng));
    var el = document.getElementById('map');
    var side = Math.max(30, Math.round((((el && el.clientWidth) || 1920) - 880) / 2));
    map.setBounds(b, 30, side, 30, side);
    if (map.getLevel() < 3) map.setLevel(3);   // 같은 건물이어도 지금과 같은 레벨 3에서 멈춘다
  }
  window.focusChild = focusChild;

  /** 월 스케줄 아동 카드 → 지도 (유성 2026-09-01). 배정 아동이라 `assigned`에서 찾는다.
      ⚠️ `e.stopPropagation()`이 없으면 카드가 접힌다(블록 전체가 `scTap` 핸들러). */
  window.scGo = function(e, lat, lng, row){
    if (e) e.stopPropagation();
    if (iwToggle('sched:'+row)) return;   // 같은 버튼 다시 누름 = 말풍선만 내린다(화면 고정)
    var c = null;
    ((currentData && currentData.assigned) || []).forEach(function(x){ if (Number(x.formRow)===Number(row)) c = x; });
    focusChild(lat, lng, c);   // 월 스케줄에서 들어오는 건 전부 배정 아동(c = 그 아이)
    var h = currentData && currentData.provider;
    var iw = c ? buildGroupedAssignedIW([c], h&&h.lat, h&&h.lng)
               : '<div class="iw"><div class="iw-nm">이 서비스 탭에 행이 없는 아이예요</div></div>';
    var ex = findMarkerAt(lat, lng);
    if (ex) { clearSearchMarker(); infoWindow.setContent(iw); infoWindow.open(map, ex); }
    else { var sm = placeSearchMarker(lat, lng, iw); infoWindow.setContent(iw); infoWindow.open(map, sm); }
  };
  window.candGo = function(row){
    if (iwToggle('cand:'+row)) return;   // 같은 카드 다시 누름 = 말풍선만 내린다(화면 고정, 유성 09-01)
    var c = null;
    ((currentData && currentData.waiting) || []).forEach(function(x){ if (Number(x.row)===Number(row)) c = x; });
    if (!c || !c.lat || !c.lng) return;
    map.setCenter(new kakao.maps.LatLng(c.lat, c.lng));
    map.setLevel(3);
    // 아동 카드 = 검색 결과 클릭과 같은 경로(0-9 — IW 만드는 문법은 하나)
    var iw = buildGroupedWaitingIW([c], currentData.provider.lat, currentData.provider.lng);
    var ex = findMarkerAt(c.lat, c.lng);
    if (ex) { clearSearchMarker(); infoWindow.setContent(iw); infoWindow.open(map, ex); }
    else { var sm = placeSearchMarker(c.lat, c.lng, iw); infoWindow.setContent(iw); infoWindow.open(map, sm); }
  };
  window.candClose = function(){ CAND.key=null; CAND.g=null; CAND.list=null; _candSig='';
    document.getElementById('candBody').__sig = null;   // 위와 같은 이유 — 닫을 때도 캐시를 버린다
    document.getElementById('candSheet').classList.remove('on');
    candFit();   // 시트가 내줬던 자리를 돌려받는다(C안) — 이걸 빼면 시트가 짧은 채로 남는다
  };
  // 폰 회전·창 크기 변경 = 옆/위와 행 수가 같이 바뀐다(PC 분기에선 inline height를 지운다)
  window.addEventListener('resize', function(){ if (CAND.key) { candFit(); candFade(); } });

  // ── 전역 노출 (onclick·훅용) ──────────────────────────────────────
  window.scTap = function(i){ SCHED.open = (SCHED.open===i? null : i); paint(); };
  window.scFx = function(i){
    var r = RL[i], k = gkey(r.d, r.g);
    if (CAND.key === k) { candClose(); paint(); return; }     // 같은 칸 두 번 = 닫기
    CAND.key = k; _candSig = '';
    // ⛔토스트 안 띄운다 — 모달 헤더가 같은 말을 한다(§2.1 문구 중복). 유성 08-16 "설명은 탭 토스트가 한다"의
    //   그 설명 자리를 모달이 가져갔다(유성 09-01 "아직 토스트가 나오는데?").
    paint();                                                   // 초록 표시 + candSync
  };
  window.scFix = function(e,i,mi){ e.stopPropagation();
    var v = RL[i].g[0].mem[mi||0];
    if (v.row) { setChildTime(v.row); return; }
    showToast('이 서비스 탭 신청폼에 행이 없는 아이라 여기서는 바꿀 수 없어요'); };
  window.schedUnknown = function(){
    var unk = (OCC.unknown && OCC.unknown[SCHED.prov]) || [];
    showToast('시간 미상(결제 기록 부족): ' + unk.join(', ')); };

  /** 렌더 단일 경로(_renderCurrent)에서만 부른다. 교사 개별 선택 + 배치안 안 열림 = 시트 자동 */
  window.schedSync = function(){
    var sel = document.getElementById('providerSelect');
    var prov = sel ? sel.value : '';
    var admin = (typeof isAdmin === 'function') ? isAdmin() : false;
    var planOn = document.getElementById('planSheet').classList.contains('on');
    if (!admin || !prov || prov === '__ALL__' || planOn) { schedClose(); return; }
    // 🔴 자동 오픈 폐기(유성 2026-08-24 "선택했을때 스케줄표가 바로 나와버리는데 아니야") —
    //    교사를 골라도 기본은 접힘(두 알약). 시트는 「○○님 월 스케줄」 버튼으로만 연다.
    if (SCHED.prov !== prov) {
      SCHED.prov = prov; SCHED.open = null; SCHED.folded = true;
      document.getElementById('schedSheet').classList.remove('on');
      schedRouteOff(); candClose();   // 교사가 바뀌면 그 자리 후보도 의미가 없다
    }
    if (SCHED.folded) { schedPillShow(); return; }
    document.getElementById('schedSheet').classList.add('on');
    document.getElementById('schedPill').classList.remove('on', 'circle', 'beside');
    paint();
    _fabShape();   // 시트가 열렸으니 후보 배치안 버튼을 원형으로 시트 옆에
  };
  window.schedRefresh = function(){
    if (document.getElementById('schedSheet').classList.contains('on')) paint();
  };
  window.schedOpen = function(){ SCHED.folded = false; schedSync(); };
  window.schedFold = function(){
    schedRouteOff();   // 접으면 동선도 끈다 — pill과 요일 버튼이 같은 자리를 쓴다
    candClose();
    SCHED.folded = true; SCHED.open = null;
    document.getElementById('schedSheet').classList.remove('on');
    schedPillShow();
  };
  function schedPillShow(){
    var pill = document.getElementById('schedPill');
    pill.querySelector('.full').textContent = SCHED.prov + '님 월 스케줄';   // 라벨 유성 확정 08-24
    pill.classList.remove('circle', 'beside');   // 알약 상태로 (원형 잔재 제거)
    pill.classList.add('on');
    _fabShape();
  }
  window.schedClose = function(){
    candClose();
    document.getElementById('schedSheet').classList.remove('on');
    document.getElementById('schedPill').classList.remove('on', 'circle', 'beside');
    schedRouteOff();
    _fabShape();
  };
  /** 「현재 동선」 — 배치안 동선과 같은 문법(요일 버튼·요일색 폴리라인·86% 화살표·planDraw 자산 재사용) */
  window.schedRouteToggle = function(){
    if (SCHED.route) { schedRouteOff(); return; }
    SCHED.route = true; SCHED.missWarned = false;
    document.getElementById('schedRouteBtn').classList.add('on');
    document.getElementById('planDays').classList.add('on');
    planDim(true);
    planDay('all');
  };
  window.schedRouteOff = function(){
    if (!SCHED.route) return;
    SCHED.route = false;
    document.getElementById('schedRouteBtn').classList.remove('on');
    document.getElementById('planDays').classList.remove('on');
    planClear(); planDim(false);
  };
  window.schedDraw = function(dayF){
    planClear();
    var vs = rows();
    var home = currentData && currentData.provider;
    var miss = 0;
    ['월','화','수','목','금','토'].forEach(function(d){
      if (dayF !== 'all' && d !== dayF) return;
      var list = dayRows(vs, d);
      if (!list.length) return;
      var col = PLAN_DC[d] || '#666';
      var byXY = {}, order = [];
      var seen = {};
      list.forEach(function(v){
        if (v.sg != null && seen['g'+v.sg]) return;   // 형제 한 집 = 한 정거장
        if (v.sg != null) seen['g'+v.sg] = 1;
        if (!v.lat || !v.lng) { miss++; return; }
        var k = v.lat.toFixed(6)+','+v.lng.toFixed(6);
        if (!byXY[k]) { byXY[k] = { lat:v.lat, lng:v.lng, kids:[] }; order.push(byXY[k]); }
        byXY[k].kids.push({ name:v.n, phone:v.tel });
      });
      var path = [];
      if (home && home.lat) path.push(new kakao.maps.LatLng(home.lat, home.lng));
      order.forEach(function(g, gi){
        path.push(new kakao.maps.LatLng(g.lat, g.lng));
        var m = new kakao.maps.Marker({
          position: new kakao.maps.LatLng(g.lat, g.lng),
          image: _planDayIcon(col, d + (gi+1), 0),
          map: map, zIndex: 20
        });
        planMarkers.push(m);
        var ov = new kakao.maps.CustomOverlay({
          position: new kakao.maps.LatLng(g.lat, g.lng),
          content: '<div class="mlbl assigned plan">' + esc(_planJoinNames(g.kids)) + '</div>',
          zIndex: 21, xAnchor: 0, yAnchor: 0
        });
        ov.setMap(map); planLabels.push(ov);
      });
      if (home && home.lat) path.push(new kakao.maps.LatLng(home.lat, home.lng));   // 귀가 포함
      if (path.length > 1) {
        var line = new kakao.maps.Polyline({
          path: path, strokeWeight: 4, strokeColor: col,
          strokeOpacity: dayF === 'all' ? 0.45 : 0.9, strokeStyle: 'solid'
        });
        line.setMap(map); planLines.push(line);
        for (var ai = 0; ai < path.length - 1; ai++) _planArrow(path[ai], path[ai+1], col);
      }
    });
    // 좌표를 모르는 아이는 조용히 빠지면 안 된다 — 06에 행이 없는 42%가 여기 걸린다(docs/4 §3)
    if (miss && !SCHED.missWarned) { SCHED.missWarned = true;
      showToast(miss + '명은 주소·좌표가 없어 동선에 못 그렸어요 (06 신청폼에 행이 없는 아이)'); }
  };

  // 핸들 드래그로 접기 (§4.3-5 — 아래로만·임계 80px. planSheet과 같은 패턴) + 탭해도 접힘
  var sh = document.getElementById('schedSheet'), gb = document.getElementById('schedGrab');
  var y0 = null, dy = 0;
  function down(e){ y0 = (e.touches ? e.touches[0].clientY : e.clientY); dy = 0;
    sh.style.transition = 'none'; sh.style.transform = 'translateY(0) scale(.97)'; }
  function move(e){ if (y0 === null) return;
    var y = (e.touches ? e.touches[0].clientY : e.clientY);
    dy = Math.max(0, y - y0);
    sh.style.transform = 'translateY(' + dy + 'px) scale(.97)';
    if (e.cancelable) e.preventDefault(); }
  function up(){ if (y0 === null) return;
    sh.style.transition = ''; sh.style.transform = '';
    if (dy > 80 || dy < 5) schedFold();   // 쭉 내리거나(80+) 톡 치거나(5 미만 = 클릭) = 접기
    y0 = null; }
  gb.addEventListener('mousedown', down); window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  gb.addEventListener('touchstart', down, {passive:true}); gb.addEventListener('touchmove', move, {passive:false}); gb.addEventListener('touchend', up);
})();

</script>
