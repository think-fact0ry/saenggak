    if (c.times) h+=iwRow('cal','희망',iwSegs(c.times)+earlyBadge(c.notes));
    if (c.notes) h+=iwRow('note','참고',esc(c.notes),'dim');
    if (c.phone) h+=iwRow('phone','전화','<a href="tel:'+esc(c.phone)+'">'+esc(fmtPhone(c.phone))+'</a>');
    if (c.voucher && c.voucher !== '네') h+=iwRow('warn','바우처',esc(c.voucher),'vwarn');
    h+='</div>';

    // 배정추천(배정하기+다음 스텝 링크 포함)·부재/거절/복사/마크 = 행정만 (제공인력·기본은 숨김)
    if (isAdmin()) h += buildRecommendation(c);
    // 출발/도착(길찾기) = 제공인력·행정 (기본지도는 좌표가 뭉개져 있어 숨김)
    if (MODE !== 'basic') h+=routeBtns(c.name,c.lat,c.lng);
    if (isAdmin()) {
      var ci = registerCopyData(c);
      // ⚠️ 여기 있던 `assignBtn`은 뺐다 — 추천 블록의 「배정하기」와 같은 `doAssign`이라 중복(유성 2026-08-09)
      h+='<div class="iw-r3">'
        +'<button class="iw-chip ww" onclick="doAbsent('+c.row+',\''+esc(c.status||'')+'\')">'+(c.status==='부재1'?'부재2':'부재')+'</button>'
        +'<button class="iw-chip dw" onclick="doStatus('+c.row+',\'거절\')">거절</button>'
        +'<button class="iw-chip gw" onclick="doCopy('+ci+')">'+IW_IC.copy+'복사</button>'
        +markActBtn(c.row, c.marked)
        +'</div>';
    }
  });
  return h+'</div>';
}


// ══ 배정 추천 ══

function buildRecommendation(child) {
  if (!providerList || !providerList.length || !child.lat || !child.lng) return '';

  var recs = getRecommendations(child);
  // ⚠️ 추천이 0명이어도 통째로 숨기지 않는다 — 담당자가 "추천이 안 나온다"는 사실 자체를 알아야 한다
  //    (빈 화면은 고장인지 결과인지 구분이 안 된다).
  // 🔴 추천 줄의 배정 버튼·「다른 선생님 고르기」 select는 2026-08-09에 뺐다 — 배정 다이얼로그의
  //    교사 select가 같은 점수·순서·라벨(`_asgFillProviders`)이라 정보·행동이 전부 중복.
  //    여긴 읽기 전용 + 행동은 「배정하기」 하나(1순위는 다이얼로그가 자동 선택하므로 클릭 수 동일).
  var h = '<div class="iw-rec"><div class="iw-rec-t">배정 추천</div>';
  recs.forEach(function(r, idx) {
    h += '<div class="iw-ri">'
      + '<span class="no">' + (idx+1) + '.</span>'
      + '<b>' + esc(r.name) + '</b>'
      + '<span class="d">' + fmtDist(r.dist) + '</span>'
      + '<span class="t">' + esc(r.timeLabel) + '</span>'
      + '<span class="c">' + r.assignedCount + '명</span>'
      + '</div>';
  });
  if (!recs.length) {
    h += '<div class="iw-ri none">가까우면서 시간이 맞는 선생님이 없어요</div>';
  }

  h += '<button class="iw-fillbtn go" onclick="doAssign(' + child.row + ')">배정하기</button>';

  // ── 다음 스텝(밑줄 링크) ── 상태에 따라 갈린다(유성 2026-08-09):
  //    · 전체 보기(__ALL__) → 이 아이를 **누가** 맡을지가 남은 질문 → 모드 B(교사 후보)
  //    · 특정 교사 선택     → 그 교사의 **주간 어디에** 넣을지가 남은 질문 → 모드 A(배치안)
  var _psel = document.getElementById('providerSelect');
  var _pnow = _psel ? _psel.value : '';
  var _hasProv = isAdmin() && _pnow && _pnow !== '__ALL__';
  h += '<div class="iw-next">'
    + (_hasProv
        ? '<button class="iw-txtu" onclick="planFromChild(' + child.row + ',' + (child.marked ? 'true' : 'false') + ')">'
          + esc(_pnow) + '님 주간에서 보기</button>'
        : '<button class="iw-txtu" onclick="planForChild(' + child.row + ',\'' + escQ(child.name) + '\')">'
          + '동선까지 따져 선생님 찾기</button>')
    + '</div>';
  return h + '</div>';
}



/** 4번 줄 드롭다운으로 배정 — 고른 선생님을 그대로 배정 다이얼로그로 넘긴다 */

function getRecommendations(child) {
  var assignCounts = {};
  if (currentData && currentData.assigned) {
    currentData.assigned.forEach(function(a) {
      var p = a.assignedTo || '';
      assignCounts[p] = (assignCounts[p] || 0) + 1;
    });
  }
  var results = [];

  providerList.forEach(function(p) {
    if (!p.lat || !p.lng) return;
    var dist = haversine(child.lat, child.lng, p.lat, p.lng);
    var timeOverlap = calcTimeOverlap(child.times, p.avail);
    if (timeOverlap.count === 0 && child.times && /[월화수목금토일]-\d/.test(child.times)) return;

    results.push({
      name: p.name,
      dist: dist,
      timeLabel: timeOverlap.label,
      timeCount: timeOverlap.count,
      assignedCount: assignCounts[p.name] || 0,
      score: dist + (timeOverlap.count > 0 ? 0 : 5)
    });
  });

  results.sort(function(a,b) { return a.score - b.score; });
  return results.slice(0, 3);
}

// 신청폼 '[시간참고]' 자유칸에서 **시작 하한**만 뽑는다 ("4시40분부터 가능" → 16:40).
// 체크박스(times)는 시(時) 단위라 분을 못 담아, 학부모가 분 단위 조건을 이 칸에 쓴다
// (2026-08-08 실측: 시간참고 34건 중 68%가 "~부터/이후" 형식 — 폼 placeholder가 그 형식을 유도한다).
// ⚠️ 하한은 **표시만** 한다 — 판정(calcTimeOverlap)은 건드리지 않는다. 사람이 보고 조정할 정보이지
//    자동 탈락 사유가 아니다. 34건 전수 + 오전 방어 케이스로 32/32 정확, 초과추출 0.
function noteEarliest(notes) {
  var s = String(notes || '').replace(/\[시간참고\]|\[원본시간\]/g, '').replace(/\s+/g, '');
  var m = s.match(/(오전|오후)?(\d{1,2})\s*(?::|시)\s*(반|\d{1,2})?\s*분?\s*(?:정도|쯤|경)?\s*(?:이후|부터|이상)/);
  if (!m) return '';
  var h = parseInt(m[2], 10);
  var mi = m[3] === '반' ? 30 : (m[3] ? parseInt(m[3], 10) : 0);
  if (isNaN(h) || h > 23 || mi > 59) return '';
  if (h < 12 && m[1] !== '오전') h += 12;   // 방문 시간대가 14~20시라 12 미만은 오후로 읽는다('오전' 명시만 예외)
  return (h < 10 ? '0' : '') + h + ':' + (mi < 10 ? '0' : '') + mi;
}
function earlyBadge(notes) {
  var e = noteEarliest(notes);
  return e ? '<span class="iw-hint">' + e + '부터</span>' : '';
}

function calcTimeOverlap(childTimes, provAvail) {
  if (!childTimes || !provAvail || !/[월화수목금토일]-\d/.test(childTimes)) {
    return { count: -1, label: '시간 비교 불가' };
  }

  var childSlots = childTimes.split(',').map(function(s) {
    s = s.trim();
    var p = s.split('-');
    return { day: p[0], hour: parseInt(p[1]) };
  });

  var overlapping = [];
  var daySet = {};
  var knownDays = 0;   // 아동이 원한 요일 중 교사 가용시간이 **실제로 읽힌** 요일 수

  childSlots.forEach(function(slot) {
    var availRange = provAvail[slot.day];
    if (!availRange) return;
    var m = availRange.match(/(\d{1,2}):?(\d{2})?\s*[-~]\s*(\d{1,2}):?(\d{2})?/);
    if (!m) return;
    knownDays++;
    var start = parseInt(m[1]);
    var end = parseInt(m[3]);
    if (slot.hour >= start && slot.hour < end) {
      overlapping.push(slot);
      daySet[slot.day] = 1;
    }
  });

  // 읽힌 요일이 하나도 없으면 '안 맞는다'가 아니라 **'모른다'**이다.
  // ⚠️ 06 제공인력 F~L 가용시간은 죽은 데이터다 (2026-08-07 실측: 21명 중 19명이 실제 수업시간과 불일치, 빈칸 다수).
  //    옛 코드는 이 경우도 count=0을 냈고 getRecommendations가 count===0인 교사를 통째로 제외해서,
  //    **가용시간이 비었거나 표기를 못 읽는 교사는 배정 추천에 영영 뜨지 않았다** (화면엔 '시간 불일치'라는 확신에 찬 오답).
  //    -1로 빼면 추천에는 남고 score +5 페널티만 받는다 = 사람이 보고 판단할 기회가 생긴다.
  if (knownDays === 0) return { count: -1, label: '가용시간 미기록' };

  if (overlapping.length === 0) return { count: 0, label: '시간 불일치' };

  var days = Object.keys(daySet);
  return {
    count: overlapping.length,
    label: days.join('') + ' 겹침'
  };
}

// ══ 배정 확인 다이얼로그 (요일·시각 같이) ══
// ⚠️ 배정 추천(doAssignTo)과 제공인력 선택 배정(doAssign)이 **같은 다이얼로그**를 쓴다 —
//    한쪽만 고치면 다른 쪽에 확정 시각이 안 남아 이중배정 구멍이 그대로 남는다.
var _asgCtx = null, _asgPick = null, _asgDay = null, _asgHour = null;
var ASG_DAYS = ['월','화','수','목','금','토'];
var ASG_HOURS = [14,15,16,17,18,19,20];

function askAssignSchedule(row, provName, childName, times) {
  _asgCtx = { row: row, prov: provName, child: childName, times: times };
  _asgPick = null; _asgDay = null; _asgHour = null;

  document.getElementById('asgTitle').textContent = '배정하기';
  // ⚠️ 추천은 상위 3명뿐이라 원하는 선생님이 없을 수 있다. 예전엔 좌상단 드롭다운을 바꾸고
  //    지도가 통째로 갈아엎어진 뒤 아동을 다시 찾아야 했다(유성 지적) ⇒ 여기서 바로 고른다.
  _asgFillProviders(row, provName, childName);
  document.getElementById('asgSub').textContent = (childName || (row + '행 아동')) + ' · ' + currentService;

  // 아동이 체크한 칸을 버튼으로. 누르기만 하면 되니 오타·형식 사고가 없다.
  var wrap = document.getElementById('asgSlots');
  var list = String(times || '').split(',').map(function(x){return x.trim()}).filter(Boolean);
  if (!list.length) {
    wrap.innerHTML = '<span style="font-size:13px;color:#8b95a1">희망시간이 비어 있습니다 — 아래에서 직접 고르세요</span>';
    asgToggleMore(true);
  } else {
    wrap.innerHTML = list.map(function(t){
      var p = t.split('-'), h = parseInt(p[1],10);
      if (!p[0] || isNaN(h)) return '';
      var lab = p[0] + ' ' + h + ':00';
      return '<button class="asg-slot" data-d="'+p[0]+'" data-h="'+h+'" onclick="asgPick(this)">'+lab+'</button>';
    }).join('');
    document.getElementById('asgMore').style.display = 'none';
    document.getElementById('asgMoreBtn').textContent = '그 외 시간 고르기 ▾';
  }

  document.getElementById('asgDays').innerHTML = ASG_DAYS.map(function(d){
    return '<button class="asg-slot" data-d="'+d+'" onclick="asgPickDay(this)">'+d+'</button>'; }).join('');
  document.getElementById('asgHours').innerHTML = ASG_HOURS.map(function(h){
    return '<button class="asg-slot" data-h="'+h+'" onclick="asgPickHour(this)">'+h+'시</button>'; }).join('');

  document.getElementById('asgNote').innerHTML = '';
  document.getElementById('asgOk').disabled = true;
  document.getElementById('asgModal').style.display = 'flex';
}
/**
 * 다이얼로그의 선생님 드롭다운을 채운다.
 * 정렬 = 배정 추천과 **같은 기준**(거리 + 시간 안 맞으면 페널티) → 위 3명이 곧 추천 3명이라 둘이 따로 놀지 않는다.
 * 각 항목에 거리·시간겹침을 붙여 30명 중에서도 근거를 보고 고를 수 있게 한다.
 * ⚠️ 가용시간이 비어 판정 불가면 '가용시간 미기록'으로 뜬다 — 그 선생님이 안 되는 게 아니라 **모르는 것**이다.
 */
function _asgFillProviders(row, preferName, childName) {
  var sel = document.getElementById('asgProvSelect');
  var child = _findChildByRow(row);
  var list = (providerList || []).slice();

  var scored = list.map(function(p) {
    var d = (child && child.lat && p.lat) ? haversine(child.lat, child.lng, p.lat, p.lng) : null;
    var t = (child && child.times) ? calcTimeOverlap(child.times, p.avail) : { count: -1, label: '' };
    return { name: p.name, dist: d, tLabel: t.label, tCount: t.count,
             score: (d == null ? 99 : d) + (t.count > 0 ? 0 : 5) };
  });
  scored.sort(function(a, b) { return a.score - b.score; });

  sel.innerHTML = scored.map(function(x) {
    var bits = [];
    if (x.dist != null) bits.push(fmtDist(x.dist));
    if (x.tLabel) bits.push(x.tLabel);
    return '<option value="' + escQ(x.name) + '">' + esc(x.name) + (bits.length ? ' · ' + bits.join(' · ') : '') + '</option>';
  }).join('');

  if (preferName) sel.value = preferName;
  if (!sel.value && scored.length) sel.value = scored[0].name;
  _asgCtx.prov = sel.value;
}

function asgProvChanged() {
  var sel = document.getElementById('asgProvSelect');
  if (_asgCtx) _asgCtx.prov = sel.value;
}

function asgClose(){ document.getElementById('asgModal').style.display='none'; _asgCtx=null; }
function asgToggleMore(force){
  var m = document.getElementById('asgMore'), b = document.getElementById('asgMoreBtn');
  var open = force === true ? true : (m.style.display === 'none');
  m.style.display = open ? '' : 'none';
  b.textContent = open ? '접기 ▴' : '그 외 시간 고르기 ▾';
}
function _asgClear(sel){ Array.prototype.forEach.call(document.querySelectorAll(sel), function(b){ b.classList.remove('on'); }); }
function asgPick(btn){
  _asgClear('#asgSlots .asg-slot'); _asgClear('#asgDays .asg-slot'); _asgClear('#asgHours .asg-slot');
  btn.classList.add('on');
  _asgPick = { day: btn.dataset.d, hour: Number(btn.dataset.h) };
  _asgDay = null; _asgHour = null;
  _asgSync();
}
function asgPickDay(btn){ _asgClear('#asgDays .asg-slot'); _asgClear('#asgSlots .asg-slot');
  btn.classList.add('on'); _asgDay = btn.dataset.d; _asgPick = null; _asgSync(); }
function asgPickHour(btn){ _asgClear('#asgHours .asg-slot'); _asgClear('#asgSlots .asg-slot');
  btn.classList.add('on'); _asgHour = Number(btn.dataset.h); _asgPick = null; _asgSync(); }
function _asgSync(){
  var d = _asgPick ? _asgPick.day : _asgDay, h = _asgPick ? _asgPick.hour : _asgHour;
  var ok = !!(d && h != null);
  document.getElementById('asgOk').disabled = !ok;
  // 아동이 체크하지 않은 칸을 고르면 알린다 — 막지는 않는다(조율해서 정한 시간일 수 있다)
  var note = document.getElementById('asgNote');
  if (ok && !_asgPick) {
    note.innerHTML = '<div class="asg-note">학부모가 체크하지 않은 시간입니다. 조율해서 정하신 시간이면 그대로 진행하세요.</div>';
  } else note.innerHTML = '';
}
function asgConfirm(){
  if (!_asgCtx) return;
  var d = _asgPick ? _asgPick.day : _asgDay, h = _asgPick ? _asgPick.hour : _asgHour;
  if (!d || h == null) return;
  var row = _asgCtx.row;
  var prov = document.getElementById('asgProvSelect').value || _asgCtx.prov;
  if (!prov) { showToast('선생님을 고르세요'); return; }
  var time = (h < 10 ? '0' : '') + h + ':00';
  asgClose();
  showLoading(true); infoWindow.close();
  fetchGAS('assign', { row: row, provider: prov, service: currentService, ctx: _ctxKeyName(), day: d, time: time })
    .then(function(res) {
      showLoading(false);
      if (res.error) {
        // 서버가 스택을 같이 보낸다(인증된 액션 한정). 안 보여주면 또 "서버 오류"만 남고
        // 어느 줄에서 죽었는지 모른 채 추측하게 된다(2026-08-09).
        showToast(res.error + (res.stack ? '  ⟨' + res.stack + '⟩' : ''));
        if (window.console) console.log('[assign 오류]', JSON.stringify(res));
        return;
      }
      // 🔴 **서버가 "썼다"고 말할 때만 완료라고 말한다** (2026-08-09 유성:
      //    *"이 시간으로 배정을 눌렀는데 왜 계속 스케줄 미정이냐"*).
      //    옛 코드는 `res.stamped`를 **한 번도 안 보고** 무조건 *"화 17:00 시간 기록 완료!"*를 띄웠다.
      //    S·T가 안 써진 경우에도 성공이라 말하니, 화면이 안 바뀌는 게 버그로 보이고
      //    새로고침해도 그대로였다(시트에 애초에 없으니까). **화면이 거짓말을 하면 진단이 불가능해진다.**
      if (res.stamped) {
        showToast(prov + ' · ' + d + ' ' + time
          + (res.mode === 'time' ? ' 시간 기록 완료!' : ' 배정 완료!'), true);
      } else {
        // 🔴 서버가 **쓰고 나서 다시 읽은 결과**를 그대로 보여준다. 어디에 썼는지·무엇이 읽혔는지를
        //    사람이 볼 수 있어야 "성공이라는데 시트는 그대로"를 진단할 수 있다(2026-08-09).
        var v = res.verify;
        showToast('⚠️ 기록 실패 — ' + (v
          ? v.ss + ' / ' + v.tab + ' ' + v.row + '행(' + v.nameAtRow + ', Q=' + v.qAtRow + ')'
            + ' · 쓴값 ' + v.wrote.join(' ') + ' · 되읽음 [' + v.readback.join(', ') + ']'
            + ' · 마지막행 ' + v.lastRow
          : (res.row || '?') + '행 · 보낸값 ' + d + ' ' + time + ' · verify 없음(구 서버)'));
        if (window.console) console.log('[assign 실패 진단]', JSON.stringify(res));
      }
      // 🔴 **지도는 언제나 갱신한다** (2026-08-09 유성: *"요일·시간을 확정했는데 즉시 반영되지 않음"*).
      //    옛 코드는 배치안 시트가 열려 있으면 `_planRefetch()`만 부르고 `_afterWrite`를 건너뛰었다.
      //    배치안 시트는 **논모달**이라 열어둔 채 지도 말풍선을 만질 수 있다 → 그 경로로 확정하면
      //    지도가 한 번도 다시 그려지지 않아 「스케줄 미정」이 그대로 남았다.
      // 🔴 게다가 `_planRefetch(ok)`는 **콜백을 받는 함수**인데 여기서만 인자 없이 불렀다 →
      //    `ok(...)`가 `.then` 안에서 TypeError를 내고, 그 throw가 promise 체인에 삼켜져
      //    **배치안도 안 바뀌고 에러도 안 뜨는** 완전 무반응이 됐다. 호출부가 둘인데 한쪽만 규약을 어겼다.
      _afterWrite(res);
      // 🔴 **응답이 방금 쓴 값을 실제로 담고 있는지 확인한다.** 안 담겼으면 서버가 쓰기 이전 상태를
      //    읽었다는 뜻이므로 한 번 더 읽는다. 왕복 1회를 더 쓰더라도, 화면이 시트와 어긋난 채
      //    남아 사람이 "안 눌렸나?" 하고 다시 누르는 것보다 낫다.
      if (res.stamped) {
        var _w = ((res.map && res.map.assigned) || []).filter(function(x) {
          return Number(x.formRow) === Number(row); })[0];
        if (!_w || String(_w.confirmedDay || '') !== d || String(_w.confirmedTime || '') !== time) {
          reloadCurrent(true);
        }
      }
      if (PLAN) { planDirty = false; _planRefetch(_planApplyRefresh); }
    }).catch(function(e) { showLoading(false); showToast('배정 실패: '+e.message); });
}

/**
 * 이미 배정된 아이의 **요일·시각만** 기록한다(같은 선생님 → 서버가 S·T만 쓴다).
 * 새 다이얼로그를 만들지 않는다 — Q·R·S·T를 쓰는 정본 경로가 둘이 되면 다시 어긋난다(0-9).
 */
function setChildTime(formRow) {
  var c = _findChildByRow(formRow);
  var prov = (c && c.assignedTo) || document.getElementById('providerSelect').value;
  askAssignSchedule(formRow, prov || '', c && c.name, c && c.times);
}

// 배정 추천에서 (아동 인포윈도우 → 추천 목록 → 배정)
function doAssignTo(row, provName) {
  var c = _findChildByRow(row);
  askAssignSchedule(row, provName, c && c.name, c && c.times);
}

// ══ 배정 처리 ══ (제공인력을 고른 상태에서 아동 인포윈도우의 배정 버튼)
function doAssign(row) {
  // ⚠️ 예전엔 좌상단에서 선생님을 안 고르면 막았다. 이제 다이얼로그 안에서 고를 수 있으므로 그대로 연다
  //    — '전체' 보기 상태에서도 아동을 눌러 바로 배정할 수 있다(지도를 갈아엎고 아동을 다시 찾을 필요 없음).
  var prov = document.getElementById('providerSelect').value;
  var c = _findChildByRow(row);
  askAssignSchedule(row, prov || '', c && c.name, c && c.times);
}

/** 행번호로 현재 화면 데이터에서 아동을 찾는다 (희망시간을 버튼으로 띄우려고) */
function _findChildByRow(row) {
  if (!currentData) return null;
  var pools = [currentData.waiting || [], currentData.assigned || []];
  for (var i = 0; i < pools.length; i++)
    for (var j = 0; j < pools[i].length; j++)
      // 배정 아동의 행번호 키는 `formRow`다 — `row`만 보면 배정된 아이를 영영 못 찾는다
      if (Number(pools[i][j].row || pools[i][j].formRow) === Number(row)) return pools[i][j];
  return null;
}

// ── 중앙 확인 다이얼로그(§4.4) — 크롬 confirm() 대체(유성 2026-08-10). 파괴적 액션이면 danger=true(우측 버튼 빨강) ──
var _cmEl = null, _cmOk = null;
function iwConfirm(title, sub, okLabel, danger, onOk) {
  if (!_cmEl) {
    _cmEl = document.createElement('div');
    _cmEl.id = 'cmDim';
    _cmEl.innerHTML = '<div class="cmodal"><div class="cm-t"></div><div class="cm-s"></div>'
      + '<div class="cm-btns"><button class="cm-btn" id="cmClose">닫기</button>'
      + '<button class="cm-btn primary" id="cmGo"></button></div></div>';
    document.body.appendChild(_cmEl);
    document.getElementById('cmClose').addEventListener('click', function(){ _cmEl.classList.remove('show'); _cmOk = null; });
    document.getElementById('cmGo').addEventListener('click', function(){ _cmEl.classList.remove('show'); var f = _cmOk; _cmOk = null; if (f) f(); });
  }
  _cmEl.querySelector('.cm-t').textContent = title;
  _cmEl.querySelector('.cm-s').textContent = sub || '';
  var go = document.getElementById('cmGo');
  go.textContent = okLabel || '확인';
  go.classList.toggle('danger', !!danger);
  _cmOk = onOk;
  _cmEl.classList.add('show');
}

// 대기 아동 이름·행 표기(모달 부제용)
function _cmWho_(row) {
  var c = _findChildByRow(row);
  return (c && c.name ? c.name + ' · ' : '') + row + '행';
}

// 상태 변경 낙관 반영 — 거절·부재2는 지도에서 빠지고, 부재1은 뱃지만 바뀐다. 반환 = 되돌리기.
function _optimisticStatus(row, status) {
  if (!currentData || !currentData.waiting) return null;
  var idx = -1;
  for (var i = 0; i < currentData.waiting.length; i++)
    if (Number(currentData.waiting[i].row) === Number(row)) { idx = i; break; }
  if (idx < 0) return null;
  var prevList = currentData.waiting;
  var c = prevList[idx], prevStatus = c.status;
  if (status === '거절' || status === '부재2') {
    currentData.waiting = prevList.slice(0, idx).concat(prevList.slice(idx + 1));
  } else {
    c.status = status;
  }
  _renderCurrent();
  return function undo() { c.status = prevStatus; currentData.waiting = prevList; _renderCurrent(); };
}

function doStatus(row, status) {
  var isRej = status === '거절';
  iwConfirm(isRej ? '거절로 처리할까요?' : status + '로 처리할까요?',
    _cmWho_(row) + (isRej ? ' — 지도에서 빠져요' : ''),
    isRej ? '거절하기' : '처리하기', true, function(){
    infoWindow.close();
    var undo = _optimisticStatus(row, status);   // 화면 먼저(대기 0초), 서버는 뒤에서(유성 2026-08-10 로딩 최적화)
    if (!undo) showLoading(true);
    fetchGAS('status', { row: row, status: status, service: currentService, ctx: _ctxKeyName() }).then(function(res) {
      showLoading(false);
      if (res.error) { if (undo) undo(); showToast(res.error); return; }
      showToast((isRej ? '거절' : status) + ' 처리 완료', true);
      _afterWrite(res);
    }).catch(function(e) { showLoading(false); if (undo) undo(); showToast('처리 실패: '+e.message); });
  });
}

function doAbsent(row, currentStatus) {
  var next = (currentStatus === '부재1') ? '부재2' : '부재1';
  iwConfirm(next === '부재2' ? '부재2로 기록할까요?' : '부재로 기록할까요?',
    _cmWho_(row) + (next === '부재2' ? ' — 이후 검색에서 빠져요' : ''),
    '기록하기', false, function(){
    infoWindow.close();
    var undo = _optimisticStatus(row, next);
    if (!undo) showLoading(true);
    fetchGAS('status', { row: row, status: next, service: currentService, ctx: _ctxKeyName() }).then(function(res) {
      showLoading(false);
      if (res.error) { if (undo) undo(); showToast(res.error); return; }
      showToast(next + ' 기록 완료', true);
      _afterWrite(res);
    }).catch(function(e) { showLoading(false); if (undo) undo(); showToast('처리 실패: '+e.message); });
  });
}

function doUnassign(row) {
  iwConfirm('배정을 취소할까요?', _cmWho_(row) + ' — 대기로 돌아가요', '배정 취소하기', true, function(){
    infoWindow.close();
    // 먼저 화면에 반영하고(대기 0초) 서버 왕복은 뒤에서 확정한다. undo가 null이면 낙관 반영 불가 → 옛 로딩바 경로.
    var undo = _optimisticUnassign(row);
    if (!undo) showLoading(true);
    fetchGAS('unassign', { row: row, service: currentService, ctx: _ctxKeyName() }).then(function(res) {
      showLoading(false);
      if (res.error) { if (undo) undo(); showToast(res.error); return; }
      showToast('배정 취소됨', true);
      _afterWrite(res);
    }).catch(function(e) { showLoading(false); if (undo) undo(); showToast('처리 실패: '+e.message); });
  });
}

// 마크 토글 (북마크 버튼) — 확인창 없음(가벼운 개인 뷰 토글).
// 낙관 반영(유성 2026-08-10 "해제 로딩이 너무 오래"): 결과가 결정적(marked 뒤집기)이라 화면 먼저(대기 0초),
// 서버는 뒤에서 확정. doUnassign과 같은 패턴 — undo 실패 시에만 옛 로딩바 경로.
function doMark(row, on) {
  infoWindow.close();
  var undo = _optimisticMark(row, on);
  if (!undo) showLoading(true);
  fetchGAS('mark', { row: row, on: on ? '1' : '0', service: currentService, ctx: _ctxKeyName() }).then(function(res) {
    showLoading(false);
    if (res.error) { if (undo) undo(); showToast(res.error); return; }
    showToast(on ? '마크됨' : '마크 해제', true);
    _afterWrite(res);
  }).catch(function(e) { showLoading(false); if (undo) undo(); showToast('처리 실패: '+e.message); });
}

// 마크 낙관 반영 — 대상 아동의 marked만 뒤집고 즉시 재렌더. 반환 = 되돌리기 함수.
function _optimisticMark(row, on) {
  var c = _findChildByRow(row);
  if (!c) return null;
  var prev = !!c.marked;
  c.marked = !!on;
  _renderCurrent();
  return function undo() { c.marked = prev; _renderCurrent(); };
}

var _copyData = [];
function registerCopyData(c) {
  var idx = _copyData.length;
  _copyData.push(c);
  return idx;
}

function doCopy(idx) {
  var c = _copyData[idx];
  if (!c) { showToast('복사 실패'); return; }
  var lines = ['신청폼-오감', c.name || ''];
  if (c.address) lines.push(c.address);
  if (c.times) lines.push(fmtTimes(c.times));
  if (c.phone) lines.push(fmtPhone(c.phone));
  if (c.notes) lines.push(c.notes);
  if (c.voucher) lines.push('바우처: ' + c.voucher);
  var text = lines.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ showToast('복사됨', true); });
  } else {
    var ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); showToast('복사됨', true);
  }
}

function reloadCurrent(keepView) {
  if (MODE === 'basic') { loadBasicMap(keepView); return; }
  if (MODE === 'provider') { loadStaffMap(keepView); return; }
  var sel = document.getElementById('providerSelect').value;
  if (sel === '__ALL__') loadAllProviders(keepView);
  else if (sel) loadMapData(sel, keepView);
}

// ══ 쓰기 액션 최적화 (2026-08-05) ══
// 구조: [클릭] → 낙관적 로컬 반영(즉시) → 쓰기 왕복 1회(응답에 최신 지도데이터 동봉) → 같으면 재렌더 생략.
// 옛 구조는 [쓰기 왕복]+[mapdata 왕복] = 왕복 2회(실측 왕복 1회 1.5~2.1초 + 전독 2~5초) = 4~7초 대기였다.

// 지금 보고 있는 지도 컨텍스트 = 캐시 키의 앞부분이자 서버에 보낼 ctx.
function _ctxKeyName() {
  var sel = document.getElementById('providerSelect').value;
  return sel || '__ALL__';
}

// 쓰기는 '한 서비스 탭의 한 행'만 바꾼다 → 다른 서비스(아청심 등) 캐시는 여전히 유효.
// 옛 코드는 _svcCache={}로 전부 날려 서비스 전환 때마다 왕복이 되살아났다.
function _invalidateServiceCache() {
  var suf = '|' + currentService;
  Object.keys(_svcCache).forEach(function(k) {
    if (k.length >= suf.length && k.slice(-suf.length) === suf) delete _svcCache[k];
  });
}

// 렌더에 쓰이는 데이터 전체의 지문. 서버 응답이 낙관 반영값과 완전히 같으면
// 마커 253개를 다시 파괴/생성하지 않는다(= 몇 초 뒤 깜빡임 0).
// 필드를 골라 뽑지 않고 통째로 직렬화한다 — 골라 뽑으면 IW의 메모·전화 같은 변경을 놓쳐
// 옛 화면이 남는다. 서버는 항상 같은 키 순서로 객체를 만들고, 낙관 객체도 그 순서를 그대로 따른다(_optimisticUnassign).
var _sigFailN = 0;
function _renderSig(d) {
  if (!d) return '';
  try { return JSON.stringify([d.provider || null, d.assigned || [], d.waiting || [], d.allProviders || null]); }
  catch (e) { return 'sigfail' + (++_sigFailN); }   // 직렬화 실패 시엔 절대 안 맞음 → 안전하게 재렌더
}
var _lastRenderSig = null;

// currentData를 화면에 반영. __ALL__일 때만 드롭다운 카운트 갱신(개별 모드의 assigned는 그 선생님 것뿐이라 카운트가 틀림).
function _renderCurrent() {
  if (!currentData) return;
  if (_ctxKeyName() === '__ALL__') updateProviderCounts(currentData.assigned);
  renderMarkers(); updateDashboard();
  populateNlFilters(); renderNewList();
  // 🔴 이 한 줄이 없어서 「후보안 뽑기」 버튼이 **영영 안 떴다** — 유일한 호출부가 planExit이라
  //    시트를 나가야만 켜지는데 들어갈 수가 없었다(2026-08-09 검증). 마크·제공인력이 바뀔 때마다 갱신.
  planSyncFab();
  _lastRenderSig = _renderSig(currentData);
}

// 쓰기 성공 후 마무리. 응답에 map이 동봉돼 있으면 그대로 채택(왕복 0),
// 없으면(구 GAS 배포) 기존처럼 재조회 → 배포 순서와 무관하게 안전.
function _afterWrite(res) {
  _invalidateServiceCache();
  // 더 나중 조작이 아직 진행 중이면 이 응답은 그것을 모른다 → 화면 확정은 마지막 응답에 넘긴다.
  // (낙관 반영 덕에 화면엔 이미 두 조작이 다 보이는 상태라 사용자는 기다리는 게 없다)
  if (_writesInFlight > 0) return;
  if (MODE !== 'admin' || !res || !res.map || res.map.error) { reloadCurrent(true); return; }
  var sel = _ctxKeyName();
  var data = res.map;
  if (sel !== '__ALL__') data.allProviders = null;   // loadMapData와 동일 규칙
  _svcCache[sel + '|' + currentService] = data;
  currentData = data;
  if (_renderSig(data) === _lastRenderSig) return;   // 낙관 반영과 동일 → 재렌더 생략
  _renderCurrent();
}

// 배정취소의 결과는 결정적이다(Q=''·R='대기'·S/T=''). 서버를 기다리지 않고 먼저 그린다.
// 반환값 = 되돌리기 함수(실패 시 호출). 대상 아동을 못 찾으면 null → 호출부가 기존 로딩바 경로로 폴백.
function _optimisticUnassign(row) {
  if (!currentData || !currentData.assigned) return null;
  var idx = -1;
  for (var i = 0; i < currentData.assigned.length; i++) {
    if (Number(currentData.assigned[i].formRow) === Number(row)) { idx = i; break; }
  }
  if (idx < 0) return null;

  var prevA = currentData.assigned, prevW = currentData.waiting || [];
  var c = prevA[idx];
  currentData.assigned = prevA.slice(0, idx).concat(prevA.slice(idx + 1));
  currentData.waiting = prevW.concat([{
    row: Number(row), name: c.name, lat: c.lat, lng: c.lng, address: c.address,
    times: c.times, phone: c.phone, notes: c.notes, voucher: c.voucher,
    status: '대기', sigungu: c.sigungu || '', bname: c.bname || '',
    addr1: c.addr1 || '', timestamp: c.timestamp, marked: !!c.marked   // 마크는 배정취소가 지우지 않음(직교)
  }]);
  _renderCurrent();
  return function undo() {
    currentData.assigned = prevA; currentData.waiting = prevW;
    _renderCurrent();
  };
}

function copyProviderLink() {
  var sel = document.getElementById('providerSelect').value;
  if (!sel || sel === '__ALL__') return;

  var url = 'https://think-fact0ry.github.io/saenggak/provider-view.html?t=' + prov.token;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function() { showToast(sel + ' 선생님 지도 링크 복사됨', true); });
  } else {
    var ta = document.createElement('textarea'); ta.value = url;

    document.body.removeChild(ta); showToast(sel + ' 선생님 지도 링크 복사됨', true);
  }
}

var searchMarker = null;
var searchMarkerIW = '';

function clearSearchMarker() {
  if (searchMarker) { searchMarker.setMap(null); searchMarker = null; searchMarkerIW = ''; }
}

function placeSearchMarker(lat, lng, iwContent) {
  clearSearchMarker();
  var pos = new kakao.maps.LatLng(lat, lng);
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="30" viewBox="0 -2 28 30">'
    +'<path d="M14 27C14 27 3 16 3 10A11 11 0 0125 10C25 16 14 27 14 27Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1.3"/>'
    +'<circle cx="14" cy="10" r="4" fill="#fff"/>'
    +'<circle cx="14" cy="10" r="2" fill="#ef4444"/>'
    +'</svg>';
  var img = new kakao.maps.MarkerImage(
    'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),
    new kakao.maps.Size(28,30), {offset: new kakao.maps.Point(14,30)}
  );
  searchMarker = new kakao.maps.Marker({ position:pos, image:img, map:map, zIndex:20 });
  searchMarkerIW = iwContent || '';

  // 검색 마커 클릭 → 저장된 인포윈도우 재열기만 (colocated 머지 없음)
  kakao.maps.event.addListener(searchMarker, 'click', function() {
    if (searchMarkerIW) {
      infoWindow.setContent(searchMarkerIW);
      infoWindow.open(map, searchMarker);
    }
  });

  return searchMarker;
}

// 같은 좌표에 이미 있는 마커 찾기
function findMarkerAt(lat, lng) {
  var found = null;
  markers.forEach(function(m){
    var p = m.getPosition();
    if (Math.abs(p.getLat()-lat) < 0.00001 && Math.abs(p.getLng()-lng) < 0.00001) found = m;
  });
  return found;
}

// ══ 지도 임의 지점 선택 (PC 우클릭 / 모바일 롱프레스) ══
// 임의 위치에 빨간 핀을 찍고 역지오코딩한 주소 + 출발/도착 버튼을 띄운다.
function handleMapPointPick(latlng) {
  if (!latlng || !geocoder) return;
  var lat = latlng.getLat(), lng = latlng.getLng();
  geocoder.coord2Address(lng, lat, function(result, status) {
    var addr = '선택한 지점';
    if (status === kakao.maps.services.Status.OK && result[0]) {
      addr = result[0].road_address ? result[0].road_address.address_name
           : (result[0].address ? result[0].address.address_name : addr);
    }
    addr = shortAddr(addr);  // '인천광역시/인천시' → '인천' 통일(#1)
    // 좌표 줄은 제거. 주소는 word-break:keep-all로 단어 단위 줄바꿈(번지만 떨어지는 것 방지)
    var iw = '<div class="iw"><div class="iw-nm iw-addr">' + esc(addr) + '</div>'
      + routeBtns(addr, lat, lng) + '</div>';
    var sm = placeSearchMarker(lat, lng, iw);  // 검색 핀과 동일(임의 지점 = 빨강)
    infoWindow.setContent(iw);
    infoWindow.open(map, sm);
  });
}

// 주소 앞머리 '인천광역시/인천특별시/인천시' → '인천' 으로 짧게 (UX)
function shortAddr(s) {
  return String(s || '').replace(/^인천(특별시|광역시|시)?\s*/, '인천 ');
}

// 모바일 롱프레스(600ms, 손가락 1개, 이동 10px 미만)를 우클릭처럼 처리.
function setupLongPress(el) {
  var timer = null, sx = 0, sy = 0, moved = false;
  el.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1) { clearTimeout(timer); return; }
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY; moved = false;
    timer = setTimeout(function() {
      if (moved) return;
      var proj = map.getProjection();
      if (!proj || !proj.coordsFromContainerPoint) return;  // 구버전 SDK 방어
      var rect = el.getBoundingClientRect();
      var latlng = proj.coordsFromContainerPoint(new kakao.maps.Point(sx - rect.left, sy - rect.top));
      if (latlng) handleMapPointPick(latlng);
    }, 600);
  }, { passive: true });
  el.addEventListener('touchmove', function(e) {
    if (!e.touches.length) return;
    var t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) { moved = true; clearTimeout(timer); }
  }, { passive: true });
  el.addEventListener('touchend', function() { clearTimeout(timer); });
  el.addEventListener('touchcancel', function() { clearTimeout(timer); });
}

(function(){
  var input = document.getElementById('searchInput');
  var results = document.getElementById('searchResults');
  var debounce;

  input.addEventListener('input', function() {
    clearTimeout(debounce);
    debounce = setTimeout(function(){ doSearch(input.value.trim()); }, 250);
  });

  input.addEventListener('focus', function() {
    if (input.value.trim()) doSearch(input.value.trim());
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-wrap')) results.classList.remove('show');
  });

  function doSearch(q) {
    if (!q) { results.classList.remove('show'); return; }

    // 쿼리 분석
    var digitsOnly = q.replace(/\D/g, '');
    var isNumericQuery = digitsOnly.length > 0 && q.replace(/[\s\-0-9]/g, '') === '';

    var html = '';
    var childResults = [];

    // ── 아동 매칭 (이름 OR 전화번호) ──
    if (currentData) {
      var all = [];
      if (currentData.assigned) {
        currentData.assigned.forEach(function(c) {
          all.push({ name: c.name, phone: c.phone||'', lat: c.lat, lng: c.lng, status: c.assignedTo ? c.assignedTo+' 배정' : '배정', type: 'assigned', row: c.formRow, data: c });
        });
      }
      if (currentData.waiting) {
        currentData.waiting.forEach(function(c) {
          all.push({ name: c.name, phone: c.phone||'', lat: c.lat, lng: c.lng, status: '대기', type: 'waiting', row: c.row, data: c });
        });
      }

      if (isNumericQuery && digitsOnly.length >= 2) {
        // 전화번호 매칭: 저장된 phone에서 숫자만 뽑아 'contains' 검사
        // 뒷자리만 입력해도 매칭되게 (예: "4565" → 010-1234-4565 매칭)
        childResults = all.filter(function(item) {
          if (!item.phone) return false;
          var p = String(item.phone).replace(/\D/g, '');
          return p.indexOf(digitsOnly) >= 0;
        });
      } else {
        // 이름 매칭 (기존 동작)
        childResults = all.filter(function(item) { return item.name && item.name.indexOf(q) >= 0; });
      }
    }

    if (childResults.length) {
      var headerLabel = isNumericQuery ? '전화번호 일치' : '아동';
      html += '<div style="padding:6px 10px;font-size:10px;color:#999;font-weight:600;border-bottom:1px solid #eee">'+headerLabel+'</div>';
      childResults.slice(0, 8).forEach(function(item, idx) {
        var stClass = item.type === 'assigned' ? 'assigned' : 'waiting';
        // 전화번호 검색이면 뒷자리 강조
        var phoneDisplay = esc(fmtPhone(item.phone));
        if (isNumericQuery && digitsOnly.length >= 2) {
          var rawPhone = String(item.phone || '').replace(/\D/g, '');
          var matchIdx = rawPhone.indexOf(digitsOnly);
          if (matchIdx >= 0) {
            // 원본 포맷된 번호에서 숫자 위치 계산해 하이라이트
            var formattedDisplay = fmtPhone(item.phone);
            var digitCount = 0;
            var startIdx = -1, endIdx = -1;
            for (var k = 0; k < formattedDisplay.length; k++) {
              if (/\d/.test(formattedDisplay[k])) {
                if (digitCount === matchIdx) startIdx = k;
                if (digitCount === matchIdx + digitsOnly.length - 1) { endIdx = k + 1; break; }
                digitCount++;
              }
            }
            if (startIdx >= 0 && endIdx > startIdx) {
              phoneDisplay = esc(formattedDisplay.substring(0, startIdx))
                + '<b style="color:#166841">' + esc(formattedDisplay.substring(startIdx, endIdx)) + '</b>'
                + esc(formattedDisplay.substring(endIdx));
            }
          }
        }
        html += '<div class="sr-item sr-child" data-cidx="'+idx+'">'
          + '<div class="sr-name">' + esc(item.name) + '</div>'
          + '<div class="sr-phone">' + phoneDisplay + '</div>'
          + '<div class="sr-status ' + stClass + '">' + esc(item.status) + '</div>'
          + '</div>';
      });
    }

    // ── 주소 검색 (services.Places 사용) — 숫자만 입력된 경우는 건너뜀 ──
    var isAddr = false;
    if (!isNumericQuery) {
      isAddr = q.length >= 2 && /[가-힣]/.test(q) && !childResults.length;
      if (!isAddr && q.length >= 2 && /\d/.test(q)) isAddr = true;
      if (!isAddr && !childResults.length && q.length >= 2) isAddr = true;
    }

    if (isAddr && placesService) {
      html += '<div style="padding:6px 10px;font-size:10px;color:#999;font-weight:600;border-bottom:1px solid #eee">📍 주소 검색 중...</div>';
      results.innerHTML = html;
      results.classList.add('show');

      placesService.keywordSearch(q, function(data, status) {
        var addrHtml = '';
        if (status === kakao.maps.services.Status.OK && data.length) {
          addrHtml += '<div style="padding:6px 10px;font-size:10px;color:#999;font-weight:600;border-bottom:1px solid #eee">📍 주소</div>';
          data.slice(0, 5).forEach(function(doc) {
            addrHtml += '<div class="sr-item sr-addr" data-lat="'+doc.y+'" data-lng="'+doc.x+'" data-name="'+esc(doc.place_name || doc.address_name)+'">'
              + '<div class="sr-name" style="min-width:auto">'+esc(doc.place_name || '')+'</div>'
              + '<div class="sr-phone" style="flex:1">'+esc(doc.road_address_name || doc.address_name || '')+'</div>'
              + '</div>';
          });
        } else {
          addrHtml += '<div class="sr-none">주소 검색 결과 없음</div>';
        }

        var childHtml = '';
        if (childResults.length) {
          childHtml += '<div style="padding:6px 10px;font-size:10px;color:#999;font-weight:600;border-bottom:1px solid #eee">아동</div>';
          childResults.slice(0, 5).forEach(function(item, idx) {
            var stClass = item.type === 'assigned' ? 'assigned' : 'waiting';
            childHtml += '<div class="sr-item sr-child" data-cidx="'+idx+'">'
              + '<div class="sr-name">' + esc(item.name) + '</div>'
              + '<div class="sr-phone">' + esc(fmtPhone(item.phone)) + '</div>'
              + '<div class="sr-status ' + stClass + '">' + esc(item.status) + '</div>'
              + '</div>';
          });
        }

        results.innerHTML = childHtml + addrHtml;
        results.classList.add('show');
        bindResultClicks(childResults);
      });
      return;
    }

    if (!html) {
      html = '<div class="sr-none">검색 결과 없음</div>';
    }

    results.innerHTML = html;
    results.classList.add('show');
    bindResultClicks(childResults);
  }

  function bindResultClicks(childResults) {
    // 아동 클릭
    results.querySelectorAll('.sr-child').forEach(function(el) {
      el.addEventListener('click', function() {
        var idx = parseInt(this.getAttribute('data-cidx'));
        var item = childResults[idx];
        if (!item || !item.lat || !item.lng) return;
        map.setCenter(new kakao.maps.LatLng(item.lat, item.lng));
        map.setLevel(3);
        var iwContent = item.type === 'assigned'
          ? buildGroupedAssignedIW([item.data], currentData.provider.lat, currentData.provider.lng)
          : buildGroupedWaitingIW([item.data], currentData.provider.lat, currentData.provider.lng);

        // 이미 같은 좌표에 지도 마커가 있으면 거기서 열기 (중복 방지)
        var existing = findMarkerAt(item.lat, item.lng);
        if (existing) {
          clearSearchMarker();
          infoWindow.setContent(iwContent);
          infoWindow.open(map, existing);
        } else {
          var sm = placeSearchMarker(item.lat, item.lng, iwContent);
          infoWindow.setContent(iwContent);
          infoWindow.open(map, sm);
        }

        results.classList.remove('show');
        input.value = item.name;
      });
    });

    // 주소 클릭
    results.querySelectorAll('.sr-addr').forEach(function(el) {
      el.addEventListener('click', function() {
        var lat = parseFloat(this.getAttribute('data-lat'));
        var lng = parseFloat(this.getAttribute('data-lng'));
        var name = this.getAttribute('data-name');
        if (!lat || !lng) return;
        map.setCenter(new kakao.maps.LatLng(lat, lng));
        map.setLevel(3);
        var iwContent = '<div class="iw"><div class="iw-nm iw-addr">'+esc(name)+'</div>'
          + routeBtns(name, lat, lng)
          + '</div>';

        // 주소 검색도 같은 처리 (아주 드물지만 우연히 좌표가 같을 수 있으니)
        var existing = findMarkerAt(lat, lng);
        if (existing) {
          clearSearchMarker();
          infoWindow.setContent(iwContent);
          infoWindow.open(map, existing);
        } else {
          var sm = placeSearchMarker(lat, lng, iwContent);
          infoWindow.setContent(iwContent);
          infoWindow.open(map, sm);
        }

        results.classList.remove('show');
        input.value = name;
      });
    });
  }
})();

function parseTimestamp(t) {
  if (!t) return 0;
  if (t instanceof Date) return t.getTime();
  var d = new Date(t);
  return isNaN(d.getTime()) ? 0 : d.getTime();
}

function fmtRelativeDate(ts) {
  if (!ts) return '';
  var diff = Date.now() - ts;
  var days = Math.floor(diff / 86400000);
  if (days === 0) return '오늘';
  if (days === 1) return '어제';
  if (days < 7) return days + '일 전';
  var d = new Date(ts);
  return (d.getMonth() + 1) + '/' + d.getDate();
}

      absent: (st === '부재1' || st === '부재2') ? st : '', marked: !!c.marked,
      row: c.row, timestamp: c.timestamp, data: c
    });
  });

  totalEl.textContent = all.length + '건';
  badgeEl.textContent = all.length;

  // 필터
  var sg = document.getElementById('nlSigungu').value;

  // 정렬
  if (nlSort === 'near' && map) {
    var c = map.getCenter();
    var cLat = c.getLat(), cLng = c.getLng();
    filtered.forEach(function(item) {
      item._dist = (item.lat && item.lng) ? haversine(cLat, cLng, item.lat, item.lng) : Infinity;
    });
    filtered.sort(function(a, b) { return a._dist - b._dist; });
  } else {
    // 최신순 = 시트 행 순서(아래일수록 최신). A열 타임스탬프는 신청폼 수정 시에도 고정이라
    // 못 쓰고(수정 행은 A열 유지한 채 맨 아래로 이동), 실제 최신성은 행 위치가 진실.
    // 표시용 날짜(fmtRelativeDate)는 여전히 A열 timestamp를 씀(접수일 표기는 그대로).
    filtered.sort(function(a, b) { return (b.row || 0) - (a.row || 0); });
  }

  countEl.textContent = filtered.length + '건 (필터)';

  if (filtered.length === 0) {
    list.innerHTML = '<div class="nl-empty">해당 조건의 신청이 없습니다</div>';
    return;
  }

  var html = '';
  filtered.forEach(function(item, idx) {
    var ts = parseTimestamp(item.timestamp);
    var dateStr = fmtRelativeDate(ts);
    var distStr = '';
    if (nlSort === 'near' && item._dist !== Infinity) {
      distStr = '<span class="nl-item-dist">' + fmtDist(item._dist) + '</span>';
    }
    html += '<div class="nl-item" data-idx="' + idx + '">'
      + '<div class="nl-item-row1">'
      +   '<div class="nl-item-name">' + esc(item.name) + '</div>'
      +   '<span class="nl-item-badge ' + item.statusType + '">' + esc(item.status) + '</span>'
      +   (item.absent ? '<span class="nl-item-badge absent">' + esc(item.absent) + '</span>' : '')
      +   (item.marked ? '<span class="nl-item-badge mark">마크</span>' : '')
      +   (dateStr ? '<span class="nl-item-date">' + dateStr + '</span>' : '')
      + '</div>'
      + '<div class="nl-item-row2">'
      +   distStr
      +   '<span>' + esc(item.sigungu) + (item.bname ? ' · ' + esc(item.bname) : '') + '</span>'
      + '</div>'
      + '</div>';
  });
  list.innerHTML = html;

  // 클릭 핸들러
  list.querySelectorAll('.nl-item').forEach(function(el) {
    el.addEventListener('click', function() {
      var idx = parseInt(this.getAttribute('data-idx'));
      var item = filtered[idx];
      if (!item || !item.lat || !item.lng) { showToast('좌표 없음'); return; }

      var pos = new kakao.maps.LatLng(item.lat, item.lng);

      if (nlSort === 'near') {
        // 가까운순: 보고 있는 맥락 유지. viewport 안이면 카메라 고정, 밖이면 center만 이동(zoom 유지)
        var bounds = map.getBounds();
        if (!bounds.contain(pos)) {
          map.setCenter(pos);
        }
        // zoom은 절대 건드리지 않음
      } else {
        // 최신순: 점프 후 확대 (기존 동작)
        map.setCenter(pos);
        map.setLevel(3);
      }

      // 기존 마커 찾아서 인포윈도우 열기
      var existing = findMarkerAt(item.lat, item.lng);
      if (existing) {
        kakao.maps.event.trigger(existing, 'click');
      }
    });
  });
}

// 지도 이동 시 가까운순이면 재정렬 (debounce 300ms)
var _zoomSig = null;

function setupMapMoveListener() {
