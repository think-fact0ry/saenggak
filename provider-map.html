}

/* 월 스케줄 버튼 — 배치안 시트가 열려 있으면(원형 '스케줄' 상태) 배치안을 나가고, 어떤 상태든 시트를 연다
   (planExit만 부르면 접힘 기본값이라 알약으로 떨어진다 — "원을 누르면 시트가 서로 전환"이 깨진다) */
function schedPillTap() {
  if (document.getElementById('planSheet').classList.contains('on')) planExit();
  schedOpen();
}

function _planMarkedRows() {
  if (!currentData) return [];
  var out = [];
  // ⚠️ 행번호 키가 다르다: 대기=`row` / **배정=`formRow`**(Code.js). `c.row`만 보면
  //    마크한 배정 아동이 조용히 빠져 FAB 숫자가 지도의 북마크 수와 어긋난다(2026-08-09 검증).
  ['waiting','assigned'].forEach(function(k){
    (currentData[k] || []).forEach(function(c){
      var r = c.row || c.formRow;
      if (c.marked && r) out.push(r); });
  });
  return out;
}

// 🌊 로딩 오버레이 대신 **시트를 먼저 열고 뼈대를 보여준다** (유성 2026-08-09:
//    *"로딩이 꼭 걸려야 하는건지? 로딩 화면 자체를 잠수함 시킬 수는 없는지?"*).
//    전체화면 오버레이는 화면을 통째로 멈추고, 말풍선이 닫히면서 **아무것도 없는 구간**을 만든다.
//    ⚠️ 늦게 온 응답이 이미 닫힌 시트를 되살리면 안 된다 → 요청마다 번호를 매겨 최신 것만 반영한다
//       (26차-10 근태 사고와 같은 부류 — 늦은 응답이 바뀐 상태를 덮는 것).
var planReqId = 0;
function _planSkeleton(title, sub) {
  infoWindow.close();
  schedClose();   // 논모달 시트 2개가 동시에 뜨면 지도가 다 가려진다(docs/4 §6)
  // 옛 동선·요일 버튼을 남기면 뼈대를 보는 동안 지도엔 지난 안이 그려져 있다(전원 화면에서 모드 B로 갈 때 발생)
  planClear();
  document.getElementById('planDays').classList.remove('on');
  document.getElementById('planLg').classList.remove('on');
  document.getElementById('planTitle').textContent = title;
  document.getElementById('planSub').textContent = sub;
  document.getElementById('planSeg').innerHTML = '';
  document.getElementById('planBody').innerHTML =
    '<div class="pskel"></div><div class="pskel"></div><div class="pskel sm"></div>';
  document.getElementById('planSheet').classList.add('on');
  document.getElementById('planFab').classList.remove('on');
  // 월 스케줄 버튼 = 흰 원 '스케줄'로 시트 왼쪽에 — 교사 선택 상태에서만(모드 B·전체 보기엔 월 스케줄이 없다)
  var _sp = document.getElementById('schedPill');
  var _pv = document.getElementById('providerSelect').value;
  if (isAdmin() && _pv && _pv !== '__ALL__') {
    _sp.querySelector('.full').textContent = _pv + '님 월 스케줄';
    _sp.classList.add('on', 'circle', 'beside');
  } else {
    _sp.classList.remove('on', 'circle', 'beside');
  }
}
function _planSkelFail(msg) {
  document.getElementById('planSub').textContent = '';
  document.getElementById('planBody').innerHTML =
      '<div class="pnote bad"><b>후보안을 못 뽑았어요</b><br>' + esc(msg || '') + '</div>'
    + '<button class="pbtn gray" onclick="planExit()">닫기</button>';
}

/**
 * 말풍선에서 바로 그 교사의 배치안으로. 마크가 안 돼 있으면 **그 행을 얹어서** 계산한다
 * (마크 쓰기 응답이 지도에 반영되기를 기다리지 않는다 — 왕복 하나가 통째로 사라진다).
 */
function planFromChild(row, marked) {
  infoWindow.close();
  if (marked) { planOpen(); return; }
  planOpen([Number(row)]);
  fetchGAS('mark', { row: row, on: '1', service: currentService, ctx: _ctxKeyName(), name: _markName(row) })
    .then(function(res) {
      if (res.error) return;
      // ⚠️ 시트가 열린 동안 `_afterWrite`로 지도를 다시 그리면 **검토 중인 마커가 통째로 새로 만들어져**
      //    planDim이 내려둔 회색이 풀린다. 기존 방식대로 dirty만 세우고 나갈 때 한 번 새로고침한다.
      _invalidateServiceCache();
      planDirty = true;
    })
    .catch(function() {});   // 마크는 편의 기록 — 실패해도 이번 배치안 계산은 이미 그 아이를 포함했다
}

function planOpen(extraRows) {
  var prov = document.getElementById('providerSelect').value;
  if (!prov || prov === '__ALL__') { showToast('선생님을 먼저 골라 주세요'); return; }
  var rows = _planMarkedRows();
  if (extraRows) for (var x = 0; x < extraRows.length; x++) {
    if (rows.indexOf(extraRows[x]) < 0) rows.push(extraRows[x]);
  }
  // 마크 0명도 정상 — 서버가 Q열로 그 교사의 주간을 만든다(마크는 "더 넣어볼 후보"일 뿐)

  var my = ++planReqId;
  _planSkeleton(prov + ' 주간 배치안', rows.length ? '후보 ' + rows.length + '명과 함께 계산 중…' : '주간을 불러오는 중…');
  fetchGAS('plans', { provider: prov, rows: rows.join(','), service: currentService, k: 6 })
    .then(function(res) {
      if (my !== planReqId) return;                       // 더 최신 요청이 있다 → 이 응답은 버린다
      if (!document.getElementById('planSheet').classList.contains('on')) return;   // 사용자가 닫았다
      if (res.error) { _planSkelFail(res.error); return; }
      PLAN = res; planCur = 0; planDayF = 'all';
      // 🔴 **계산 당시의 서비스·교사·아동을 박아둔다.** 시트가 열린 채 상단에서 서비스를 바꾸면
      //    행번호는 옛 탭 기준인데 service는 지금 것이 나가 **무관한 아동의 희망시간이 오염**된다
      //    (2026-08-09 검증: 오감 57행 조율 → 아청심 57행 C열에 기록). 교사·rows도 같은 이유.
      PLAN.service = currentService;
      PLAN.rows = rows.slice();
      planTab = 'plans'; planCalcAt = new Date().getTime();
      planQDone = []; planQLog = []; planQMiss = {}; planQPass = {}; planDirty = false;
      planQBuild();
      planRenderSheet();
      _planIntro();
    })
    .catch(function(e) { if (my === planReqId) _planSkelFail(e.message); });
}

function planRenderSheet() {
  if (!PLAN) return;
  document.getElementById('planTitle').textContent = '배치안';
  document.getElementById('planSub').textContent =
    (PLAN.provider ? PLAN.provider.name : '')
    + ' · 마크 ' + ((PLAN.summary && PLAN.summary.requested != null)
                     ? PLAN.summary.requested
                     : (PLAN.diagnostics ? PLAN.diagnostics.totalChildren : 0)) + '명'
    + (PLAN.exact ? ' · 최적 보장' : ' · 추정')
    + (PLAN.reconUsed ? ' · 기존 수업 ' + PLAN.reconUsed + '건 반영' : ' · 기존 수업 확인 안 됨')
    + ' · ' + _planAgeLabel();

  // 세그먼트 — 세 화면 어디에도 "숨겨진 아이"가 없다는 걸 숫자로 보인다
  var sm = PLAN.summary || {};
  document.getElementById('planSeg').innerHTML =
      '<button class="psg' + (planTab === 'plans'  ? ' on' : '') + '" onclick="planTabTo(\'plans\')">안 ' + (PLAN.plans || []).length + '</button>'
    + '<button class="psg' + (planTab === 'roster' ? ' on' : '') + '" onclick="planTabTo(\'roster\')">전원 ' + (sm.marked || (PLAN.roster || []).length) + '</button>'
    + '<button class="psg' + (planTab === 'adj'    ? ' on' : '') + '" onclick="planTabTo(\'adj\')">조율 ' + planQ.length + '</button>';

  var body = planTab === 'roster' ? _planViewRoster()
           : planTab === 'adj'    ? _planViewAdj()
           :                        _planViewPlans();
  var el = document.getElementById('planBody');
  var top = el.scrollTop;
  el.innerHTML = body;
  el.scrollTop = top;   // 조율은 한 건씩 눌러 나가는 화면 — 매번 맨 위로 튀면 안 된다
}

/**
 * 시트를 **열 때 한 번만** 순차 등장을 재생한다.
 * ⚠️ 매 렌더에 걸면 「건너뛰기」같은 순수 클라 동작에도 1.2초 스태거가 다시 흘러
 *    전화 붙들고 한 건씩 처리하는 화면이 매 클릭마다 멈춘다(§5.1·§5.6·2-3).
 */
function _planIntro() {
  var el = document.getElementById('planBody');
  el.classList.add('intro');
  setTimeout(function(){ el.classList.remove('intro'); }, 1400);
}

/** 계산 시각 — 뽑아두고 며칠 뒤 확정하면 그 사이 신청·배정이 들어온다(docs/5 §3-F) */
function _planAgeLabel() {
  if (!planCalcAt) return '';
  var mins = Math.floor((new Date().getTime() - planCalcAt) / 60000);
  if (mins < 1) return '방금 계산';
  if (mins < 60) return mins + '분 전 계산';
  return Math.floor(mins / 60) + '시간 전 계산 · 다시 뽑기 권장';
}

function planTabTo(t) { planTab = t; planRenderSheet(); }

/**
 * 이 안이 **이번에 정하는** 방문 수 = 확정(🔒)이 아닌 것 전부.
 * 두 종류가 섞여 있다 — 처음 오는 아이(`isNew`)와 이미 우리 아이인데 시간만 정하는 아이(`needsTime`).
 * 둘 다 "지금 결정해서 시트에 쓰는 것"이라 확정 버튼의 대상은 같다.
 */
function _planNewCount(p) {
  var n = 0;
  (p.days || []).forEach(function(d) {
    (d.visits || []).forEach(function(v) { if (!v.locked) n++; });
  });
  return n;
}
/** 그중 **처음 이 선생님에게 오는** 아이 수 (기존 아이의 시간 정하기와 구분) */
function _planTrulyNew(p) {
  var n = 0;
  (p.days || []).forEach(function(d) {
    (d.visits || []).forEach(function(v) { if (!v.locked && v.isNew) n++; });
  });
  return n;
}

/**
 * 고른 안의 **주간 전체**를 요일별로 펼친다. 이 화면의 1차 질문이 *"이 선생님 주간이 어떻게 되나"*이므로
 * 한 줄 요약이 아니라 표로 낸다. 방문마다 상태를 앞에 붙여 **뭐가 새로 생기는지**가 눈에 들어오게 한다.
 *   (없음) 이미 확정 · ⏱ 배정은 됐는데 시간을 지금 정함 · 🆕 이번에 처음 오는 아이
 */
function _planWeekHtml(p) {
  var h = '<div class="pweek">';
  (p.days || []).forEach(function(d) {
    h += '<div class="pwd"><span class="pwdn" style="background:' + (PLAN_DC[d.day] || '#666') + '">' + esc(d.day) + '</span>'
       + '<span class="pwdm">이동 ' + d.moveMin + '분 · 주차 ' + d.parks + '회'
       + (d.idleMin > 0 ? ' · 빈 시간 ' + d.idleMin + '분' : '') + '</span></div>';
    (d.visits || []).forEach(function(v) {
      // 🔴 아이콘만 두면 무슨 뜻인지 모른다(유성: *"기존에 이미 확정된 아동은 누구이며,
      //    확정되지 않은 신규 아동은 누구지? 매칭연락을 해야하는 아동은 누구지?"*) → **글자로 쓴다.**
      var tag = v.locked ? '<span class="pwg lock">확정</span>'
              : (v.isNew ? '<span class="pwg new">신규·연락</span>'
                         : '<span class="pwg time">시간 제안</span>');
      h += '<div class="pwv' + (v.isNew ? ' fresh' : (v.locked ? '' : ' hot')) + '">'
         + '<span class="pwh">' + _pm(v.start) + '</span>'
         + '<span class="pwn">' + esc(v.name) + '</span>' + tag
         + (v.household ? '<span class="pwx">형제</span>' : '')
         + '<span class="pwd2">' + v.durMin + '분</span></div>';
    });
  });
  if (!(p.days || []).length) h += '<div class="pwv"><span class="pwn" style="color:#8b95a1">이 주에 방문이 없어요</span></div>';
  return h + '</div>';
}

function _planViewPlans() {
  var plans = PLAN.plans || [];
  var h = '';
  if (_planAgeLabel().indexOf('권장') > 0) {
    h += '<div class="pnote warn">이 안을 뽑은 지 한 시간이 넘었어요. 그 사이 다른 신청·배정이 들어왔을 수 있으니 <b>확정 전에 다시 뽑아</b> 주세요.</div>';
  }
  // 지킬 수 없는 배치만 나온 경우 — 확정하면 선생님이 실제로 못 간다
  if (PLAN.allInfeasible) {
    h += '<div class="pnote bad"><b>어떤 배치도 시간이 안 맞아요.</b><br>'
      + '집 사이 이동시간 때문에 다음 수업에 제때 못 가요. <b>확정하지 마시고</b> 조율하거나 인원을 줄여 주세요.</div>';
  }
  // 안이 하나뿐이면 **왜 하나뿐인지** 말한다 — 안 그러면 고장인지 결과인지 구분이 안 된다(유성 #79)
  if (plans.length === 1) {
    h += '<div class="pnote">안이 <b>하나뿐</b>입니다 — 인원·이동·주차·빈 시간 어느 쪽으로 봐도 이 안을 이기는 배치가 없었어요.'
      + (planQ.length ? '<br>더 좋게 하려면 아래 <b>조율</b>이 유일한 길이에요.' : '') + '</div>';
  }
  plans.forEach(function(p, i) {
    var nNew = _planNewCount(p);          // 이번에 시트에 쓸 것 전부 (신규 + 시간 기록)
    var nFresh = _planTrulyNew(p);        // 그중 **처음 오는 아이** = 학부모에게 연락할 대상
    var nTime = nNew - nFresh;            // 이미 우리 아이인데 시간만 기록하는 것
    var nOld = p.placed - nFresh;         // 이미 이 선생님 아이
    var sel = (i === planCur);
    h += '<div class="pcand' + (sel ? ' best' : '') + '" onclick="planPick(' + i + ')">'
      + '<h4>' + esc(i === 0 ? '최적안' : (p.objectiveLabel || ('안 ' + (i+1)))) + '</h4>'
      // 배지는 **제목이 말하지 않는 것만** 말한다(§2.1-7).
      + (p.placed < (PLAN.maxPlaced || p.placed)
          ? '<span class="tg w">' + (PLAN.maxPlaced - p.placed) + '명 적게</span>' : '')
      // 🔴 옛 화면은 「새로 배정 / 이미 확정 / 주간 전체」 세 줄을 나란히 뒀는데 유성이
      //    *"새로배정 / 주간 전체의 차이는 뭐지?"*라 물었다 = 셋 다 읽히지 않았다.
      //    ⇒ **한 줄**로 줄이고 차이는 괄호로 말한다.
      // 🔴 유성 2026-08-09: *"주간 인원 5명은 뭐고, 이번에 5명은 뭘 의미하지?"* — 숫자만 두면 안 읽힌다.
      //    ⇒ **말로 갈라 쓴다**: 이미 이 선생님 아이 몇 명 / 그중 시간 기록이 없는 몇 명 / 새로 연락할 몇 명.
      + '<div class="pm"><span>주간 인원</span><b>' + p.placed + '명</b></div>'
      + (nOld  ? '<div class="pm"><span>이미 이 선생님 아이</span><b>' + nOld + '명</b></div>' : '')
      + (nTime ? '<div class="pm"><span>└ 시간 기록 없음</span><b class="bad">' + nTime + '명</b></div>' : '')
      + '<div class="pm"><span>새로 연락할 아이</span><b class="' + (nFresh ? '' : 'muted') + '">'
        + (nFresh ? nFresh + '명' : '없음') + '</b></div>'
      + '<div class="pm"><span>총 이동(귀가 포함)</span><b>' + p.totalMoveMin + '분</b></div>'
      + '<div class="pm"><span>주차 횟수</span><b>' + p.totalParks + '회</b></div>'
      + '<div class="pm"><span>출근일</span><b>' + p.workDays + '일</b></div>'
      + '<div class="pm"><span>최소 여유</span><b class="' + (p.worstSlackMin != null && p.worstSlackMin < 3 ? 'bad' : '') + '">'
        + (p.worstSlackMin == null ? '—' : p.worstSlackMin + '분') + '</b></div>'
      + '<div class="pm"><span>빈 시간</span><b class="' + (p.totalIdleMin > 0 ? 'bad' : '') + '">' + p.totalIdleMin + '분</b></div>'
      // 🗓️ **고른 안은 주간을 통째로 펼친다** (유성 2026-08-09: *"지금 이 선생님이 어떤 스케줄을
      //    가지고 있는지도 확인이 안되고, 새로 추가할 아동이 누구인지도 시각적으로 명확하지 않다"*).
      //    한 줄 요약(`pseq`)은 7명만 돼도 읽을 수 없다.
      + (sel ? _planWeekHtml(p) : '<div class="pseq">' + esc(p.days.map(function(d) {
            return d.day + ' ' + d.visits.length + '명'; }).join(' · ')) + '</div>')
      // 주행시간은 추정치다 — 서버가 estimated로 알려주는 사실을 화면이 삼키면 담당자는 실측으로 읽는다
      + (PLAN.estimated ? '<div class="pseq">이동·여유는 추정치예요</div>' : '')
      + (p.unplaced && p.unplaced.length
          ? '<div class="pdrop">' + esc(p.unplaced.map(function(u){ return u.name + '(' + u.reason + ')'; }).join(' · ')) + '</div>' : '')
      + (p.infeasibleDays > 0
          ? '<div class="pdrop"><b>이 안은 이동시간이 부족해요</b> — 다음 수업에 제때 못 갑니다</div>' : '')
      // 🔴 **제안 시각을 실제 시각인 척 쓰면 안 된다.** 시간 기록이 없는 아이의 시각은 엔진이 만든
      //    제안이고, 실제 수업 시각을 아는 사람은 유성뿐이다. 확정 버튼 위에 그 사실을 먼저 붙인다.
      + (sel && nTime > 0
          ? '<div class="pnote warn">⏱ <b>' + nTime + '명은 시트에 요일·시각이 없어</b> 시스템이 제안한 시각이에요.<br>'
            + '실제 수업 시각과 다르면 <b>「전원」에서 직접 지정</b>한 뒤 확정해 주세요.</div>' : '')
      // 새로 쓸 게 없으면 확정 버튼을 내지 않는다 — 눌러도 시트에 아무 일이 없어 "먹통"으로 읽힌다
      + (sel && !p.infeasibleDays && nNew > 0
          ? '<button class="pbtn" onclick="event.stopPropagation();planCommit()">'
            + (nFresh ? '새로 ' + nFresh + '명 배정' : '')
            + (nFresh && nTime ? ' · ' : '')
            + (nTime ? '시간 ' + nTime + '명 기록' : '') + '</button>' : '')
      + (sel && !p.infeasibleDays && nNew === 0
          ? '<div class="pnote">이 주는 <b>이미 다 정해져</b> 있어요 — 새로 정할 게 없어요.</div>' : '')
      + '</div>';
  });

  if (!plans.length) {
    h += '<div class="pnote bad"><b>' + (PLAN.allInfeasible ? '이 명단은 이대로 못 갑니다.' : '지금 만들 수 있는 안이 없어요.')
      + '</b><br>「전원」에서 왜 안 되는지 보고, 다른 선생님을 찾아 주세요.</div>'
      + '<button class="pbtn line" onclick="planTabTo(\'roster\')">전원 상태 보기</button>';
  }

  if (planQ.length) {
    h += '<div class="padj"><b>💬 조율하면 ' + planQ.length + '건 더 받을 수 있어요</b>'
      + '<div style="margin-top:4px">전화로 한 건씩 물어보고 그 자리에서 반영해요.</div>'
      + '<button class="pbtn" style="margin-top:8px" onclick="planTabTo(\'adj\')">조율 시작</button></div>';
  }
  h += '<button class="pbtn gray" onclick="planExit()">닫기</button>';
  return h;
}

// ══ 전원 상태표 — 마크한 아이는 한 명도 화면에서 사라지지 않는다 ══

var _PLAN_ST = {
  placed:                { c: 'ok',    t: '새 배정' },
  'placed-hold-advised': { c: 'hold',  t: '새 배정(보류권고)' },
  'crowded-out':         { c: 'out',   t: '밀림' },
  impossible:            { c: 'no',    t: '불가' },
  // 🔒 2026-08-09 — 이미 확정된 아이는 "배정"이 아니라 **이미 자리가 있는 아이**다. 섞어 보이면
  //    담당자가 이번에 전화해야 할 집이 몇인지 셀 수 없다(유성: *"이미 자리도 넣은 아동인데 왜 배치안이…"*).
  fixed:                 { c: 'lock',  t: '이미 확정' },
  'fixed-conflict':      { c: 'clash', t: '확정 겹침' },
  'other-provider':      { c: 'other', t: '다른 선생님' },
  // ⏱ 이 선생님 아이인데 **시간만 안 정해진** 것. "새 배정"이라 부르면 유성이 본 그 오해가 난다
  //    (지도에서 배정하면 Q·R만 차고 S·T는 빈다 → 그 시간을 정해주는 게 이 화면의 일).
  'needs-time':          { c: 'time',  t: '시간 정하기' }
};

function _planViewRoster() {
  var roster = PLAN.roster || [], sm = PLAN.summary || {};
  var h = '';

  // 🔴 마크 수와 여기 목록 수가 어긋나면 **누가 빠졌는지 담당자가 알 수 없다**(유성 "전원7 이거 좀 이상한데").
  //    조용히 줄어드는 길이 셋 있다 — 중복 신청 병합 · 시트 범위 밖 행 · 다른 선생님 배정.
  //    그래서 보낸 수(requested)와 목록 수를 같이 보이고, 차이가 나면 사유를 바로 밑에 적는다.
  // 🔴 머릿줄의 기준은 **마크가 아니라 이 선생님의 주간**이다(2026-08-09 유성 정정 —
  //    마크는 "더 넣어볼 후보"일 뿐이고 계산 대상은 Q열이 정한다).
  h += '<div class="pnote">' + esc(PLAN.provider ? PLAN.provider.name : '') + ' 선생님 주간 <b>'
    + (sm.weekly != null ? sm.weekly : roster.length) + '명</b>'
    + ((sm.fixed || 0)         ? ' · 🔒 확정 ' + sm.fixed + '명' : '')
    + ((sm.needsTime || 0)     ? ' · ⏱ 시간 정하기 ' + sm.needsTime + '명' : '')
    + ((sm.newlyPlaced || 0)   ? ' · 🆕 새로 ' + sm.newlyPlaced + '명' : '')
    + ((sm.crowdedOut || 0)    ? ' · 밀림 ' + sm.crowdedOut + '명' : '')
    + ((sm.impossible || 0)    ? ' · 불가 ' + sm.impossible + '명' : '')
    + ((sm.otherProvider || 0) ? ' · 다른 선생님 ' + sm.otherProvider + '명' : '')
    + '<br><span style="color:#8b95a1">마크 ' + (sm.requested || 0) + '명은 <b>후보</b>예요 — 이 선생님 아이는 마크와 상관없이 다 들어옵니다.'
    + ((sm.needsTime || 0) ? '<br>「시간 정하기」는 <b>배정은 됐는데 요일·시각이 시트에 없는</b> 아이예요. 확정하면 채워집니다.' : '')
    + ((sm.crowdedOut || 0) ? '<br>「밀림」은 <b>넣을 수 있는데</b> 이 안에서 빠진 거예요 — 조율하거나 다른 안을 보세요.' : '')
    + '</span></div>';

  // 🔴 **시트와 실제가 다르면 조용히 덮지 않는다.** 역산(실제 결제 이력)이 1차 진실이지만,
  //    시트를 계속 믿고 있는 사람에게는 그 차이 자체가 정보다(유성 확정 2026-08-09).
  if (sm.mismatches && sm.mismatches.length) {
    h += '<div class="pnote warn"><b>시트에 적힌 시각과 실제가 달라요 ' + sm.mismatches.length + '명</b><br>'
      + sm.mismatches.map(function(m) {
          return esc(m.name) + ' — 시트 <b>' + esc(m.mismatch.sheetDay + ' ' + m.mismatch.sheetTime) + '</b>'
            + ' · 실제(최근 8주) <b>' + esc(m.mismatch.realDay + ' ' + m.mismatch.realTime) + '</b>'
            + ' <a href="javascript:void(0)" style="color:#166841;font-weight:700" onclick="planSetTime(' + m.row + ')">시트 맞추기 →</a>';
        }).join('<br>')
      + '<br><span style="color:#8b95a1">배치안은 <b>실제</b>를 씁니다 — 선생님이 시간을 옮긴 것이 시트에 안 반영된 거예요.</span></div>';
  }
  if ((sm.timeFromRecon || 0) + (sm.timeFromReconLow || 0)) {
    h += '<div class="pnote"><b>' + ((sm.timeFromRecon || 0) + (sm.timeFromReconLow || 0)) + '명은 결제 이력에서 시각을 역산</b>했어요 — 실제로 하고 있는 시간이에요.'
      + ((sm.timeFromReconLow || 0)
          ? '<br>그중 <b>' + sm.timeFromReconLow + '명</b>은 <b>확실하지 않아요</b> — 회기가 적거나(한 달 미만) 최근에 시간이 바뀌는 중이에요. 이 아이들은 <b>고정하지 않고</b> 계산했어요.'
          : '')
      + '</div>';
  }

  if ((sm.fixedConflict || 0)) {
    h += '<div class="pnote bad"><b>확정 시간이 서로 겹쳐요 ' + sm.fixedConflict + '건</b><br>'
      + '시트의 확정요일(S)·확정시간(T)을 확인해 주세요. 이건 조율이 아니라 시트 수정으로 풀어요.</div>';
  }
  // 조용히 줄어드는 길(중복 병합·시트 범위 밖 행)은 **일어났을 때만** 말한다
  if ((sm.droppedDuplicates || 0) || (sm.skippedRows && sm.skippedRows.length)) {
    h += '<div class="pnote warn">목록에서 빠진 것 — '
      + ((sm.droppedDuplicates || 0) ? '중복 신청 ' + sm.droppedDuplicates + '건 병합' : '')
      + ((sm.skippedRows && sm.skippedRows.length)
          ? ((sm.droppedDuplicates ? ' · ' : '') + '시트에 없는 행 ' + sm.skippedRows.join(',')) : '')
      + '</div>';
  }

  if (!roster.length) h += '<div class="pnote">보여드릴 아동이 없어요.</div>';

  roster.forEach(function(r) {
    var st = _PLAN_ST[r.status] || { c: 'no', t: r.status };
    var hasWhen = (r.status.indexOf('placed') === 0 || r.status === 'fixed' || r.status === 'needs-time');
    var why = hasWhen ? ((r.day || '') + ' ' + (r.time || '')) : (r.reason || '');
    h += '<div class="prow"><span class="pst ' + st.c + '">' + st.t + '</span>'
      + '<b>' + esc(r.name) + '</b>'
      + (r.anchorCount > 1 ? '<span style="color:#8b95a1;font-size:11px">단지 ' + r.anchorCount + '건</span>' : '')
      + '<span class="why">' + esc(why) + '</span></div>';
    if (r.holdReasons && r.holdReasons.length) {
      h += '<div class="plog">보류 권고 — ' + esc(r.holdReasons.join(' / '))
        + (r.costHint ? '<br>' + esc(r.costHint) : '')
        + (r.parentMessage ? '<br>학부모께: <b>' + esc(r.parentMessage) + '</b>' : '') + '</div>';
    }
    if (r.hint) h += '<div class="plog">' + esc(r.hint) + '</div>';
    // 🔴 **근거를 숨기지 않는다** — "화 15:30"만 보여주면 그게 6회치인지 2회치인지 알 수 없다
    //    (유성 2026-08-09: *"고신뢰 역산 역시 단기간의 경우 확실하지 않다는 거 알고있지?"*).
    if (r.reconWhy) {
      var w = r.reconWhy;
      h += '<div class="plog">' + (r.timeSource === 'recon' ? '결제 이력 기준' : '⚠️ 확실하지 않아요')
        + ' — ' + w.sessions + '회 / ' + w.spanDays + '일'
        + (w.shift ? ' · <b>최근에 시간이 바뀌는 중</b>' : '')
        + (r.timeSource === 'recon-low'
            ? (w.sessions < 4 ? ' · 회기가 적어요' : (w.spanDays < 21 ? ' · 기간이 짧아요' : '')) : '')
        + '</div>';
    }
    // ⏱ 시간 기록이 없는 아이 = **실제 수업 시각을 아는 사람은 유성뿐**이다. 엔진 제안을 그대로
    //    확정하면 틀린 시각이 박히므로, 그 자리에서 직접 지정할 길을 준다(기존 배정 다이얼로그 재사용).
    if (r.status === 'needs-time') {
      h += '<div class="plog">시트에 요일·시각이 없어 <b>' + esc((r.day || '') + ' ' + (r.time || '')) + '</b>로 제안했어요.'
        + ' 실제와 다르면 <a href="javascript:void(0)" style="color:#166841;font-weight:700" onclick="planSetTime(' + r.row + ')">직접 지정 →</a></div>';
    }
    if (r.status === 'impossible' || r.status === 'crowded-out') {
      h += '<div class="plog"><a href="javascript:void(0)" style="color:#166841" onclick="planForChild(' + r.row + ',\'' + escQ(r.name) + '\')">이 아이를 맡을 다른 선생님 찾기 →</a></div>';
    }
  });

  // 사람이 모르면 오해하는 사실들 — 숫자만 주면 안 된다
  (PLAN.anchorWarnings || []).forEach(function(w) { h += '<div class="pnote warn">' + esc(w) + '</div>'; });
  if (PLAN.duplicatesDropped && PLAN.duplicatesDropped.length) {
    h += '<div class="pnote warn"><b>중복 신청 ' + PLAN.duplicatesDropped.length + '건을 하나로 묶었어요</b><br>'
      + esc(PLAN.duplicatesDropped.map(function(d){ return d.name + '(' + d.row + '행)'; }).join(' · ')) + '</div>';
  }
  if (PLAN.availWidened && PLAN.availWidened.length) {
    h += '<div class="pnote warn">시트의 가용시간보다 <b>' + esc(PLAN.availWidened.join('·')) + '요일</b>에 실제로 수업한 기록이 있어 '
      + '그만큼 넓혀 계산했어요 — 시트가 낡았을 수 있어요.</div>';
  }
  h += '<button class="pbtn gray" onclick="planTabTo(\'plans\')">안으로 돌아가기</button>';
  return h;
}

// ══ 조율 — 한 건씩 진행 (유성 2026-08-08 확정: "한건씩 진행") ══
//
// 전화를 한 통 걸고, 답을 듣고, 그 자리에서 반영한다. 목록을 통째로 보여주고
// "알아서 처리하세요"로 두면 어디까지 했는지 사람이 기억해야 한다.
//
// 네 답이 각각 **다른 곳으로 간다** — 이걸 섞으면 다음에 또 전화하게 된다:
//   동의     → 희망시간(C열)에 그 칸을 **추가**(기존 값 안 지움) → 배치안 재계산
//   거절     → 조율거절 열에 기록 → **다시 안 뜬다**
//   통화안됨 → 기록 없음, 맨 뒤로. 2회면 이번 목록에서 뺀다(무한 순환 방지, 유성 확정)
//   건너뛰기 → 기록 없음, 맨 뒤로. 다음에 다시 뽑으면 또 나온다

function _planViewAdj() {
  var h = '';
  var hidden = PLAN.adjustmentsHidden || 0;

  if (!planQ.length) return h + _planAdjDone(hidden);

  var a = planQ[0];
  var allSeen = planQ.every(function(x) { return (planQPass[_planQKey(x)] || 0) > 0 || (planQMiss[_planQKey(x)] || 0) > 0; });

  h += '<div class="pqhd"><b>처리 ' + planQDone.length + '건</b><span>· 남음 ' + planQ.length + '건</span>'
    + '<span style="margin-left:auto">동의할 때마다 다시 계산돼요</span></div>';

  if (allSeen) {
    h += '<div class="pnote warn">남은 ' + planQ.length + '건은 <b>모두 한 번씩 미룬 항목</b>이에요. 지금 끝내도 되고, 다시 뽑으면 또 나와요.</div>';
  }

  // ⚠️ 이 한 수에 **두 집의 동의**가 필요한 경우가 35%다(2026-08-09 40시나리오 실측).
  //    한 집만 보여주면 나머지 한 집은 전화를 못 받고, 거절도 엉뚱한 집에 기록된다.
  var asks = a.asks && a.asks.length ? a.asks
           : [{ name: a.ask, row: a.askRow, phone: a.askPhone, from: a.from, to: a.to, negotiable: a.negotiable }];
  var multi = asks.length > 1;

  h += '<div class="pqcard">';
  h += multi ? '<h4>📞 두 집의 동의가 필요해요</h4>' : '';

  asks.forEach(function(k, ki) {
    h += (multi ? '<div style="margin:9px 0 0;padding-top:9px;border-top:1px solid #f2f4f6">' : '')
      + (multi ? '<h4>' + (ki + 1) + '. ' : '<h4>📞 ') + esc(k.name) + ' 보호자'
      + (k.phone ? '<a href="tel:' + esc(k.phone) + '">' + esc(fmtPhone(k.phone)) + '</a>' : '')
      + (multi ? '<span class="undo" style="float:right" onclick="planAdjAnswer(\'decline\',' + ki + ')">이 집 거절</span>' : '')
      + '</h4>'
      // 담당자용 메모는 **읽어줄 문장 밖**에 둔다 — 안에 있으면 같이 읽게 된다
      + '<div class="pqmeta">' + esc(k.from) + ' → <b style="color:#191f28">' + esc(k.to) + '</b>'
      + ' <span class="cost">처음 적어주신 시간 밖이에요</span>'
      + (k.negotiable ? '<br><span class="gain">「협의 가능」이라고 적어주신 집이에요</span>' : '')
      + '</div>'
      + '<div class="pqs">' + _planSayScript(k, a) + '</div>'
      + (multi ? '</div>' : '');
  });

  var saidPlaced = a.gainPlaced > 0 && !!a.enables;
  h += '<div class="pqmeta" style="margin-top:9px">'
    + (!saidPlaced ? ''
       : a.enables !== asks[0].name ? '성공하면 <b>' + esc(a.enables) + '</b>가 들어가요<br>'
       : '성공하면 이 아이가 <b>들어가요</b><br>')
    + _planGainLabel(a, saidPlaced) + '</div>'
    + '<div class="pqb">'
    + '<button class="go" onclick="planAdjAnswer(\'agree\')">' + (multi ? '둘 다 동의 → 반영' : '동의 → 반영') + '</button>'
    + (multi ? '' : '<button onclick="planAdjAnswer(\'decline\',0)">거절</button>')
    + '<button onclick="planAdjAnswer(\'miss\')">통화 안 됨</button>'
    + '<button onclick="planAdjAnswer(\'pass\')">건너뛰기</button>'
    + '</div></div>';

  if (hidden) h += '<div class="plog">전에 안 된다고 하신 제안 ' + hidden + '건은 빼고 보여드려요.</div>';
  planQLog.slice(0, 3).forEach(function(t) { h += '<div class="plog">' + t + '</div>'; });
  h += _planDoneList();
  h += '<button class="pbtn gray" onclick="planTabTo(\'plans\')">나중에 하기</button>';
  return h;
}

/**
 * 대가·이득을 숨기지 않는다 — 받는 게 이득인지 그 자리에서 판단해야 한다.
 * @param {boolean} skipPlaced 위에서 "성공하면 ○○가 들어갑니다"를 이미 말했으면 인원은 빼고 낸다(§2.1 문구중복금지)
 */
function _planGainLabel(a, skipPlaced) {
  var bits = [];
  if (a.gainPlaced > 0 && !skipPlaced) bits.push('<span class="gain">배정 +' + a.gainPlaced + '명</span>');
  if (a.gainMoveMin > 0) bits.push('<span class="gain">이동 −' + a.gainMoveMin + '분</span>');
  else if (a.gainMoveMin < 0) bits.push('<span class="cost">이동 +' + Math.abs(a.gainMoveMin) + '분</span>');
  if (a.gainParks > 0) bits.push('<span class="gain">주차 −' + a.gainParks + '회</span>');
  else if (a.gainParks < 0) bits.push('<span class="cost">주차 +' + Math.abs(a.gainParks) + '회</span>');
  if (a.worstSlackAfter != null && a.worstSlackAfter < 3) bits.push('<span class="cost">여유 ' + a.worstSlackAfter + '분(빠듯)</span>');
  return bits.length ? bits.join(' · ') : '이동·주차는 그대로';
}

/**
 * 전화 문구 — 유성 보이스([[copy-voice-yuseong]]: 짧은 줄·해요체·번역투 금지).
 * ⚠️ 문장을 새로 짓지 않는다. "왜 바꾸는지"는 말하지 않는다 —
 *    동선 사정을 설명하면 학부모는 우리 편의를 위해 양보하는 기분이 든다.
 */
/**
 * `화 15:00`(시스템 포맷) → `화요일 오후 3시`(사람이 말하는 형태).
 * §2.1-8 — 표시는 이용자 언어로. 유성이 승인한 목업도 "화요일 3시"였다.
 * ⚠️ **저장·전송은 원본 `화 15:00`을 그대로 쓴다.** 여기서 바꾸는 건 읽어줄 문장뿐이다.
 */
function _planSpeakTime(to) {
  var p = String(to).split(' ');
  if (p.length < 2) return String(to);
  var hm = p[1].split(':'), h = Number(hm[0]), m = Number(hm[1]) || 0;
  if (isNaN(h)) return String(to);
  return p[0] + '요일 ' + (h < 12 ? '오전 ' : '오후 ') + (h % 12 || 12) + '시' + (m ? ' ' + m + '분' : '');
}

/** 학부모에게 그대로 읽어주는 문장 — 유성 보이스(짧은 줄·해요체). 우리 동선 사정은 말하지 않는다 */
function _planSayScript(k, a) {
  var when = '<b>' + esc(_planSpeakTime(k.to)) + '</b>';
  var t = esc(k.name) + ' 어머님, 안녕하세요. 생각공작소예요.<br>';
  if (k.from === '미배정') t += '수업을 ' + when + '에 시작해도 괜찮으실까요?<br>그 시간이면 바로 시작할 수 있어요.';
  else                     t += '수업 시간을 ' + when + '로 옮겨도 괜찮으실까요?';
  return t;
}

function _planDoneList() {
  if (!planQDone.length) return '';
  var h = '<div style="margin-top:11px;font-size:11px;color:#8b95a1">처리 내역</div>';
  planQDone.forEach(function(d, i) {
    var cls = d.kind === 'agree' ? 'ok' : (d.kind === 'decline' ? 'out' : 'no');
    h += '<div class="pdone"><span class="pst ' + cls + '">' + esc(d.label) + '</span>'
      + '<b>' + esc(d.by || d.a.ask) + '</b> <span style="color:#8b95a1">' + esc(d.a.from) + ' → ' + esc(d.a.to) + '</span>'
      + (d.kind === 'agree' || d.kind === 'decline'
          ? '<span class="undo" onclick="planAdjUndo(' + i + ')">되돌리기</span>' : '')
      + '</div>';
  });
  return h;
}

function _planAsksOf(a) {
  return (a.asks && a.asks.length) ? a.asks
    : [{ name: a.ask, dob: a.askDob, row: a.askRow, phone: a.askPhone, from: a.from, to: a.to }];
}

/** @param {number} who 거절일 때만 — asks 안에서 실제로 거절한 집의 index */
function planAdjAnswer(kind, who) {
  var a = planQ[0];
  if (!a) return;
  var key = _planQKey(a);
  var asks = _planAsksOf(a);

  // ── 기록이 남지 않는 두 답: 서버를 부르지 않는다 ──
  if (kind === 'miss') {
    planQMiss[key] = (planQMiss[key] || 0) + 1;
    if (planQMiss[key] >= 2) {
      planQ.shift();
      planQDone.push({ a: a, kind: 'miss', label: '통화 안 됨' });
      planQLog.unshift('📵 <b>' + esc(a.ask) + '</b> 통화 안 됨 2회 — 이번 목록에서 뺐어요. 다시 뽑으면 또 나와요');
    } else {
      planQ.push(planQ.shift());
      planQLog.unshift('📵 <b>' + esc(a.ask) + '</b> 통화 안 됨 — 기록 없이 맨 뒤로 보냈어요');
    }
    planRenderSheet(); return;
  }
  if (kind === 'pass') {
    planQPass[key] = (planQPass[key] || 0) + 1;
    planQ.push(planQ.shift());
    planQLog.unshift('⏭ <b>' + esc(a.ask) + '</b> 건너뜀 — 아무것도 기록하지 않았어요');
    planRenderSheet(); return;
  }

  // ── 시트에 쓰는 두 답 ──
  // 동의 = asks 전원의 희망시간에 그 칸을 더한다(두 집이면 두 번 쓴다 — 한 집만 쓰면 안이 안 바뀐다)
  // 거절 = **실제로 거절한 집 하나만** 기록한다(다 기록하면 멀쩡한 집의 칸까지 영구히 막는다)
  var targets = kind === 'agree' ? asks : [asks[who || 0]];
  _planAdjWrite(kind === 'agree' ? 'adjust' : 'decline', a, targets, false, function(res) {
    planQ.shift();
    if (kind === 'agree') {
      planQDone.push({ a: a, kind: 'agree', label: '동의' });
      planQLog.unshift('✅ ' + targets.map(function(t){ return '<b>' + esc(t.name) + '</b> ' + esc(t.to); }).join(' · ')
        + ' 희망시간에 추가했어요 → 배치안 다시 계산');
    } else {
      planQDone.push({ a: a, kind: 'decline', label: '거절', by: targets[0].name });
      planQLog.unshift('🚫 <b>' + esc(targets[0].name) + '</b> ' + esc(targets[0].to) + ' 거절을 기록했어요 → 다시 안 떠요');
    }
    _planApplyRefresh(res, a);
  });
}

function planAdjUndo(i) {
  var d = planQDone[i];
  if (!d || (d.kind !== 'agree' && d.kind !== 'decline')) return;
  // 되돌리기는 **그때 쓴 것만** 되돌린다 — 동의는 전원, 거절은 거절한 한 집
  var targets = d.kind === 'agree' ? _planAsksOf(d.a)
              : _planAsksOf(d.a).filter(function(k){ return !d.by || k.name === d.by; });
  _planAdjWrite(d.kind === 'agree' ? 'adjust' : 'decline', d.a, targets, true, function(res) {
    planQDone.splice(i, 1);
    planQLog.unshift('↩️ <b>' + esc(targets.map(function(t){return t.name;}).join(' · ')) + '</b> 기록을 되돌렸어요');
    _planApplyRefresh(res, null);
  });
}

/**
 * 조율 기록. `targets`가 여럿이면 **순차로** 쓴다.
 * ⚠️ 병렬로 던지면 같은 시트에 동시 쓰기가 되고, GAS 락에서 하나가 튕긴다.
 *    마지막 응답의 `refreshed`만 쓴다 — 중간 응답은 아직 다 안 쓴 상태를 담고 있다.
 */
function _planAdjWrite(action, a, targets, undo, ok) {
  var jobs = (targets || []).filter(function(t) { return t && t.row; });
  if (!jobs.length) { showToast('이 제안은 대상 행을 몰라요 — 다시 뽑아 주세요'); return; }
  for (var i = 0; i < jobs.length; i++) {
    if (String(jobs[i].to).split(' ').length < 2) { showToast('시간을 읽지 못했어요: ' + jobs[i].to); return; }
  }

  showLoading(true);
  var last = null, noops = [], okd = [], failed = [];
  var chain = Promise.resolve();
  jobs.forEach(function(t) {
    chain = chain.then(function() {
      var p = String(t.to).split(' ');
      // ⚠️ `ctx`를 **안 보낸다**. 보내면 서버가 응답마다 지도 데이터 한 판(시트 전독 2~5초)을
      //    같이 계산하는데 이 경로는 그걸 한 번도 안 읽는다(지도 갱신은 planExit의 reloadCurrent).
      var params = {
        row: t.row, day: p[0], time: p[1],
        service: PLAN.service || currentService,
        provider: PLAN.provider.name, rows: (PLAN.rows || _planMarkedRows()).join(','), k: 6
      };
      if (undo) params.undo = '1';
      return fetchGAS(action, params).then(function(res) {
        // 🔴 여기서 throw하면 **앞 집은 이미 시트에 기록된 채** 화면은 "실패" 한 줄만 남는다
        //    → 처리 내역에 안 들어가니 되돌리기도 못 한다. 집별로 결과를 모아 부분 성공을 알린다.
        //    되돌리기 때 "원래 없습니다"는 실패가 아니다(이미 되돌아간 상태) — 통과시킨다.
        if (!res || (res.error && !(undo && /원래 없습니다/.test(res.error)))) {
          failed.push(t.name + ' ' + t.to + (res && res.error ? ' (' + res.error + ')' : ''));
          return;
        }
        okd.push(t.name);
        // 이미 가능한 칸이면 서버가 noop으로 조기 반환한다 → refreshed가 없다.
        if (res.noop) { noops.push(t.name + ' ' + t.to); return; }
        last = res;
      });
    });
  });

  chain.then(function() {
      showLoading(false);
      if (!okd.length) {   // 하나도 못 썼다 = 진짜 실패. 큐를 건드리지 않는다
        showToast('기록하지 못했어요: ' + failed.join(' · '));
        planRenderSheet();
        return;
      }
      planDirty = true;
      _invalidateServiceCache();
      if (failed.length) {
        planQLog.unshift('⚠️ <b>' + esc(okd.join('·')) + '</b>만 기록됐어요 — ' + esc(failed.join(' · ')) + ' 은(는) 기록하지 못했어요');
        showToast('일부만 기록됐어요 — 처리 내역에서 확인해 주세요');
      }
      if (noops.length) planQLog.unshift('ℹ️ ' + esc(noops.join(' · ')) + ' 은(는) 이미 그렇게 돼 있어 새로 기록할 게 없었어요');
      // 전부 noop이면 서버가 새 배치안을 안 보냈다 → 스스로 다시 계산한다(안 그러면 화면이 낡은 채로 남는다)
      if (!last) { _planRefetch(ok); return; }
      ok(last);
    })
    .catch(function(e) { showLoading(false); showToast('실패: ' + e.message); });
}

/** 서버가 갱신본을 안 실어 보낸 경우의 폴백 — 배치안을 다시 계산해 온다 */
function _planRefetch(ok) {
  // 콜백을 빠뜨린 호출부가 실제로 있었다(2026-08-09) — `ok(...)`가 `.then` 안에서 던지면
  // promise 체인이 삼켜서 **아무 일도 안 일어나고 에러도 안 보인다**. 기본값으로 그 구멍을 막는다.
  ok = ok || _planApplyRefresh;
  showLoading(true);
  fetchGAS('plans', { provider: PLAN.provider.name, rows: (PLAN.rows || _planMarkedRows()).join(','),
                      service: PLAN.service || currentService, k: 6 })
    .then(function(res) {
      showLoading(false);
      ok(res && !res.error ? { refreshed: res } : {});
    })
    .catch(function() { showLoading(false); ok({}); });
}

/**
 * 수락·거절 응답에 실려 온 **새 배치안**을 반영한다.
 * 유성 2026-08-08: *"제안 OK > OK > OK 더 최적으로 계속 제안해서 그걸 다 성공시켰을 때
 * 세 번째 OK가 첫 번째·두 번째를 반영하고 최적화시킬 수는 있는 건가?"* → 그렇다.
 * 매번 서버가 **바뀐 시트를 다시 읽어** 안과 제안을 통째로 다시 만든다(값을 화면에서 누산하지 않는다).
 */
function _planApplyRefresh(res, answered) {
  if (!PLAN) return;   // 응답이 오는 사이 시트를 닫았다 — 되살리지 않는다
  if (!res) { planQLog.unshift('⚠️ 기록은 됐지만 안이 갱신되지 않았어요 — 닫았다 다시 뽑아 주세요'); planRenderSheet(); return; }
  if (res.refreshed && !res.refreshed.error) {
    var before = planQ.length;               // 방금 처리한 건은 이미 shift된 뒤다
    // ⚠️ 재계산은 plans 배열을 **통째로 새로 만든다** — index를 그대로 두면 3번 카드가
    //    전혀 다른 안이 되고, 그 상태로 확정·안내문·이미지가 나간다. sig로 같은 안을 다시 찾는다.
    // 최적안(0번)을 보고 있었으면 어차피 0번으로 돌아가므로 알릴 게 없다
    var wasSig = (planCur > 0 && PLAN.plans && PLAN.plans[planCur]) ? PLAN.plans[planCur].sig : null;
    var wasSvc = PLAN.service, wasRows = PLAN.rows;
    PLAN = res.refreshed;
    PLAN.service = wasSvc; PLAN.rows = wasRows;   // 갱신본에는 화면이 박아둔 값이 없다
    planCalcAt = new Date().getTime();
    planCur = 0;
    if (wasSig) {
      for (var pi = 0; pi < (PLAN.plans || []).length; pi++) {
        if (PLAN.plans[pi].sig === wasSig) { planCur = pi; break; }
      }
      if (planCur === 0 && (!PLAN.plans[0] || PLAN.plans[0].sig !== wasSig)) {
        planQLog.unshift('↻ 보시던 안이 사라져 <b>최적안</b>으로 돌아갔어요');
      }
    }
    planQBuild();
    var gone = Math.max(0, before - planQ.length);
    if (gone > 0) planQLog.unshift('↻ 같은 칸을 노리던 제안 ' + gone + '건이 <b>무효가 되어 사라졌어요</b>');
    planDraw();
  } else if (res.refreshError) {
    // 기록은 됐고 재계산만 실패 — 나빠지지 않는다. 화면이 거짓말하지 않게 알린다
    planQLog.unshift('⚠️ 기록은 됐지만 재계산이 안 됐어요 — 닫았다 다시 뽑아 주세요');
  }
  planRenderSheet();
}

/** 대기열이 비었을 때 — 결과 요약 · 한계 명시 · 교사 안내문 */
function _planAdjDone(hidden) {
  var agreed = planQDone.filter(function(d){ return d.kind === 'agree'; }).length;
  var declined = planQDone.filter(function(d){ return d.kind === 'decline'; }).length;
  var h = '';

  if (!planQDone.length) {
    h += '<div class="pnote">지금은 조율로 더 얻을 게 없어요.'
      + (hidden ? ' 이전에 거절하신 ' + hidden + '건은 빼고 봤어요.' : '')
      + '<br><span style="color:#8b95a1">사람을 더 넣으려면 다른 선생님을 봐야 해요.</span></div>';
    h += '<button class="pbtn gray" onclick="planTabTo(\'roster\')">전원 상태 보기</button>';
    return h;
  }

  h += '<div class="pnote' + (agreed ? '' : ' bad') + '"><b>조율 끝 — 처리 ' + planQDone.length + '건</b><br>'
    + '동의 ' + agreed + '건 · 거절 ' + declined + '건'
    + (agreed ? '<br>배치안을 다시 계산했어요. 「안」에서 확인하고 확정해 주세요.' : '') + '</div>';

  // 유성 2026-08-08: 전부 거절이면 **한계를 명시**해야 한다 — 아니면 담당자는 계속 방법을 찾는다
  if (!agreed) {
    var top = (PLAN.plans || [])[0];
    var sm = PLAN.summary || {};
    h += '<div class="pnote bad"><b>조율이 모두 어려워요.</b><br>'
      + '이 명단·이 선생님으로는 <b>' + (top ? top.placed : (sm.placed || 0)) + '명이 최대</b>이고, 지금 안이 최선이에요.'
      + '<br><br><b>남은 아동은 이렇게 하세요</b><br>'
      + '· 「전원」에서 <b>다른 선생님 찾기</b>를 눌러 후보를 봐요<br>'
      + '· 그래도 없으면 대기 — 학부모께는 <b>"' + esc(PLAN_WAIT_MSG) + '"</b></div>';
  }

  if (agreed) {
    h += '<div style="font-size:11.5px;font-weight:700;color:#4e5968;margin-top:11px">'
      + esc(PLAN.provider ? PLAN.provider.name : '') + ' 선생님께 보낼 안내문</div>'
      + '<div class="pbrief" id="planBrief">' + esc(_planBriefText()) + '</div>'
      + '<div style="display:flex;gap:5px">'
      + '<button class="pbtn" style="margin-top:0" onclick="planBriefCopy()">' + _pmIcon('copy') + '문자 복사</button>'
      + '<button class="pbtn line" style="margin-top:0" onclick="planBriefShot()">' + _pmIcon('image') + '이미지 복사</button>'
      + '</div>';
  }

  h += _planDoneList();
  h += '<button class="pbtn gray" onclick="planTabTo(\'plans\')">안으로 돌아가기</button>';
  return h;
}

function _pm(min) { var hh = Math.floor(min/60), mm = min%60; return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm; }

// ══ 교사 전달 (유성 2026-08-08: "제공인력에게 어떻게 알려야 할지도 캡쳐로 보여줘야되고") ══

/**
 * 버튼 아이콘 — §3.5 "유니코드 이모지를 아이콘으로 쓰지 말 것"(자간·플랫폼별 렌더가 제각각).
 * `currentColor`라 버튼 색을 따라간다.
 */
function _pmIcon(kind) {
  var d = kind === 'copy'
    ? '<rect x="7" y="7" width="9" height="9" rx="2"/><path d="M4 11V4h7"/>'
    : '<rect x="3" y="4" width="14" height="12" rx="2"/><circle cx="7.5" cy="8.5" r="1.5"/><path d="M3 13l4-3 3.5 2.5L14 9l3 2.5"/>';
  return '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"'
    + ' stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px">' + d + '</svg>';
}

/** 문자로 그대로 보낼 수 있는 시간표. 지금 고른 안 기준 */
function _planBriefText() {
  var p = (PLAN.plans || [])[planCur];
  if (!p) return '';
  // 조율로 새로 들어간 아이를 짚어준다 — 전체 덤프만 주면 선생님이 직접 대조해야 한다(목업이 그랬다)
  var newly = {};
  planQDone.forEach(function(d) {
    if (d.kind === 'agree' && d.a.enables) newly[d.a.enables] = 1;
  });
  var n = Object.keys(newly).length;
  var lines = [n ? '선생님, 이번 주 스케줄이 ' + n + '명 늘었어요.' : '선생님, 이번 주 스케줄이에요.', ''];
  p.days.forEach(function(d) {
    lines.push('[' + d.day + '요일]');
    d.visits.forEach(function(v) {
      lines.push('  ' + _pm(v.start) + '  ' + v.name + (newly[v.name] ? ' (신규)' : ''));
    });
  });
  lines.push('');
  lines.push('바뀐 시간 확인해 주세요.');
  return lines.join('\n');
}

function planBriefCopy() {
  var t = _planBriefText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function(){ showToast('복사했어요', true); },
                                          function(){ _planCopyFallback(t); });
  } else _planCopyFallback(t);
}
function _planCopyFallback(t) {
  var ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showToast('복사했어요', true); }
  catch (e) { showToast('복사하지 못했어요'); }
  document.body.removeChild(ta);
}

/**
 * 시간표를 **이미지**로 만든다 — 카톡에 붙일 수 있게.
 * ⚠️ html2canvas 같은 외부 라이브러리를 안 쓴다: 표가 단순한 텍스트 격자라 canvas에 직접 그리면
 *    의존성 0 · 폰트·색을 우리가 정확히 통제 · 오프라인에서도 된다(3-F 경량화 우선).
 * 클립보드 이미지는 https+사용자 제스처에서만 되므로 실패하면 **다운로드**로 떨어진다.
 */
function planBriefShot() {
  var p = (PLAN.plans || [])[planCur];
  if (!p) return;
  var name = (PLAN.provider ? PLAN.provider.name : '') + ' 선생님';

  var rows = [];
  p.days.forEach(function(d) {
    rows.push({ head: true, text: d.day + '요일' });
    d.visits.forEach(function(v) { rows.push({ head: false, time: _pm(v.start), text: v.name }); });
  });

  var S = 2;                                   // 레티나 배율 — 카톡에서 흐려지지 않게
  var W = 420, PAD = 26, LH = 34, HEAD = 96;
  var H = HEAD + rows.length * LH + PAD;
  var cv = document.createElement('canvas');
  cv.width = W * S; cv.height = H * S;
  var g = cv.getContext('2d');
  g.scale(S, S);
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#166841'; g.fillRect(0, 0, W, 6);

  var FF = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  g.fillStyle = '#191f28'; g.font = '700 21px ' + FF;
  g.fillText(name, PAD, 46);
  g.fillStyle = '#4e5968'; g.font = '400 13px ' + FF;   // 카톡으로 나가는 이미지 — g500(3.04)은 13px에서 미달
  g.fillText('주간 스케줄 · 총 ' + p.placed + '명', PAD, 70);

  var y = HEAD;
  rows.forEach(function(r) {
    if (r.head) {
      g.fillStyle = '#4e5968'; g.font = '700 13px ' + FF;
      g.fillText(r.text, PAD, y);
    } else {
      g.fillStyle = '#4e5968'; g.font = '600 15px ' + FF;
      g.fillText(r.time, PAD + 10, y);
      g.fillStyle = '#191f28'; g.font = '600 15px ' + FF;
      g.fillText(r.text, PAD + 78, y);
    }
    y += LH;
  });

  cv.toBlob(function(blob) {
    if (!blob) { showToast('이미지를 만들지 못했어요'); return; }
    var fname = (PLAN.provider ? PLAN.provider.name : '스케줄') + '_주간.png';
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      var item = {}; item[blob.type] = blob;
      navigator.clipboard.write([new ClipboardItem(item)]).then(
        function(){ showToast('이미지를 복사했어요 — 카톡에 붙여넣으세요', true); },
        function(){ _planDownload(blob, fname); });
    } else _planDownload(blob, fname);
  }, 'image/png');
}
function _planDownload(blob, fname) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  showToast('이미지를 내려받았어요', true);
}

// ══ 모드 B — 아동 1명 → 이 아이를 맡을 선생님 후보 ══
//
// 유성 2026-08-07(러시): *"실제는 아동 1명 + 많은 교사야."* 신청은 3~4주에 걸쳐 하나씩 들어오고
// **다음주 월요일까지 연락드릴게요는 뺏긴다**(내일까지는 괜찮다). 그때 필요한 건
// "이 아이를 누구에게"이지 "이 선생님에게 누굴 몰아줄까"가 아니다.
function planForChild(row, name) {
  var my = ++planReqId;
  // ⚠️ textContent로 넣으므로 esc() 금지 — 이중 이스케이프라 '김&민' 같은 이름이 '김&amp;민'으로 보인다
  _planSkeleton((name || '') + ' 담당 후보', '가까운 선생님부터 보는 중…');
  fetchGAS('planfor', { row: row, service: currentService, k: 3 })
    .then(function(res) {
      if (my !== planReqId) return;
      if (!document.getElementById('planSheet').classList.contains('on')) return;
      if (!res || res.error) { _planSkelFail((res && res.error) || ''); return; }
      // 모드 A 잔해를 치운다 — 안 그러면 지도에 옛 동선이 남고 요일 버튼이 살아 있어
      // 「화」를 누르면 없어진 안의 동선을 다시 그린다.
      planClear();
      document.getElementById('planDays').classList.remove('on');
      document.getElementById('planLg').classList.remove('on');
      PLANB = res;
      document.getElementById('planTitle').textContent = (name || (res.child && res.child.name) || '') + ' 담당 후보';
      document.getElementById('planSub').textContent =
        '선생님 ' + (res.totalProviders || 0) + '명 중 가까운 ' + (res.looked || 0) + '명을 봤어요';
      document.getElementById('planSeg').innerHTML = '';
      document.getElementById('planBody').innerHTML = _planViewForChild();
    })
    .catch(function(e) { if (my === planReqId) _planSkelFail(e.message); });
}
var PLANB = null;

function _planViewForChild() {
  var r = PLANB, h = '';
  var c = r.child || {};
  h += '<div class="pnote"><b>' + esc(c.name || '') + '</b>'
    + (c.times ? '<br>희망 ' + esc(fmtTimes(c.times)) : '')
    + (c.earliest ? '<br>' + esc(c.earliest) + ' 이후 가능' : '') + '</div>';

  (r.candidates || []).forEach(function(k, i) {
    h += '<div class="pcand static' + (i === 0 ? ' best' : '') + '">'
      + '<h4>' + (i + 1) + '. ' + esc(k.provider) + '</h4>'
      + (i === 0 ? '<span class="tg">가장 손해가 적음</span>' : '')
      + '<div class="pm"><span>넣을 자리</span><b>' + esc((k.day || '') + ' ' + (k.time || '')) + '</b></div>'
      + '<div class="pm"><span>왕복(집↔이 아이)</span><b>' + (k.roundTripMin != null ? k.roundTripMin + '분' : '—') + '</b></div>'
      + '<div class="pm"><span>그날 이미 가는 집</span><b>' + (k.sameDayVisits || 0) + '곳</b></div>'
      + '<div class="pm"><span>선생님 집까지</span><b>' + (k.km != null ? k.km + 'km' : '—') + '</b></div>'
      + '<div class="pm"><span>맡고 있는 아동</span><b>' + (k.load || 0) + '명</b></div>'
      + '<div class="pseq">' + (k.sameDayVisits
          ? '그날 이미 나가는 날이라 왕복이 이미 있어요 — 그만큼 싸요'
          : '이 아이 때문에 <b>새로 나가는 날</b>이 돼요') + '</div>'
      + '<button class="pbtn" onclick="doAssignTo(' + c.row + ',\'' + escQ(k.provider) + '\')">이 선생님에게 배정</button>'
      + '</div>';
  });

  if (!(r.candidates || []).length) {
    h += '<div class="pnote bad"><b>지금 넣을 수 있는 선생님이 없어요.</b><br>'
      + '학부모께는 <b>"' + esc(PLAN_WAIT_MSG) + '"</b>라고 안내해 주세요.</div>';
  }
  if ((r.rejected || []).length) {
    h += '<div class="pnote">넣을 수 없던 선생님<br><span style="color:#8b95a1">'
      + esc(r.rejected.map(function(x){ return x.provider + '(' + (x.reason || '') + ')'; }).join(' · '))
      + '</span></div>';
  }
  // 이 모드는 기존 아동 좌표를 안 읽는다 = 왕복비용이 하한이다. 단정하지 않는다
  // (후보가 0명이면 비용 얘기 자체가 의미 없다 — 띄우면 소음)
  if (r.caveat && (r.candidates || []).length) h += '<div class="pnote warn">' + esc(r.caveat) + '</div>';
  // 모드 A에서 넘어왔으면 **재계산 없이** 돌아갈 수 있어야 한다(계산은 1회라는 설계)
  if (PLAN) h += '<button class="pbtn line" onclick="planBackToA()">← 배치안으로</button>';
  h += '<button class="pbtn gray" onclick="planExit()">닫기</button>';
  return h;
}

/** 모드 B → 모드 A 복귀. 들고 있던 PLAN을 그대로 다시 그린다(서버 재호출 없음) */
function planBackToA() {
  if (!PLAN) { planExit(); return; }
  PLANB = null;
  planTab = 'plans';
  planRenderSheet();
  document.getElementById('planDays').classList.add('on');
  planDim(true);
  planLegend();
  planDraw();
}

function planPick(i) {
  planCur = i; planDayF = 'all';
  planRenderSheet();
  document.getElementById('planDays').classList.add('on');
  Array.prototype.forEach.call(document.querySelectorAll('.pd'), function(b){
    if (b.dataset.d) b.classList.toggle('on', b.dataset.d === 'all'); });
  planDim(true);          // 무지개 5색이 기존 마커색과 5/5 충돌 → 검토 중엔 기존 마커를 내린다
  planLegend();
  planDraw();
}

/**
 * 전원 화면에서 그 아이의 **실제** 요일·시각을 직접 지정한다.
 * 새 UI를 만들지 않고 기존 배정 다이얼로그(`askAssignSchedule`)를 그대로 쓴다 —
 * 그게 Q·R·S·T를 한 번에 쓰는 유일한 정본 경로이고, 두 벌이 되면 다시 어긋난다(0-9).
 */
function planSetTime(row) {
  var c = _findChildByRow(row);
  var prov = (PLAN && PLAN.provider) ? PLAN.provider.name : document.getElementById('providerSelect').value;
  askAssignSchedule(row, prov || '', c && c.name, c && c.times);
}

/** 검토 범례 — 이 안에 있는 요일만 색을 보여준다(없는 요일 색까지 띄우면 소음) */
function planLegend() {
  var el = document.getElementById('planLg');
  if (!el || !PLAN || !PLAN.plans[planCur]) return;
  var p = PLAN.plans[planCur];
  var days = p.days.map(function(d){ return d.day; });
  // ⛔ "흐린 마커 = 이 안에 없는 아동" 줄은 뺐다 — 유성 2026-08-09: *"이 범례는 필요 없어보이는데"*.
  //    회색은 보면 아는 것이고, 정작 알아야 할 건 **이번에 새로 넣는 아이가 누구인가**다.
  var nNew = 0;
  p.days.forEach(function(d){ d.visits.forEach(function(v){ if (!v.locked) nNew++; }); });
  el.innerHTML = days.map(function(d) {
      return '<span><i style="background:' + (PLAN_DC[d] || '#666') + '"></i>' + d + '</span>';
    }).join('')
    + (nNew ? '<span style="width:100%;color:#166841;font-weight:700">🆕 = 이번에 정하는 ' + nNew + '명</span>' : '');
  el.classList.add('on');
}

function planDay(d) {
  planDayF = d;
  Array.prototype.forEach.call(document.querySelectorAll('.pd'), function(b){
    if (b.dataset.d) b.classList.toggle('on', b.dataset.d === d); });
  // 요일 버튼은 배치안과 월 스케줄 동선이 **공유**한다 — 배치안이 없으면 월 스케줄 쪽을 그린다
  if (!PLAN && SCHED.route) { schedDraw(d); return; }
  planDraw();
}

/** 지도에 요일 마커 + 동선을 그린다. 기존 마커는 그대로 두되 요일 마커가 위에 얹힌다(z=20) */
function planDraw() {
  planClear();
  if (!PLAN || !PLAN.plans || !PLAN.plans[planCur]) return;
  var p = PLAN.plans[planCur];
  var home = PLAN.provider;

  p.days.forEach(function(d) {
    if (planDayF !== 'all' && d.day !== planDayF) return;
    var col = PLAN_DC[d.day] || '#666';

    // 좌표별로 묶어 겹침 방지 — 같은 자리 여러 명이면 가로로 벌리고 이름은 한 번만
    var byXY = {};
    d.visits.forEach(function(v, i) {
      var c = (v.row && _findChildByRow(v.row)) || _planFindByName(v.name, v.dob);
      if (!c || !c.lat) return;
      var k = c.lat.toFixed(6) + ',' + c.lng.toFixed(6);
      byXY[k] = byXY[k] || { lat: c.lat, lng: c.lng, items: [], kids: [] };
      byXY[k].items.push({ d: d.day, i: i + 1, col: col });
      if (byXY[k].kids.some(function(x){ return x.name === v.name; })) return;
      byXY[k].kids.push({ name: v.name, phone: (c.phone || '') });
    });

    var path = [];
    if (home && home.lat) path.push(new kakao.maps.LatLng(home.lat, home.lng));
    Object.keys(byXY).forEach(function(k) {
      var g = byXY[k];
      path.push(new kakao.maps.LatLng(g.lat, g.lng));
      // 🔴 같은 자리 여러 명이면 원이 완전히 포개진다(유성 2026-08-07: *"화2, 화3 동그라미가 겹쳐서 문제가 있어"*).
      //    좌표는 같으니 **아이콘 앵커를 픽셀로 밀어** 가로로 벌린다 — 줌이 바뀌어도 간격이 유지된다.
      g.items.forEach(function(t, j) {
        var dx = (j - (g.items.length - 1) / 2) * 26;   // 중앙 기준 양쪽으로
        var m = new kakao.maps.Marker({
          position: new kakao.maps.LatLng(g.lat, g.lng),
          image: _planDayIcon(t.col, t.d + t.i, dx),
          map: map, zIndex: 20
        });
        planMarkers.push(m);
      });
      var ov = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(g.lat, g.lng),
        content: '<div class="mlbl assigned plan">' + esc(_planJoinNames(g.kids)) + '</div>',
        zIndex: 21, xAnchor: 0, yAnchor: 0
      });
      ov.setMap(map); planLabels.push(ov);
    });
    if (home && home.lat) path.push(new kakao.maps.LatLng(home.lat, home.lng));   // 귀가 포함

    if (path.length > 1) {
      var line = new kakao.maps.Polyline({
        path: path, strokeWeight: 4, strokeColor: col,
        strokeOpacity: planDayF === 'all' ? 0.45 : 0.9, strokeStyle: 'solid'
      });
      line.setMap(map); planLines.push(line);
      for (var ai = 0; ai < path.length - 1; ai++) _planArrow(path[ai], path[ai+1], col);   // 선과 원이 닿는 지점에 방향
    }
  });
}

/**
 * 같은 자리 아동들의 이름을 합친다 — **형제는 "/" · 남남은 ", "** (유성 2026-08-08).
 *   김하린/김지원        (2형제)
 *   김하린/김지원, 최태원 (2형제 + 다른 아동)
 * 형제 판정 = **같은 보호자 전화**(03·05·18과 같은 소스). 전화가 없으면 남남으로 본다(안전한 쪽).
 */
function _planJoinNames(kids) {
  var groups = [], byPhone = {};
  (kids || []).forEach(function(k) {
    var ph = String(k.phone || '').replace(/\D/g, '');
    if (ph && byPhone[ph] != null) { groups[byPhone[ph]].push(k.name); return; }
    if (ph) byPhone[ph] = groups.length;
    groups.push([k.name]);
  });
  return groups.map(function(g){ return g.join('/'); }).join(', ');
}

/**
 * 구간 화살표 — **선과 원이 닿는 지점**에 방향을 찍는다 (유성 2026-08-07:
 * "동그라미 안 1,2,3은 한눈에 잘 안 들어온다. 선과 원이 닿는 지점을 화살표로").
 * ⚠️ 카카오 Polyline엔 화살표 옵션이 없어 회전 마커를 얹는다. 위치는 구간의 **86%**(도착 원 직전) —
 *    픽셀로 물러서면 줌마다 달라지므로 비율로 잡아야 어느 배율에서도 원에 붙어 보인다.
 */
function _planArrow(a, b, color) {
  var t = 0.86;
  var lat = a.getLat() + (b.getLat() - a.getLat()) * t;
  var lng = a.getLng() + (b.getLng() - a.getLng()) * t;
  var midLat = (a.getLat() + b.getLat()) / 2 * Math.PI / 180;
  var dx = (b.getLng() - a.getLng()) * Math.cos(midLat);
  var dy = (b.getLat() - a.getLat());
  if (!dx && !dy) return null;
  var deg = Math.atan2(-dy, dx) * 180 / Math.PI;   // 화면 y는 아래로 증가하므로 dy 부호를 뒤집는다
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">'
    + '<g transform="rotate(' + deg.toFixed(1) + ' 9 9)">'
    + '<path d="M3 5 L13 9 L3 13 Z" fill="' + color + '" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>'
    + '</g></svg>';
  var m = new kakao.maps.Marker({
    position: new kakao.maps.LatLng(lat, lng),
    image: new kakao.maps.MarkerImage(svgUri(svg), new kakao.maps.Size(18,18), { offset: new kakao.maps.Point(9,9) }),
    map: map, zIndex: 19, clickable: false
  });
  planMarkers.push(m);
  return m;
}

/**
 * 검토 모드에서 **기존 마커를 회색으로 내린다**.
 * ⚠️ 무지개 5색이 기존 마커색과 5/5 전부 충돌한다(월↔마크·화↔대기·수↔오감·목↔선생님·금↔정신).
 *    마커색이 6종이라 피할 색이 없으므로 **모드 분리**가 유일한 해법이다(목업 §1 실측).
 */
function planDim(on) {
  markers.forEach(function(m) { try { m.setOpacity(on ? 0.28 : 1); } catch (e) {} });
  // ⚠️ 이름표는 CustomOverlay인데 content를 **문자열**로 넣었다 → `getContent().style`이 없어
  //    옛 코드는 아무것도 안 했다(2026-08-09 검증). 클래스 한 개로 CSS가 처리하게 바꾼다.
  //    배치안이 그린 이름표(.mlbl.plan)는 제외해야 한다 — 그건 지금 봐야 하는 것이다.
  document.body.classList.toggle('plan-review', !!on);
  /* 🔴 끌 때 opacity를 **전 마커 1로** 되돌리면 대기 기간 슬라이더가 가라앉혀 둔 마커까지 선명해진다.
        이미지(회색)와 zIndex(0)는 그대로 남아 "회색인데 진한" 어긋난 상태가 된다
        (유성 2026-09-01 적발: "동선 껐다 켜면 숨겨진 마커 투명도가 없어지고 회색으로 바뀜").
        ⇒ 흐림을 푸는 쪽이 슬라이더 상태를 **되살릴 책임**을 진다. planExit·schedRouteOff 둘 다 여기를 탄다. */
  if (!on && typeof _waApplyCut === 'function') _waApplyCut();
}

/** @param {number} dx 같은 좌표에 여러 명일 때 가로로 벌리는 픽셀(양수=오른쪽) */
function _planDayIcon(color, text, dx) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">'
    + '<circle cx="15" cy="15" r="12" fill="' + color + '" stroke="#fff" stroke-width="2.5"/>'
    + '<text x="15" y="19" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="sans-serif">'
    + text + '</text></svg>';
  // offset = "이미지의 이 점이 좌표에 놓인다" → x를 키우면 그림은 왼쪽으로 간다. 그래서 dx를 뺀다.
  return new kakao.maps.MarkerImage(svgUri(svg), new kakao.maps.Size(30,30),
    { offset: new kakao.maps.Point(15 - (dx || 0), 15) });
}

function _planFindByName(name, dob) {
  if (!currentData) return null;
  var pools = [currentData.waiting || [], currentData.assigned || []];
  for (var i = 0; i < pools.length; i++)
    for (var j = 0; j < pools[i].length; j++) {
      var c = pools[i][j];
      if (c.name === name && (!dob || !c.dob || String(c.dob).replace(/\D/g,'') === String(dob).replace(/\D/g,''))) return c;
    }
  return null;
}

function planClear() {
  planLines.forEach(function(l){ l.setMap(null); }); planLines = [];
  planMarkers.forEach(function(m){ m.setMap(null); }); planMarkers = [];
  planLabels.forEach(function(o){ o.setMap(null); }); planLabels = [];
}

function planExit() {
  // 배치안이 아니라 **월 스케줄 동선**이 켜져 있을 때의 「나가기」 — 동선만 끈다(요일 버튼을 공유하므로)
  if (!PLAN && !PLANB && SCHED.route) { schedRouteOff(); return; }
  planClear();
  planDim(false);
  document.getElementById('planSheet').classList.remove('on');
  document.getElementById('planDays').classList.remove('on');
  document.getElementById('planLg').classList.remove('on');
  document.getElementById('planSeg').innerHTML = '';
  PLAN = null; PLANB = null;
  // 조율로 희망시간·거절을 시트에 썼으면 지도의 아동 정보가 낡았다 → 여기서 한 번만 새로고침
  // (조율 도중에 매번 재렌더하면 검토 중인 마커가 깜빡인다)
  if (planDirty) { planDirty = false; reloadCurrent(true); }
  planSyncFab();
  schedSync();   // 배치안을 나가면 교사 선택 상태의 기본 화면(월 스케줄)으로 복귀
}

/** 확정 — 배정(Q·R) + 확정 요일·시각(S·T)을 한 번에. 하나라도 이미 배정돼 있으면 서버가 전부 거부한다 */
function planCommit() {
  if (!PLAN || !PLAN.plans[planCur]) return;
  var p = PLAN.plans[planCur];
  // ⚠️ **서버가 준 `v.row`를 쓴다.** 이름으로 되찾으면 동명이인(06에 박건우 2명 실재)이
  //    한 명으로 뭉개져 **같은 행에 두 번 확정**되고 다른 아이는 영영 배정되지 않는다.
  //    서버가 row를 안 준 구버전 응답만 이름 폴백(그 경우는 확정을 막는다 — 조용히 틀리느니 멈춘다).
  var picks = [], noRow = [];
  p.days.forEach(function(d) {
    d.visits.forEach(function(v) {
      // 🔒 이미 확정된 수업은 **다시 쓰지 않는다.** 이 안이 만든 게 아니라 원래 있던 것이고,
      //    시트를 덮으면 합의된 시간이 말없이 바뀔 수 있다(서버 commitPlan도 한 번 더 막는다).
      if (v.locked) return;
      var r = v.row || ((_planFindByName(v.name, v.dob) || {}).row);
      if (r) picks.push({ row: r, day: d.day, time: _pm(v.start) });
      else noRow.push(v.name);
    });
  });
  if (noRow.length) { showToast(noRow.join('·') + ' 의 행을 못 찾았어요 — 다시 뽑아 주세요'); return; }
  if (!picks.length) { showToast('확정할 배치가 없어요'); return; }
  // 누구를 배정하는지 이름까지 보여준다 — 요일·시각만 보면 동명이인·오선택을 못 잡는다.
  // ⚠️ 두 종류가 섞인다: **처음 오는 아이**(배정+시간)와 **이미 우리 아이인데 시간만 정하는 아이**.
  //    한 덩어리로 "N명 배정"이라 하면 후자를 새 아이로 오해한다(유성 2026-08-09의 그 오해).
  var infoOf = {};
  p.days.forEach(function(d){ d.visits.forEach(function(v){
    infoOf[(v.row || '') + '|' + d.day + '|' + _pm(v.start)] = { name: v.name, isNew: v.isNew }; }); });
  var lines = picks.map(function(x){
    var it = infoOf[x.row + '|' + x.day + '|' + x.time] || {};
    return '· ' + x.day + ' ' + x.time + '  ' + (it.name || '') + (it.isNew ? '  (새로 배정)' : '  (시간 정하기)');
  });
  var nNewC = picks.filter(function(x){ var it = infoOf[x.row + '|' + x.day + '|' + x.time] || {}; return it.isNew; }).length;
  if (!confirm(PLAN.provider.name + ' 선생님 — 새로 배정 ' + nNewC + '명 · 시간 정하기 ' + (picks.length - nNewC) + '명\n\n'
      + lines.join('\n') + '\n\n진행할까요?')) return;

  showLoading(true);
  fetchGAS('commit', { provider: PLAN.provider.name, picks: JSON.stringify(picks),
                       service: PLAN.service || currentService, ctx: _ctxKeyName() })
    .then(function(res) {
      showLoading(false);
      if (res.error && !(res.failed || []).length) { showToast(res.error); return; }
      var nC = (res.committed || []).length, nT = (res.timed || []).length;
      // 🔴 부분 반영을 숨기지 않는다(감사 발견 B) — 서버가 행마다 되읽어 확인하고 실패분을 보낸다
      if ((res.failed || []).length) {
        showToast('⚠️ ' + res.failed.length + '건이 시트에 기록되지 않았어요 — '
          + res.failed.map(function(f){ return f.row + '행(되읽음 ' + f.readback.join(',') + ')'; }).join(' / ')
          + ' · 시트를 직접 확인해 주세요');
        if (window.console) console.log('[commit 부분 실패]', JSON.stringify(res.failed));
      } else {
        showToast((nC ? nC + '명 배정' : '') + (nC && nT ? ' · ' : '') + (nT ? nT + '명 시간 확정' : '') + ' 완료!', true);
      }
      planExit();
      _afterWrite(res);
      loadOccupancy();
    })
    .catch(function(e) { showLoading(false); showToast('확정 실패: ' + e.message); });
}

/* 시트 핸들 드래그로 닫기 (docs/1 §4.3-5 — 아래로만, 임계 80px, 누름 축소) */
(function(){
  var sh = document.getElementById('planSheet'), gb = document.getElementById('planGrab');
  if (!sh || !gb) return;
  var y0 = null, dy = 0;
  function down(e){ y0 = (e.touches ? e.touches[0].clientY : e.clientY); dy = 0;
    sh.style.transition = 'none'; sh.style.transform = 'translateY(0) scale(.97)'; }
  function move(e){ if (y0 === null) return;
    var y = (e.touches ? e.touches[0].clientY : e.clientY);
    dy = Math.max(0, y - y0);
    sh.style.transform = 'translateY(' + dy + 'px) scale(.97)';
    if (e.cancelable) e.preventDefault(); }
  function up(){ if (y0 === null) return;
    sh.style.transition = ''; sh.style.transform = '';
    if (dy > 80) planExit();
    y0 = null; }
  gb.addEventListener('mousedown', down); window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  gb.addEventListener('touchstart', down, {passive:true}); gb.addEventListener('touchmove', move, {passive:false}); gb.addEventListener('touchend', up);
})();

/* ════════════════════════════════════════════════════════════════════
   월 스케줄 논모달 (2026-08-16 정식 병합 — 프리뷰 06_월스케줄_확정안 6라운드 확정판 이식)

   진입 = 좌상단 드롭다운에서 제공인력을 고르면 자동으로 뜬다(유성 원 요청).
   데이터 = OCC(부팅 병렬 1회 수신한 점유표: 6탭 S·T + 대장 역산) + currentData.assigned 조인.
   유성 확정 요지(전체 이력=docs/4 §7): A 채움·56px/시간 고정·기본 14~20(밖에 아이 있으면 확장)·
   토요일은 있을 때만·8주 초과 조용히 제외·형제=성+5분 60분 합반 한 칸·겹침 5분 이하 무시·
   동네색 시트 안 순서·접힌 블록엔 시각만·빈자리 50분+ 한 줄·격자 아래 텍스트 금지·
   계획/기록은 펼쳤을 때 두 줄 나란히(블록 시각 = 기록).
   내부 헬퍼는 전부 클로저 — 전역 오염은 sched*·scTap·scFx·scFix 만([[gas-duplicate-global-function-collision]] 부류 예방).
   ════════════════════════════════════════════════════════════════════ */
var SCHED = { prov: null, open: null, route: false, folded: false, missWarned: false };
(function(){
  var PALN = ['코랄','주황','노랑','민트','파랑','보라','연두','초록'];   // 배정 순서 = 유성 확정 08-15
  var PAL = [["#ee8a7a","#ea705d"],["#fbac6b","#ef7006"],["#ebc368","#bd8b19"],["#7dd1c1","#3aa490"],
             ["#7da6e6","#6394e1"],["#9e87e1","#9c85e0"],["#a8c872","#7ca03e"],["#79ca8a","#42a758"]];
  var NEUT = ["#eceff3","#b0b8c1"];   // 동을 모르는 아이(06에 행 없음 — 42% 실측) = 무채색. 거짓말 안 함
  var LIVE_DAYS = 56, SHAKE_MIN = 30, CLASH_TOL = 5, MOVE_DEFAULT = 12, PPH = 56;
  var RL = [], DONGCOL = {}, DONGSEQ = [];

  function hh(m){ var h=Math.floor(m/60), x=m%60; return (h<10?'0':'')+h+':'+(x<10?'0':'')+x; }
  function dur(m){ if(m<60) return m+'분'; var h=Math.floor(m/60), x=m%60; return h+'시간'+(x?' '+x+'분':''); }
  /** 빈 칸 문구는 **두 줄**로 (유성 지시) — `+1시간` / `23분`. 레인이 41~60px라 한 줄이면 잘린다.
      시간 단위가 없으면(`+45분`) 한 줄 그대로. */
  function durBr(m){ var s=dur(m), i=s.indexOf(' ');
    return i<0 ? '+'+esc(s) : '+'+esc(s.slice(0,i))+'<br>'+esc(s.slice(i+1)); }
  function short(a){ return String(a||'').replace(/^인천(광역시)?\s*/,'').replace(/^[가-힣]+시\s*/,'')
    .replace(/^[가-힣]+구\s*/,'').replace(/\s+/g,' ').trim().slice(0,18); }

  /** 점유표 + assigned 조인 → 렌더 행. 8주 넘게 결제 없는 추정 아이는 조용히 뺀다(유성 08-13 ⑧) */
  function rows(){
    var prov = SCHED.prov;
    var slots = (OCC.map && OCC.map[prov]) || [];
    var asg = (currentData && currentData.assigned) || [];
    function join(n, dob){
      for (var i=0;i<asg.length;i++){
        var c = asg[i];
        if (c.name !== n) continue;
        var a = String(c.dob||'').slice(0,8), b = String(dob||'').slice(0,8);
        if (a && b && a !== b) continue;   // 동명이인 방어 — 이름만 조인하면 남의 주소가 붙는다(§7-10 실측 8.4%)
        return c;
      }
      return null;
    }
    var out = [];
    slots.forEach(function(s){
      if (s.src === 'recon' && s.last != null && s.last > LIVE_DAYS) return;
      var c = join(s.n, s.dob);
      out.push({ d:s.d, s:s.s, e:s.e, m:(s.e-s.s), n:s.n, dob:s.dob, src:s.src,
                 ses:s.ses||0, conf:s.conf, last:s.last, span:s.span||0, iqr:s.iqr||0,
                 was:s.was||null, shift:s.shift||null, plan:s.plan||null,
                 dong:(c&&c.bname)||'', ad:(c?short(c.addr1||c.address):''), tel:(c&&c.phone)||'',
                 want:(c? String(c.times||'').slice(0,24) : ''), row:(c&&c.formRow)||null,
                 lat:(c&&c.lat)||null, lng:(c&&c.lng)||null, sg:null });
    });
    // 형제 = 성 같고 시작 ±5분 + 서버가 이미 60분 합반으로 잰 것(유성 08-15 규칙·서버 _srDuration_와 동일 기준)
    var sg = 0;
    out.forEach(function(a,i){ out.forEach(function(b,j){
      if (j<=i || a.d!==b.d) return;
      if (a.m<60 || b.m<60) return;
      if (Math.abs(a.s-b.s)>5) return;
      if (a.n.charAt(0)!==b.n.charAt(0)) return;
      if (a.sg==null && b.sg==null){ a.sg=b.sg=++sg; }
      else if (a.sg==null) a.sg=b.sg; else if (b.sg==null) b.sg=a.sg;
    });});
    return out;
  }
  function DAYS(vs){ var d=['월','화','수','목','금'];
    if (vs.some(function(v){return v.d==='토';})) d.push('토');
    return d; }
  function BND(vs, ds){ var lo=14*60, hi=20*60;
    vs.forEach(function(v){ if(ds.indexOf(v.d)<0) return;
      if(v.s<lo) lo=Math.floor(v.s/60)*60;
      if(v.e>hi) hi=Math.ceil(v.e/60)*60; });
    return {lo:lo,hi:hi}; }
  function assignColors(vs){
    DONGCOL={}; DONGSEQ=[]; var i=0;
    vs.slice().sort(function(a,b){ return '월화수목금토'.indexOf(a.d)-'월화수목금토'.indexOf(b.d) || a.s-b.s; })
      .forEach(function(v){
        if(!v.dong) return;
        if(!(v.dong in DONGCOL)){ DONGCOL[v.dong]=PAL[i%PAL.length]; DONGSEQ.push(v.dong); i++; } });
  }
  function palOf(v){ return (v.dong && DONGCOL[v.dong]) || NEUT; }
  function dayRows(vs,d){ return vs.filter(function(v){return v.d===d;}).sort(function(a,b){return a.s-b.s;}); }
  function units(vs,d){
    var list=dayRows(vs,d), map={}, out=[];
    list.forEach(function(v,vi){
      // ⚠️ 키를 이름+시각으로 쓰면 같은 요일·같은 시각의 동명이인이 한 칸으로 합쳐진다(김도윤 3명 실재)
      var k=(v.sg!=null)?('g'+v.sg):('i'+vi);
      if(!map[k]){ map[k]={mem:[],sib:(v.sg!=null)}; out.push(map[k]); }
      map[k].mem.push(v);
    });
    out.forEach(function(u){
      u.mem.sort(function(a,b){return a.s-b.s;});
      u.s=Math.min.apply(null,u.mem.map(function(x){return x.s;}));
      u.e=Math.max.apply(null,u.mem.map(function(x){return x.e;}));
      u.nm=u.mem.map(function(x){return x.n;}).join(' · ');
    });
    return out.sort(function(a,b){return a.s-b.s;});
  }
  function ovMin(a,b){ return Math.min(a.e,b.e)-Math.max(a.s,b.s); }
  /** 형제로 묶고 남은 겹침만 — 5분 이하로 스치는 건 겹침이 아니다(유성 08-15 "추정 오차로 보여") */
  function groups(vs,d){
    var us=units(vs,d), used=[], out=[];
    us.forEach(function(u){
      if(used.indexOf(u)>=0) return;
      var g=[u]; used.push(u);
      us.forEach(function(o){ if(used.indexOf(o)<0 && ovMin(u,o)>CLASH_TOL){ g.push(o); used.push(o); } });
      out.push(g.sort(function(a,b){return a.s-b.s;}));
    });
    return out.sort(function(a,b){return a[0].s-b[0].s;});
  }
  /** 빈자리 = 이동시간 빼고 50분 이상만 (유성 확정) */
  /** 빈자리 = 이동시간 빼고 50분 이상만 (유성 확정)
      🆕 2026-09-01 — **첫 아동 앞·마지막 아동 뒤도 자리다**(R3, 유성 확정). 경계는 **격자 전체**(BND).
         이게 없으면 눌리는 자리가 164곳 중 23곳뿐이었다(사전계획 §10 위험1이 실측으로 실현).
         앞·뒤 자리의 기준점은 **교사의 집**이고, 집 좌표는 26명 전원에게 있다(2026-09-01 실측) —
         그래서 "앞뒤 주소를 몰라 못 찾는" 자리는 **아동과 아동 사이 구간에만** 생긴다.
      ⛔ 시각적으로 점선 박스로 보이지 않아도 된다(유성 2026-08-26) → 투명 히트영역 + hover에서만 드러냄. */
  function gaps(vs,d,b){
    var gs=groups(vs,d), out=[];
    if(!gs.length) return out;
    if(b){
      var first=gs[0][0].s, hd=first-b.lo-MOVE_DEFAULT;
      if(hd>=50) out.push({s:b.lo,e:first,min:hd,mv:MOVE_DEFAULT,edge:'head',nx:gs[0]});
    }
    for(var i=0;i<gs.length-1;i++){
      var end=Math.max.apply(null,gs[i].map(function(u){return u.e;}));
      var nxt=gs[i+1][0].s, sl=nxt-end-MOVE_DEFAULT;
      // pv·nx = 앞뒤 기준점 그룹. 후보 반경을 어디서 재는지는 이 둘이 정한다(2026-09-01)
      if(sl>=50) out.push({s:end,e:nxt,min:sl,mv:MOVE_DEFAULT,pv:gs[i],nx:gs[i+1]});
    }
    if(b){
      var lastG=gs[gs.length-1];
      var last=Math.max.apply(null,lastG.map(function(u){return u.e;}));
      var tl=b.hi-last-MOVE_DEFAULT;
      if(tl>=50) out.push({s:last,e:b.hi,min:tl,mv:MOVE_DEFAULT,edge:'tail',pv:lastG});
    }
    return out;
  }

  function paint(){
    var body = document.getElementById('schedBody');
    var vs = rows();
    assignColors(vs);
    var ds = DAYS(vs), b = BND(vs, ds), H = (b.hi-b.lo)/60*PPH, aw = 26;
    function Y(m){ return (m-b.lo)/60*PPH; }
    RL = [];
    var unk = (OCC.unknown && OCC.unknown[SCHED.prov]) || [];
    document.getElementById('schedTitle').textContent = SCHED.prov + ' 선생님';
    document.getElementById('schedSub').innerHTML = vs.length + '명 · ' + hh(b.lo) + '~' + hh(b.hi)
      + (unk.length ? ' · <span class="sunk" onclick="schedUnknown()">시간 미상 ' + unk.length + '명</span>' : '');

    if (!vs.length && !unk.length){
      body.innerHTML = '<div class="pnote">최근 8주 결제 기록도, 계획(S·T)도 없어요</div>';
      candClose();   // 격자가 없으면 자리도 없다 — 열려 있던 후보 모달을 남기지 않는다
      return;
    }
    var h='<div class="ghead" style="padding-left:'+aw+'px">'
      + ds.map(function(d){return '<div class="dh">'+d+'</div>';}).join('')+'</div>';
    h+='<div class="gbody" style="height:'+H+'px"><div class="axis" style="width:'+aw+'px">';
    for(var t=b.lo;t<=b.hi;t+=60) h+='<span style="top:'+Y(t)+'px">'+(t/60)+'</span>';
    h+='</div><div style="position:absolute;left:'+aw+'px;right:0;top:0;bottom:0;pointer-events:none">';
    for(var t2=b.lo+60;t2<b.hi;t2+=60) h+='<i class="hr" style="top:'+Y(t2)+'px"></i>';
    h+='</div>';

        // ⛔"이동 N분 빼고" 문구는 안 쓴다(유성 08-16) — 값엔 이동 12분이 이미 빠져 있고 설명은 탭 토스트가 한다
        // 앞·뒤 자리(edge)는 **투명**하게 둔다(유성 08-26) — hover·열림에서만 드러난다
        h+='<div class="free'+(g.edge?' edge':'')+(CAND.key===gkey(d,g)?' on':'')

      GS.forEach(function(g,gi){
        var many=g.length>1, u=g[0], v=u.mem[0], p=palOf(v);
        var s0=g[0].s, eRaw=Math.max.apply(null,g.map(function(x){return x.e;})), e0=eRaw;
        if(GS[gi+1] && GS[gi+1][0].s < e0) e0 = GS[gi+1][0].s;   // 5분 이하 스침은 몇 px만 잘라 겹쳐 그리지 않는다
        RL.push({g:g,d:d,end:eRaw});
        var id=RL.length-1, op=(SCHED.open===id);
        var bh=Y(e0)-Y(s0);
        var upward = op && Y(s0) > H*0.5;
        var sty = upward ? ('bottom:'+(H-Y(e0))+'px;min-height:'+bh+'px;')
                         : ('top:'+Y(s0)+'px;'+(op?'min-height:':'height:')+bh+'px;');
        if(op) sty+='width:226px;z-index:9;border-left-color:'+(many?'var(--danger)':p[1])+';'
                   +(di>=ds.length-2?'left:auto;right:1px;':'left:1px;right:auto;');
        else if(!many) sty+='background:'+p[0]+';';
        var lines = many ? 1 : u.mem.length;
        var tight = !op && bh < (lines*14+13+8);   // 축소 임계는 이름 줄 수가 정한다(형제 합반=두 줄)
        h+='<div class="blk'+(many?' clash':'')+(op?' open':'')+(tight?' tight':'')
          + '" style="'+sty+'" onclick="scTap('+id+')">';
        if(many && !op){
          h+='<div class="nm">겹침</div><div class="tm">'+hh(s0)+'</div>';
        } else if(many && op){
          h+='<div class="nm">겹침</div><div class="tm">'+hh(s0)+'~'+hh(e0)+'</div>';
          h+='<div class="det">'+g.map(function(x){
               return '<div class="drow"><span class="dl" style="width:auto;min-width:30px">'+esc(x.nm)+'</span>'
                 +'<span class="dv">'+hh(x.s)+'~'+hh(x.e)+(x.sib?' 합반':'')
                 +' · '+(x.mem[0].ses||0)+'회'
                 +(x.mem[0].iqr>=SHAKE_MIN?' · ±'+x.mem[0].iqr+'분':'')+'</span></div>'; }).join('')
            + '<div class="memo">'+clashWhy(g)+'</div></div>';
        } else if(u.sib){
          h+=u.mem.map(function(x){return '<div class="nm">'+esc(x.n)+'</div>';}).join('')
            + '<div class="tm">'+hh(u.s)+' 합반</div>';
          if(op) h+=detailSib(u,id);
        } else {
          // ⛔접힌 블록엔 '추정'도 '±N분'도 안 쓴다 — 시각만(유성 08-15·16). 흔들림은 펼친 카드가 말한다
          h+='<div class="nm">'+esc(v.n)+'</div><div class="tm">'+hh(v.s)
            + (op&&v.src==='recon'?' 추정':'')+'</div>';
          if(op) h+=detail(v,id);
        }

      });

    // ⛔격자 아래 요약 텍스트는 쓰지 않는다 (유성 08-15)

    // 펼친 카드가 격자 밖으로 나가면 재보고 끌어당긴다 — 높이는 렌더 전엔 모른다(프리뷰 실측 15px 초과)
    var opEl=body.querySelector('.blk.open');
    if(opEl){
      var gH=body.querySelector('.gbody').offsetHeight;

    document.getElementById('schedBody').onscroll = syncFade;

  }
  function syncFade(){

    sh.classList.toggle('more', sb.scrollHeight - sb.clientHeight - sb.scrollTop > 6);

    sh.classList.toggle('moreTop', sb.scrollTop > 6);

  }
  function clashWhy(g){
    var ov=999;
    for(var i=0;i<g.length;i++) for(var j=i+1;j<g.length;j++)
      ov=Math.min(ov, Math.min(g[i].e,g[j].e)-Math.max(g[i].s,g[j].s));
    var names=g.map(function(u){return u.mem[0].n.charAt(0);});
    var sameSur=names.every(function(x){return x===names[0];});
    return (sameSur? '성은 같지만 시각이 5분 넘게 달라 합반으로 안 봤어요'

  /** 계획(S·T)/기록(역산)을 펼쳤을 때 두 줄 나란히 — 블록에 그리는 시각은 기록이 이긴다(유성 픽 08-16) */
  /** 펼친 아동 카드 우상단 「지도에서 보기」 (유성 2026-09-01). 좌표를 모르는 아이(06에 행 없음)는 안 단다 */
  function goMapBtn(v){

      + '<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></button>';

  function detail(v,id){

      // 연속 4회+ 새 슬롯 = 바뀐 쪽이 1차 추정(유성 08-15) — 옛 값은 참고로만. 1회짜리 옛 슬롯은 이상치라 말 안 한다
      + (v.was && (v.was.n||0)>=2 ?'<br><span style="color:#8a5a00">'+(v.was.run||4)+'회 연속 바뀌었어요 · 이전엔 '
               +v.was.d+' '+hh(v.was.s)+'('+v.was.n+'회)</span>':'')
      + (v.shift?'<br><span style="color:#8a5a00">최근 결제는 '+v.shift.d+' '+hh(v.shift.s)

  function detailSib(u,id){
    var a=u.mem[0];

        + (x.iqr>=SHAKE_MIN?' · ±'+x.iqr+'분':'')

    h+='<div class="drow"><span class="dl">전화</span><span class="dv">'+(a.tel?esc(a.tel):'-')+'</span></div>';
    h+='<div class="memo">성이 같고 시각이 5분 안이라 형제로 봤어요 — 60분 합반</div>';
