// 같은 좌표에 이미 있는 마커 찾기
/* ⚠️ 기간 슬라이더로 **완전히 가라앉은** 마커는 후보에서 뺀다. 안 빼면 투명도 10%·회색·맨 아래로 깔린
   마커에 말풍선이 붙어 꼬리가 어디를 가리키는지 안 보인다. 빼면 요일·시간 필터와 같은 길(빨간 검색 핀)을 탄다. */
function _sunk(m){ return !!(m.__items && m.__kind === 'waiting' && !m.__mark && !m.__items.some(_waAlive)); }
function findMarkerAt(lat, lng) {
  var found = null;
  markers.forEach(function(m){
    if (_sunk(m)) return;
    var p = m.getPosition();
    if (Math.abs(p.getLat()-lat) < 0.00001 && Math.abs(p.getLng()-lng) < 0.00001) found = m;
  });
  return found;
}

// ══ 지도 임의 지점 선택 (PC 우클릭 / 모바일 롱프레스) ══
// 임의 위치에 빨간 핀을 찍고 역지오코딩한 주소 + 출발/도착 버튼을 띄운다.
function handleMapPointPick(latlng) {
  if (!latlng || !geocoder) return;
  var lat = latlng.getLat(), lng = latlng.getLng();
  geocoder.coord2Address(lng, lat, function(result, status) {
    var addr = '선택한 지점';
    if (status === kakao.maps.services.Status.OK && result[0]) {
      addr = result[0].road_address ? result[0].road_address.address_name
           : (result[0].address ? result[0].address.address_name : addr);
    }
    addr = shortAddr(addr);  // '인천광역시/인천시' → '인천' 통일(#1)
    // 좌표 줄은 제거. 주소는 word-break:keep-all로 단어 단위 줄바꿈(번지만 떨어지는 것 방지)
    var iw = '<div class="iw"><div class="iw-nm iw-addr">' + esc(addr) + '</div>'
      + routeBtns(addr, lat, lng) + '</div>';
    var sm = placeSearchMarker(lat, lng, iw);  // 검색 핀과 동일(임의 지점 = 빨강)
    infoWindow.setContent(iw);
    infoWindow.open(map, sm);
  });
}

// 주소 앞머리 '인천광역시/인천특별시/인천시' → '인천' 으로 짧게 (UX)
function shortAddr(s) {
  return String(s || '').replace(/^인천(특별시|광역시|시)?\s*/, '인천 ');
}

// 모바일 롱프레스(600ms, 손가락 1개, 이동 10px 미만)를 우클릭처럼 처리.
function setupLongPress(el) {
  var timer = null, sx = 0, sy = 0, moved = false;
  el.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1) { clearTimeout(timer); return; }
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY; moved = false;
    timer = setTimeout(function() {
      if (moved) return;
      var proj = map.getProjection();
      if (!proj || !proj.coordsFromContainerPoint) return;  // 구버전 SDK 방어
      var rect = el.getBoundingClientRect();
      var latlng = proj.coordsFromContainerPoint(new kakao.maps.Point(sx - rect.left, sy - rect.top));
      if (latlng) handleMapPointPick(latlng);
    }, 600);
  }, { passive: true });
  el.addEventListener('touchmove', function(e) {
    if (!e.touches.length) return;
    var t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) { moved = true; clearTimeout(timer); }
  }, { passive: true });
  el.addEventListener('touchend', function() { clearTimeout(timer); });
  el.addEventListener('touchcancel', function() { clearTimeout(timer); });
}

(function(){
  var input = document.getElementById('searchInput');
  var results = document.getElementById('searchResults');
  var debounce;

  input.addEventListener('input', function() {
    clearTimeout(debounce);
    debounce = setTimeout(function(){ doSearch(input.value.trim()); }, 250);
  });

  input.addEventListener('focus', function() {
    if (input.value.trim()) doSearch(input.value.trim());
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-wrap')) results.classList.remove('show');
  });

  function doSearch(q) {
    if (!q) { results.classList.remove('show'); return; }

    // 쿼리 분석
    var digitsOnly = q.replace(/\D/g, '');
    var isNumericQuery = digitsOnly.length > 0 && q.replace(/[\s\-0-9]/g, '') === '';

    var html = '';
    var childResults = [];

    // ── 아동 매칭 (이름 OR 전화번호) ──
    if (currentData) {
      var all = [];
      if (currentData.assigned) {
        currentData.assigned.forEach(function(c) {
          all.push({ name: c.name, phone: c.phone||'', lat: c.lat, lng: c.lng, status: c.assignedTo ? c.assignedTo+' 배정' : '배정', type: 'assigned', row: c.formRow, data: c });
        });
      }
      if (currentData.waiting) {
        currentData.waiting.forEach(function(c) {
          all.push({ name: c.name, phone: c.phone||'', lat: c.lat, lng: c.lng, status: '대기', type: 'waiting', row: c.row, data: c });
        });
      }

      if (isNumericQuery && digitsOnly.length >= 2) {
        // 전화번호 매칭: 저장된 phone에서 숫자만 뽑아 'contains' 검사
        // 뒷자리만 입력해도 매칭되게 (예: "4565" → 010-1234-4565 매칭)
        childResults = all.filter(function(item) {
          if (!item.phone) return false;
          var p = String(item.phone).replace(/\D/g, '');
          return p.indexOf(digitsOnly) >= 0;
        });
      } else {
        // 이름 매칭 (기존 동작)
        childResults = all.filter(function(item) { return item.name && item.name.indexOf(q) >= 0; });
      }
    }

    if (childResults.length) {
      var headerLabel = isNumericQuery ? '전화번호 일치' : '아동';
      html += '<div style="padding:6px 10px;font-size:10px;color:#999;font-weight:600;border-bottom:1px solid #eee">'+headerLabel+'</div>';
      childResults.slice(0, 8).forEach(function(item, idx) {
        var stClass = item.type === 'assigned' ? 'assigned' : 'waiting';
        // 전화번호 검색이면 뒷자리 강조
        var phoneDisplay = esc(fmtPhone(item.phone));
        if (isNumericQuery && digitsOnly.length >= 2) {
          var rawPhone = String(item.phone || '').replace(/\D/g, '');
          var matchIdx = rawPhone.indexOf(digitsOnly);
          if (matchIdx >= 0) {
            // 원본 포맷된 번호에서 숫자 위치 계산해 하이라이트
            var formattedDisplay = fmtPhone(item.phone);
            var digitCount = 0;
            var startIdx = -1, endIdx = -1;
            for (var k = 0; k < formattedDisplay.length; k++) {
              if (/\d/.test(formattedDisplay[k])) {
                if (digitCount === matchIdx) startIdx = k;
                if (digitCount === matchIdx + digitsOnly.length - 1) { endIdx = k + 1; break; }
                digitCount++;
              }
            }
            if (startIdx >= 0 && endIdx > startIdx) {
              phoneDisplay = esc(formattedDisplay.substring(0, startIdx))
                + '<b style="color:#166841">' + esc(formattedDisplay.substring(startIdx, endIdx)) + '</b>'
                + esc(formattedDisplay.substring(endIdx));
            }
          }
        }
        html += '<div class="sr-item sr-child" data-cidx="'+idx+'">'
          + '<div class="sr-name">' + esc(item.name) + '</div>'
          + '<div class="sr-phone">' + phoneDisplay + '</div>'
          + '<div class="sr-status ' + stClass + '">' + esc(item.status) + '</div>'
          + '</div>';
      });
    }

    // ── 주소 검색 (services.Places 사용) — 숫자만 입력된 경우는 건너뜀 ──
    var isAddr = false;
    if (!isNumericQuery) {
      isAddr = q.length >= 2 && /[가-힣]/.test(q) && !childResults.length;
      if (!isAddr && q.length >= 2 && /\d/.test(q)) isAddr = true;
      if (!isAddr && !childResults.length && q.length >= 2) isAddr = true;
    }

    if (isAddr && placesService) {
      html += '<div style="padding:6px 10px;font-size:10px;color:#999;font-weight:600;border-bottom:1px solid #eee">📍 주소 검색 중...</div>';
      results.innerHTML = html;
      results.classList.add('show');

      placesService.keywordSearch(q, function(data, status) {
        var addrHtml = '';
        if (status === kakao.maps.services.Status.OK && data.length) {
          addrHtml += '<div style="padding:6px 10px;font-size:10px;color:#999;font-weight:600;border-bottom:1px solid #eee">📍 주소</div>';
          data.slice(0, 5).forEach(function(doc) {
            addrHtml += '<div class="sr-item sr-addr" data-lat="'+doc.y+'" data-lng="'+doc.x+'" data-name="'+esc(doc.place_name || doc.address_name)+'">'
              + '<div class="sr-name" style="min-width:auto">'+esc(doc.place_name || '')+'</div>'
              + '<div class="sr-phone" style="flex:1">'+esc(doc.road_address_name || doc.address_name || '')+'</div>'
              + '</div>';
          });
        } else {
          addrHtml += '<div class="sr-none">주소 검색 결과 없음</div>';
        }

        var childHtml = '';
        if (childResults.length) {
          childHtml += '<div style="padding:6px 10px;font-size:10px;color:#999;font-weight:600;border-bottom:1px solid #eee">아동</div>';
          childResults.slice(0, 5).forEach(function(item, idx) {
            var stClass = item.type === 'assigned' ? 'assigned' : 'waiting';
            childHtml += '<div class="sr-item sr-child" data-cidx="'+idx+'">'
              + '<div class="sr-name">' + esc(item.name) + '</div>'
              + '<div class="sr-phone">' + esc(fmtPhone(item.phone)) + '</div>'
              + '<div class="sr-status ' + stClass + '">' + esc(item.status) + '</div>'
              + '</div>';
          });
        }

        results.innerHTML = childHtml + addrHtml;
        results.classList.add('show');
        bindResultClicks(childResults);
      });
      return;
    }

    if (!html) {
      html = '<div class="sr-none">검색 결과 없음</div>';
    }

    results.innerHTML = html;
    results.classList.add('show');
    bindResultClicks(childResults);
  }

  function bindResultClicks(childResults) {
    // 아동 클릭
    results.querySelectorAll('.sr-child').forEach(function(el) {
      el.addEventListener('click', function() {
        var idx = parseInt(this.getAttribute('data-cidx'));
        var item = childResults[idx];
        if (!item || !item.lat || !item.lng) return;
        window.focusChild(item.lat, item.lng, item.type === 'assigned' ? item.data : null);
        var iwContent = item.type === 'assigned'
          ? buildGroupedAssignedIW([item.data], currentData.provider.lat, currentData.provider.lng)
          : buildGroupedWaitingIW([item.data], currentData.provider.lat, currentData.provider.lng);

        // 이미 같은 좌표에 지도 마커가 있으면 거기서 열기 (중복 방지)
        var existing = findMarkerAt(item.lat, item.lng);
        if (existing) {
          clearSearchMarker();
          infoWindow.setContent(iwContent);
          infoWindow.open(map, existing);
        } else {
          var sm = placeSearchMarker(item.lat, item.lng, iwContent);
          infoWindow.setContent(iwContent);
          infoWindow.open(map, sm);
        }

        results.classList.remove('show');
        input.value = item.name;
      });
    });

    // 주소 클릭
    results.querySelectorAll('.sr-addr').forEach(function(el) {
      el.addEventListener('click', function() {
        var lat = parseFloat(this.getAttribute('data-lat'));
        var lng = parseFloat(this.getAttribute('data-lng'));
        var name = this.getAttribute('data-name');
        if (!lat || !lng) return;
        map.setCenter(new kakao.maps.LatLng(lat, lng));
        map.setLevel(3);
        var iwContent = '<div class="iw"><div class="iw-nm iw-addr">'+esc(name)+'</div>'
          + routeBtns(name, lat, lng)
          + '</div>';

        // 주소 검색도 같은 처리 (아주 드물지만 우연히 좌표가 같을 수 있으니)
        var existing = findMarkerAt(lat, lng);
        if (existing) {
          clearSearchMarker();
          infoWindow.setContent(iwContent);
          infoWindow.open(map, existing);
        } else {
          var sm = placeSearchMarker(lat, lng, iwContent);
          infoWindow.setContent(iwContent);
          infoWindow.open(map, sm);
        }

        results.classList.remove('show');
        input.value = name;
      });
    });
  }
})();

  // 거절만 제외.

  //    waiting = Q열 비었고 + 거절·**부재2 아님** + **좌표 있음**  → 부재2와 좌표 없는 행은 애초에 안 온다
  //    assigned = Q열에 제공인력이 있으면 **상태 무관**(거절·부재1·부재2여도 담긴다)
  //    ⇒ 부재2가 이 목록에 들어올 수 있는 유일한 경로는 배정된 아동뿐이다.
  //    (2026-08-31 정정 — 옛 주석 "부재1/2는 리스트에 노출되므로 필터 옵션에도 포함"은
  //     클라만 고치고 서버 필터를 안 본 서술이었다)
  all = all.filter(function(c) {

    if (!sgMap[sg]) sgMap[sg] = {};

  var sgList = Object.keys(sgMap).sort(function(a, b) { return a.localeCompare(b, 'ko'); });

function parseTimestamp(t) {
  if (!t) return 0;
  if (t instanceof Date) return t.getTime();
  var d = new Date(t);
  return isNaN(d.getTime()) ? 0 : d.getTime();
}

function fmtRelativeDate(ts) {
  if (!ts) return '';
  var diff = Date.now() - ts;
  var days = Math.floor(diff / 86400000);
  if (days === 0) return '오늘';
  if (days === 1) return '어제';
  if (days < 7) return days + '일 전';
  var d = new Date(ts);
  return (d.getMonth() + 1) + '/' + d.getDate();
}

function renderNewList() {
  if (!currentData) return;
  var list = document.getElementById('nlList');
  var countEl = document.getElementById('nlFilteredCount');
  var totalEl = document.getElementById('nlTotalCount');
  var badgeEl = document.getElementById('nlFabBadge');

  // 전체 모수 — 여기서 빼는 건 **거절뿐**이다(아래 waiting 루프).
  // 부재2는 서버가 waiting에 안 담아 이미 없고(Code.js:453), 좌표 없는 행도 마찬가지다(:456).
  // ⇒ 이 숫자는 "대기 전원"이 아니라 **지도에 찍힐 수 있는 대기 + 배정 전원**이다.
  //    (대시보드 페이지의 '대기'는 부재1까지 빼고 좌표 없는 행은 넣으므로 값이 다르다 — 06 CLAUDE.md)
  var all = [];
  (currentData.assigned || []).forEach(function(c) {
    all.push({
      name: c.name, lat: c.lat, lng: c.lng, address: c.address,
      phone: c.phone, sigungu: c.sigungu || '', bname: c.bname || '',
      times: c.times, status: c.assignedTo ? (c.assignedTo + ' 배정') : '배정',
      statusType: 'assigned', absent: '', marked: !!c.marked,
      row: c.formRow, timestamp: c.timestamp, data: c
    });
  });
  (currentData.waiting || []).forEach(function(c) {
    var st = String(c.status || '').trim();
    if (st === '거절') return;   // 거절만 제외 — 부재1은 대기 기본뱃지 + 부재 서브뱃지로 노출(지도엔 이미 뜸).
                                 // 부재2는 서버가 안 보내므로 이 분기가 걸릴 일이 없다(방어로만 남긴다).
    all.push({
      name: c.name, lat: c.lat, lng: c.lng, address: c.address,
      phone: c.phone, sigungu: c.sigungu || '', bname: c.bname || '',
      times: c.times, status: '대기', statusType: 'waiting',
      absent: (st === '부재1' || st === '부재2') ? st : '', marked: !!c.marked,
      row: c.row, timestamp: c.timestamp, data: c
    });
  });

  totalEl.textContent = all.length + '건';
  badgeEl.textContent = all.length;
  badgeEl.style.display = all.length > 0 ? 'flex' : 'none';

  // 필터
  var sg = document.getElementById('nlSigungu').value;
  var bn = document.getElementById('nlBname').value;
  var filtered = all.filter(function(item) {
    if (sg && item.sigungu !== sg) return false;
    if (bn && item.bname !== bn) return false;
    return true;
  });

  // 정렬
  if (nlSort === 'near' && map) {
    var c = map.getCenter();
    var cLat = c.getLat(), cLng = c.getLng();
    filtered.forEach(function(item) {
      item._dist = (item.lat && item.lng) ? haversine(cLat, cLng, item.lat, item.lng) : Infinity;
    });
    filtered.sort(function(a, b) { return a._dist - b._dist; });
  } else {
    // 최신순 = 시트 행 순서(아래일수록 최신). A열 타임스탬프는 신청폼 수정 시에도 고정이라
    // 못 쓰고(수정 행은 A열 유지한 채 맨 아래로 이동), 실제 최신성은 행 위치가 진실.
    // 표시용 날짜(fmtRelativeDate)는 여전히 A열 timestamp를 씀(접수일 표기는 그대로).
    filtered.sort(function(a, b) { return (b.row || 0) - (a.row || 0); });
  }

  countEl.textContent = filtered.length + '건 (필터)';

  if (filtered.length === 0) {
    list.innerHTML = '<div class="nl-empty">해당 조건의 신청이 없습니다</div>';
    return;
  }

  var html = '';
  filtered.forEach(function(item, idx) {
    var ts = parseTimestamp(item.timestamp);
    var dateStr = fmtRelativeDate(ts);
    var distStr = '';
    if (nlSort === 'near' && item._dist !== Infinity) {
      distStr = '<span class="nl-item-dist">' + fmtDist(item._dist) + '</span>';
    }
    html += '<div class="nl-item" data-idx="' + idx + '">'
      + '<div class="nl-item-row1">'
      +   '<div class="nl-item-name">' + esc(item.name) + '</div>'
      +   '<span class="nl-item-badge ' + item.statusType + '">' + esc(item.status) + '</span>'
      +   (item.absent ? '<span class="nl-item-badge absent">' + esc(item.absent) + '</span>' : '')
      +   (item.marked ? '<span class="nl-item-badge mark">마크</span>' : '')
      +   (dateStr ? '<span class="nl-item-date">' + dateStr + '</span>' : '')
      + '</div>'
      + '<div class="nl-item-row2">'
      +   distStr
      +   '<span>' + esc(item.sigungu) + (item.bname ? ' · ' + esc(item.bname) : '') + '</span>'
      + '</div>'
      + '</div>';
  });
  list.innerHTML = html;

  // 클릭 핸들러
  list.querySelectorAll('.nl-item').forEach(function(el) {
    el.addEventListener('click', function() {
      var idx = parseInt(this.getAttribute('data-idx'));
      var item = filtered[idx];
      if (!item || !item.lat || !item.lng) { showToast('좌표 없음'); return; }
      // 같은 줄 다시 누름 = 말풍선만 내린다(화면 고정, 유성 09-01)
      if (iwToggle('nl:'+(item.row || item.formRow || '')+':'+item.name)) return;

      var pos = new kakao.maps.LatLng(item.lat, item.lng);

      if (nlSort === 'near') {
        // 가까운순: 보고 있는 맥락 유지. viewport 안이면 카메라 고정, 밖이면 center만 이동(zoom 유지)
        var bounds = map.getBounds();
        if (!bounds.contain(pos)) {
          map.setCenter(pos);
        }
        // zoom은 절대 건드리지 않음
      } else {
        // 최신순: 점프 후 확대. 배정 아동이면 선생님 집까지 담아 축소한다(유성 09-02)
        window.focusChild(item.lat, item.lng, item.statusType === 'assigned' ? item.data : null);
      }

      // 기존 마커 찾아서 인포윈도우 열기 — **고른 아이를 맨 위로**(유성 2026-08-31).
      // 옛 코드는 trigger('click')으로 마커에 박힌 정적 말풍선을 그대로 열어, 같은 위치에 여러 명이면
      // 고른 아이가 어디 있는지 알 수 없었다(말풍선이 첫 카드까지만 보이므로 사실상 안 보인다).
      var existing = _markerHolding(item.data) || findMarkerAt(item.lat, item.lng);
      var iwHtml = _iwForPicked(existing, item.data, item.statusType);
      if (existing) {
        infoWindow.setContent(iwHtml);
        infoWindow.open(map, existing);
      } else {
        // 🐛 옛 코드엔 이 분기가 없어서, 요일·시간 필터로 마커가 사라진 아이를 리스트에서 누르면
        //    지도만 움직이고 말풍선이 안 열렸다. 검색과 같은 길(빨간 핀)로 통일한다.
        var sm = placeSearchMarker(item.lat, item.lng, iwHtml);
        infoWindow.setContent(iwHtml);
        infoWindow.open(map, sm);
      }
    });
  });
}

// ── 시트 안 세 화면 ─────────────────────────────────────────────
// 'plans' 후보안 / 'roster' 마크 전원 상태 / 'adj' 조율 한 건씩

function _planQKey(a) { return a.ask + '|' + (a.askDob || '') + '|' + a.to; }

// 자리가 없을 때 학부모께 드리는 말. **한 군데**에만 둔다 — 두 벌로 두면 화면마다 다른 말이 나간다(0-9).
// ⚠️ 「~해주셔야 할 것 같습니다」는 과공손 + hedging이라 확정인지 아닌지 학부모가 못 읽는다.

var PLAN_WAIT_MSG = '지금은 시간이 맞는 선생님이 없어요. 자리가 나면 바로 연락드릴게요.';

/** 서버가 준 조율 제안으로 대기열을 다시 만든다. 세션 상태(통화안됨·건너뜀·처리완료)는 살린다 */
function planQBuild() {
  var list = (PLAN && PLAN.adjustments) || [];
  // 이번 세션에서 이미 답한 건은 다시 묻지 않는다.
  // ⚠️ 거절은 서버가 걸러주지만 **동의**는 안 걸러진다 — 희망시간이 늘어나 같은 제안이 또 나올 수 있다.
  var answered = {};
  planQDone.forEach(function(d) {
    if (d.kind === 'agree' || d.kind === 'decline' || d.kind === 'miss') answered[_planQKey(d.a)] = 1;
  });
  planQ = list.filter(function(a) {
    var k = _planQKey(a);
    return !answered[k] && (planQMiss[k] || 0) < 2;
  });
  // 건너뛴 건 뒤로 — 아직 안 본 것부터 보여준다
  planQ.sort(function(x, y) {
    return (planQPass[_planQKey(x)] || 0) - (planQPass[_planQKey(y)] || 0);
  });
}
