<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/saenggak/kakao-escape.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>급여명세서 — 생각공작소</title>
<!-- 카톡 공유 카드(15일 공지방 링크) — 이미지 = 로고(provider-view와 같은 결). og-image.jpg는 오감 신청 배너라 쓰지 않는다(receipt 06-12 혼동 선례).
     바꾸면 카카오 캐시 초기화 = developers.kakao.com/tool/clear/og 에 https://think-fact0ry.github.io/saenggak/pay/ -->
<meta property="og:type" content="website">
<meta property="og:title" content="생각공작소 급여명세서">
<meta property="og:description" content="본인 명세서만 보여요.">
<meta property="og:image" content="https://think-fact0ry.github.io/saenggak/android-icon-512x512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:url" content="https://think-fact0ry.github.io/saenggak/pay/">
<meta name="description" content="본인 명세서만 보여요.">
<link rel="icon" href="/saenggak/android-icon-192x192.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="pay.css?v=3">
</head>
<body>
<!-- 급여명세서 선생님 화면. 서버 = 12 급여 웹앱(scripts/12_급여명세서/발송, 옛 28 — doPost만, 화면은 여기). 정본 원칙 = docs/1_원칙_디자인UX.md
     흐름: 본인 확인(휴대폰) → 문자 6자리 → 이번 달 명세서(실지급액·카드·확인했어요) → 카드 = 크게 보기 / 지난 명세서
     ?demo=1 = 서버 없이 가짜 자료(&scene=id|home|acked|fixed|empty|error) -->
<div id="app">

  <!-- 본인 확인 — 태블릿 s-signup1·근태 idOv 그대로(밑줄 칸 하나, 11자리면 바로 넘어감) -->
  <section class="pg idwrap gone" id="pId">
    <div class="body">
      <h1>본인 확인을 할게요</h1>
      <div class="tfield" id="idTf">
        <label for="idPhone">휴대폰 번호</label>
        <div class="tin-wrap">
          <input id="idPhone" type="text" inputmode="numeric" placeholder="010-0000-0000" readonly autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other">
          <button class="clr" type="button" tabindex="-1" aria-label="지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
      </div>
      <div class="note" id="idNote"></div>
    </div>
    <div class="cta"><button class="btn off" id="idGo" type="button">다음</button></div>
  </section>

  <!-- 문자 6자리 — 근태 otpOv 그대로(확인 버튼 없음, 6자리면 바로 확인) -->
  <section class="pg gone" id="pOtp">
    <div class="hd"><button class="ic" id="otpBack" type="button" aria-label="이전"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><span></span><span></span></div>
    <div class="body">
      <h1>문자로 받은<br>인증번호 6자리를 알려주세요</h1>
      <div class="osub" id="otpSub"></div>
      <div class="obody">
        <div class="otp-box" id="otpBox">
          <div class="otp-cell"></div><div class="otp-cell"></div><div class="otp-cell"></div><div class="otp-cell"></div><div class="otp-cell"></div><div class="otp-cell"></div>
          <input id="otpIn" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="인증번호" autocorrect="off" autocapitalize="off" spellcheck="false">
          <svg class="otp-frame" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" pathLength="100" vector-effect="non-scaling-stroke"/></svg>
          <div class="otp-morph" id="otpMorph"><svg class="om-check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 12 9 17 20 6" pathLength="1"/></svg></div>
        </div>
        <div class="otp-done-text">인증을 마쳤어요!</div>
        <div class="note" id="otpNote"></div>
      </div>
    </div>
    <div class="cta"><button class="lk-resend" id="otpResend" type="button">문자가 안 오나요?</button></div>
  </section>

  <!-- 이번 달 명세서(맨 처음 화면) / 지난 달 명세서는 같은 틀을 pMonth에 그린다 -->
  <section class="pg gone" id="pHome" data-month>
    <div class="hd"><span></span><span></span><span></span></div>
    <div class="body">
      <div class="mh"><h1 class="m-title"></h1><div class="who m-who"></div></div>
      <div class="sum m-sum"><div class="k m-k">실지급액</div><div class="v m-net"></div></div>
      <div class="docs m-docs"></div>
      <div class="links">
        <button class="lk" type="button" id="toPast">지난 명세서</button>
      </div>
    </div>
    <div class="cta m-cta"></div>
  </section>

  <section class="pg gone" id="pMonth" data-month>
    <div class="hd"><button class="ic" type="button" data-back aria-label="뒤로"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><span></span><span></span></div>
    <div class="body">
      <div class="mh"><h1 class="m-title"></h1><div class="who m-who"></div></div>
      <div class="sum m-sum"><div class="k m-k">실지급액</div><div class="v m-net"></div></div>
      <div class="docs m-docs"></div>
    </div>
    <div class="cta m-cta"></div>
  </section>

  <!-- 지난 명세서 목록 -->
  <section class="pg gone" id="pPast">
    <div class="hd"><button class="ic" type="button" data-back aria-label="뒤로"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><span class="t">지난 명세서</span><span></span></div>
    <div class="body"><div class="mlist" id="pastList"></div></div>
  </section>

  <!-- 명세서 크게 보기 -->
  <section class="pg gone" id="pDoc">
    <div class="hd"><button class="ic" type="button" data-back aria-label="뒤로"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><span class="t" id="docT"></span><button class="tx" type="button" id="docSave">저장</button></div>
    <div class="vb" id="vb"></div>
    <div class="vhint" id="vhint">두 손가락으로 크게 볼 수 있어요</div>
  </section>

  <div class="mdim" id="mdim"></div>
  <div class="cmodal" id="cmodal" role="dialog" aria-modal="true">
    <h3 id="cmT"></h3><p id="cmS"></p>
    <div class="row"><button class="btn gray" type="button" id="cmNo">닫기</button><button class="btn" type="button" id="cmGo"></button></div>
  </div>

  <div class="toast" id="toast"><span class="tk"><svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6"/></svg></span><span class="tx"></span></div>
  <div id="exitHint"><span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>한 번 더 뒤로 가면 나가요.</div>
</div>
<script src="pay.js?v=4"></script>
</body>
</html>
