<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>바우처 이용내역 조회</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', Arial, sans-serif;
    background: #f5f6fa; color: #202124;
  }
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white; padding: 14px 16px; position: sticky; top: 0; z-index: 10;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; }
  .header h1 { margin: 0; font-size: 13px; font-weight: 400; opacity: 0.85; }
  .header .name { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .header-btns button {
    background: rgba(255,255,255,0.2); color: white; border: none;
    padding: 5px 9px; border-radius: 5px; font-size: 11px; cursor: pointer; margin-left: 4px;
  }
  .content { padding: 12px; padding-bottom: 60px; }

  .tabs {
    display: flex; background: white; border-radius: 10px; padding: 3px; margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .tab {
    flex: 1; padding: 9px; text-align: center; font-size: 13px; font-weight: 500;
    border-radius: 7px; cursor: pointer; color: #5f6368;
  }
  .tab.active { background: #667eea; color: white; }

  .controls {
    background: white; border-radius: 10px; padding: 10px; margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .control-row { display: flex; gap: 6px; }
  .control-row select, .control-row input {
    flex: 1; padding: 9px 10px; font-size: 13px;
    border: 1px solid #dadce0; border-radius: 7px; outline: none;
    background: white; -webkit-appearance: none;
  }
  .control-row select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%235f6368' d='M0 0l5 6 5-6z'/></svg>");
    background-repeat: no-repeat; background-position: right 10px center; padding-right: 28px;
  }
  .control-row button {
    padding: 9px 18px; font-size: 13px; font-weight: 600;
    background: #667eea; color: white; border: none; border-radius: 7px; cursor: pointer;
  }
  .refresh-btn {
    padding: 7px 12px; font-size: 12px; background: white; color: #667eea;
    border: 1px solid #667eea; border-radius: 6px; cursor: pointer; margin-top: 6px;
  }

  .title-bar {
    background: white; border-radius: 10px 10px 0 0; padding: 14px 12px;
    font-size: 15px; font-weight: 700; text-align: center;
    border-bottom: 1.5px solid #202124;
  }
  .meta-bar {
    background: white; padding: 6px 12px; font-size: 11px; color: #5f6368;
    display: flex; justify-content: space-between; align-items: center;
  }

  .table-wrap {
    background: white; border-radius: 0 0 10px 10px; overflow-x: auto;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  table {
    border-collapse: collapse; width: 100%; min-width: 720px; font-size: 12px;
  }
  th, td {
    padding: 7px 6px; border: 1px solid #e8eaed; text-align: center; white-space: nowrap;
  }
  thead th {
    background: #f5f6fa; font-weight: 600;
    font-size: 11.5px; border-top: 1.5px solid #202124; border-bottom: 1.5px solid #202124;
  }
  td.amount { text-align: right; padding-right: 10px; }
  td.name { font-weight: 500; }
  .pay-red { color: #d93025; font-weight: 700; }
  .row-empty td { border: none; height: 10px; padding: 0; background: white; }

  .empty, .loading {
    background: white; text-align: center; padding: 40px 20px; color: #5f6368;
    font-size: 14px; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .loading::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
  @keyframes dots {
    0%, 20% { content: ''; } 40% { content: '.'; }
    60% { content: '..'; } 80%, 100% { content: '...'; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div>
      <h1>바우처 이용내역</h1>
      <div class="name" id="providerName">-</div>
    </div>
    <div class="header-btns">
      <button id="refreshBtn" title="데이터 새로고침">↻</button>
      <button id="changePwBtn">비번변경</button>
      <button id="logoutBtn">로그아웃</button>
    </div>
  </div>
</div>

<div class="content">
  <div class="tabs">
    <div class="tab active" data-tab="month">월별 전체</div>
    <div class="tab" data-tab="child">아동별 검색</div>
  </div>

  <div class="controls">
    <div class="control-row" id="monthControls">
      <select id="yearSel"></select>
      <select id="monthSel"></select>
    </div>
    <div class="control-row" id="childControls" style="display:none;">
      <input type="text" id="childInput" placeholder="아동 이름 (전체 입력)">
      <button id="searchBtn">검색</button>
    </div>
  </div>

  <div id="resultWrap"><div class="loading">불러오는 중</div></div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyDLm7VCcRNmPrK08waOFx3JHt9lvxP22coImDfK9xfWNheiS11My2xcJJrqrE6GVRPSw/exec';
const STORAGE_KEY = 'saenggak_voucher_session';

const $ = id => document.getElementById(id);

function getSession() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; } }
function clearSession() { localStorage.removeItem(STORAGE_KEY); }

async function apiCall(params) {
  const url = API_URL + '?' + Object.keys(params).map(k =>
    encodeURIComponent(k) + '=' + encodeURIComponent(params[k])
  ).join('&');
  const res = await fetch(url, { method: 'GET', redirect: 'follow' });
  return res.json();
}

// 인증/세션 만료성 에러면 true (로그인 화면으로 돌려보내야 하는 에러)
function isAuthError(err) {
  return !!err && (err.indexOf('세션') >= 0 || err.indexOf('로그인') >= 0 ||
    err.indexOf('인증') >= 0 || err.indexOf('선생님 정보') >= 0);
}

const session = getSession();
if (!session) location.href = 'login.html';
$('providerName').textContent = session.name + ' 선생님';

// ───── 클라이언트 전역 캐시 ─────
let allRecords = [];       // 본인 전체 데이터
let availableMonths = [];  // [{year, month}]
let latestUpdate = '';
let currentTab = 'month';

// 탭 전환 — 서버 호출 없음, 즉시
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.tab;

    if (currentTab === 'child') {
      $('monthControls').style.display = 'none';
      $('childControls').style.display = 'flex';
      $('resultWrap').innerHTML = '<div class="empty">아동 이름을 입력하고 검색해주세요.</div>';
      $('childInput').focus();
    } else {
      $('monthControls').style.display = 'flex';
      $('childControls').style.display = 'none';
      renderMonthView();
    }
  });
});

$('yearSel').addEventListener('change', () => {
  updateMonthSelect();
  renderMonthView();
});
$('monthSel').addEventListener('change', renderMonthView);

$('searchBtn').addEventListener('click', searchByChild);
$('childInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchByChild();
});

$('refreshBtn').addEventListener('click', async () => {
  $('refreshBtn').disabled = true;
  $('refreshBtn').textContent = '...';
  await loadAllData(true);
  $('refreshBtn').disabled = false;
  $('refreshBtn').textContent = '↻';
});

// ───── 초기 전체 로드 (1회) ─────
async function loadAllData(forceRefresh) {
  if (!forceRefresh && allRecords.length > 0) return; // 이미 로드됨

  $('resultWrap').innerHTML = '<div class="loading">전체 데이터 불러오는 중</div>';

  const params = { action: 'queryMyAllData', token: session.token };
  if (forceRefresh) params._t = Date.now(); // 캐시 우회용 dummy

  try {
    const res = await apiCall(params);
    if (res.error) {
      if (isAuthError(res.error)) { clearSession(); location.href = 'login.html'; return; }
      $('resultWrap').innerHTML = '<div class="empty">' + res.error + '</div>';
      return;
    }

    allRecords = res.records || [];
    availableMonths = res.months || [];
    latestUpdate = res.latestUpdate || '';

    if (availableMonths.length === 0) {
      $('resultWrap').innerHTML = '<div class="empty">이용내역이 없습니다.</div>';
      return;
    }

    // 연도 드롭다운 채우기
    const years = [...new Set(availableMonths.map(m => m.year))].sort((a,b) => b - a);
    const yearSel = $('yearSel');
    yearSel.innerHTML = '';
    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y + '년';
      yearSel.appendChild(opt);
    });

    updateMonthSelect();
    renderMonthView();
  } catch (e) {
    $('resultWrap').innerHTML = '<div class="empty">네트워크 오류: ' + e.message + '</div>';
  }
}

function updateMonthSelect() {
  const year = Number($('yearSel').value);
  const monthSel = $('monthSel');
  const prev = Number(monthSel.value);
  monthSel.innerHTML = '';

  const months = availableMonths
    .filter(m => m.year === year)
    .map(m => m.month)
    .sort((a,b) => b - a);

  months.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m + '월';
    monthSel.appendChild(opt);
  });

  if (months.indexOf(prev) >= 0) monthSel.value = prev;
}

function getPayClass(type) { return (type === '소급' || type === '취소') ? 'pay-red' : ''; }
function displayType(type) { return type === '보강' ? '-보강' : type; }

function renderTable(records, titleText) {
  const wrap = $('resultWrap');

  if (!records || records.length === 0) {
    wrap.innerHTML = '<div class="title-bar">' + titleText + '</div>' +
      '<div class="empty">이용내역이 없습니다.</div>';
    return;
  }

  let seq = 0;
  records.forEach(r => {
    if (r.paymentType === '취소') r._seq = '';
    else { seq++; r._seq = seq; }
  });

  const rowsHtml = [];
  let prevType = null, prevChild = null, prevYm = null;
  records.forEach(r => {
    const ym = r.date.substring(0, 7);
    if (prevType !== null && (r.serviceType !== prevType || r.childName !== prevChild || ym !== prevYm)) {
      rowsHtml.push('<tr class="row-empty"><td colspan="10"></td></tr>');
    }
    const cls = getPayClass(r.paymentType);
    rowsHtml.push(
      '<tr>' +
        '<td>' + r._seq + '</td>' +
        '<td class="name">' + r.childName + '</td>' +
        '<td>' + (r.dateDisplay || r.date) + '</td>' +
        '<td>' + r.time + '</td>' +
        '<td class="' + cls + '">' + displayType(r.paymentType) + '</td>' +
        '<td class="amount">' + r.amount + '</td>' +
        '<td>' + r.birth + '</td>' +
        '<td>' + r.serviceType + '</td>' +
        '<td>' + r.paymentProvider + '</td>' +
        '<td>' + (r.center || '') + '</td>' +
      '</tr>'
    );
    prevType = r.serviceType;
    prevChild = r.childName;
    prevYm = ym;
  });

  wrap.innerHTML =
    '<div class="title-bar">' + titleText + '</div>' +
    '<div class="meta-bar">' +
      '<span>' + (latestUpdate ? '최신화: ' + latestUpdate : '') + '</span>' +
      '<span>제공인력: ' + session.name + '</span>' +
    '</div>' +
    '<div class="table-wrap">' +
      '<table>' +
        '<thead><tr>' +
          '<th>순번</th><th>대상자명</th><th>결제일시</th><th>결제시간</th>' +
          '<th>구분</th><th>승인금액</th><th>생년월일</th><th>유형</th>' +
          '<th>제공인력</th><th>센터</th>' +
        '</tr></thead>' +
        '<tbody>' + rowsHtml.join('') + '</tbody>' +
      '</table>' +
    '</div>';
}

// ───── 월별 전체 (클라이언트 필터) ─────
function renderMonthView() {
  const year = Number($('yearSel').value);
  const month = Number($('monthSel').value);
  if (!year || !month) {
    $('resultWrap').innerHTML = '<div class="empty">이용내역이 없습니다.</div>';
    return;
  }

  const mm = ('0' + month).slice(-2);
  const ymPrefix = year + '-' + mm;
  const filtered = allRecords.filter(r => r.date.substring(0, 7) === ymPrefix);

  renderTable(filtered, year + '년 ' + month + '월 바우처 이용내역 조회');
}

// ───── 아동별 검색 (서버: 전체 대장 완전일치, 전 기간) ─────
async function searchByChild() {
  const name = $('childInput').value.trim();
  if (!name) { alert('아동 이름을 적어주세요.'); $('childInput').focus(); return; }
  if (name.length < 2) { alert('아동 이름을 2글자 이상 적어주세요.'); $('childInput').focus(); return; }

  $('resultWrap').innerHTML = '<div class="loading">검색하고 있어요</div>';
  try {
    const res = await apiCall({ action: 'queryAllByChild', token: session.token, child: name });
    if (res.error) {
      if (isAuthError(res.error)) { clearSession(); location.href = 'login.html'; return; }
      $('resultWrap').innerHTML = '<div class="empty">' + res.error + '</div>';
      return;
    }
    if (res.latestUpdate) latestUpdate = res.latestUpdate;
    renderTable(res.records || [], '"' + name + '" 바우처 이용내역 조회 (전체 기간)');
  } catch (e) {
    $('resultWrap').innerHTML = '<div class="empty">네트워크 오류: ' + e.message + '</div>';
  }
}

$('logoutBtn').addEventListener('click', async () => {
  if (!confirm('로그아웃 하시겠습니까?')) return;
  try { await apiCall({ action: 'authLogout', token: session.token }); } catch {}
  clearSession();
  location.href = 'login.html';
});
$('changePwBtn').addEventListener('click', () => {
  if (confirm('비밀번호 변경을 위해 로그인 페이지로 이동합니다.')) location.href = 'login.html';
});

// 시작
loadAllData();
</script>
</body>
</html>
