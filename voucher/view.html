<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>바우처 이용내역 — 생각공작소</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="/saenggak/favicon.js"></script>
<style>
  :root{
    --green:#3a8a5f; --green-d:#2f6f4d; --green-l:#eaf5ee;
    --g900:#191f28; --g700:#4e5968; --g500:#8b95a1; --g400:#b0b8c1; --g300:#d1d6db;
    --g200:#e5e8eb; --g100:#f2f4f6; --red:#f04452;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:#fff;color:var(--g900);word-break:keep-all;line-height:1.5;-webkit-text-size-adjust:100%;}
  .wrap{max-width:920px;margin:0 auto;padding:0 0 60px;}

  .head{position:sticky;top:0;z-index:10;background:#fff;padding:14px 20px 12px;border-bottom:1px solid var(--g100);}
  .back{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:none;background:#fff;color:var(--g700);text-decoration:none;margin:0 0 4px -8px;}
  .back:active{background:var(--g100);}
  .back svg{width:24px;height:24px;}
  h1{font-size:20px;font-weight:700;letter-spacing:-.5px;}
  .who{display:inline-block;font-size:13px;font-weight:700;color:var(--green-d);background:var(--green-l);border-radius:8px;padding:5px 11px;margin-top:8px;}
  .who.admin{color:#1967d2;background:#e8f0fe;}

  .body{padding:16px 20px;}

  .seg{display:flex;background:var(--g100);border-radius:13px;padding:4px;gap:4px;margin-bottom:16px;}
  .seg button{flex:1;padding:11px;border:none;background:none;border-radius:10px;font-family:inherit;font-weight:600;color:var(--g500);font-size:14.5px;cursor:pointer;transition:.12s;}
  .seg button.active{background:#fff;color:var(--green-d);box-shadow:0 1px 4px rgba(0,0,0,.08);}

  .controls{margin-bottom:16px;}
  .row{display:flex;gap:8px;}
  .row + .row{margin-top:8px;}
  select,.search-in{font-family:inherit;font-size:15px;padding:13px 14px;border:2px solid transparent;border-radius:13px;background:var(--g100);outline:none;width:100%;color:var(--g900);transition:.15s;-webkit-appearance:none;}
  select:focus,.search-in:focus{background:#fff;border-color:var(--green);}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%238b95a1' d='M1 1l5 6 5-6'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:34px;}
  .search-btn{flex-shrink:0;padding:13px 22px;font-family:inherit;font-size:15px;font-weight:700;background:var(--green);color:#fff;border:none;border-radius:13px;cursor:pointer;}
  .search-btn:active{background:var(--green-d);}

  .title-bar{font-size:15px;font-weight:700;color:var(--g900);padding:8px 2px 6px;}
  .meta{font-size:12.5px;color:var(--g500);margin-bottom:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;}

  .table-wrap{overflow-x:auto;border:1px solid var(--g200);border-radius:14px;-webkit-overflow-scrolling:touch;}
  table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px;}
  th,td{padding:9px 8px;border-bottom:1px solid var(--g100);text-align:center;white-space:nowrap;}
  thead th{background:var(--g100);font-weight:600;color:var(--g700);font-size:12.5px;}
  td.name{font-weight:600;}
  td.amount{text-align:right;padding-right:12px;font-variant-numeric:tabular-nums;}
  .pay-red{color:var(--red);font-weight:700;}
  .row-gap td{border:none;height:8px;background:#fff;padding:0;}

  .state{text-align:center;padding:48px 20px;color:var(--g500);font-size:14.5px;}
  .ld-dots{display:inline-block;margin-left:2px;}
  .ld-dots i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--g400);margin:0 1.5px;animation:bo 1s infinite;}
  .ld-dots i:nth-child(2){animation-delay:.15s;} .ld-dots i:nth-child(3){animation-delay:.3s;}
  @keyframes bo{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}

  /* 다른 아동 경계 = 더 큰 간격(같은 아동 내 월/서비스 전환은 기본 8px) */
  .row-gap.big td{height:20px;}

  /* 모바일(≤640px): 가로 테이블 → 카드형(라벨:값). 좌우 한 화면, 위아래만 스크롤 */
  @media (max-width:640px){
    .table-wrap{border:none;overflow-x:visible;}
    table{min-width:0;}
    thead{display:none;}
    table,tbody,tr,td{display:block;width:100%;}
    tr:not(.row-gap){border:1px solid var(--g200);border-radius:12px;margin-bottom:8px;padding:7px 13px;}
    td{border:none;display:flex;justify-content:space-between;align-items:baseline;gap:14px;text-align:right;padding:4px 0;white-space:normal;}
    td::before{content:attr(data-label);color:var(--g500);font-weight:600;text-align:left;flex-shrink:0;}
    td.amount{padding-right:0;}
    .row-gap{display:none;}
    .row-gap.big{display:block;height:8px;}
    .row-gap.big td{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <a class="back" href="../tablet/index.html" aria-label="뒤로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <h1>바우처 이용내역</h1>
    <div class="who" id="who">-</div>
  </div>

  <div class="body">
    <div class="seg" id="seg"></div>
    <div class="controls" id="controls"></div>
    <div id="resultWrap"></div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyDLm7VCcRNmPrK08waOFx3JHt9lvxP22coImDfK9xfWNheiS11My2xcJJrqrE6GVRPSw/exec';
const SESS_KEY = 'tf_staff_v1';            // 11 OTP 세션(제공인력)
const ADMIN_KEY = 'saenggak_admin_token';  // ACCESS_TOKEN(행정) — provider-map과 공유
const HUB_URL = '../tablet/index.html';
const $ = id => document.getElementById(id);

function getSess(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY)); }catch(e){ return null; } }
function clearSess(){ try{ localStorage.removeItem(SESS_KEY); }catch(e){} }
function getAdminToken(){ try{ return localStorage.getItem(ADMIN_KEY) || ''; }catch(e){ return ''; } }
function clearAdmin(){ try{ localStorage.removeItem(ADMIN_KEY); }catch(e){} }
function goHub(){ location.replace(HUB_URL); }
function bounceAuth(){ clearSess(); goHub(); }    // 11 세션 거부 → 비우고 허브(재OTP)
function bounceAdmin(){ clearAdmin(); alert('행정 인증이 만료됐어요. 다시 등록해주세요.'); goHub(); }

function isAuthError(err){ return !!err && (err.indexOf('세션')>=0 || err.indexOf('로그인')>=0 || err.indexOf('만료')>=0); }

async function apiCall(params){
  const url = GAS_URL + '?' + Object.keys(params).map(k => encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
  const res = await fetch(url, { method:'GET', redirect:'follow' });
  return res.json();
}

// ── 역할(모드) 판정 ── 행정키 우선 → 11 세션 → 없으면 허브
const adminToken = getAdminToken();
const sess = getSess();
let MODE = 'none';
if(adminToken){ MODE = 'admin'; }
else if(sess && sess.staffId && sess.session){ MODE = 'provider'; }
else { goHub(); }

// 역할 표시 (디자인원칙 §2.7)
if(MODE === 'admin'){ $('who').textContent = '행정'; $('who').classList.add('admin'); }
else { $('who').textContent = ((sess && sess.name) ? sess.name : '') + ' 선생님'; }

let latestUpdate = '';
function payClass(t){ return (t==='소급'||t==='취소')?'pay-red':''; }
function dispType(t){ return t==='보강'?'-보강':t; }
function loadingHTML(text){ return '<div class="state">'+text+'<span class="ld-dots"><i></i><i></i><i></i></span></div>'; }

function renderTable(records, titleText){
  const wrap=$('resultWrap');
  if(!records||records.length===0){ wrap.innerHTML='<div class="title-bar">'+titleText+'</div><div class="state">이용내역이 없어요.</div>'; return; }
  let seq=0; records.forEach(r=>{ if(r.paymentType==='취소') r._seq=''; else { seq++; r._seq=seq; } });
  const rows=[]; let pt=null,pc=null,pm=null;
  records.forEach(r=>{
    const ym=r.date.substring(0,7);
    if(pt!==null){
      if(r.childName!==pc) rows.push('<tr class="row-gap big"><td colspan="10"></td></tr>');           // 다른 아동 = 큰 간격
      else if(r.serviceType!==pt||ym!==pm) rows.push('<tr class="row-gap"><td colspan="10"></td></tr>'); // 같은 아동 내 = 기본
    }
    const cls=payClass(r.paymentType);
    rows.push('<tr>'+
      '<td data-label="순번">'+r._seq+'</td>'+
      '<td class="name" data-label="대상자명">'+r.childName+'</td>'+
      '<td data-label="결제일시">'+(r.dateDisplay||r.date)+'</td>'+
      '<td data-label="결제시간">'+r.time+'</td>'+
      '<td class="'+cls+'" data-label="구분">'+dispType(r.paymentType)+'</td>'+
      '<td class="amount" data-label="승인금액">'+r.amount+'</td>'+
      '<td data-label="생년월일">'+r.birth+'</td>'+
      '<td data-label="유형">'+r.serviceType+'</td>'+
      '<td data-label="제공인력">'+r.paymentProvider+'</td>'+
      '<td data-label="센터">'+(r.center||'')+'</td>'+
    '</tr>');
    pt=r.serviceType; pc=r.childName; pm=ym;
  });
  wrap.innerHTML='<div class="title-bar">'+titleText+'</div>'+
    '<div class="meta"><span>'+(latestUpdate?'최신화 '+latestUpdate:'')+'</span><span>'+records.length+'건</span></div>'+
    '<div class="table-wrap"><table><thead><tr><th>순번</th><th>대상자명</th><th>결제일시</th><th>결제시간</th><th>구분</th><th>승인금액</th><th>생년월일</th><th>유형</th><th>제공인력</th><th>센터</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
}

// 탭 전환 공통
function bindSeg(onSwitch){
  document.querySelectorAll('.seg button').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      onSwitch(t.dataset.tab);
    });
  });
}

// ════════════ 제공인력 모드 ════════════
let allRecords=[], availableMonths=[];

function initProvider(){
  $('seg').innerHTML = '<button class="active" data-tab="month">월별 전체</button><button data-tab="child">아동별 검색</button>';
  $('controls').innerHTML =
    '<div class="row" id="monthControls"><select id="yearSel"></select><select id="monthSel"></select></div>'+
    '<div class="row" id="childControls" style="display:none;"><input class="search-in" type="text" id="childInput" placeholder="아동 이름 (전체 입력)"><button class="search-btn" id="childBtn">검색</button></div>';
  $('resultWrap').innerHTML = loadingHTML('불러오는 중');

  bindSeg(tab=>{
    if(tab==='child'){
      $('monthControls').style.display='none'; $('childControls').style.display='flex';
      $('resultWrap').innerHTML='<div class="state">아동 이름을 적고 검색해주세요.</div>'; $('childInput').focus();
    }else{
      $('monthControls').style.display='flex'; $('childControls').style.display='none'; renderMonthView();
    }
  });
  $('yearSel').addEventListener('change', ()=>{ updateMonthSelect(); renderMonthView(); });
  $('monthSel').addEventListener('change', renderMonthView);
  $('childBtn').addEventListener('click', pSearchChild);
  $('childInput').addEventListener('keydown', e=>{ if(e.key==='Enter') pSearchChild(); });

  loadAllData();
}

async function loadAllData(){
  const res = await apiCall({ action:'queryMyAllData', staffId:sess.staffId, session:sess.session });
  if(res.error){
    if(isAuthError(res.error)){ bounceAuth(); return; }
    $('resultWrap').innerHTML='<div class="state">'+res.error+'</div>'; return;
  }
  allRecords=res.records||[]; availableMonths=res.months||[]; latestUpdate=res.latestUpdate||'';
  if(res.providerName) $('who').textContent=res.providerName+' 선생님';
  if(availableMonths.length===0){ $('resultWrap').innerHTML='<div class="state">이용내역이 없어요.</div>'; return; }
  const years=[...new Set(availableMonths.map(m=>m.year))].sort((a,b)=>b-a);
  const ys=$('yearSel'); ys.innerHTML='';
  years.forEach(y=>{ const o=document.createElement('option'); o.value=y; o.textContent=y+'년'; ys.appendChild(o); });
  updateMonthSelect(); renderMonthView();
}
function updateMonthSelect(){
  const year=Number($('yearSel').value); const ms=$('monthSel'); const prev=Number(ms.value); ms.innerHTML='';
  const months=availableMonths.filter(m=>m.year===year).map(m=>m.month).sort((a,b)=>b-a);
  months.forEach(m=>{ const o=document.createElement('option'); o.value=m; o.textContent=m+'월'; ms.appendChild(o); });
  if(months.indexOf(prev)>=0) ms.value=prev;
}
function renderMonthView(){
  const year=Number($('yearSel').value), month=Number($('monthSel').value);
  if(!year||!month){ $('resultWrap').innerHTML='<div class="state">이용내역이 없어요.</div>'; return; }
  const mm=('0'+month).slice(-2), ymP=year+'-'+mm;
  renderTable(allRecords.filter(r=>r.date.substring(0,7)===ymP), year+'년 '+month+'월 이용내역');
}
async function pSearchChild(){
  const name=$('childInput').value.trim();
  if(!name){ alert('아동 이름을 적어주세요.'); $('childInput').focus(); return; }
  if(name.length<2){ alert('아동 이름을 2글자 이상 적어주세요.'); $('childInput').focus(); return; }
  $('resultWrap').innerHTML=loadingHTML('검색하고 있어요');
  try{
    const res=await apiCall({ action:'queryAllByChild', staffId:sess.staffId, session:sess.session, child:name });
    if(res.error){ if(isAuthError(res.error)){ bounceAuth(); return; } $('resultWrap').innerHTML='<div class="state">'+res.error+'</div>'; return; }
    if(res.latestUpdate) latestUpdate=res.latestUpdate;
    renderTable(res.records||[], '"'+name+'" 이용내역 (전체 기간)');
  }catch(e){ $('resultWrap').innerHTML='<div class="state">네트워크 오류: '+e.message+'</div>'; }
}

// ════════════ 행정 모드 ════════════
function initAdmin(){
  const ny = new Date().getFullYear();
  const yearOpts = [ny, ny-1, ny-2].map(y=>'<option value="'+y+'">'+y+'년</option>').join('');
  let monthOpts = '<option value="">전체 월</option>';
  for(let m=1;m<=12;m++) monthOpts += '<option value="'+m+'">'+m+'월</option>';

  $('seg').innerHTML = '<button class="active" data-tab="prov">제공인력별</button><button data-tab="child">아동별 검색</button>';
  $('controls').innerHTML =
    '<div id="provControls">'+
      '<div class="row"><input class="search-in" type="text" id="provInput" placeholder="제공인력 이름"></div>'+
      '<div class="row"><select id="aYear">'+yearOpts+'</select><select id="aMonth">'+monthOpts+'</select><button class="search-btn" id="provBtn">검색</button></div>'+
    '</div>'+
    '<div class="row" id="acControls" style="display:none;"><input class="search-in" type="text" id="acInput" placeholder="아동 이름 (전체 입력)"><button class="search-btn" id="acBtn">검색</button></div>';
  $('resultWrap').innerHTML = '<div class="state">제공인력 이름과 월을 정해 검색해주세요.</div>';

  bindSeg(tab=>{
    if(tab==='child'){
      $('provControls').style.display='none'; $('acControls').style.display='flex';
      $('resultWrap').innerHTML='<div class="state">아동 이름을 적고 검색해주세요.</div>'; $('acInput').focus();
    }else{
      $('provControls').style.display='block'; $('acControls').style.display='none';
      $('resultWrap').innerHTML='<div class="state">제공인력 이름과 월을 정해 검색해주세요.</div>'; $('provInput').focus();
    }
  });
  $('provBtn').addEventListener('click', aSearchProvider);
  $('provInput').addEventListener('keydown', e=>{ if(e.key==='Enter') aSearchProvider(); });
  $('acBtn').addEventListener('click', aSearchChild);
  $('acInput').addEventListener('keydown', e=>{ if(e.key==='Enter') aSearchChild(); });
}

async function aSearchProvider(){
  const prov=$('provInput').value.trim();
  if(!prov){ alert('제공인력 이름을 적어주세요.'); $('provInput').focus(); return; }
  const year=$('aYear').value, month=$('aMonth').value;
  $('resultWrap').innerHTML=loadingHTML('검색하고 있어요');
  try{
    const res=await apiCall({ action:'queryProviderAdmin', t:adminToken, provider:prov, year:year, month:month });
    if(res.error){ if(res.error.indexOf('Unauthorized')>=0){ bounceAdmin(); return; } $('resultWrap').innerHTML='<div class="state">'+res.error+'</div>'; return; }
    latestUpdate=res.latestUpdate||'';
    const title = prov+' '+(year?year+'년 ':'')+(month?month+'월 ':'(전체 기간) ')+'이용내역';
    renderTable(res.records||[], title);
  }catch(e){ $('resultWrap').innerHTML='<div class="state">네트워크 오류: '+e.message+'</div>'; }
}
async function aSearchChild(){
  const name=$('acInput').value.trim();
  if(!name){ alert('아동 이름을 적어주세요.'); $('acInput').focus(); return; }
  if(name.length<2){ alert('아동 이름을 2글자 이상 적어주세요.'); $('acInput').focus(); return; }
  $('resultWrap').innerHTML=loadingHTML('검색하고 있어요');
  try{
    const res=await apiCall({ action:'queryChildAdmin', t:adminToken, child:name });
    if(res.error){ if(res.error.indexOf('Unauthorized')>=0){ bounceAdmin(); return; } $('resultWrap').innerHTML='<div class="state">'+res.error+'</div>'; return; }
    if(res.latestUpdate) latestUpdate=res.latestUpdate;
    renderTable(res.records||[], '"'+name+'" 이용내역 (전체 기간)');
  }catch(e){ $('resultWrap').innerHTML='<div class="state">네트워크 오류: '+e.message+'</div>'; }
}

// ── 부팅 ──
if(MODE==='admin') initAdmin();
else if(MODE==='provider') initProvider();
</script>
</body>
</html>
