name: 부재중 알림톡 화면 지우기

# 2026-10-27 유성 「이 주소는 30일이 되면 자동 삭제시킬 것. 28일에 현아선생님이 확인하기 때문」.
# 한국 10월 30일 0시부터 missed/ 폴더를 지우고 푸시 → GitHub Pages 재배포(봇 푸시도 Pages가 다시 빌드 — kr month-plan.yml과 같은 결, 10-26 실측).
# 예약 실행은 GitHub 부하로 늦거나 빠질 수 있어 한 시간마다 다시 본다. 이미 지웠으면 아무것도 안 하고, 지운 뒤엔 이 워크플로를 스스로 끈다.
# 이 파일을 봇이 지우지 않는 이유 = GITHUB_TOKEN은 .github/workflows 파일을 바꾸는 푸시가 거부될 수 있어서(그러면 missed/ 삭제까지 같이 실패).
on:
  schedule:
    - cron: '7 15-23 29 10 *'   # UTC 10-29 15:07~23:07 = 한국 10-30 0:07~8:07
    - cron: '7 * 30-31 10 *'    # UTC 10-30~31 매시 = 한국 10-30 9:07 ~ 11-01 8:07
  workflow_dispatch:
    inputs:
      dry:
        description: '시험(지우지 않고 지울 파일만 보기)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: remove-missed
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: missed/ 지우기
        run: |
          if [ ! -d missed ]; then
            echo "missed/ 없음 — 이미 지움"
            if [ "${{ inputs.dry }}" != "true" ]; then gh workflow disable remove-missed.yml || true; fi
            exit 0
          fi
          if [ "${{ inputs.dry }}" = "true" ]; then
            echo "시험 — 지울 파일:"
            git ls-files missed
            exit 0
          fi
          git config user.name "think-factory-bot"
          git config user.email "noreply@think-factory.kr"
          git rm -r --quiet missed
          git commit -m "chore: 부재중 알림톡 안내 화면 지움 (10-30 자동, 유성 10-27)"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ] || exit 1
          gh workflow disable remove-missed.yml || true
