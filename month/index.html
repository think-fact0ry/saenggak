<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>월 계획안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!--
  07 월 계획안 센터 발송 — 현아쌤 화면 (2026-10-12 자리 지킴이, 유성 「내일 업무로 그 주소 주고 북마크 해라」).
  즐겨찾기 하나('월 계획안') 안에 25일 명단, 답 처리, 1일 못 받은 아이가 들어온다(1단계, 10/23까지). 지금은 열쇠만 저장한다.
  열쇠 = 주소 # 뒤(서버로 안 감) → 이 브라우저에 저장 → 주소창에서 지움 → 다음부턴 짧은 주소로 열린다(24 feedback/과 같은 방식).
  열쇠 값의 정본 = 07 Script Properties MP_SCREEN_KEY(메뉴 📨 월 계획안 › 🔑 현아쌤 화면 주소). 데이터는 1단계 07 doPost가 열쇠를 확인한 뒤에만 준다.
-->
<style>
:root{--bg:#f6f7f6;--card:#fff;--ink:#1d2321;--sub:#5d6662;--line:#e3e7e5;--g:#3a8a5f;--g7:#166841;--gw:#e9f8ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif;line-height:1.6;word-break:keep-all}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 80px}h1{font-size:24px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.ok{display:flex;gap:10px;align-items:flex-start;font-size:16px;font-weight:700;color:var(--g7)}
.ok i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--gw);display:grid;place-items:center;margin-top:2px}
.sub{color:var(--sub);font-size:15px;margin:10px 0 0}
</style></head><body><div class="wrap">
<h1>월 계획안</h1>
<div class="card" id="box"></div>
</div>
<script>
(function () {
  var KEY_STORE = 'mp-key';
  var box = document.getElementById('box');
  var key = '';
  var h = location.hash.replace(/^#/, '');
  if (/^[0-9a-f]{32}$/.test(h)) {
    key = h;
    try { localStorage.setItem(KEY_STORE, key); } catch (e) {}
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  } else {
    try { key = localStorage.getItem(KEY_STORE) || ''; } catch (e) {}
  }
  if (!key) {
    box.innerHTML = '<p class="sub" style="margin:0">이 컴퓨터에서는 처음이라 열 수 없어요. 대표님께 받은 링크로 한 번만 열어주세요. 그 다음부터는 이 주소로 바로 열려요.</p>';
    return;
  }
  box.innerHTML = '<div class="ok"><i><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#166841" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>이 컴퓨터는 준비됐어요</div>' +
    '<p class="sub">매달 25일 발송 명단과 1일 못 받은 아이를 이 화면에서 봐요. 첫 명단은 10월 26일(월)에 떠요.</p>';
})();
</script>
</body></html>
