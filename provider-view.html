<!DOCTYPE html>
<html lang="ko">
<head>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Pretendard','Noto Sans KR',sans-serif;color:#1a1a1a;background:#f0ebe4}
  .controls{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.06);padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hdr-icon{width:28px;height:28px;background:#3a6b4e;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}

  .divider{width:1px;height:22px;background:#e0dcd5;flex-shrink:0}
  .search-wrap{position:relative;flex:1;max-width:180px}
  .search-input{width:100%;padding:6px 10px;border:1.5px solid #d4cfc6;border-radius:7px;font-size:12px;font-family:inherit;outline:none;background:#fff}

  .search-results{display:none;position:absolute;top:100%;left:0;right:0;z-index:60;background:#fff;border:1px solid #e0dcd5;border-radius:0 0 8px 8px;box-shadow:0 4px 16px rgba(0,0,0,.1);max-height:240px;overflow-y:auto}
  .search-results.show{display:block}
  .sr-item{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer;border-bottom:1px solid #f5f5f5;font-size:12px;transition:background .1s}
  .sr-item:hover{background:#f5f3ef}
  .sr-name{font-weight:600;min-width:40px}.sr-sub{color:#888;font-size:11px;flex:1}
  .sr-none{padding:12px;text-align:center;font-size:12px;color:#bbb}
  .sr-hdr{padding:5px 10px;font-size:10px;color:#999;font-weight:600;border-bottom:1px solid #eee}
  #map{position:fixed;top:76px;left:0;right:0;bottom:0}
  .iw{padding:10px 14px;font-family:inherit;font-size:12.5px;line-height:1.55;min-width:180px;max-width:280px;max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;box-sizing:border-box}
  .iw-title{font-weight:700;font-size:14px;margin-bottom:3px}
  .iw-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:4px;vertical-align:middle}
  .iw-badge.home{background:#dbeafe;color:#2563eb}.iw-badge.child{background:#dcfce7;color:#16a34a}
  .iw-row{color:#666;font-size:12px}
  .iw-times{margin-top:3px;font-size:11.5px;color:#7c3aed;font-weight:500}
  .iw-phone{margin-top:2px;font-size:12px}.iw-phone a{color:#3b82f6;text-decoration:none;font-weight:500}
  .iw-notes{margin-top:4px;font-size:11px;color:#333;background:#f5f3ef;padding:4px 8px;border-radius:5px;line-height:1.5;white-space:pre-wrap;border-left:2px solid #7c3aed}
  .iw-edit{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:5px;padding:5px 6px;background:#f5f3ef;border-radius:6px}

  .iw-edit-btn{padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid #3a6b4e;color:#3a6b4e;background:#fff}

  .iw-actions{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .iw-act{padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid #ccc;color:#555;background:#fff;transition:all .15s;white-space:nowrap;font-family:inherit}
  .iw-act:hover{background:#f5f5f5}

  .iw-act.to{border-color:#ef4444;color:#dc2626}.iw-act.to:hover{background:#fee2e2}
  .route-panel{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);z-index:45;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-radius:12px;padding:12px 16px;box-shadow:0 4px 20px rgba(0,0,0,.12);display:none;min-width:240px;max-width:340px}
  .route-panel.show{display:block}
  .route-row{display:flex;align-items:center;gap:8px;font-size:13px}
  .rdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.rdot.from{background:#22c55e}.rdot.to{background:#ef4444}
  .rname{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rname.empty{color:#bbb;font-weight:400}
  .rclear{cursor:pointer;color:#ccc;font-size:16px;padding:0 4px}.rclear:hover{color:#999}
  .rarrow{text-align:center;color:#ccc;font-size:11px;margin:2px 0}
  .route-go{display:block;margin-top:8px;padding:10px;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;text-align:center;text-decoration:none;color:#fff;transition:all .15s}
  .route-go.ready{background:#3b82f6}.route-go.ready:hover{background:#2563eb}
  .route-go.disabled{background:#ddd;color:#aaa;pointer-events:none}
  .legend{position:fixed;bottom:16px;left:14px;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:10px;padding:8px 12px;box-shadow:0 2px 12px rgba(0,0,0,.1);font-size:11px;display:flex;gap:12px;pointer-events:none}
  .legend-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
  .ldot{width:9px;height:9px;border-radius:50%;flex-shrink:0}.ldot.home{background:#3b82f6}.ldot.child{background:#22c55e}
  .loading-overlay{position:fixed;inset:0;z-index:100;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center}

  .toast{position:fixed;top:54px;left:50%;transform:translateX(-50%);z-index:60;background:#842029;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:none}

  .trip-bar.show{display:flex}

  .tm-btn{flex:1;padding:6px 6px;border:1.5px solid #e0dcd5;background:#fff;color:#888;border-radius:8px;font-size:11.5px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent}

  .trip-list::-webkit-scrollbar{display:none}

  .trip-item:active{cursor:grabbing}
  .trip-item.sortable-chosen{transform:scale(1.08);box-shadow:0 4px 14px rgba(0,0,0,.18);border-color:#3a6b4e;background:#eef5e9;z-index:10}
  .trip-item.sortable-ghost{opacity:.35}

  .trip-rank.empty{background:#bbb}
  .trip-name{font-weight:600;color:#333;white-space:nowrap}
  .trip-chip-nav{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#3a6b4e;color:#fff;font-size:12px;text-decoration:none;margin-left:2px;flex-shrink:0}
  .trip-chip-nav:active{background:#2d5540}
  .trip-start{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 14px;background:#3a6b4e;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;text-decoration:none;cursor:pointer;transition:background .15s}
  .trip-start:active{background:#2d5540}
  .trip-start.disabled{background:#d4cfc6;pointer-events:none;cursor:not-allowed}
  .trip-start .count{background:rgba(255,255,255,.2);padding:2px 8px;border-radius:12px;font-size:12px;font-weight:600;margin-left:4px}
  .trip-hint{font-size:10.5px;color:#999;text-align:center;margin-top:-2px}
  body.trip-active .legend{display:none}
  @media(max-width:480px){.controls{padding:6px 10px;gap:5px}}
</style>
</head>
<body>
<div class="controls">
  <div class="hdr-icon" id="hdrIcon">?</div>
  <div class="hdr-name" id="hdrName">로딩 중...</div>
  <div class="hdr-count" id="hdrCount">0명</div>
  <div class="divider"></div>
  <div class="search-wrap">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 아동 이름 또는 주소" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>
<div class="day-filter" id="dayFilter">
  <button class="day-btn active" id="dayAll" data-day="" onclick="filterDay('')">전체</button>
  <button class="day-btn" data-day="월" onclick="filterDay('월')">월</button>
  <button class="day-btn" data-day="화" onclick="filterDay('화')">화</button>
  <button class="day-btn" data-day="수" onclick="filterDay('수')">수</button>
  <button class="day-btn" data-day="목" onclick="filterDay('목')">목</button>
  <button class="day-btn" data-day="금" onclick="filterDay('금')">금</button>

</div>
<div class="trip-bar" id="tripBar">
  <div class="trip-mode" id="tripMode">
    <button type="button" class="tm-btn active" data-mode="car">🚗 자동차</button>
    <button type="button" class="tm-btn" data-mode="traffic">🚇 대중교통</button>
    <button type="button" class="tm-btn" data-mode="walk">🚶 도보</button>
  </div>
  <div class="trip-list" id="tripList"></div>
  <div class="trip-hint" id="tripHint"></div>
  <a class="trip-start" id="tripStart" target="_blank" rel="noopener">
    🧭 <span id="tripStartLabel">동선 시작</span>
    <span class="count" id="tripCount">0명</span>
  </a>
</div>
<div id="map"></div>
<div class="empty-msg" id="emptyMsg" style="display:none">배정된 아동이 없습니다.</div>
<div class="route-panel" id="routePanel">
  <div class="route-row"><div class="rdot from"></div><div class="rname empty" id="routeFromName">출발지 선택</div><span class="rclear" onclick="clearRoute('from')" style="display:none" id="routeFromClear">✕</span></div>
  <div class="rarrow">▼</div>
  <div class="route-row"><div class="rdot to"></div><div class="rname empty" id="routeToName">도착지 선택</div><span class="rclear" onclick="clearRoute('to')" style="display:none" id="routeToClear">✕</span></div>
  <a class="route-go disabled" id="routeGoBtn" target="_blank">🧭 카카오맵에서 길찾기</a>
</div>
<div class="legend"><div class="legend-item"><div class="ldot home"></div>내 집</div><div class="legend-item"><div class="ldot child"></div>배정 아동</div></div>
<div class="loading-overlay" id="loading"><div class="ld-spinner"></div></div>
<div class="toast" id="toast"></div>
<script>
// ─────────────────────────────────────────────
//  REST 키는 서버 전용. 클라이언트에서는 JavaScript 키만.
// ─────────────────────────────────────────────
var CONFIG={
  GAS_URL:'https://script.google.com/macros/s/AKfycbyDLm7VCcRNmPrK08waOFx3JHt9lvxP22coImDfK9xfWNheiS11My2xcJJrqrE6GVRPSw/exec',
  KAKAO_JS_KEY:'90fa3176ac77c6fc1ae5a165b9f0662c'
};
var map,markers=[],overlays=[],infoWindow,routeFrom=null,routeTo=null,viewData=null,routeLine=null;
var searchMarker=null,searchMarkerIW='',searchMarkerLat=0,searchMarkerLng=0;
var params=new URLSearchParams(window.location.search);var viewToken=params.get('t')||'';
var placesService=null;  // services.Places 인스턴스 (키워드 검색용)

function initMap(){
  map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(37.46,126.70),level:6});
  infoWindow=new kakao.maps.InfoWindow({zIndex:10});
  kakao.maps.event.addListener(map,'click',function(){infoWindow.close()});
  placesService=new kakao.maps.services.Places();
  if(!viewToken){document.getElementById('hdrName').textContent='링크가 유효하지 않습니다';return}
  loadData();
}

function loadData(){
  showLoading(true);
  fetch(CONFIG.GAS_URL+'?action=provview&token='+encodeURIComponent(viewToken),{redirect:'follow'}).then(function(r){return r.json()}).then(function(data){
    showLoading(false);
    if(data.error){document.getElementById('hdrName').textContent=data.error;return}
    viewData=data;var p=data.provider;
    document.getElementById('hdrName').textContent=p.name+' 선생님';
    document.getElementById('hdrIcon').textContent=p.name.charAt(0);
    document.title=p.name+' 선생님 배정 아동 지도';
    var og=document.querySelector('meta[property="og:title"]');if(og)og.content=p.name+' 선생님 배정 아동 지도';
    if(!data.assigned.length){document.getElementById('emptyMsg').style.display='block';return}
    document.getElementById('dayFilter').classList.add('show');
    renderFiltered();
    fitBounds();
  }).catch(function(){showLoading(false);showToast('로드 실패')});
}

function clearMarkers(){markers.forEach(function(m){m.setMap(null)});markers=[];overlays.forEach(function(o){o.setMap(null)});overlays=[];if(routeLine){routeLine.setMap(null);routeLine=null}}
function addMarker(lat,lng,type,iwContent,count,rank){
  if(!lat||!lng)return;var pos=new kakao.maps.LatLng(lat,lng);
  count = count || 1;
  // 숫자 표시 우선순위: 그룹 2명 이상이면 그룹수 / 아니면 rank / 그것도 없으면 숫자 없음
  var displayNum = (count > 1) ? count : (rank || 0);
  var c=type==='home'?{f:'#3b82f6',s:'#1d4ed8'}:{f:'#22c55e',s:'#15803d'};
  var svg, sz, off;
  if(type==='home'){
    svg='<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><path d="M16 30C16 30 4 18 4 12A12 12 0 0128 12C28 18 16 30 16 30Z" fill="'+c.f+'" stroke="'+c.s+'" stroke-width="1.5"/><circle cx="16" cy="12" r="5" fill="#fff"/><path d="M13 13.5L16 10.5L19 13.5V16H17V14H15V16H13Z" fill="'+c.f+'"/></svg>';
    sz=new kakao.maps.Size(32,32);off=new kakao.maps.Point(16,32);
  } else if(displayNum){
    svg='<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"><path d="M15 29C15 29 4 17 4 11A11 11 0 0126 11C26 17 15 29 15 29Z" fill="'+c.f+'" stroke="'+c.s+'" stroke-width="1.3"/><circle cx="15" cy="11" r="7" fill="#fff"/><text x="15" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="'+c.f+'" font-family="sans-serif">'+displayNum+'</text></svg>';
    sz=new kakao.maps.Size(30,30);off=new kakao.maps.Point(15,30);
  } else {
    svg='<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M12 23C12 23 3 14 3 9A9 9 0 0121 9C21 14 12 23 12 23Z" fill="'+c.f+'" stroke="'+c.s+'" stroke-width="1.2"/><circle cx="12" cy="9" r="3.5" fill="#fff"/></svg>';
    sz=new kakao.maps.Size(24,24);off=new kakao.maps.Point(12,24);
  }
  var img=new kakao.maps.MarkerImage('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),sz,{offset:off});
  var m=new kakao.maps.Marker({position:pos,image:img,map:map,zIndex:type==='home'?10:1});
  kakao.maps.event.addListener(m,'click',function(){infoWindow.setContent(iwContent);infoWindow.open(map,m)});
  markers.push(m);
}
function addLabel(lat,lng,text,type){
  var color = type==='home' ? '#1d4ed8' : '#15803d';
  var ov=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(lat,lng),content:'<div style="padding:1px 5px;border-radius:3px;font-size:10px;font-weight:700;white-space:nowrap;pointer-events:none;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;color:'+color+'">'+text+'</div>',yAnchor:type==='home'?2.8:2.5,zIndex:type==='home'?9:4});
  ov.setMap(map);overlays.push(ov);
}
function groupByCoord(items){var g={};items.forEach(function(c){if(!c.lat||!c.lng)return;var k=c.lat.toFixed(6)+','+c.lng.toFixed(6);if(!g[k])g[k]={lat:c.lat,lng:c.lng,items:[]};g[k].items.push(c)});return Object.values(g)}
function fitBounds(){if(!markers.length)return;if(markers.length===1){map.setCenter(markers[0].getPosition());map.setLevel(4);return}var b=new kakao.maps.LatLngBounds();markers.forEach(function(m){b.extend(m.getPosition())});map.setBounds(b,50)}

function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
function escQ(s){return esc(s).replace(/'/g,"\\'")}
function fmtPhone(s){var d=String(s||'').replace(/\D/g,'');if(d.length===11&&/^01/.test(d))return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);return s}
function haversine(a,b,c,d){var R=6371,dL=(c-a)*Math.PI/180,dN=(d-b)*Math.PI/180,x=Math.sin(dL/2)*Math.sin(dL/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)*Math.sin(dN/2);return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function fmtDist(k){return k<1?Math.round(k*1000)+'m':k.toFixed(1)+'km'}
function fmtTimes(t){if(!t||!/[월화수목금토일]-\d/.test(t))return t;var days={};t.split(',').forEach(function(s){s=s.trim();var p=s.split('-');if(p.length<2)return;if(!days[p[0]])days[p[0]]=[];days[p[0]].push(parseInt(p[1]))});var parts=[];['월','화','수','목','금','토','일'].forEach(function(d){if(!days[d])return;var hrs=days[d].sort(function(a,b){return a-b});var ranges=[],st=hrs[0],prev=hrs[0];for(var i=1;i<hrs.length;i++){if(hrs[i]===prev+1)prev=hrs[i];else{ranges.push(st===prev?st+'시':st+'~'+prev+'시');st=hrs[i];prev=hrs[i]}}ranges.push(st===prev?st+'시':st+'~'+prev+'시');parts.push(d+' '+ranges.join(', '))});return parts.join(' | ')}

function routeBtns(name,lat,lng){if(!lat||!lng)return'';return'<div class="iw-actions"><button class="iw-act from" onclick="setRoute(\'from\',\''+escQ(name)+'\','+lat+','+lng+')">🟢 출발</button><button class="iw-act to" onclick="setRoute(\'to\',\''+escQ(name)+'\','+lat+','+lng+')">🔴 도착</button></div>'}

function buildHomeIW(p){return'<div class="iw"><div class="iw-title">'+esc(p.name)+'<span class="iw-badge home">내 집</span></div>'+routeBtns(p.name+' 집',p.lat,p.lng)+'</div>'}

function buildChildIW(items,hLat,hLng){
  var h='<div class="iw">';
  if(items.length>1)h+='<div style="font-size:11px;color:#999;font-weight:600;margin-bottom:4px">같은 위치 '+items.length+'명</div>';
  items.forEach(function(c,i){
    if(i>0)h+='<hr style="border:none;border-top:1px solid #eee;margin:6px 0">';
    var name = (c.name||'').replace(/\s+$/,'');
    var dist='';if(hLat&&hLng&&c.lat&&c.lng)dist='<span style="display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#f3e8ff;color:#7c3aed;margin-left:4px;vertical-align:middle">'+fmtDist(haversine(hLat,hLng,c.lat,c.lng))+'</span>';
    h+='<div class="iw-title">'+esc(name)+'<span class="iw-badge child">배정</span>'+dist+'</div>'
      +'<div class="iw-row">📍 '+esc(c.address)+'</div>';
    if(c.phone)h+='<div class="iw-phone">📞 <a href="tel:'+esc(c.phone)+'">'+esc(fmtPhone(c.phone))+'</a></div>';
    if(c.times)h+='<div class="iw-times">🕐 '+esc(fmtTimes(c.times))+'</div>';

    if(c.formRow){
      var schId = 'sch_'+c.formRow;
      var curDay = c.confirmedDay||'';
      var curOrder = c.confirmedTime||'';
      h+='<div class="iw-edit">';
      if(curDay) h+='<span class="iw-edit-label">✅ '+esc(curDay)+(curOrder?' · '+esc(curOrder)+'번째':'')+'</span>';
      h+='<select id="'+schId+'_day" class="iw-edit-sel">'
        +'<option value="">요일</option>';
      ['월','화','수','목','금','토'].forEach(function(d){
        h+='<option'+(curDay===d?' selected':'')+'>'+d+'</option>';
      });
      h+='</select>'
        +'<button class="iw-edit-btn" onclick="saveSchedule('+c.formRow+',\''+schId+'\')">저장</button>';
      if(curDay) h+='<button class="iw-edit-btn clear" onclick="clearSchedule('+c.formRow+')">초기화</button>';
      h+='</div>';
    }

    if(c.notes)h+='<div class="iw-notes">'+esc(c.notes)+'</div>';
    // 출발/도착 버튼 제거 — 하단 동선 바로 이동이 기본 플로우
  });
  return h+'</div>';
}

function setRoute(type,name,lat,lng){if(type==='from')routeFrom={name:name,lat:lat,lng:lng};else routeTo={name:name,lat:lat,lng:lng};updateRoutePanel();infoWindow.close()}
function clearRoute(type){if(type==='from')routeFrom=null;else routeTo=null;updateRoutePanel()}
function updateRoutePanel(){
  var panel=document.getElementById('routePanel');
  var fn=document.getElementById('routeFromName'),tn=document.getElementById('routeToName');
  var fc=document.getElementById('routeFromClear'),tc=document.getElementById('routeToClear');
  var go=document.getElementById('routeGoBtn');
  if(!routeFrom&&!routeTo){panel.classList.remove('show');clearSearchMarker();return}
  panel.classList.add('show');
  if(routeFrom){fn.textContent=routeFrom.name;fn.classList.remove('empty');fc.style.display=''}else{fn.textContent='출발지 선택';fn.classList.add('empty');fc.style.display='none'}
  if(routeTo){tn.textContent=routeTo.name;tn.classList.remove('empty');tc.style.display=''}else{tn.textContent='도착지 선택';tn.classList.add('empty');tc.style.display='none'}
  if(routeFrom&&routeTo){go.href='https://map.kakao.com/link/from/'+encodeURIComponent(routeFrom.name)+','+routeFrom.lat+','+routeFrom.lng+'/to/'+encodeURIComponent(routeTo.name)+','+routeTo.lat+','+routeTo.lng;go.className='route-go ready'}else{go.href='#';go.className='route-go disabled'}
}

function clearSearchMarker(){if(searchMarker){searchMarker.setMap(null);searchMarker=null;searchMarkerIW=''}}
function placeSearchMarker(lat,lng,iwContent){
  clearSearchMarker();
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><path d="M14 27C14 27 3 16 3 10A11 11 0 0125 10C25 16 14 27 14 27Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1.3"/><circle cx="14" cy="10" r="4" fill="#fff"/><circle cx="14" cy="10" r="2" fill="#ef4444"/></svg>';
  var img=new kakao.maps.MarkerImage('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),new kakao.maps.Size(28,28),{offset:new kakao.maps.Point(14,28)});
  searchMarker=new kakao.maps.Marker({position:new kakao.maps.LatLng(lat,lng),image:img,map:map,zIndex:20});
  searchMarkerIW=iwContent||'';searchMarkerLat=lat;searchMarkerLng=lng;
  kakao.maps.event.addListener(searchMarker,'click',function(){if(searchMarkerIW){infoWindow.setContent(searchMarkerIW);infoWindow.open(map,searchMarker)}});
  return searchMarker;
}

// ══ 검색 (services.Places 사용 — REST 키 제거됨) ══
(function(){
  var input=document.getElementById('searchInput'),results=document.getElementById('searchResults'),debounce;
  input.addEventListener('input',function(){clearTimeout(debounce);debounce=setTimeout(function(){doSearch(input.value.trim())},250)});
  input.addEventListener('focus',function(){if(input.value.trim())doSearch(input.value.trim())});
  document.addEventListener('click',function(e){if(!e.target.closest('.search-wrap'))results.classList.remove('show')});

  function doSearch(q){
    if(!q){results.classList.remove('show');return}
    var html='',childResults=[];
    if(viewData&&viewData.assigned)childResults=viewData.assigned.filter(function(c){return c.name&&c.name.indexOf(q)>=0});
    if(childResults.length){
      html+='<div class="sr-hdr">아동</div>';
      childResults.slice(0,8).forEach(function(c,idx){html+='<div class="sr-item sr-child" data-cidx="'+idx+'"><div class="sr-name">'+esc(c.name)+'</div><div class="sr-sub">'+esc(fmtPhone(c.phone))+'</div></div>'});
    }
    var isAddr=q.length>=2&&!childResults.length;
    if(!isAddr&&q.length>=2&&/\d/.test(q))isAddr=true;
    if(!isAddr&&!childResults.length&&q.length>=2)isAddr=true;
    if(isAddr && placesService){
      html+='<div class="sr-hdr">📍 검색 중...</div>';results.innerHTML=html;results.classList.add('show');
      placesService.keywordSearch(q, function(data, status){
        var ah='';
        if(status === kakao.maps.services.Status.OK && data.length){
          ah+='<div class="sr-hdr">📍 주소</div>';
          data.slice(0,5).forEach(function(doc){
            ah+='<div class="sr-item sr-addr" data-lat="'+doc.y+'" data-lng="'+doc.x+'" data-name="'+esc(doc.place_name||doc.address_name)+'"><div class="sr-name" style="min-width:auto">'+esc(doc.place_name||'')+'</div><div class="sr-sub">'+esc(doc.road_address_name||doc.address_name||'')+'</div></div>'
          });
        }
        var ch='';if(childResults.length){ch+='<div class="sr-hdr">아동</div>';childResults.slice(0,5).forEach(function(c,idx){ch+='<div class="sr-item sr-child" data-cidx="'+idx+'"><div class="sr-name">'+esc(c.name)+'</div><div class="sr-sub">'+esc(fmtPhone(c.phone))+'</div></div>'})}
        results.innerHTML=ch+ah;results.classList.add('show');bindClicks(childResults);
      });
      return;
    }
    if(!html)html='<div class="sr-none">검색 결과 없음</div>';
    results.innerHTML=html;results.classList.add('show');bindClicks(childResults);
  }
  function bindClicks(childResults){
    results.querySelectorAll('.sr-child').forEach(function(el){el.addEventListener('click',function(){
      var c=childResults[parseInt(this.getAttribute('data-cidx'))];if(!c||!c.lat||!c.lng)return;
      map.setCenter(new kakao.maps.LatLng(c.lat,c.lng));map.setLevel(3);
      var iw=buildChildIW([c],viewData.provider.lat,viewData.provider.lng);
      var found=null;markers.forEach(function(m){var p=m.getPosition();if(Math.abs(p.getLat()-c.lat)<0.00001&&Math.abs(p.getLng()-c.lng)<0.00001)found=m});
      if(found){infoWindow.setContent(iw);infoWindow.open(map,found)}
      else{var sm=placeSearchMarker(c.lat,c.lng,iw);infoWindow.setContent(iw);infoWindow.open(map,sm)}
      results.classList.remove('show');input.value=c.name;
    })});
    results.querySelectorAll('.sr-addr').forEach(function(el){el.addEventListener('click',function(){
      var lat=parseFloat(this.getAttribute('data-lat')),lng=parseFloat(this.getAttribute('data-lng')),name=this.getAttribute('data-name');if(!lat||!lng)return;
      map.setCenter(new kakao.maps.LatLng(lat,lng));map.setLevel(3);
      var iw='<div class="iw"><div class="iw-title">📍 '+esc(name)+'</div>'+routeBtns(name,lat,lng)+'</div>';
      var sm=placeSearchMarker(lat,lng,iw);infoWindow.setContent(iw);infoWindow.open(map,sm);
      results.classList.remove('show');input.value=name;
    })});
  }
})();

function showLoading(v){document.getElementById('loading').classList.toggle('show',v)}
var _tt;function showToast(m,ok){var e=document.getElementById('toast');e.textContent=m;e.className='toast show'+(ok?' success':'');clearTimeout(_tt);_tt=setTimeout(function(){e.classList.remove('show')},3000)}

function saveSchedule(row, schId) {
  var day = document.getElementById(schId+'_day').value;
  if (!day) { showToast('요일을 선택해주세요'); return; }
  // 순서 드롭다운 제거됨 — 기존 confirmedTime 유지 (드래그로만 순서 변경)
  var order = '';
  if (viewData && viewData.assigned) {
    viewData.assigned.forEach(function(c) {
      if (c.formRow === row) order = c.confirmedTime || '';
    });
  }
  if (viewData && viewData.assigned) {
    viewData.assigned.forEach(function(c) {
      if (c.formRow === row) { c.confirmedDay = day; /* confirmedTime 유지 */ }
    });
    renderFiltered();
  }
  showToast(day + (order ? ' '+order+'번째' : '') + ' 저장됨', true);
  infoWindow.close();
  fetch(CONFIG.GAS_URL + '?action=saveschedule&token=' + encodeURIComponent(viewToken)
    + '&row=' + row + '&day=' + encodeURIComponent(day) + '&time=' + encodeURIComponent(order),
    {redirect:'follow'}).catch(function(){});
}

function clearSchedule(row) {
  if (!confirm('확정 요일을 취소합니다.')) return;
  if (viewData && viewData.assigned) {
    viewData.assigned.forEach(function(c) {
      if (c.formRow === row) { c.confirmedDay = ''; c.confirmedTime = ''; }
    });
    renderFiltered();
  }
  showToast('확정 취소됨', true);
  infoWindow.close();
  fetch(CONFIG.GAS_URL + '?action=saveschedule&token=' + encodeURIComponent(viewToken)
    + '&row=' + row + '&day=&time=', {redirect:'follow'}).catch(function(){});
}

// ══ 요일 필터 ══
var activeDay = '';
function filterDay(day) {
  activeDay = (activeDay === day) ? '' : day;
  document.querySelectorAll('.day-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-day') === activeDay);
  });
  document.getElementById('dayAll').classList.toggle('active', activeDay === '');
  renderFiltered();
}

function renderFiltered() {
  if (!viewData) return;
  clearMarkers();
  var p = viewData.provider;
  if (p.lat && p.lng) { addMarker(p.lat, p.lng, 'home', buildHomeIW(p)); addLabel(p.lat, p.lng, p.name, 'home'); }

  var filtered = viewData.assigned;
  if (activeDay) {
    filtered = filtered.filter(function(c) { return c.confirmedDay === activeDay; });
  }

  // 동선 정렬 (rank 계산용, 필터 걸렸을 때만)
  var sortedForRoute = null;
  if (activeDay && filtered.length >= 1) {
    sortedForRoute = filtered.slice().sort(function(a,b) {
      var oa = parseInt(a.confirmedTime) || 999;
      var ob = parseInt(b.confirmedTime) || 999;
      return oa - ob;
    });
  }

  var grouped = groupByCoord(filtered);
  grouped.forEach(function(g) {
    // 그룹 1명 + 요일 필터 중이면 정렬 순서 기반 rank 부여
    var rank = null;
    if (sortedForRoute && g.items.length === 1) {
      var ci = sortedForRoute.indexOf(g.items[0]);
      if (ci >= 0) rank = ci + 1;
    }
    addMarker(g.lat, g.lng, 'child', buildChildIW(g.items, p.lat, p.lng), g.items.length, rank);
    var label = '';
    if (g.items.length === 1) {
      label = (g.items[0].name||'').replace(/\s+$/,'');
    } else if (g.items.length <= 3) {
      label = g.items.map(function(c){ return (c.name||'').replace(/\s+$/,''); }).join(', ');
    }
    if (label) addLabel(g.lat, g.lng, label, 'child');
  });

  // ── 요일 필터 시 동선 폴리라인 ──
  if (sortedForRoute && sortedForRoute.length >= 2) {
    var path = [];
    if (p.lat && p.lng) path.push(new kakao.maps.LatLng(p.lat, p.lng));
    sortedForRoute.forEach(function(c) {
      if (c.lat && c.lng) path.push(new kakao.maps.LatLng(c.lat, c.lng));
    });
    if (path.length >= 2) {
      var line = new kakao.maps.Polyline({
        path: path,
        strokeWeight: 3,
        strokeColor: '#3a6b4e',
        strokeOpacity: 0.6,
        strokeStyle: 'shortdash'
      });
      line.setMap(map);
      routeLine = line;
    }
  }

  document.getElementById('hdrCount').textContent = filtered.length + '명' + (activeDay ? ' ('+activeDay+')' : '');
  updateTripBar(sortedForRoute);
}

// ── 하단 동선 바: 모드 토글 + 드래그 리스트 + 시작 버튼 ──
var tripMode = 'car';  // 'car' | 'traffic' | 'walk'
var sortableInstance = null;
var lastSortedForRoute = null;  // 드래그 중/후 참조용

// 모드 토글 초기화 (스크립트 실행 시점에 .tm-btn이 이미 DOM에 있음)
(function initTripModeToggle(){
  document.querySelectorAll('.tm-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tripMode = this.getAttribute('data-mode');
      document.querySelectorAll('.tm-btn').forEach(function(b) {
        b.classList.toggle('active', b.getAttribute('data-mode') === tripMode);
      });
      updateTripBar(lastSortedForRoute);
    });
  });
})();

function updateTripBar(sorted) {
  lastSortedForRoute = sorted;
  var bar = document.getElementById('tripBar');
  var list = document.getElementById('tripList');
  var hint = document.getElementById('tripHint');
  var startBtn = document.getElementById('tripStart');
  var startLabel = document.getElementById('tripStartLabel');
  var countEl = document.getElementById('tripCount');

  if (!activeDay || !sorted || sorted.length < 2 || !viewData) {
    bar.classList.remove('show');
    document.body.classList.remove('trip-active');
    if (sortableInstance) { sortableInstance.destroy(); sortableInstance = null; }
    return;
  }

  var p = viewData.provider;

  // 리스트 아이템 렌더
  list.innerHTML = '';
  var unorderedCount = 0;
  sorted.forEach(function(c, idx) {
    var hasOrder = !!parseInt(c.confirmedTime);
    if (!hasOrder) unorderedCount++;
    var name = (c.name || '').replace(/\s+$/, '');
    var item = document.createElement('div');
    item.className = 'trip-item';
    item.setAttribute('data-row', c.formRow || '');
    item.setAttribute('data-lat', c.lat || '');
    item.setAttribute('data-lng', c.lng || '');

    var inner = '<div class="trip-rank' + (hasOrder ? '' : ' empty') + '">' + (idx + 1) + '</div>'
      + '<div class="trip-name">' + esc(name) + '</div>';

    // 대중교통 모드면 개별 🚇 버튼 추가
    if (tripMode === 'traffic' && c.lat && c.lng) {
      var fromName, fromLat, fromLng;
      // 이전 '다른 좌표' 지점을 찾는다 (동일좌표 연속이면 건너뜀)
      if (idx === 0) {
        if (p.lat && p.lng && !(Math.abs(p.lat - c.lat) < 0.00001 && Math.abs(p.lng - c.lng) < 0.00001)) {
          fromName = (p.name || '집') + ' 집';
          fromLat = p.lat; fromLng = p.lng;
        }
      } else {
        for (var j = idx - 1; j >= 0; j--) {
          var prev = sorted[j];
          if (!prev.lat || !prev.lng) continue;
          if (Math.abs(prev.lat - c.lat) < 0.00001 && Math.abs(prev.lng - c.lng) < 0.00001) continue;
          fromName = (prev.name || '이전').replace(/\s+$/, '');
          fromLat = prev.lat; fromLng = prev.lng;
          break;
        }
        // 이전 칩 전부 같은 좌표였다면 집에서 출발
        if (!fromLat && p.lat && p.lng && !(Math.abs(p.lat - c.lat) < 0.00001 && Math.abs(p.lng - c.lng) < 0.00001)) {
          fromName = (p.name || '집') + ' 집';
          fromLat = p.lat; fromLng = p.lng;
        }
      }
      if (fromLat && fromLng) {
        var toName = name || '아동';
        var href = 'https://map.kakao.com/link/by/traffic/'
          + encodeURIComponent(fromName) + ',' + fromLat + ',' + fromLng + '/'
          + encodeURIComponent(toName) + ',' + c.lat + ',' + c.lng;
        inner += '<a class="trip-chip-nav" href="' + href + '" target="_blank" rel="noopener" title="이 구간 대중교통으로 열기">🚇</a>';
      } else {
        // 이전 지점과 동일 좌표 → 이동 필요 없음
        inner += '<span style="font-size:9.5px;color:#aaa;margin-left:2px">같은 위치</span>';
      }
    }

    item.innerHTML = inner;

    // 칩 탭 → 지도 이동 + 인포윈도우 (🚇 버튼·드래그 중엔 무시)
    item.addEventListener('click', function(e) {
      if (e.target.closest('.trip-chip-nav')) return;  // 링크 기본동작 허용
      var lat = parseFloat(this.getAttribute('data-lat'));
      var lng = parseFloat(this.getAttribute('data-lng'));
      if (!lat || !lng) return;
      map.setCenter(new kakao.maps.LatLng(lat, lng));
      map.setLevel(3);
      markers.forEach(function(m) {
        var pp = m.getPosition();
        if (Math.abs(pp.getLat() - lat) < 0.00001 && Math.abs(pp.getLng() - lng) < 0.00001) {
          kakao.maps.event.trigger(m, 'click');
        }
      });
    });
    list.appendChild(item);
  });

  // 힌트 텍스트
  if (tripMode === 'traffic') {
    hint.textContent = '🚇 대중교통은 구간별로 여세요 — 각 칩의 🚇 버튼';
    hint.style.display = 'block';
  } else if (unorderedCount > 0) {
    hint.textContent = '⚠️ 순서 미지정 ' + unorderedCount + '명 — 아동 탭 → 순서 설정';
    hint.style.display = 'block';
  } else {
    hint.textContent = '드래그로 순서 변경';
    hint.style.display = 'block';
    hint.style.color = '#bbb';
  }
  if (tripMode !== 'traffic' && unorderedCount === 0) hint.style.color = '';

  // 메인 버튼: 모드별 분기
  if (tripMode === 'traffic') {
    startBtn.classList.add('disabled');
    startBtn.removeAttribute('href');
    startLabel.textContent = '구간별로 열기';
    countEl.textContent = sorted.length + '구간';
  } else {
    startBtn.classList.remove('disabled');
    // 포인트 객체로 빌드하면서 동일좌표 연속 dedup (형제 같은 아파트 케이스 등)
    var pts = [];
    if (p.lat && p.lng) {
      pts.push({ name: (p.name || '집') + ' 집', lat: p.lat, lng: p.lng });
    }
    sorted.forEach(function(c) {
      if (!c.lat || !c.lng) return;
      var nm = (c.name || '아동').replace(/\s+$/, '');
      var last = pts.length > 0 ? pts[pts.length - 1] : null;
      if (last && Math.abs(last.lat - c.lat) < 0.00001 && Math.abs(last.lng - c.lng) < 0.00001) {
        // 직전 포인트와 같은 좌표 → 이름만 병합 (예: "지안, 예준")
        last.name += ', ' + nm;
      } else {
        pts.push({ name: nm, lat: c.lat, lng: c.lng });
      }
    });
    if (pts.length > 7) pts = pts.slice(0, 7);  // 카카오 URL 안전 한도
    if (pts.length >= 2) {
      var urlPoints = pts.map(function(pt) {
        return encodeURIComponent(pt.name) + ',' + pt.lat + ',' + pt.lng;
      });
      startBtn.href = 'https://map.kakao.com/link/by/' + tripMode + '/' + urlPoints.join('/');
    } else {
      startBtn.removeAttribute('href');
      startBtn.classList.add('disabled');
    }
    var modeLabel = tripMode === 'car' ? '자동차' : '도보';
    startLabel.textContent = activeDay + '요일 ' + modeLabel + ' 동선 시작';
    countEl.textContent = sorted.length + '명';
  }

  bar.classList.add('show');
  document.body.classList.add('trip-active');

  // SortableJS 드래그 초기화
  if (sortableInstance) { sortableInstance.destroy(); sortableInstance = null; }
  if (typeof Sortable !== 'undefined') {
    sortableInstance = Sortable.create(list, {
      animation: 180,
      delay: 80,               // 짧은 탭은 클릭으로 처리, 긴 프레스는 드래그
      delayOnTouchOnly: true,
      forceFallback: false,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      onStart: function() {
        if (navigator.vibrate) { try { navigator.vibrate(10); } catch(e){} }
      },
      onEnd: function(evt) {
        if (evt.oldIndex === evt.newIndex) return;
        handleTripReorder();
      }
    });
  }
}

// 드래그 종료 시: 새 순서 읽어 낙관적 업데이트 + 지도 재렌더 + 백그라운드 저장
function handleTripReorder() {
  var list = document.getElementById('tripList');
  var newAssignments = [];
  list.querySelectorAll('.trip-item').forEach(function(el, idx) {
    var row = parseInt(el.getAttribute('data-row'));
    if (row) newAssignments.push({ row: row, order: idx + 1 });
  });

  // viewData 낙관적 업데이트
  newAssignments.forEach(function(a) {
    viewData.assigned.forEach(function(c) {
      if (c.formRow === a.row) c.confirmedTime = String(a.order);
    });
  });

  // 지도 마커 + 폴리라인 재렌더 (하지만 trip-bar는 updateRanksInPlace로 최소 갱신)
  updateRanksInPlace();
  rebuildMapOnly();

  // 저장 (fire-and-forget)
  var failed = 0;
  var pending = newAssignments.length;
  newAssignments.forEach(function(a) {
    fetch(CONFIG.GAS_URL + '?action=saveschedule&token=' + encodeURIComponent(viewToken)
      + '&row=' + a.row + '&day=' + encodeURIComponent(activeDay)
      + '&time=' + encodeURIComponent(String(a.order)), { redirect: 'follow' })
      .then(function(r){ return r.json(); })
      .catch(function(){ failed++; })
      .finally(function(){
        pending--;
        if (pending === 0) {
          if (failed > 0) showToast('일부 저장 실패 ('+failed+'건) — 새로고침 권장');
          else showToast('순서 저장됨', true);
        }
      });
  });
}

// 드래그 직후 리스트 rank 번호만 갱신 (DOM 재생성 없이 → SortableJS 바인딩 유지)
function updateRanksInPlace() {
  var items = document.querySelectorAll('#tripList .trip-item');
  items.forEach(function(el, idx) {
    var rankEl = el.querySelector('.trip-rank');
    if (rankEl) {
      rankEl.textContent = idx + 1;
      rankEl.classList.remove('empty');  // 드래그 후엔 모두 확정 순서
    }
  });
  // 대중교통 모드면 🚇 링크 재생성 필요
  if (tripMode === 'traffic') {
    var p = viewData.provider;
    var items2 = document.querySelectorAll('#tripList .trip-item');
    items2.forEach(function(el, idx) {
      var lat = parseFloat(el.getAttribute('data-lat'));
      var lng = parseFloat(el.getAttribute('data-lng'));
      if (!lat || !lng) return;
      var fromName, fromLat, fromLng;
      if (idx === 0) {
        fromName = (p.name || '집') + ' 집';
        fromLat = p.lat; fromLng = p.lng;
      } else {
        var prev = items2[idx - 1];
        fromLat = parseFloat(prev.getAttribute('data-lat'));
        fromLng = parseFloat(prev.getAttribute('data-lng'));
        var prevName = prev.querySelector('.trip-name');
        fromName = prevName ? prevName.textContent : '이전';
      }
      var nameEl = el.querySelector('.trip-name');
      var toName = nameEl ? nameEl.textContent : '아동';
      var navLink = el.querySelector('.trip-chip-nav');
      if (navLink && fromLat && fromLng) {
        navLink.href = 'https://map.kakao.com/link/by/traffic/'
          + encodeURIComponent(fromName) + ',' + fromLat + ',' + fromLng + '/'
          + encodeURIComponent(toName) + ',' + lat + ',' + lng;
      }
    });
  }
  // 메인 버튼 URL도 새 순서로 업데이트 (dedup 포함)
  if (tripMode !== 'traffic' && lastSortedForRoute) {
    var p = viewData.provider;
    var sorted = lastSortedForRoute.slice().sort(function(a,b){
      var oa = parseInt(a.confirmedTime) || 999;
      var ob = parseInt(b.confirmedTime) || 999;
      return oa - ob;
    });
    lastSortedForRoute = sorted;
    var pts = [];
    if (p.lat && p.lng) pts.push({name:(p.name||'집')+' 집',lat:p.lat,lng:p.lng});
    sorted.forEach(function(c){
      if (!c.lat || !c.lng) return;
      var nm = (c.name||'아동').replace(/\s+$/,'');
      var last = pts.length > 0 ? pts[pts.length-1] : null;
      if (last && Math.abs(last.lat-c.lat)<0.00001 && Math.abs(last.lng-c.lng)<0.00001) {
        last.name += ', ' + nm;
      } else {
        pts.push({name:nm,lat:c.lat,lng:c.lng});
      }
    });
    if (pts.length > 7) pts = pts.slice(0, 7);
    var startBtn = document.getElementById('tripStart');
    if (pts.length >= 2) {
      var urlPoints = pts.map(function(pt){
        return encodeURIComponent(pt.name)+','+pt.lat+','+pt.lng;
      });
      startBtn.href = 'https://map.kakao.com/link/by/' + tripMode + '/' + urlPoints.join('/');
    }
  }
}

// 지도(마커+폴리라인)만 재렌더 (trip-bar는 건드리지 않음 → 드래그 연속성 유지)
function rebuildMapOnly() {
  if (!viewData) return;
  clearMarkers();
  var p = viewData.provider;
  if (p.lat && p.lng) { addMarker(p.lat, p.lng, 'home', buildHomeIW(p)); addLabel(p.lat, p.lng, p.name, 'home'); }

  var filtered = viewData.assigned;
  if (activeDay) filtered = filtered.filter(function(c){ return c.confirmedDay === activeDay; });

  var sortedForRank = null;
  if (activeDay && filtered.length >= 1) {
    sortedForRank = filtered.slice().sort(function(a,b) {
      var oa = parseInt(a.confirmedTime) || 999;
      var ob = parseInt(b.confirmedTime) || 999;
      return oa - ob;
    });
  }

  var grouped = groupByCoord(filtered);
  grouped.forEach(function(g) {
    var rank = null;
    if (sortedForRank && g.items.length === 1) {
      var ci = sortedForRank.indexOf(g.items[0]);
      if (ci >= 0) rank = ci + 1;
    }
    addMarker(g.lat, g.lng, 'child', buildChildIW(g.items, p.lat, p.lng), g.items.length, rank);
    var label = '';
    if (g.items.length === 1) label = (g.items[0].name||'').replace(/\s+$/,'');
    else if (g.items.length <= 3) label = g.items.map(function(c){return (c.name||'').replace(/\s+$/,'');}).join(', ');
    if (label) addLabel(g.lat, g.lng, label, 'child');
  });

  if (sortedForRank && sortedForRank.length >= 2) {
    var path = [];
    if (p.lat && p.lng) path.push(new kakao.maps.LatLng(p.lat, p.lng));
    sortedForRank.forEach(function(c) {
      if (c.lat && c.lng) path.push(new kakao.maps.LatLng(c.lat, c.lng));
    });
    if (path.length >= 2) {
      var line = new kakao.maps.Polyline({
        path: path, strokeWeight: 3, strokeColor: '#3a6b4e',
        strokeOpacity: 0.6, strokeStyle: 'shortdash'
      });
      line.setMap(map);
      routeLine = line;
    }
  }
}
</script>
